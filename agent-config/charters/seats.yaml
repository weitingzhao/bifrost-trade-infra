# 席位表（机器读）。Crew 块（9 号，原 Harness 接入 / Labor）起草，2026-11-21。
# 出处：Owner 2026-11-21 在参谋长线程定的（法 59–65，经主统筹转述）：ownership 在 Agent；有主人席位、有临时席位（干完就走）；
# 人和 Agent 都是 labor。本表回答「谁在干活」：不管工具，不评结果。
# 对账：每页 charters/*.md（README 除外）恰有一个 seat 行（charter 字段）；domain_id 必须是平台领域表里的 id 或 null；
# kind=temporary 的行必须有 invited_by（指向一个 kind=owner 的席位或一个人）；kind=human 的行 harness 写 human。
# 【量】= 读 list_sessions、章程文件得到；【推】= 推断；sits_now 是写表时的读数，不是承诺，由对账脚本和会话清单核对。
# 对账脚本：agent-config/scripts/check-seats.py（只读、不进 CI；进 CI 是新增裁判检查，要先交 Owner）。
version: 1
# 跟 platform config/domain-ownership.json 的 domains[].id 一致（读于 platform origin/main，2026-11-21）
domain_ids: [foundation, plan, lineage, verification, delivery, approvals, compute, payload, coordination, crew, station, audit, triage]

# 参谋长不是席位：它独立于所有席位之外，不握任何领域的 ownership，没有领域身份卡（Owner 更正，主统筹 11-21 转述）。
# 但它发信、收信，信箱要认得出它：记在最后的 outside_seats，只有会话和收信，没有领域、没有卡（11-22 沟通线读数发现缺它）。
# name = Owner 11-21 定的新叫法（法 66）；id 仍是章程文件名。Audit（12）章程页 11-21 进了 main（3f4163d6），由 2-lineage 的会话兼坐：两行同一个 session。
# mailbox = 这个会话在平台信箱里是不是收件人（thread:<session>）。平台判的是 writer 表里有没有这个 actor：会话第一次用平台工具写入时登记。
# 量法（2026-11-21 15:10 Chicago，临时读数）：Crew 给它发过 send_message，成功 = registered，HTTP 422「not a registered actor」= not_registered；
# 没发过 = unmeasured。none = 没有自己的会话（6-compute 是 Codex 每轮新起，信走 liaison，liaison 已登记）。
# 登记的做法由沟通线给（主统筹 11-21）；登记了的改这一列。
seats:
  - {id: company-coordinator, charter: company-coordinator.md, domain: company, domain_id: null,        kind: owner, harness: claude, session: local_accccb4e-410c-4b5f-9f1b-b54c6915dc9a, mailbox: registered}
