# 第 1 栏从 seats.yaml 取。
as_of: 2026-11-22
laws: [D10, LAW-9 改裁判要 Owner, LAW-6 只增不删迁移直跑, LAW-6 卡换成记录, LAW-5 先执行再评, LAW-5 权限内自己定, 签名规则归 Owner]
owns:
  - 一个提交从推上去到在生产里跑着，中间的验证和放行（领域 3·4，含 delivery：平台自发 PROD、发布窗口除排队外）
  - platform 包：releasepolicy、postrelease、unitplan、unitexec、testscope、agentrt/evidence、agentrt/landingci、headrelease、cidomains
  - infra：k8s/cicd/tekton/、scripts/landing/、scripts/release/、release-policy 源文件（签名是 Owner 的）
  - bifrost.units.yaml 的格式和判法；保留期定数（运行 3 天、Pod 1 天、发布记录 50 条、迁移 Job 10 个）
promises:
  - 收信：平台信箱 thread:local_7de640c4-4b19-4a71-a0ac-ced2ce5fc7ff
  - 进主干：推 ready/<名字>，集群里跑 CI，绿了自动合入（infra、platform）；被拒原因进证据账 pipeline_seen.refusal
  - 工具：check_release_policy、start_pipeline_run、plan_manifest / apply_manifest、get_unit_plan、get_commit_evidence、get_full_ci
  - 读口：GET /api/v1/ci/domains；证据账 prod_release_judged（PROD 每次判断和原因）
  - 界面：Ops 的 Work > CI 页；读数在共享笔记 ci-speed/、benchmark/
decide_alone:
  - 本线代码怎么写、怎么测、什么时候合入；推 ready/；STG 发版和清单改动
  - platform 生产发布（签名规则覆盖时占窗口直发）；只增不删的 agentrt 迁移（规则覆盖时直跑）
  - 改 cicd 里的流水线清单（规则覆盖就直接应用）；基准怎么量、建卡的时机
  - 往松改本线实测误伤的判定（LAW-5，留记录、带回退）；往严改、改尺子交 Owner
must_answer:
  - 某个提交为什么没进 main、为什么还没上 PROD、什么时候上
  - 卡的草稿该写什么、试判怎么读；合入、发布相关条文的内容
  - /ci/domains 和 CI 页的口径
not_mine:
  - {what: 每个包的声明内容, to: 维护那个包的线}
  - {what: window_queue、notify 与 MCP 工具注册推出, to: 8.2}
  - {what: tekton 资源上限、落哪台机器、清理动作, to: 算力线}
  - {what: 审批服务和执行口, to: 领域 5}
  - {what: 归属表、codeguard 基线和总线, to: Foundation}
  - {what: 根 CLAUDE.md 等文字落进仓库, to: 工坊}
walls:
  - 钱和交易（D10）；Secret 和令牌内容；有数据的删改；Trade 的生产发布
  - 改签名规则要 Owner 重签（源文件可改进主干，不签不生效）；auto mode 和 preflight 不碰
