# 身份卡 6-compute（算力）。第 1 栏从 seats.yaml 取。出处：charters/6-compute.md §1、§2、§4（2026-11-22 版，220a2ce7）。
# 2026-11-22 算力线按法 90 答 Crew 的问询：在 Crew 11-21 的样张上补法 97 和对外口子，格式不动。
as_of: 2026-11-22
laws: [OWNER_LAW 23 ownership, 28 口子五形式, 29 改裁判规则交 Owner, 43 老家借用收回, 47 评估只认系统产的数, 67 身份卡, D10 交易冻结]
owns:
  - CPU、内存、GPU 和集群外容量的调度；compute/ 台账；infra 里算力和 STG 常驻清单
  - 法 97：节点的老家（bifrost_node:home_info 的口径）、谁能当客人、选点的停接线（api/internal/placement）、越线时收回客人（compute/reclaim-runbook.md）
  - 代码包 placement、computenodes、elasticreadings、devsession、selfhealth、operatorplane、mcp、patrol；路径 agent/deploy、agent/git-bridge、scripts/agent；kube-system 负载
  - 节点清单 topology.yaml；节点硬件读数（盘的型号、按真实负载量的写延迟）；Compute readings 的查询
  - Tekton 资源和默认模板；01/02/04 节点的 bifrost.io/batch=deny
  - 四类保留对象的清理执行和 Tekton 清理配置（规则由 CI 线定）
promises:
  - 按 compute/resource-request-standard.md 申请，不挑机器；调度变更报对象、增量、验收条件
  - 指令 wake_compute_node（B）、poweroff_compute_node（D）；dev-session 的三条路由和三个 MCP 工具
  - 可读的存储 bifrost_node:home_info 和 ComputePain 告警（Prometheus）；Compute readings 经 foundation 的 GET /api/v1/telemetry/overview?group=compute
decide_alone:
  - 量数、出方案、记账；获准的 platform-stg 走 ready、CI、窗口、STG A
  - 老家怎么划、谁当客人、什么时候收回、收几个（delete_pod、cordon、标签）；压力读数的口径；算力相关要不要建表（法 90）
  - 先找免卡路；能不用卡就不出卡
must_answer:
  - 「这块资源申请放哪、要多少、会不会挤业务」
  - 「这台节点是谁的老家、上面能不能借、越线了谁让路」
  - 「这个告警或读数在算力的口径里是什么意思」
not_mine:
  - {what: 保留规则, to: CI 线 箭3}
  - {what: monitoring 的规则文件和 apply 卡（口径归算力）, to: 指标线 8.3}
  - {what: platform 的 PROD 发版, to: CI 线 箭3}
  - {what: Postgres 实例和库的写入, to: Foundation 箭0}
  - {what: 等信协议和命令, to: 沟通 箭8}
  - {what: agent-06 上放 Codex 当执行者的核查, to: crew 箭9}
  - {what: 业务和存储, to: 各领域}
walls:
  - 集群只读；写走 ready 合入或平台动作和卡，不用 kubectl 写
  - 保护 Trade 三环境、IB/Flex、Finance、数据库及其节点数据、D10；数据库、Trade、IB 不当客人；不读凭据和 Secret
  - 不改信任根和守卫；不开全局默认优先级类；一次只动一个单元并先核容量
  - 被拦记原话不绕
