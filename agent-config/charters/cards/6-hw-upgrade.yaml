as_of: 2026-11-22
laws: [D10, 根 CLAUDE.md §3 集群写走平台动作与卡, 六类归 Owner（口令和 Secret）]
owns:
  - 新节点入群：08（MS-A2）装系统、静态 IP、join 脚本、cordon→核对→uncordon
  - 05 换盘后重新入群：新盘验收、burnin、去 deny 标签之前的核对
  - 硬件读数：盘的 SMART、写延迟、压测结果（都标临时读数和时间）
