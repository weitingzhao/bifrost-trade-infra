# CNPG bifrost-postgres — allow application and operator traffic.
#
# postgres-metrics-ingress only opens :9187 from monitoring; without these rules
# all other ingress to CNPG pods is denied (default deny when any NP matches).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-trade-ingress
  labels:
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bifrost-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-dev
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-stg
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-prod
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plugin-market-data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plugin-flex-query
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: research
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-cnpg-operator-ingress
  labels:
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bifrost-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-inter-instance-ingress
  labels:
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bifrost-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: bifrost-postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
---
# LAN NodePort (:30432) — Mac Mini / Work Mac / DBeaver.
#
# kube-proxy MASQUERADE + flannel rewrite NodePort sources to each node's
# flannel.1 address (10.42.<podCIDR>.0/32), NOT the LAN node IP. Keep LAN
# CIDRs for ExternalTrafficPolicy=Local / future paths. When a node joins,
# add its `ip -4 addr show flannel.1` address below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-lan-ingress
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/name: bifrost-postgres
    bifrost.io/purpose: lan-nodeport
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bifrost-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        # NodePort SNAT sources (flannel.1 on each Ready node)
        - ipBlock:
            cidr: 10.42.0.0/32
        - ipBlock:
            cidr: 10.42.3.0/32
        - ipBlock:
            cidr: 10.42.6.0/32
        - ipBlock:
            cidr: 10.42.8.0/32
        - ipBlock:
            cidr: 10.42.9.0/32
        # LAN clients (Server VLAN + Work VLAN)
        - ipBlock:
            cidr: 192.168.10.0/24
        - ipBlock:
            cidr: 192.168.20.0/24
      ports:
        - protocol: TCP
          port: 5432
