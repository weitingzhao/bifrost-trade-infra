# Daily logical dump of hand-entered data (phase 0 W5), see backup.sh.
#
# Scope (PLAN-phase0 W5): bifrost_{prod,stg,dev}.public and Golden Source
# journal, research, ops_feedback, raw_broker. Market data is not here: it is
# re-downloadable or covered by W3's archive.
#
# 04:30 UTC: after the 03:00 CNPG base backup has started, clear of the
# 21:05-23:15 UTC deliver window and of W4's 16:20 / 20:30 ET snapshot jobs.
# The NAS squashes every client uid to 1000 (that is who owns the MinIO and
# provisioner folders), so the uid here only matters inside the pod; it runs as
# root with every capability dropped. The image is the CNPG one already cached on the
# postgres nodes (pg_dump 17 matches the server).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: logical-backup
  labels:
    app.kubernetes.io/name: logical-backup
spec:
  schedule: "30 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: logical-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role: postgres
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: backup
              image: ghcr.io/cloudnative-pg/postgresql:17.9
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/backup.sh"]
              env:
                - name: TARGETS
                  value: >-
                    bifrost_prod:public bifrost_stg:public bifrost_dev:public
                    bifrost_golden_source:journal bifrost_golden_source:research
                    bifrost_golden_source:ops_feedback bifrost_golden_source:raw_broker
                - name: KEEP_DAILY
                  value: "14"
                - name: WEEKLY_EVERY_DAYS
                  value: "7"
                - name: PGHOST
                  value: bifrost-postgres-rw
                - name: PGSSLMODE
                  value: require
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: bifrost-postgres-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: bifrost-postgres-app
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: hot
                  mountPath: /backup/hot
                - name: cold
                  mountPath: /backup/cold
          volumes:
            - name: scripts
              configMap:
                name: logical-backup-scripts
            - name: hot
              persistentVolumeClaim:
                claimName: logical-backup-hot
            - name: cold
              persistentVolumeClaim:
                claimName: logical-backup-cold
