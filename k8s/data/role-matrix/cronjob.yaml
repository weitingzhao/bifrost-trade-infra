# Daily read-only compare of login-role grants to expected.yaml (TD-85).
# Exit 1 is drift. Apply with the NetworkPolicy in this directory; do not
# attach it to k8s/data/kustomization.yaml (same pattern as logical-backup).
# The password secret is not in git. See the db-step for role_matrix_reader.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-role-matrix
  labels:
    app.kubernetes.io/name: db-role-matrix
spec:
  schedule: "15 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-role-matrix
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role: postgres
          initContainers:
            - name: wait-pg
              image: ghcr.io/cloudnative-pg/postgresql:17.9
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -c
                - |
                  for i in $(seq 1 60); do
                    if pg_isready -q -t 2; then echo ready; exit 0; fi
                    echo "wait $i"; sleep 2
                  done
                  echo "bifrost-postgres-rw not reachable after 120 s"; exit 1
              env:
                - name: PGHOST
                  value: bifrost-postgres-rw
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          containers:
            - name: check
              image: ghcr.io/cloudnative-pg/postgresql:17.9
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /opt/role-matrix/check_role_matrix.py
                - --matrix
                - /opt/role-matrix/expected.yaml
                - --via
                - psql
              env:
                - name: PGHOST
                  value: bifrost-postgres-rw
                - name: PGSSLMODE
                  value: require
                - name: PGOPTIONS
                  value: "-c default_transaction_read_only=on -c statement_timeout=120000"
                - name: PGAPPNAME
                  value: role-matrix-check
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: db-role-matrix-reader
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-role-matrix-reader
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /opt/role-matrix
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: db-role-matrix
