# TD-217 scratch Cluster. Prepared, not applied.
#
# One instance, bootstrap.recovery from the bifrost-postgres Barman object store,
# targetTime about one hour ago (render-cluster.sh fills the placeholder),
# serverName of the SOURCE is bifrost-postgres (the live Cluster leaves it empty,
# so CNPG uses the Cluster name). This Cluster's own name is pg-recovery-drill,
# which is the serverName it would archive under. It has no backup section, so
# it does not archive, and the credentials below must be read-only.
#
# Live source, read 2026-10-07 (no secret values):
#   endpointURL http://minio.data.svc.cluster.local:9000
#   destinationPath s3://bifrost-postgres-backup/
#   wal.compression gzip, data.compression gzip
#   image ghcr.io/cloudnative-pg/postgresql:17.9
#   firstRecoverabilityPoint 2026-09-07T03:08:25Z
#   lastSuccessfulBackup 2026-10-07T04:15:50Z
#   databases about 34 GB (Golden Source) plus the three small Trade databases
#
# Secret pg-recovery-drill/minio-backup-readonly is NOT in git. Owner creates it
# out of band with s3:GetObject and s3:ListBucket on bifrost-postgres-backup only.
# Do not copy Secret data/minio-backup: that one can write, and a write into the
# backup bucket can destroy PITR.
#
# Schedule onto a general-pool node (ubt-k3s-05 or ubt-k3s-06). The primary is
# on ubt-k3s-02 and the replica on ubt-k3s-04; local-path of 80Gi must not land
# on those disks. Check `df -h` on the chosen node first. Allocatable ephemeral
# storage on the general nodes was about 442 GiB on 2026-10-07; that is not
# free disk.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-recovery-drill
  namespace: pg-recovery-drill
  labels:
    app.kubernetes.io/name: pg-recovery-drill
    app.kubernetes.io/part-of: bifrost
    bifrost.io/purpose: recovery-drill
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9
  primaryUpdateStrategy: unsupervised
  storage:
    size: 80Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: false
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: bifrost.io/workload-pool
                operator: In
                values: ["general"]
  bootstrap:
    recovery:
      source: bifrost-postgres
      recoveryTarget:
        targetTime: "__TARGET_TIME__"
  externalClusters:
    - name: bifrost-postgres
      barmanObjectStore:
        destinationPath: s3://bifrost-postgres-backup/
        endpointURL: http://minio.data.svc.cluster.local:9000
        serverName: bifrost-postgres
        s3Credentials:
          accessKeyId:
            name: minio-backup-readonly
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: minio-backup-readonly
            key: SECRET_ACCESS_KEY
        wal:
          compression: gzip
          maxParallel: 2
        data:
          compression: gzip
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  monitoring:
    enablePodMonitor: false
