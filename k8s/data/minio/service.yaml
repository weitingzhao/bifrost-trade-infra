# The backup MinIO runs on the NAS itself (k8s/data/minio/nas/compose.yaml), not in
# the cluster. This Service keeps the name the Cluster spec uses
# (endpointURL http://minio.data.svc.cluster.local:9000) and sends it to the NAS:
# no selector, and a hand-written EndpointSlice with the NAS address.
#
# Rollback to the in-cluster MinIO: stop the NAS container first, then restore the
# selector (app.kubernetes.io/name: minio, targetPort api/console), delete the
# EndpointSlice minio-nas and scale deploy/minio to 1. Never both at once: they
# share one data directory.
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: minio-nas
  labels:
    kubernetes.io/service-name: minio
    endpointslice.kubernetes.io/managed-by: bifrost-infra
addressType: IPv4
ports:
  - name: api
    port: 9000
    protocol: TCP
  - name: console
    port: 9001
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.10.20
    conditions:
      ready: true
