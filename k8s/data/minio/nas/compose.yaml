# MinIO for the CNPG backups (bucket bifrost-postgres-backup), run on the NAS itself.
#
# Replaces data/minio in the cluster, which reached the same directory over NFS:
# on that path MinIO lost multipart parts underneath itself (InvalidPart, 10-03 and
# 10-04) and kept its only drive offline for 6h40m after an 8-minute NAS stall
# (10-05). Here MinIO writes the NAS's own btrfs volume; the cluster reaches it
# over S3 (HTTP) through the Service data/minio, so the Cluster spec is unchanged.
#
# TD-444 step 5 (runbook §4 group 6, stage M4b): the data now lives on the SSD RAID1,
# /volume2/minio-backup/data, copied there by scripts/nas/td444-move.sh (M2) from the
# directory the cluster MinIO used. The old directory stays frozen as the A fallback.
# Two companions sit next to this file (only ever one MinIO runs on a directory):
#   compose.isolated.yaml  M4a: same service, network_mode none, no ports (structural isolation)
#   compose.recovery.yaml  B:   override of the data bind onto the recovery directory
#                               (docker compose -f compose.yaml -f compose.recovery.yaml ...)
# NEVER run this while data/minio in the cluster is up. Start and edit it only from the
# command line, never from the UGOS UI (the UI drops the compose network).
#
# Lives in /volume1/docker/minio-backup/ on the NAS with .env (credentials, not in
# git) next to it. Run as root: sudo docker compose up -d
name: minio-backup

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    # docker.io no longer serves minio/minio; the image is loaded from the tarball.
    pull_policy: never
    container_name: minio-backup
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: .env
    environment:
      # Prometheus scrapes /minio/v2/metrics/cluster without a token
      # (k8s/monitoring/bifrost-minio-nas.yaml). The metrics carry bucket and
      # capacity figures, no credentials, and the ports are bound to the LAN
      # address only.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "192.168.10.20:9000:9000"
      - "192.168.10.20:9001:9001"
    volumes:
      - /volume2/minio-backup/data:/data
    restart: unless-stopped
    # In the cluster it peaked at 690 MiB (1 GiB limit); the NAS has 7.4 GiB.
    mem_limit: 1536m
    # /minio/health/cluster is the endpoint that turns 503 when the drive is offline
    # (live and ready keep answering 200). Docker only marks the container
    # unhealthy; it does not restart it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/cluster"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
