apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: backup
spec:
  # 0 since the move to the NAS (k8s/data/minio/nas/compose.yaml): the NAS MinIO
  # serves the same data directory, and two MinIO servers on one directory corrupt
  # it. Kept as the rollback path; see service.yaml for the order.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: backup
    spec:
      containers:
        - name: minio
          # docker.io/minio/minio can no longer be pulled (pull access denied, 2026-10-03).
          # This tag runs from the containerd cache, imported on ubt-k3s-01/02/04/05/06
          # (pull policy IfNotPresent). Copies: 192.168.10.73:30500/minio/minio (amd64;
          # the registry has no volume) and ~/bifrost-backups/images/ on the Owner's Mac.
          # A new node needs `k3s ctr -n k8s.io images import` before MinIO can land there.
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-backup
                  key: ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-backup
                  key: SECRET_ACCESS_KEY
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          # /minio/health/live and /ready keep answering 200 when MinIO has marked
          # its only drive offline; /cluster answers 503. On 2026-10-05 the NAS
          # stopped responding for ~8 min (19:15-19:23), MinIO never brought the
          # drive back, and WAL archiving failed for 6h40m behind a Ready pod.
          # A restart re-attaches the drive; 4 x 30 s rides out a short NAS blip.
          livenessProbe:
            httpGet:
              path: /minio/health/cluster
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
