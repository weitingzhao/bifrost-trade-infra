# LAN-only NodePorts for Redis Insight / redis-cli from the local network.
#
# Each Service targets the matching ClusterIP redis deployment in data NS.
# No password is configured on these phase-⑥ single-replica instances (dev only).
#
# Ports (LAN only — never expose to the public internet):
#   redis-dev          30379
#
# redis-live-stg (30380) and redis-live-prod (30382) were removed on 2026-10-07
# (TD-205): they had no password, carried the PROD daemon's control stream and
# answered the whole LAN. For Redis Insight use
#   kubectl -n data port-forward svc/redis-live-prod 16382:6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-dev-lan
  namespace: data
  labels:
    app.kubernetes.io/name: redis-dev
    app.kubernetes.io/component: redis-lan-access
    bifrost.io/environment: dev
  annotations:
    bifrost.io/purpose: "LAN Redis Insight access — dev"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis-dev
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
      nodePort: 30379