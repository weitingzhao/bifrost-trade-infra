# Temporary diagnostic — capture a MinIO trace across one nightly base backup.
#
# 2026-10-03 the daily backup failed at CompleteMultipartUpload with InvalidPart:
# MinIO could not find part.3 of data.tar.gz on its NFS-backed drive. Nothing
# recorded whether that part was uploaded twice (renamePart deletes an existing
# part before renaming the new one in) or vanished on the NFS backend. These
# traces answer that if it happens again.
#
# Fires once, 2026-10-04 02:55 UTC (the backup starts 03:00 and has taken
# 73-77 min), and traces for 2 h. Read the result with
#   kubectl -n data logs job/<job> -c s3     # every S3 call under .../base/ (partNumber in the query)
#   kubectl -n data logs job/<job> -c parts  # OS ops on .minio.sys/multipart: per part, a rename of
#                                            # any existing part.N to trash, tmp -> part.N, part.N.meta
# (~10 s3 and ~66 parts lines a minute while a backup runs; `--all --errors` was
# tried and rejected: --errors does not filter OS/scanner calls, 5k lines a minute.)
# minio/minio can no longer be pulled from Docker Hub (pull access denied,
# 2026-10-03), so the pod runs on the MinIO node and reuses its cached image
# (the same image ships mc). In use by MinIO there, so image GC keeps it.
# Not in k8s/data/kustomization.yaml: apply with `kubectl apply -f`, delete the
# CronJob (and this file) once the trace has been read.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup-trace
  namespace: data
  labels:
    app.kubernetes.io/name: minio-backup-trace
    app.kubernetes.io/component: diagnostics
spec:
  schedule: "55 2 4 10 *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: minio-backup-trace
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: ubt-k3s-05
          containers:
            - name: s3
              image: minio/minio:RELEASE.2024-12-18T13-15-44Z
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  until mc alias set bk http://minio.data.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; do sleep 5; done
                  timeout "$TRACE_SECONDS" mc admin trace bk --call s3 --path '*bifrost-postgres/base/*'
                  exit 0
              env: &traceEnv
                - name: TRACE_SECONDS
                  value: "7200"
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: minio-backup
                      key: ACCESS_KEY_ID
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: minio-backup
                      key: SECRET_ACCESS_KEY
              resources: &traceResources
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
            - name: parts
              image: minio/minio:RELEASE.2024-12-18T13-15-44Z
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  until mc alias set bk http://minio.data.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; do sleep 5; done
                  timeout "$TRACE_SECONDS" mc admin trace bk --call storage --call os --path '*.minio.sys/multipart/*'
                  exit 0
              env: *traceEnv
              resources: *traceResources
