# K3s bifrost-stg — the only config for this env, mounted into every pod as
# /app/config/runtime.yaml (TD-06, TD-52). Nothing is merged under it. Secrets come from
# bifrost-stg-secrets env (passwords and tokens stay empty here).
server:
  skip_monitor_ib: false
  architecture:
    monitor_port: 8765
    docs_port: 8767
    ops_port: 8768
  account:
    trading_port: 8769
    portfolio_port: 8771
  research:
    research_port: 8773
    market_port: 8772
    strategy_port: 8770
  feed:
    massive_port: 8766

sink: postgres

# One ib_operator block (TD-53): a second one further down set the stream, and YAML kept
# only that one, silently dropping these keys. STG's own command stream: trade-stg may write
# only this one, and the gateway answers read ops only here — STG cannot disconnect or
# reconnect the gateway PROD uses (TD-21).
ib_operator:
  enabled: true
  stream: "ib:operator:cmd:stg"
  consumer_group: ib-operator
  result_prefix: "ib:operator:result:"
  health_key: "bifrost:health:ws_ib_operator"
  result_ttl_sec: 300
  request_timeout_sec: 120
  health_refresh_sec: 30
  max_result_bytes: 4194304
  block_ms: 5000

ib_connection:
  reconnect_base_sec: 2
  reconnect_max_sec: 60
  reconnect_max_exp: 6
  ib_probe_interval_sec: 15
  ib_probe_stale_multiplier: 2.5

ib:
  connect_timeout: 60.0
  host:
    ip: 192.168.10.30
    port_type: tws_live
    client_id:
      daemon: 210
      listener: 201
      operator: 220
      worker_market: 240
      ingestor: 250
      account_agent: 260
  secondary:
    ip: 192.168.10.33
    port_type: tws_live
    client_id:
      listener: 202
      operator: 222
      account_agent: 262

utilized:
  services:
    server: stg
    massive: stg
    docs: stg
    ops: stg
    trading: stg
    strategy: stg
    portfolio: stg
    market: stg
    research: stg

postgres:
  host: bifrost-postgres-rw.data.svc.cluster.local
  port: 5432
  user: bifrost
  password: ""
  database: bifrost_stg

# Shared brokerage Golden Source (IB account/positions/executions)
golden_source:
  host: bifrost-postgres-rw.data.svc.cluster.local
  port: 5432
  database: bifrost_golden_source
  user: bifrost
  password: ""
  fdw_user: brokerage_reader
  fdw_password: ""

redis:
  enabled: true
  host: redis-live-stg.data.svc.cluster.local
  port: 6379
  db: 0

# IBGP3 — shared Platform IB bus (ExternalName redis-ib → data NS). Password: REDIS_IB_PASSWORD in bifrost-stg-secrets.
redis_ib:
  enabled: true
  host: redis-ib
  port: 6379
  db: 0
  # STG's own redis-ib user (TD-21). REDIS_IB_USERNAME / REDIS_IB_PASSWORD in bifrost-stg-secrets
  # override this; bifrost-platform-plugin scripts/redis-ib-env-users.sh switches them.
  username: trade-stg
  password: ""

ops:
  control_profile: stg
  # Wave A: D10 freeze — block daemon scale-up via api-ops until Owner unlock.
  daemon_scale_guard: freeze
  executor_mode: kubernetes
  kubernetes:
    namespace: bifrost-stg
  auth:
    # TD-23: an anonymous caller reads; a write needs the Operator sign-in
    # (OPS_OPERATOR_TOKEN / OPS_ADMIN_TOKEN, scripts/trade-operator-tokens.sh).
    default_role: viewer
    tokens: []
  platform_audit:
    enabled: true
    url: http://platform-api.bifrost-platform-stg.svc.cluster.local:8780
    timeout_ms: 2000

# api_key: Prefer env MASSIVE_API_KEY / POLYGON_API_KEY from Secret in pods.
# Polygon WS ingest retired; only features.trades_enabled is still read (Research REST, option discovery).
massive:
  api_key: ""
  tier: starter
  features:
    trades_enabled: false

# Reference indices for the market strip and Refresh Index (TD-53). They lived only in the
# core example, which K3s never merges, so /status served [] and Refresh Index answered ok
# with nothing updated. ^IXIC (Polygon I:COMP) is not listed: it is index data, and the
# Indices plan is not subscribed (0 of 1255 sessions), so it could only ever fail.
reference_indices:
  - symbol: "^GSPC"
    label: "S&P 500 (SPY)"
    polygon_ticker: "SPY"
  - symbol: "^DJI"
    label: "Dow 30 (DIA)"
    polygon_ticker: "DIA"
  - symbol: "^VIX"
    label: "VIX (VIXY)"
    polygon_ticker: "VIXY"
