# Wave 6 — allow api-monitor to POST satellite audit to platform-api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-monitor-platform-audit-egress
  labels:
    app.kubernetes.io/component: api-monitor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-monitor
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-platform-stg
      ports:
        - protocol: TCP
          port: 8780
