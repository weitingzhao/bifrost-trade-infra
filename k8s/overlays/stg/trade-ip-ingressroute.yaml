# IP-only gateway — http://192.168.10.73:30880/ (no /etc/hosts).
# NodePort escape hatch (no Host required) — entryPoint trade-stg :30880.
# Preferred path: http://stg.trader.bifrost.lan/ via VIP :80.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trade-gateway-ip
  labels:
    app.kubernetes.io/name: trade-gateway-ip
    app.kubernetes.io/component: ingress
    bifrost.io/gateway-host: stg.trader.bifrost.lan
spec:
  entryPoints:
    - trade-stg
  routes:
    - match: PathPrefix(`/api/monitor`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-monitor
        - name: sse-streaming
      services:
        - name: api-monitor
          port: 8765
          responseForwarding:
            flushInterval: 1ms
    # /api/docs and /api/ops are aliases for the api-monitor pods. Route only the paths
    # they own, so monitor's /control/* and /config/* stay reachable at /api/monitor
    # only, where the D10 preflight guard looks (debt TD-07). The /account-sync/control/*
    # routes this also covered were removed with account-sync (2026-10-02, TD-22).
    - match: (Path(`/api/docs/health`) || PathPrefix(`/api/docs/research/docs/`))
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-docs
        - name: sse-streaming
      services:
        - name: api-docs
          port: 8765
          responseForwarding:
            flushInterval: 1ms
    - match: (Path(`/api/ops/health`) || Path(`/api/ops/data-probe`) || PathPrefix(`/api/ops/ops/`))
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-ops
        - name: sse-streaming
      services:
        - name: api-ops
          port: 8765
          responseForwarding:
            flushInterval: 1ms
    - match: PathPrefix(`/api/trading`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-trading
        - name: sse-streaming
      services:
        - name: api-trading
          port: 8769
          responseForwarding:
            flushInterval: 1ms
    - match: PathPrefix(`/api/strategy`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-strategy
        - name: sse-streaming
      services:
        - name: api-strategy
          port: 8769
          responseForwarding:
            flushInterval: 1ms
    - match: PathPrefix(`/api/portfolio`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-portfolio
        - name: sse-streaming
      services:
        - name: api-portfolio
          port: 8769
          responseForwarding:
            flushInterval: 1ms
    # /api/account is api-account's own prefix (TD-55 B1, Owner 2026-10-04 option B).
    # /api/trading, /api/strategy and /api/portfolio above are aliases of the same process;
    # they keep answering until B2 removes them after 7 days of zero traffic.
    - match: PathPrefix(`/api/account`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-account
        - name: sse-streaming
      services:
        - name: api-account
          port: 8769
          responseForwarding:
            flushInterval: 1ms
    - match: PathPrefix(`/api/market`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-market
        - name: sse-streaming
      services:
        - name: api-market
          port: 8772
          responseForwarding:
            flushInterval: 1ms
    - match: PathPrefix(`/api/research`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-research
        - name: sse-streaming
      services:
        - name: api-research
          port: 8773
          responseForwarding:
            flushInterval: 1ms
    - match: PathPrefix(`/api/plugin/market-data`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-market-data
      services:
        - name: market-data-api
          namespace: plugin-market-data
          port: 8790
    - match: PathPrefix(`/api/plugin/flex-query`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-flex-query
        - name: flex-query-trade-gateway
      services:
        - name: flex-query-api
          namespace: plugin-flex-query
          port: 8791
    - match: PathPrefix(`/api/plugin/research`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-research
        - name: research-env-header
        - name: sse-streaming
      services:
        - name: research-api
          namespace: research
          port: 8795
    # Ops Platform plugin status, same-origin for the Trade cockpit.
    # Read-only by construction: `/status` only, so the rest of
    # platform-api is not reachable from the Trade origin.
    - match: PathRegexp(`^/api/platform/plugins/[a-z0-9-]+/status$`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-platform
        - name: add-platform-api-v1
      services:
        - name: platform-api
          namespace: bifrost-platform-prod
          port: 8780
    - match: Path(`/health`)
      kind: Rule
      priority: 50
      services:
        - name: frontend
          port: 80
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: frontend
          port: 80
