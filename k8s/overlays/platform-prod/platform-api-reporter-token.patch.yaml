# Reporter token — must match PLATFORM_PROD_REPORTER_TOKEN in bifrost-platform-reporter-token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: PLATFORM_PROD_REPORTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-reporter-token
                  key: PLATFORM_PROD_REPORTER_TOKEN
                  optional: true
