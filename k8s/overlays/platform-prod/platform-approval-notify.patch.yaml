# Phone push when an approval is created. The token matches the operator-plane
# relay's ALERT_RELAY_TOKEN and lives in Secret bifrost-platform-approval-notify
# (key APPROVAL_NOTIFY_TOKEN). optional: pods start before the Secret exists;
# the client logs and skips when the token is empty. Do not put the value here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: APPROVAL_NOTIFY_URL
              value: "http://192.168.10.50:8783/api/v1/alerts/notify"
            - name: APPROVAL_NOTIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-approval-notify
                  key: APPROVAL_NOTIFY_TOKEN
                  optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: APPROVAL_NOTIFY_URL
              value: "http://192.168.10.50:8783/api/v1/alerts/notify"
            - name: APPROVAL_NOTIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-approval-notify
                  key: APPROVAL_NOTIFY_TOKEN
                  optional: true
