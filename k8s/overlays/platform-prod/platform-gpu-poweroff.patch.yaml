# Owner supplies a pinned host key and a key accepted only by the 4090's poweroff account.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: GPU_POWEROFF_SSH_DIR
              value: /etc/bifrost/gpu-poweroff-ssh
          volumeMounts:
            - name: gpu-poweroff-ssh
              mountPath: /etc/bifrost/gpu-poweroff-ssh
              readOnly: true
      volumes:
        - name: gpu-poweroff-ssh
          secret:
            secretName: gpu-poweroff-ssh
            defaultMode: 0400
            optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: GPU_POWEROFF_SSH_DIR
              value: /etc/bifrost/gpu-poweroff-ssh
          volumeMounts:
            - name: gpu-poweroff-ssh
              mountPath: /etc/bifrost/gpu-poweroff-ssh
              readOnly: true
      volumes:
        - name: gpu-poweroff-ssh
          secret:
            secretName: gpu-poweroff-ssh
            defaultMode: 0400
            optional: true
