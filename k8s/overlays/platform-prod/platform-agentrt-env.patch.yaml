# W-31 2.2b: the agent runtime on PROD (design v5 §5.2), the first slice the
# Owner chose to run on PROD (2026-10-15 evening: 「直接按 5 步上 PROD」 and the
# checklist he agreed). The platform connects as the environment's runtime
# role to its own database; the password is the Secret the Owner made in 2.1
# (OWNER-STEPS-agentrt-21, step 1). Without the Secret the variable is empty,
# the connection fails and the runtime's routes answer 503; the rest of the
# platform is untouched. platform-workers runs the controller loops,
# platform-api the routes. AGENTRT_GIT_ORG: the Gitea organization agent
# branches are pushed to and the result check reads, the same as STG's:
# bifrost since Gitea-primary batch A (Owner 2026-10-17 22:4x 「推 PROD 接线」;
# bifrost/bifrost-platform and bifrost-ui are Gitea's own repositories with
# protected agent/** branches), bifrost-agents before. Only platform-api serves
# persist.
# AGENTRT_REDIS_*: redis-agents of this namespace, as on STG (W-31 2.3; Owner
# 2026-10-18 「同意：心跳加 actions，只在 Redis 存 24 小时」): the workers run
# the relay on it, platform-api writes and reads attempts' actions there. The
# password is the Secret the redis-agents Deployment reads; its
# NetworkPolicy already admits platform-api and platform-workers.
# AGENTRT_LEDGER (TD-391, Owner 2026-10-20 「AI 评估用 A」): the ledger an
# assessment of a card or an approval reads its items from, as
# <repository>/<path> at main through the Gitea mirror; only the workers run
# the assessments.
# UNIT_DISPATCH (CI root design, landing stage 2 block 2-C; Owner 2026-11-13):
# shadow has the platform create unit TaskRuns in cicd when asked (POST
# /api/v1/units/evidence) and record their results in the evidence ledger; no
# gate reads those rows yet. UNIT_NODE_SELECTOR keeps the unit pods on one
# node, the one the CI design measured. To go back: remove the two variables
# (or set UNIT_DISPATCH to off) and sync; runs already started finish and are
# still recorded. platform-api serves the route; the workers start the one
# retry of a run the cluster lost.
# HEAD_RELEASE (2026-11-13, design: side-session notes ci-speed/release-head.md;
# platform 2d099561): stg has the workers release the newest head of platform
# main to STG by themselves when the evidence ledger has it green, one delivery
# at a time, and write a record of every decision to the audit log (action
# head_release). Nothing is released to PROD by it. Why: that day three STG
# deliveries failed because each line released its own commit while main
# moved, and commits waited 13 and 22.7 minutes for a release window other
# lines held. Only the workers read it (the loop runs there). To go back:
# remove the variable (or set it to off) and sync; a delivery already started
# finishes. Turn it off before releasing an older commit to STG by hand, or
# the loop releases main's head over it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: UNIT_DISPATCH
              value: shadow
            - name: UNIT_NODE_SELECTOR
              value: bifrost.io/host-id=ubt-k3s-05
            - name: AGENTRT_ENV
              value: prod
            - name: AGENTRT_GIT_ORG
              value: bifrost
            - name: AGENTRT_REDIS_ADDR
              value: redis-agents:6379
            - name: AGENTRT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-agents
                  key: password
            - name: AGENTRT_DSN
              value: host=bifrost-postgres-rw.data.svc.cluster.local port=5432 dbname=bifrost_platform user=platform_agentrt_prod sslmode=require
            - name: AGENTRT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentrt-db-runtime
                  key: password
                  optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: HEAD_RELEASE
              value: stg
            - name: UNIT_DISPATCH
              value: shadow
            - name: UNIT_NODE_SELECTOR
              value: bifrost.io/host-id=ubt-k3s-05
            - name: AGENTRT_LEDGER
              value: bifrost-trade-infra/agent-config/TECH_DEBT.md
            - name: AGENTRT_ENV
              value: prod
            - name: AGENTRT_REDIS_ADDR
              value: redis-agents:6379
            - name: AGENTRT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-agents
                  key: password
            - name: AGENTRT_DSN
              value: host=bifrost-postgres-rw.data.svc.cluster.local port=5432 dbname=bifrost_platform user=platform_agentrt_prod sslmode=require
            - name: AGENTRT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentrt-db-runtime
                  key: password
                  optional: true
