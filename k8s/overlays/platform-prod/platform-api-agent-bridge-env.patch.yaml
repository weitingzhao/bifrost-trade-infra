# Seat pin and the browser Grafana URL. The remediation runner (:8781) was
# removed (LANE-W33); do not put REMEDIATION_RUNNER_* back. OPERATOR_PLANE_URL
# is a separate patch. LAN values are non-secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            # Explicit seat pin (overrides clusters.yaml; local make start stays DEV without this).
            - name: OPS_VIEWER_ENV
              value: "prod"
            - name: NOUS_HERMES_URL
              value: "http://192.168.10.50:9119"
            - name: PLATFORM_GRAFANA_URL
              value: "https://ops.bifrost.lan/grafana"
