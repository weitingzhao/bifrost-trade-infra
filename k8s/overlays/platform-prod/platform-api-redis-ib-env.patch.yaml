# REDIS_IB_PLATFORM_PASS lives in gitignored Secret redis-ib-platform
# (apply from plugin .env REDIS_IB_PLATFORM_PASS — see docs/SECRETS.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: REDIS_IB_PLATFORM_PASS
              valueFrom:
                secretKeyRef:
                  name: redis-ib-platform
                  key: password
                  optional: true
