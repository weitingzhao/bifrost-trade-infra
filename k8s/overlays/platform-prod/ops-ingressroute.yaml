# Rocket Ops Console — Traefik Host on VIP :80.
# Primary: ops.bifrost.lan → platform-console (nginx proxies /api → platform-api).
# Escape hatch remains NodePort :30877.
# Smoke: curl -sS -o /dev/null -w '%{http_code}\n' -H 'Host: ops.bifrost.lan' https://192.168.10.100/
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-gateway
  labels:
    app.kubernetes.io/name: ops-gateway
    app.kubernetes.io/component: ingress
    bifrost.io/gateway-host: ops.bifrost.lan
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    # Traefik evaluates the highest priority first. Trade PathPrefix routes use
    # 100; the Console host rule is 10. /grafana must win or Console swallows it.
    - match: Host(`ops.bifrost.lan`) && PathPrefix(`/grafana`)
      kind: Rule
      priority: 100
      services:
        - name: kube-prometheus-stack-grafana
          namespace: monitoring
          port: 80
    - match: Host(`ops.bifrost.lan`)
      kind: Rule
      priority: 10
      services:
        - name: platform-console
          port: 80
