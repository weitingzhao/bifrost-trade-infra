# Registered Bifrost Trade environments for connectivity matrix (Phase 0).
# In-cluster platform-api MUST use Traefik NodePort escape hatches — CoreDNS cannot
# resolve *.bifrost.lan, and VIP :80 redirects to https://*.lan (DNS fail on follow).

environments:
  - id: dev
    label: Development
    probe_mode: pull
    nginx_base: http://192.168.10.73:30882
    ingress_host: dev.trader.bifrost.lan
    ingress_node_ip: 192.168.10.73
    postgres:
      host: 192.168.10.73
      port: 30432
    redis:
      host: 192.168.10.73
      port: 30379
    ops_token_env: BIFROST_DEV_OPS_TOKEN
    # Trade workload namespace and logical DB (read by cluster / ib-gateway probes, TD-231).
    namespace: bifrost-dev
    database: bifrost_dev

  - id: stg
    label: Staging
    probe_mode: pull
    nginx_base: http://192.168.10.73:30880
    ingress_host: stg.trader.bifrost.lan
    ingress_node_ip: 192.168.10.73
    postgres:
      host: 192.168.10.73
      port: 30432
    redis:
      # in-cluster Service; the LAN NodePort 30380 was removed (TD-205)
      host: redis-live-stg.data.svc.cluster.local
      port: 6379
    ops_token_env: BIFROST_STG_OPS_TOKEN
    # Trade workload namespace and logical DB (read by cluster / ib-gateway probes, TD-231).
    namespace: bifrost-stg
    database: bifrost_stg

  - id: prod
    label: Production
    probe_mode: pull
    # Traefik trade-prod entryPoint — plain HTTP, no HTTPS redirect.
    nginx_base: http://192.168.10.73:30881
    ingress_host: trader.bifrost.lan
    ingress_node_ip: 192.168.10.73
    postgres:
      host: 192.168.10.73
      port: 30432
    redis:
      # in-cluster Service; the LAN NodePort 30382 was removed (TD-205)
      host: redis-live-prod.data.svc.cluster.local
      port: 6379
    ops_token_env: BIFROST_PROD_OPS_TOKEN
    # Trade workload namespace and logical DB (read by cluster / ib-gateway probes, TD-231).
    namespace: bifrost-prod
    database: bifrost_prod
