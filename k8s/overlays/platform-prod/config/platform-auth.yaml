# Bifrost Ops Platform auth for L1+ actuation — PROD instance.
# Prod tokens MUST differ from STG. No inline tokens: every role comes from its token_env
# (Secrets bifrost-platform-role-tokens, -reporter-token, -satellite-tokens).

tokens:
  - name: viewer
    role: viewer
    token_env: PLATFORM_PROD_VIEWER_TOKEN
  # See STG note. No inline value — prod tokens come from the environment only.
  - name: reporter
    role: reporter
    token_env: PLATFORM_PROD_REPORTER_TOKEN
  - name: operator
    role: operator
    token_env: PLATFORM_PROD_OPERATOR_TOKEN
  - name: admin
    role: admin
    token_env: PLATFORM_PROD_ADMIN_TOKEN
  - name: trade-satellite
    role: operator
    token_env: PLATFORM_SATELLITE_AUDIT_TOKEN
  # agentd:mbp-dev (the dev Mac) was removed on 2026-10-17 (Owner 「清理 PROD 的
  # mbp-dev」) when the Mac agentd retired and agent-06 took over (W-31 2.3);
  # its key in the Secret bifrost-platform-role-tokens is the Owner's to delete.
  # W-31 2.3 (Owner 2026-10-17): the PROD agentd on the agent host ubt-k3s-06
  # (out of the cluster), user bifrost-agentd; bound to host agent-06. It took
  # over from agentd:mbp-dev on 2026-10-17.
  - name: agentd:agent-06
    role: agentd
    token_env: PLATFORM_PROD_AGENTD_AGENT_06_TOKEN
