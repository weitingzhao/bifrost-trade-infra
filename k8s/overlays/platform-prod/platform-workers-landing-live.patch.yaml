# W-31 4.1 S3 (CUT-landing-2026-10-24.md §11.11): the PROD landing. Only the
# workers tier runs the controller (api/internal/server/agentrt_landing.go).
# It reads main as agentrt-lander, whose Gitea team writes bifrost-platform
# only and which is on platform main's whitelist alone (infra waits for S6;
# no tag, no protection change). The Owner makes Secret agentrt-lander
# (kubernetes.io/basic-auth: username, password) in this namespace with
# scripts/gitea/put-reader-token.sh lander; the controller reads the two
# files at each git call and never puts the token in its environment.
# Without the Secret every read of main records unreadable and no landing
# runs.
#
# AGENTRT_LANDING_LIVE_REPOS names the repositories that land live (S3
# opening for platform, S6 for infra): the workers record the live mode, claim
# under the signed landing rule and push those repositories' main as
# agentrt-lander. To stop landings, set it to "": the workers then only
# reconcile main and settle bounds and cards from the database, writing no
# claim or push.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            # W-31 S6 opening (2026-10-31): infra joins the live landing under
            # the signed landing:dev v3 (landing/repos.go LiveRepos).
            - name: AGENTRT_LANDING_LIVE_REPOS
              value: "bifrost-platform,bifrost-trade-infra"
            # R5:5.7 countdown 20: a platform landing CI names its base M0, so
            # test-api runs only the tests the change touches, and the daily
            # full run asks for the whole suite. Both params are declared by the
            # bifrost-ci-platform Pipeline in k8s/cicd/tekton, applied by an
            # apply_manifest card: apply that card before these workers send them.
            - name: AGENTRT_LANDING_CI_BASE_PARAM
              value: "on"
            - name: AGENTRT_FULL_CI_PARAM
              value: "on"
            - name: AGENTRT_LANDER_USERNAME_FILE
              value: /etc/bifrost/lander/username
            - name: AGENTRT_LANDER_PASSWORD_FILE
              value: /etc/bifrost/lander/password
          volumeMounts:
            - name: lander
              mountPath: /etc/bifrost/lander
              readOnly: true
      volumes:
        - name: lander
          secret:
            secretName: agentrt-lander
            optional: true
            defaultMode: 0400
