# platform-workers on PROD (2026-11-06): after the R5:5.7 release at 09:28 CDT (platform
# 5661d6c4) the workers ran at the 1-core CPU limit (0.99 cores; 0.74 at peak before) and were
# OOMKilled once at 512Mi (09:57 CDT, while the first landing of the new lane was in its
# drill). Several loops then took 12-30 s a pass (facts-rules, landing-drill, STG release).
# 2 cores and 1536Mi, as platform-api has since 10-31, give headroom while the slow passes
# are found and fixed. The node has ample allocatable memory.
# 18:30 CDT the same day: at 2 cores the workers used 1.3 on average and were CPU-throttled
# in 42% of periods; the landing drill's git fetches then timed out every pass and no
# landing was claimed (dozens of stale landing operations replayed each pass). The Owner
# asked why 2 when every node has 16 cores: no number here was ever measured. So no CPU
# limit (a limit only throttles, while the node is ~12% busy); a 1-core request keeps a fair
# share when the node is busy. The memory limit stays, so a leak cannot take the node down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      containers:
        - name: platform-api
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: null
              memory: 1536Mi
