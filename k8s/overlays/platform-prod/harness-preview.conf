map $http_upgrade $harness_connection {
    default upgrade;
    ''      close;
}

# Traefik marks the TLS WebSocket handshake as wss.
map $http_x_forwarded_proto $harness_secure_transport {
    default 0;
    https   1;
    wss     1;
}

# Station 2026-11-24: the IDE gateway runs on both Mac minis; mini-02 takes over when mini-01 is down.
upstream harness_gateway {
    server 192.168.10.52:14202 max_fails=2 fail_timeout=30s;
    server 192.168.10.50:14202 backup;
}

server {
    listen 80;
    server_name opencode-preview.ops.bifrost.lan deepseek-preview.ops.bifrost.lan;

    location / {
        if ($harness_secure_transport = 0) {
            return 426;
        }
        proxy_pass http://harness_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $harness_connection;
        proxy_buffering off;
        proxy_redirect off;
        proxy_read_timeout 300s;
    }
}
