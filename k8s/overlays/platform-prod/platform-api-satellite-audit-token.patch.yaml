# Trade satellite audit token — must match PLATFORM_SATELLITE_AUDIT_TOKEN in bifrost-prod-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: PLATFORM_SATELLITE_AUDIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-satellite-tokens
                  key: PLATFORM_SATELLITE_AUDIT_TOKEN
                  optional: true
