# TD-204: run as the least-privilege ServiceAccount; the kubeconfig volume now
# comes from a ConfigMap that points at the pod's token instead of the admin
# kubeconfig Secret. Roll back by deleting this patch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      serviceAccountName: bifrost-platform
      volumes:
        - name: kubeconfig
          secret: null
          configMap:
            name: bifrost-platform-sa-kubeconfig
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      serviceAccountName: bifrost-platform
      volumes:
        - name: kubeconfig
          secret: null
          configMap:
            name: bifrost-platform-sa-kubeconfig
