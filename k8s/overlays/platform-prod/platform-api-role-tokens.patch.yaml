# Viewer / operator / admin tokens — Secret bifrost-platform-role-tokens, written by
# scripts/k3s/apply-platform-role-tokens.sh from .env. config/platform-auth.yaml has
# no inline values: without this Secret the three roles simply cannot sign in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: PLATFORM_PROD_VIEWER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-role-tokens
                  key: PLATFORM_PROD_VIEWER_TOKEN
                  optional: true
            - name: PLATFORM_PROD_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-role-tokens
                  key: PLATFORM_PROD_OPERATOR_TOKEN
                  optional: true
            - name: PLATFORM_PROD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-role-tokens
                  key: PLATFORM_PROD_ADMIN_TOKEN
                  optional: true
            - name: PLATFORM_PROD_AGENTD_AGENT_06_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-role-tokens
                  key: PLATFORM_PROD_AGENTD_AGENT_06_TOKEN
                  optional: true
            - name: PLATFORM_PROD_SEAT_COORDINATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-role-tokens
                  key: PLATFORM_PROD_SEAT_COORDINATOR_TOKEN
                  optional: true
            - name: PLATFORM_PROD_AGENTD_COORDINATOR_MBP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-role-tokens
                  key: PLATFORM_PROD_AGENTD_COORDINATOR_MBP_TOKEN
                  optional: true
            - name: APPROVAL_TICKET_KEY
              valueFrom:
                secretKeyRef:
                  name: owner-exec-host-tickets
                  key: ticket-key
                  optional: true
            - name: OWNER_EXEC_WORK_MAC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: owner-exec-host-tickets
                  key: work-mac
                  optional: true
            - name: OWNER_EXEC_MINI_01_TOKEN
              valueFrom:
                secretKeyRef:
                  name: owner-exec-host-tickets
                  key: ops-mac-agent-01
                  optional: true
            - name: OWNER_EXEC_MINI_02_TOKEN
              valueFrom:
                secretKeyRef:
                  name: owner-exec-host-tickets
                  key: ops-mac-agent-02
                  optional: true
            - name: OWNER_EXEC_AGENT_06_TOKEN
              valueFrom:
                secretKeyRef:
                  name: owner-exec-host-tickets
                  key: ubt-k3s-06
                  optional: true
