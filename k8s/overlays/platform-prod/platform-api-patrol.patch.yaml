# platform-api serves /patrol/skills and runs a manual trigger in-process
# (W-33). It needs the same skill files and the same dispatch/mode as
# platform-workers, or /patrol/skills is empty and an L1 skill calls Cursor
# Cloud. The patrol loop stays on platform-workers: this patch does not set
# PLATFORM_PATROL_LOOP, and it does not set CHECKLIST_PROBER.
#
#   PATROL_SKILLS_DIR=/app/patrol-skills
#   PATROL_MODE=report
#   PATROL_DISPATCH=local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: PATROL_SKILLS_DIR
              value: /app/patrol-skills
            - name: PATROL_MODE
              value: report
            - name: PATROL_DISPATCH
              value: local
          volumeMounts:
            - name: patrol-skills
              mountPath: /app/patrol-skills
              readOnly: true
      volumes:
        - name: patrol-skills
          configMap:
            name: bifrost-platform-patrol-skills
