# DEV: inject bifrost-dev-secrets into Discovery / Massive APIs.
# Secret already holds MASSIVE_API_KEY + POLYGON_API_KEY (and Ops tokens).
# Without this, api-research / api-massive only see empty config.stg massive.api_key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-research
spec:
  template:
    spec:
      containers:
        - name: api-research
          envFrom:
            - secretRef:
                name: bifrost-dev-secrets
                optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-massive
spec:
  template:
    spec:
      containers:
        - name: api-massive
          envFrom:
            - secretRef:
                name: bifrost-dev-secrets
                optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ops
spec:
  template:
    spec:
      containers:
        - name: api-ops
          envFrom:
            - secretRef:
                name: bifrost-dev-secrets
                optional: true
