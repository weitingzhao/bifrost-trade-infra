# DEV: inject bifrost-dev-secrets into Discovery / Ops APIs.
# Secret already holds MASSIVE_API_KEY + POLYGON_API_KEY (and Ops tokens).
# Without this, api-research only sees empty config.stg massive.api_key.
# P7: api-massive REST retired from base manifests — no longer patched here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-research
spec:
  template:
    spec:
      containers:
        - name: api-research
          envFrom:
            - secretRef:
                name: bifrost-dev-secrets
                optional: true
