apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bifrost-dev

resources:
  - namespace.yaml
  - ../../base
  - trade-ingressroute.yaml
  - trade-http-redirect.yaml
  - trade-ip-ingressroute.yaml
  - research-env-header.yaml
  - db-init-dev.job.yaml
  - api-monitor-platform-audit-egress.yaml
  - position-snapshot.cronjob.yaml

configMapGenerator:
  - name: bifrost-config
    files:
      # Every pod mounts its env's config as runtime.yaml (TD-52).
      - runtime.yaml=config/config.dev.yaml
    options:
      disableNameSuffixHash: true

patches:
  - path: bifrost-env.patch.yaml
  - path: daemon-scale-one.patch.yaml
  - path: daemon-golden-writes-off.patch.yaml
  - path: node-control-plane.patch.yaml
  - path: dev-images-pull-always.patch.yaml
  - path: postgres-remove.patch.yaml
  - path: redis-remove.patch.yaml
  - path: delete-db-init-stg.patch.yaml
  # P8: Trade Discovery needs Polygon keys; Massive Celery ingest retired (Plugin market-data).
  - path: dev-secrets-env.patch.yaml
  - path: dev-write-token-secret.patch.yaml

images:
  # DEV runs its own :dev tags (TD-34). They used to inherit :stg, so a DEV restart picked up
  # whatever STG last built and DEV-only builds pushed :stg, which STG -- the smoke gate before
  # PROD -- then ran on its next restart. :dev is pushed by the DEV-only builds
  # (bifrost-build-frontend-stg, the dev-api-only runs); STG and PROD delivers never touch it.
  # The worker has no DEV-only build: `make dev-sync-backend-images` copies the backend :stg
  # tags to :dev (it froze before TD-04 and DEV's daemon read no account snapshot, 2026-10-02).
  # Keep api-monitor on the shared registry (same pattern as account/market/research).
  # A previous local tag (dev-live-fix-*) is not on nodes and caused ImagePullBackOff,
  # which blocked rollout after Secret rotation → stale PGPASSWORD → empty Accounts.
  - name: registry.cicd.svc.cluster.local:5000/bifrost-api-monitor
    newName: 192.168.10.73:30500/bifrost-api-monitor
    newTag: dev
  - name: registry.cicd.svc.cluster.local:5000/bifrost-api-account
    newName: 192.168.10.73:30500/bifrost-api-account
    newTag: dev
  - name: registry.cicd.svc.cluster.local:5000/bifrost-api-market
    newName: 192.168.10.73:30500/bifrost-api-market
    newTag: dev
  - name: registry.cicd.svc.cluster.local:5000/bifrost-api-research
    newName: 192.168.10.73:30500/bifrost-api-research
    newTag: dev
  - name: registry.cicd.svc.cluster.local:5000/bifrost-frontend
    newName: 192.168.10.73:30500/bifrost-frontend
    newTag: dev
  - name: registry.cicd.svc.cluster.local:5000/bifrost-worker
    newName: 192.168.10.73:30500/bifrost-worker
    newTag: dev

commonAnnotations:
  bifrost.io/environment: dev

labels:
  - pairs:
      bifrost.io/environment: dev
    includeSelectors: false
