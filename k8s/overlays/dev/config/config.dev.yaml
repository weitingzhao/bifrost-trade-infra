# Dev overlay — deep-merged over config.yaml (from core example).
# NOTE: LOCAL Docker Compose fallback (non-K3s). Canonical K3s config:
#   k8s/overlays/dev/config/config.dev.yaml (CNPG @ data NS, bifrost_dev).
# Local LAN access: NodePort 30432 on any Ready node (see k8s/data/postgres-nodeport.yaml).
# ops.auth.tokens：UI Authenticate 用此处 token (Settings → API Health / Socket / Celery)。

server:
  skip_monitor_ib: false
  architecture:
    monitor_port: 8765
    docs_port: 8767
    ops_port: 8768
  account:
    trading_port: 8769
    portfolio_port: 8771
  research:
    research_port: 8773
    market_port: 8772
    strategy_port: 8770
  feed:
    massive_port: 8766  # legacy — api-massive retired (P7)

sink: postgres

ib:
  connect_timeout: 60.0
  host:
    ip: 192.168.10.30
    port_type: tws_live
    client_id:
      daemon: 10
      listener: 1
      operator: 20
      worker_market: 40
      ingestor: 50
      account_agent: 60
  secondary:
    ip: 192.168.10.33
    port_type: tws_live
    client_id:
      listener: 1
      operator: 20
      account_agent: 60

utilized:
  services:
    server: dev
    massive: dev
    docs: dev
    ops: dev
    trading: dev
    strategy: dev
    portfolio: dev
    market: dev
    research: dev

postgres:
  host: 192.168.10.73
  port: 30432
  user: bifrost
  password: ""
  database: bifrost_dev

# Shared brokerage Golden Source (IB account/positions/executions)
golden_source:
  host: 192.168.10.73
  port: 30432
  database: bifrost_golden_source
  user: bifrost
  password: ""
  fdw_user: brokerage_reader
  fdw_password: ""

redis:
  enabled: true
  host: 192.168.10.70
  port: 6379
  db: 0

redis_ib:
  enabled: true
  host: host.docker.internal
  port: 6380
  db: 0
  username: trade-prod
  password: ""

ib_operator:
  enabled: true
  stream: "ib:operator:cmd"
  consumer_group: ib-operator
  result_prefix: "ib:operator:result:"
  health_key: "bifrost:health:ws_ib_operator"
  result_ttl_sec: 300
  request_timeout_sec: 120
  bars_backfill_request_timeout_sec: 7200
  health_refresh_sec: 30
  max_result_bytes: 4194304
  block_ms: 5000

ops:
  control_profile: dev
  executor_mode: kubernetes
  daemon_scale_guard: freeze
  auth:
    default_role: "admin" # dev convenience: unauthenticated = admin
    allow_unauthenticated_reads: true
    tokens: []
  platform_audit:
    enabled: false
    url: http://platform-api.bifrost-platform-stg.svc.cluster.local:8780
    timeout_ms: 2000

# Plugin redis-massive — ExternalName → redis-massive.data.svc.cluster.local
redis_massive:
  enabled: true
  host: redis-massive
  port: 6379
  db: 0
  username: trade-prod
  password: ""


# api_key + rest_base still used by Research REST (polygon_http); WS migrated to Plugin
massive:
  api_key: ""
