# K3s bifrost-dev — the only config for this env, mounted into every pod as
# /app/config/runtime.yaml (TD-06, TD-52). Nothing is merged under it; the old header said
# "deep-merged over config.yaml", which never happened in K3s (TD-53).
# Local LAN access: NodePort 30432 on any Ready node (see k8s/data/postgres-nodeport.yaml).
# ops.auth.tokens：UI Authenticate 用此处 token (Settings → API Health / Socket)。

server:
  skip_monitor_ib: false
  # The four ports something listens on (TD-79). docs, ops, portfolio, strategy and
  # massive ports are gone: nothing listened on them, and core no longer requires them.
  architecture:
    monitor_port: 8765
  account:
    account_port: 8769
  research:
    research_port: 8773
    market_port: 8772

sink: postgres

ib:
  connect_timeout: 60.0
  host:
    ip: 192.168.10.30
    port_type: tws_live
    client_id:
      daemon: 10
      listener: 1
      operator: 20
      worker_market: 40
      ingestor: 50
      account_agent: 60
  secondary:
    ip: 192.168.10.33
    port_type: tws_live
    client_id:
      listener: 1
      operator: 20
      account_agent: 60

utilized:
  services:
    server: dev
    massive: dev
    docs: dev
    ops: dev
    trading: dev
    strategy: dev
    portfolio: dev
    market: dev
    research: dev

# In-cluster CNPG (pods cannot reliably reach LAN NodePort 30432 — hairpin/NP).
# Mac / thin-client LAN access remains via bifrost-postgres-lan :30432.
postgres:
  host: bifrost-postgres-rw.data.svc.cluster.local
  port: 5432
  # TD-85: the Trade runtime's role. PGUSER / GOLDEN_SOURCE_USER in bifrost-dev-secrets win over
  # these lines (env first, TD-54); db-init signs in as bifrost through bifrost-dev-db-owner.
  user: trade_app_dev
  password: ""
  database: bifrost_dev

# Shared brokerage Golden Source (IB account/positions/executions)
golden_source:
  host: bifrost-postgres-rw.data.svc.cluster.local
  port: 5432
  database: bifrost_golden_source
  user: trade_app_dev
  password: ""
  fdw_user: brokerage_reader
  fdw_password: ""

redis:
  enabled: true
  host: redis-dev.data.svc.cluster.local
  port: 6379
  db: 0

redis_ib:
  enabled: true
  host: redis-ib
  port: 6379
  db: 0
  # DEV's own redis-ib user (TD-21). REDIS_IB_USERNAME / REDIS_IB_PASSWORD in bifrost-dev-secrets
  # override this; bifrost-platform-plugin scripts/redis-ib-env-users.sh switches them.
  username: trade-dev
  password: ""

ib_operator:
  enabled: true
  # DEV's own command stream: trade-dev may write only this one, and the gateway answers read
  # ops only here — DEV cannot disconnect or reconnect the gateway PROD uses (TD-21).
  stream: "ib:operator:cmd:dev"
  consumer_group: ib-operator
  result_prefix: "ib:operator:result:"
  health_key: "bifrost:health:ws_ib_operator"
  result_ttl_sec: 300
  request_timeout_sec: 120
  health_refresh_sec: 30
  max_result_bytes: 4194304
  block_ms: 5000

ops:
  control_profile: dev
  executor_mode: kubernetes
  daemon_scale_guard: freeze
  auth:
    # TD-23: an anonymous caller reads; a write needs the Operator sign-in
    # (OPS_OPERATOR_TOKEN / OPS_ADMIN_TOKEN, scripts/trade-operator-tokens.sh).
    default_role: viewer
    tokens: []
  platform_audit:
    enabled: false
    url: http://platform-api.bifrost-platform-stg.svc.cluster.local:8780
    timeout_ms: 2000

# api_key + rest_base still used by Research REST (polygon_http); Polygon WS ingest retired
massive:
  api_key: ""

# Reference indices for the market strip and Refresh Index (TD-53). They lived only in the
# core example, which K3s never merges, so /status served [] and Refresh Index answered ok
# with nothing updated. ^IXIC (Polygon I:COMP) is not listed: it is index data, and the
# Indices plan is not subscribed (0 of 1255 sessions), so it could only ever fail.
reference_indices:
  - symbol: "^GSPC"
    label: "S&P 500 (SPY)"
    polygon_ticker: "SPY"
  - symbol: "^DJI"
    label: "Dow 30 (DIA)"
    polygon_ticker: "DIA"
  - symbol: "^VIX"
    label: "VIX (VIXY)"
    polygon_ticker: "VIXY"
