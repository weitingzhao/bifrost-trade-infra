# DEV: the daemon must not write the shared Golden Source.
#
# raw_broker.* (accounts, positions, open orders, TWS executions) lives in
# bifrost_golden_source, which every environment shares; account/positions
# are written by the PROD daemon's PostgresSink. Without this flag the DEV
# daemon writes them too: write_snapshot's accounts sync and ib_edge's
# write_open_orders / write_account_executions stand down only when
# ACCOUNT_SYNC_DAEMON_ENABLED is set. account-sync stays at replicas 0 in DEV,
# so nothing in DEV writes those tables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemon
spec:
  template:
    spec:
      containers:
        - name: daemon
          env:
            - name: ACCOUNT_SYNC_DAEMON_ENABLED
              value: "1"
