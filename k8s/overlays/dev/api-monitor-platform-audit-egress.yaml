# Wave 6 — DEV api-monitor egress: platform STG audit + cluster + LAN fallbacks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-monitor-platform-audit-egress
  labels:
    app.kubernetes.io/component: api-monitor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-monitor
  policyTypes:
    - Egress
  egress:
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data
    ports:
      - protocol: TCP
        port: 5432
      - protocol: TCP
        port: 6379
  - to:
      - ipBlock:
          cidr: 10.43.0.0/16
    ports:
      - protocol: TCP
        port: 443
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: bifrost-platform-stg
    ports:
      - protocol: TCP
        port: 8780
  # DEV overlay may use LAN NodePort PG / legacy redis (config.dev.yaml)
  - to:
      - ipBlock:
          cidr: 192.168.10.0/24
    ports:
      - protocol: TCP
        port: 30432
      - protocol: TCP
        port: 6379
