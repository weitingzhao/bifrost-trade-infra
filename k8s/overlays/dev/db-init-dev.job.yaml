apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-dev
  labels:
    app.kubernetes.io/name: db-init
    app.kubernetes.io/component: infra
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: bifrost-config
          configMap:
            name: bifrost-config
      containers:
        - name: db-init
          image: 192.168.10.73:30500/bifrost-api-monitor:dev
          imagePullPolicy: Always
          # The script ships under the image WORKDIR (Dockerfile.api-stg); /app holds only the mounted config.
          command:
            - python
            - /build/bifrost-trade-api/scripts/run_db_refresh_schema.py
          env:
            - name: BIFROST_CONFIG
              value: /app/config/runtime.yaml
            - name: BIFROST_ENV
              value: dev
            # TD-85: db-init runs the DDL as bifrost (owner of the Trade tables and of raw_broker /
            # ops_feedback); the runtime Pods sign in as trade_app_dev through PGUSER /
            # GOLDEN_SOURCE_USER in bifrost-dev-secrets. Explicit env wins over envFrom. optional: until
            # the Owner creates bifrost-dev-db-owner (scripts/trade-app-role.sh owner-secret dev) the
            # keys fall through to bifrost-dev-secrets, which is still on bifrost then.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: bifrost-dev-db-owner
                  key: PGUSER
                  optional: true
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-dev-db-owner
                  key: PGPASSWORD
                  optional: true
            - name: GOLDEN_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: bifrost-dev-db-owner
                  key: GOLDEN_SOURCE_USER
                  optional: true
            - name: GOLDEN_SOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-dev-db-owner
                  key: GOLDEN_SOURCE_PASSWORD
                  optional: true
          envFrom:
            - secretRef:
                name: bifrost-dev-secrets
                optional: true
          volumeMounts:
            - name: bifrost-config
              mountPath: /app/config/runtime.yaml
              subPath: runtime.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
