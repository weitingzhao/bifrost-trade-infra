# DEV: MARKET_DATA_WRITE_TOKEN lives in bifrost-dev-secrets (base defaults to stg).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-monitor
spec:
  template:
    spec:
      containers:
        - name: api-monitor
          env:
            - name: MARKET_DATA_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-dev-secrets
                  key: MARKET_DATA_WRITE_TOKEN
                  optional: true
---
