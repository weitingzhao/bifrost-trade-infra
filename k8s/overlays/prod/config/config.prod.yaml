# K3s bifrost-prod — the only config for this env, mounted into every pod as
# /app/config/runtime.yaml (TD-06, TD-52). Nothing is merged under it; the old header said
# "deep-merged over config.yaml", which never happened in K3s (TD-53).
# ops.auth.tokens：生产 token 勿提交 git；通过 .env OPS_* 或部署密钥注入。

server:
  skip_monitor_ib: false
  # The four ports something listens on (TD-79). docs, ops, portfolio, strategy and
  # massive ports are gone: nothing listened on them, and core no longer requires them.
  architecture:
    monitor_port: 8765
  account:
    account_port: 8769
  research:
    research_port: 8773
    market_port: 8772

sink: postgres

ib:
  connect_timeout: 60.0
  host:
    ip: 192.168.10.30
    port_type: tws_live
    client_id:
      daemon: 10
      listener: 1
      operator: 20
      worker_market: 40
      ingestor: 50
      account_agent: 60
  secondary:
    ip: 192.168.10.33
    port_type: tws_live
    client_id:
      listener: 1
      operator: 20
      account_agent: 60

utilized:
  services:
    server: prod
    massive: prod
    docs: prod
    ops: prod
    trading: prod
    strategy: prod
    portfolio: prod
    market: prod
    research: prod

# In-cluster CNPG (pods cannot reliably reach LAN NodePort 30432 — hairpin/NP).
# Mac / thin-client LAN access remains via bifrost-postgres-lan :30432.
postgres:
  host: bifrost-postgres-rw.data.svc.cluster.local
  port: 5432
  user: bifrost
  password: ""
  database: bifrost_prod

# Shared brokerage Golden Source (IB account/positions/executions)
golden_source:
  host: bifrost-postgres-rw.data.svc.cluster.local
  port: 5432
  database: bifrost_golden_source
  user: bifrost
  password: ""
  fdw_user: brokerage_reader
  fdw_password: ""

# In-cluster ExternalName `redis` → redis-live-prod @ data NS (see redis-remove.patch.yaml).
redis:
  enabled: true
  host: redis
  port: 6379
  db: 0

redis_ib:
  enabled: true
  host: redis-ib
  port: 6379
  db: 0
  username: trade-prod
  password: ""

ops:
  control_profile: prod
  executor_mode: kubernetes
  # D10: Ops start/restart of the daemon is refused (the code default too; stated, as in DEV and STG).
  daemon_scale_guard: freeze
  kubernetes:
    namespace: bifrost-prod
  auth:
    # TD-23: an anonymous caller reads; a write needs the Operator sign-in
    # (OPS_OPERATOR_TOKEN / OPS_ADMIN_TOKEN, scripts/trade-operator-tokens.sh).
    default_role: viewer
    tokens: []
  # Ops actuations are appended to the PROD platform audit (egress: api-monitor-platform-audit-egress).
  # `audit.persist` was a dead key — nothing reads it — and left PROD with no audit trail (TD-05).
  platform_audit:
    enabled: true
    url: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780
    timeout_ms: 2000

# api_key + rest_base still used by Research REST (polygon_http); Polygon WS ingest retired
massive:
  api_key: ""
  tier: starter
  features:
    trades_enabled: false

# Reference indices for the market strip and Refresh Index (TD-53). They lived only in the
# core example, which K3s never merges, so /status served [] and Refresh Index answered ok
# with nothing updated. ^IXIC (Polygon I:COMP) is not listed: it is index data, and the
# Indices plan is not subscribed (0 of 1255 sessions), so it could only ever fail.
reference_indices:
  - symbol: "^GSPC"
    label: "S&P 500 (SPY)"
    polygon_ticker: "SPY"
  - symbol: "^DJI"
    label: "Dow 30 (DIA)"
    polygon_ticker: "DIA"
  - symbol: "^VIX"
    label: "VIX (VIXY)"
    polygon_ticker: "VIXY"
