# Argo self-heal: rewrite MARKET_DATA_WRITE_TOKEN secretRef from base (stg) to prod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-monitor
spec:
  template:
    spec:
      containers:
        - name: api-monitor
          env:
            - name: MARKET_DATA_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-prod-secrets
                  key: MARKET_DATA_WRITE_TOKEN
                  optional: true
---
