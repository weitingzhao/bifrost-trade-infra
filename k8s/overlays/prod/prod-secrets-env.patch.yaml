# Prod namespace: point envFrom at bifrost-prod-secrets (base defaults to stg).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-monitor
spec:
  template:
    spec:
      containers:
        - name: api-monitor
          envFrom:
            - secretRef:
                name: bifrost-prod-secrets
                optional: true
---
