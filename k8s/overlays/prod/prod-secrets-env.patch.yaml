# Prod namespace: point env + secretRef at bifrost-prod (base defaults to stg).
# Trade massive-ws retired — Polygon Options WS is Plugin polygon-ws-ingestor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-data
          env:
            - name: BIFROST_CONFIG
              value: /app/config/config.stg.yaml
            - name: BIFROST_ENV
              value: prod
      containers:
        - name: celery-beat
          env:
            - name: BIFROST_CONFIG
              value: /app/config/config.stg.yaml
            - name: BIFROST_ENV
              value: prod
          envFrom:
            - secretRef:
                name: bifrost-prod-secrets
                optional: true
---
