# Prod runtime placement.
#
# It was a hard `nodeSelector: bifrost.io/host-id: mini-pc-a` on every workload.
# Nothing in Prod actually needs that host — postgres and redis are removed from
# this overlay and the shared CloudNativePG cluster lives in the `data`
# namespace, and no Prod pod mounts a hostPath or a local volume. The pin was a
# placement preference expressed as a hard requirement, and on 2026-09-06 it
# cost five hours: mini-pc-a went unreachable at 00:43Z, every Prod pod became
# unschedulable ("didn't match Pod's node affinity/selector"), and the whole
# Prod surface returned 503 until the host came back.
#
# Now it is a preference. Normal scheduling puts everything on ubt-k3s-07
# (weight 100). When that host is gone the pods move to the general pool and
# Prod keeps serving, while BifrostClusterNodeDown still reports the node loss —
# drifting does not hide the fault, it stops the fault from being an outage.
#
# 2026-10-27 (W-68, round 4 step 4.9-5): the preferred host moved from mini-pc-a
# (ubt-k3s-02) to ubt-k3s-07, a new 7735HS node in the general pool. mini-pc-a
# also holds the CloudNativePG primary (bifrost-postgres-1) and much of CI, so
# Prod Trade and the database primary no longer share one machine. mini-pc-a
# stays a fallback through the prod-pool label.
#
# The tolerations shorten the wait before a pod on an unreachable node is
# evicted, from the 300s Kubernetes defaults to 45s, so failover is quick enough
# to matter.
#
# Registry should be configured on all nodes via configure-insecure-registry.sh.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-monitor
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          # Hard: somewhere that can actually run Prod.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: bifrost.io/workload-pool
                    operator: In
                    values: [prod-pool, general]
          # Soft: ubt-k3s-07 whenever it is available.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: bifrost.io/host-id
                    operator: In
                    values: [ubt-k3s-07]
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 45
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 45
