# Wave 6 — api-monitor egress: platform audit + required cluster dependencies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-monitor-platform-audit-egress
  labels:
    app.kubernetes.io/component: api-monitor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-monitor
  policyTypes:
    - Egress
  egress:
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data
    ports:
      - protocol: TCP
        port: 5432
      - protocol: TCP
        port: 6379
  - to:
      - ipBlock:
          cidr: 10.43.0.0/16
    ports:
      - protocol: TCP
        port: 443
  # k3s apiserver is host-networked; Service 10.43.0.1:443 DNAT → node:6443
  - to:
      - ipBlock:
          cidr: 192.168.10.0/24
    ports:
      - protocol: TCP
        port: 6443
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: bifrost-platform-prod
    ports:
      - protocol: TCP
        port: 8780
