# Traefik IngressRoute for bifrost-prod.
# Primary: trader.bifrost.lan → VIP 192.168.10.100:80
# Escape: Host 192.168.10.70 / 192.168.10.100 (direct IP).
# Duplicate Host rules (no OR) — matches prior Traefik precedence practice.
# Smoke: curl -H 'Host: trader.bifrost.lan' https://192.168.10.100/api/monitor/status
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trade-gateway
  labels:
    app.kubernetes.io/name: trade-gateway
    app.kubernetes.io/component: ingress
    bifrost.io/gateway-host: trader.bifrost.lan
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`trader.bifrost.lan`) && PathPrefix(`/api/monitor`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-monitor
        - name: sse-streaming
      services:
        - name: api-monitor
          port: 8765
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`192.168.10.70`) && PathPrefix(`/api/monitor`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-monitor
        - name: sse-streaming
      services:
        - name: api-monitor
          port: 8765
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`192.168.10.100`) && PathPrefix(`/api/monitor`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-monitor
        - name: sse-streaming
      services:
        - name: api-monitor
          port: 8765
          responseForwarding:
            flushInterval: 1ms
    # /api/account is api-account's own prefix (TD-55 B1, Owner 2026-10-04 option B). The aliases
    # /api/trading, /api/strategy, /api/portfolio (api-account) and /api/docs, /api/ops (api-monitor)
    # went in B2 (Owner 2026-10-04): ops and docs are /api/monitor/ops/* and /api/monitor/research/docs/*.
    - match: Host(`trader.bifrost.lan`) && PathPrefix(`/api/account`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-account
        - name: sse-streaming
      services:
        - name: api-account
          port: 8769
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`192.168.10.70`) && PathPrefix(`/api/account`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-account
        - name: sse-streaming
      services:
        - name: api-account
          port: 8769
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`192.168.10.100`) && PathPrefix(`/api/account`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-account
        - name: sse-streaming
      services:
        - name: api-account
          port: 8769
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`trader.bifrost.lan`) && PathPrefix(`/api/market`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-market
        - name: sse-streaming
      services:
        - name: api-market
          port: 8772
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`192.168.10.70`) && PathPrefix(`/api/market`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-market
        - name: sse-streaming
      services:
        - name: api-market
          port: 8772
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`192.168.10.100`) && PathPrefix(`/api/market`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-market
        - name: sse-streaming
      services:
        - name: api-market
          port: 8772
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`trader.bifrost.lan`) && PathPrefix(`/api/research`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-research
        - name: sse-streaming
      services:
        - name: api-research
          port: 8773
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`192.168.10.70`) && PathPrefix(`/api/research`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-research
        - name: sse-streaming
      services:
        - name: api-research
          port: 8773
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`192.168.10.100`) && PathPrefix(`/api/research`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-api-research
        - name: sse-streaming
      services:
        - name: api-research
          port: 8773
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`trader.bifrost.lan`) && PathPrefix(`/api/plugin/market-data`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-market-data
      services:
        - name: market-data-api
          namespace: plugin-market-data
          port: 8790
    - match: Host(`trader.bifrost.lan`) && PathPrefix(`/api/plugin/flex-query`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-flex-query
        - name: flex-query-trade-gateway
      services:
        - name: flex-query-api
          namespace: plugin-flex-query
          port: 8791
    - match: Host(`trader.bifrost.lan`) && PathPrefix(`/api/plugin/research`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-research
        - name: research-env-header
        - name: sse-streaming
      services:
        - name: research-api
          namespace: research
          port: 8795
    # Ops Platform plugin status, same-origin for the Trade cockpit.
    # Read-only by construction: `/status` only, so the rest of
    # platform-api is not reachable from the Trade origin.
    - match: Host(`trader.bifrost.lan`) && PathRegexp(`^/api/platform/plugins/[a-z0-9-]+/status$`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-platform
        - name: add-platform-api-v1
      services:
        - name: platform-api
          namespace: bifrost-platform-prod
          port: 8780
    - match: Host(`192.168.10.70`) && PathPrefix(`/api/plugin/market-data`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-market-data
      services:
        - name: market-data-api
          namespace: plugin-market-data
          port: 8790
    - match: Host(`192.168.10.70`) && PathPrefix(`/api/plugin/flex-query`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-flex-query
        - name: flex-query-trade-gateway
      services:
        - name: flex-query-api
          namespace: plugin-flex-query
          port: 8791
    - match: Host(`192.168.10.70`) && PathPrefix(`/api/plugin/research`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-research
        - name: research-env-header
        - name: sse-streaming
      services:
        - name: research-api
          namespace: research
          port: 8795
    # Ops Platform plugin status, same-origin for the Trade cockpit.
    # Read-only by construction: `/status` only, so the rest of
    # platform-api is not reachable from the Trade origin.
    - match: Host(`192.168.10.70`) && PathRegexp(`^/api/platform/plugins/[a-z0-9-]+/status$`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-platform
        - name: add-platform-api-v1
      services:
        - name: platform-api
          namespace: bifrost-platform-prod
          port: 8780
    - match: Host(`192.168.10.100`) && PathPrefix(`/api/plugin/market-data`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-market-data
      services:
        - name: market-data-api
          namespace: plugin-market-data
          port: 8790
    - match: Host(`192.168.10.100`) && PathPrefix(`/api/plugin/flex-query`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-flex-query
        - name: flex-query-trade-gateway
      services:
        - name: flex-query-api
          namespace: plugin-flex-query
          port: 8791
    - match: Host(`192.168.10.100`) && PathPrefix(`/api/plugin/research`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-plugin-research
        - name: research-env-header
        - name: sse-streaming
      services:
        - name: research-api
          namespace: research
          port: 8795
    # Ops Platform plugin status, same-origin for the Trade cockpit.
    # Read-only by construction: `/status` only, so the rest of
    # platform-api is not reachable from the Trade origin.
    - match: Host(`192.168.10.100`) && PathRegexp(`^/api/platform/plugins/[a-z0-9-]+/status$`)
      kind: Rule
      priority: 110
      middlewares:
        - name: strip-api-platform
        - name: add-platform-api-v1
      services:
        - name: platform-api
          namespace: bifrost-platform-prod
          port: 8780
    - match: Host(`trader.bifrost.lan`) && Path(`/health`)
      kind: Rule
      priority: 50
      services:
        - name: frontend
          port: 80
    - match: Host(`192.168.10.70`) && Path(`/health`)
      kind: Rule
      priority: 50
      services:
        - name: frontend
          port: 80
    - match: Host(`192.168.10.100`) && Path(`/health`)
      kind: Rule
      priority: 50
      services:
        - name: frontend
          port: 80
    - match: Host(`trader.bifrost.lan`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: frontend
          port: 80
    - match: Host(`192.168.10.70`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: frontend
          port: 80
    - match: Host(`192.168.10.100`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: frontend
          port: 80
