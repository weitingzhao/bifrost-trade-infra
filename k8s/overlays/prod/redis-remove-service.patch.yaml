# Phase ⑥ — PROD uses redis-live/queue @ data NS (no embedded redis Deployment).
# One deleted object per file: kustomize 5.4 (kubectl 1.31) panics on several $patch: delete in one file.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ExternalName
  externalName: redis-live-prod.data.svc.cluster.local
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
