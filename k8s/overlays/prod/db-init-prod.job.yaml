apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-prod
  labels:
    app.kubernetes.io/name: db-init
    app.kubernetes.io/component: infra
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
    spec:
      restartPolicy: OnFailure
      # Same placement as every Prod workload (node-prod.patch.yaml): any Prod-capable node,
      # mini-pc-a preferred. The hard pin left the schema refresh unschedulable whenever
      # that one host was down (2026-09-06; debt TD-68).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: bifrost.io/workload-pool
                    operator: In
                    values: [prod-pool, general]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: bifrost.io/host-id
                    operator: In
                    values: [mini-pc-a]
      volumes:
        - name: bifrost-config
          configMap:
            name: bifrost-config
      containers:
        - name: db-init
          image: 192.168.10.73:30500/bifrost-api-monitor:prod
          imagePullPolicy: Always
          # The script ships under the image WORKDIR (Dockerfile.api-stg); /app holds only the mounted config.
          command:
            - python
            - /build/bifrost-trade-api/scripts/run_db_refresh_schema.py
          env:
            - name: BIFROST_CONFIG
              value: /app/config/runtime.yaml
            - name: BIFROST_ENV
              value: prod
            # TD-85: db-init runs the DDL as bifrost (owner of the Trade tables and of raw_broker /
            # ops_feedback); the runtime Pods sign in as trade_app_prod through PGUSER /
            # GOLDEN_SOURCE_USER in bifrost-prod-secrets. Explicit env wins over envFrom. optional: until
            # the Owner creates bifrost-prod-db-owner (scripts/trade-app-role.sh owner-secret prod) the
            # keys fall through to bifrost-prod-secrets, which is still on bifrost then.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: bifrost-prod-db-owner
                  key: PGUSER
                  optional: true
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-prod-db-owner
                  key: PGPASSWORD
                  optional: true
            - name: GOLDEN_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: bifrost-prod-db-owner
                  key: GOLDEN_SOURCE_USER
                  optional: true
            - name: GOLDEN_SOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-prod-db-owner
                  key: GOLDEN_SOURCE_PASSWORD
                  optional: true
          envFrom:
            - secretRef:
                name: bifrost-prod-secrets
                optional: true
          volumeMounts:
            - name: bifrost-config
              mountPath: /app/config/runtime.yaml
              subPath: runtime.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
