# Every Trade pod names its own environment (TD-52). The base sets BIFROST_ENV=stg,
# and before this every PROD pod said stg. Code reads ops.control_profile first
# (bifrost_core.config.profile), so this is for people and agents reading the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-monitor
spec:
  template:
    spec:
      containers:
        - name: api-monitor
          env:
            - name: BIFROST_ENV
              value: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-account
spec:
  template:
    spec:
      containers:
        - name: api-account
          env:
            - name: BIFROST_ENV
              value: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-market
spec:
  template:
    spec:
      containers:
        - name: api-market
          env:
            - name: BIFROST_ENV
              value: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-research
spec:
  template:
    spec:
      containers:
        - name: api-research
          env:
            - name: BIFROST_ENV
              value: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemon
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-data
          env:
            - name: BIFROST_ENV
              value: prod
      containers:
        - name: daemon
          env:
            - name: BIFROST_ENV
              value: prod
