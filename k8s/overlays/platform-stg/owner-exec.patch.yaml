# Keep the PROD runner/shell topology, but give neither STG container a
# cluster identity or a Secret. The throwaway seed is generated by the runner;
# it does not bypass platform authentication or approval-home enforcement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner-exec
  namespace: bifrost-owner-exec
spec:
  template:
    spec:
      serviceAccountName: null
      containers:
        - name: runner
          image: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg
          imagePullPolicy: Always
          env:
            - name: PLATFORM_API_URL
              value: http://platform-api:8780
            - name: OWNER_EXEC_SEED_FILE
              $patch: delete
            - name: OWNER_EXEC_EGRESS_PROBE
              $patch: delete
            - name: OWNER_EXEC_TEST_SEED
              value: generate
            - name: OWNER_EXEC_ISSUER
              value: Bifrost STG test
            - name: OWNER_EXEC_TIMEOUT
              value: 5m
          volumeMounts:
            - name: seed
              mountPath: /etc/owner-exec
              $patch: delete
        - name: shell
          image: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg
          imagePullPolicy: Always
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              $patch: delete
      volumes:
        - name: seed
          $patch: delete
        - name: kube-api-access
          $patch: delete
