# TD-207: the shared bearer the Mac mini remediation runner (:8781) and Hermes gateway (:8782)
# require on writes. Secret key written by scripts/k3s/apply-platform-role-tokens.sh from
# .env REMEDIATION_RUNNER_TOKEN. optional: a pod still starts before the key exists.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: REMEDIATION_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-role-tokens
                  key: REMEDIATION_RUNNER_TOKEN
                  optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: REMEDIATION_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-platform-role-tokens
                  key: REMEDIATION_RUNNER_TOKEN
                  optional: true
