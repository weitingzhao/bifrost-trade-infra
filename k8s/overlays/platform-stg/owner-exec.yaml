# owner-exec on STG: the runner for owner_run_command cards approved in the
# Console with a one-time code (platform api/internal/ownerexec).
#
# STG runs it with NO cluster identity and a throwaway seed it generates and
# logs itself (OWNER_EXEC_TEST_SEED=generate). The program refuses that switch
# when a ServiceAccount token or a seed Secret is mounted, so it only works in
# a Pod that can do nothing to the cluster: commands run inside this container
# and reach nothing. scripts/check_owner_exec.py keeps the switch out of every
# PROD manifest and keeps the token unmounted here.
#
# PROD's runner is not here and not under Argo: k8s/owner-exec/, applied once
# by the Owner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner-exec
  labels:
    app.kubernetes.io/name: owner-exec
    app.kubernetes.io/component: owner-exec
spec:
  replicas: 1
  # One replica, stopped before the next starts: the used-code record lives in
  # the process, and two runners would each accept the same code once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: owner-exec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owner-exec
        app.kubernetes.io/component: owner-exec
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: owner-exec
          image: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg
          imagePullPolicy: Always
          command: ["owner-exec"]
          env:
            - name: OWNER_EXEC_TEST_SEED
              value: generate
            - name: OWNER_EXEC_ISSUER
              value: Bifrost STG test
            - name: PLATFORM_API_URL
              value: http://platform-api:8780
            - name: OWNER_EXEC_TIMEOUT
              value: 5m
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /api/owner-exec/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/owner-exec/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: owner-exec
  labels:
    app.kubernetes.io/name: owner-exec
spec:
  selector:
    app.kubernetes.io/name: owner-exec
  ports:
    - name: http
      port: 8787
      targetPort: http
