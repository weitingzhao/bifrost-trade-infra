# The UI engine backend in bifrost-platform-stg (bifrost-engine, R0C; Owner lifted the repo pause for it
# 2026-11-24, OWNER_LAW 84). From the engine's own draft (bifrost-engine deploy/platform-stg.draft.yaml).
# The image is the CI's build of one commit (pipeline-ci-engine.yaml), pinned by digest, never a moving
# tag: moving it is this line. No ServiceAccount of its own and no token mounted: the engine reads the platform's public
# read routes with the viewer's own token and needs no Kubernetes API, so there is no RBAC either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-engine
  labels: {app.kubernetes.io/name: ui-engine, app.kubernetes.io/component: ui-engine}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: ui-engine}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ui-engine, app.kubernetes.io/component: ui-engine}
    spec:
      automountServiceAccountToken: false
      priorityClassName: bifrost-default-nonpreempting
      containers:
        - name: ui-engine
          # bifrost-engine:0ebd6b7f092259f92ae94e15abad7b2779217266 (ci-engine-gsl5d: /engine/v1/delivery/lanes),
          # by digest at the registry's NodePort as the platform's own images: the node's kubelet cannot resolve
          # registry.cicd.svc.cluster.local (2026-11-24, ImagePullBackOff for 21 minutes).
          image: 192.168.10.73:30500/bifrost-engine@sha256:3479940f44a45f6b4600f135002bced4d4d85ecaa5f36991cf0928ee4818aaab
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8796}]
          env:
            - {name: PLATFORM_API_URL, value: "http://platform-api:8780"}
            # The bus reader name of /engine/v1/traffic: the Console's own, so the switch replaces that reader.
            - {name: BUS_CLIENT, value: "console"}
          readinessProbe: {httpGet: {path: /engine/v1/live, port: http}, initialDelaySeconds: 2, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /engine/v1/live, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            runAsNonRoot: true
            # The image's USER is the name node, which the kubelet cannot check against runAsNonRoot;
            # node's uid in the official node images is 1000 (2026-11-24, CreateContainerConfigError).
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: ui-engine
  labels: {app.kubernetes.io/name: ui-engine}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ui-engine}
  ports: [{name: http, port: 8796, targetPort: http}]
