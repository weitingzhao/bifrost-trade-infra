# TD-204: the kubeconfig platform-api reads at PLATFORM_KUBECONFIG, pointing at
# the pod's own ServiceAccount token (bifrost-platform, k8s/platform-rbac). It
# holds no credential; it replaced the Secret bifrost-platform-kubeconfig, a copy
# of the k3s admin kubeconfig (system:masters). Same path, so no code changed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-platform-sa-kubeconfig
data:
  bifrost-k3s.yaml: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: bifrost-platform
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context: {cluster: in-cluster, user: bifrost-platform}
    current-context: in-cluster
