# W-31 2.2: the agent runtime on STG (design v5 §5.2; Gate A runs here). The
# platform connects as the environment's runtime role to its own database;
# the password is the Secret the Owner made in 2.1 (OWNER-STEPS-agentrt-21,
# step 1). Without the Secret the variable is empty, the connection fails
# and the runtime's routes answer 503; the rest of the platform is untouched.
# platform-workers runs the controller loops, platform-api the routes.
# Owner 2026-10-14 20:10: 「STG 接线 A」.
# AGENTRT_GIT_ORG: the Gitea organization agent branches are pushed to and the
# result check reads. bifrost since Gitea-primary batch A (2026-10-17,
# CUT-gitea-primary-2026-10-17): bifrost/bifrost-platform and bifrost-ui are
# Gitea's own repositories with protected agent/** branches; before that,
# bifrost-agents (Owner 2026-10-15 11:30 「Gitea A」). Only platform-api
# serves persist.
# AGENTRT_REDIS_*: redis-agents of this namespace (W-31 2.3 slice 1; Owner
# 2026-10-18 「同意：心跳加 actions，只在 Redis 存 24 小时」): the workers run
# the relay on it, platform-api writes and reads attempts' actions there
# (slice 2). The password is the Secret the redis-agents Deployment reads.
# AGENTRT_LEDGER (TD-391, Owner 2026-10-20 「AI 评估用 A」): the ledger an
# assessment of a card or an approval reads its items from, as
# <repository>/<path> at main through the Gitea mirror; only the workers run
# the assessments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: AGENTRT_ENV
              value: stg
            - name: AGENTRT_GIT_ORG
              value: bifrost
            - name: AGENTRT_REDIS_ADDR
              value: redis-agents:6379
            - name: AGENTRT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-agents
                  key: password
            - name: AGENTRT_DSN
              value: host=bifrost-postgres-rw.data.svc.cluster.local port=5432 dbname=bifrost_platform_stg user=platform_agentrt_stg sslmode=require
            - name: AGENTRT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentrt-db-runtime
                  key: password
                  optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: AGENTRT_LEDGER
              value: bifrost-trade-infra/agent-config/TECH_DEBT.md
            - name: AGENTRT_ENV
              value: stg
            - name: AGENTRT_REDIS_ADDR
              value: redis-agents:6379
            - name: AGENTRT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-agents
                  key: password
            - name: AGENTRT_DSN
              value: host=bifrost-postgres-rw.data.svc.cluster.local port=5432 dbname=bifrost_platform_stg user=platform_agentrt_stg sslmode=require
            - name: AGENTRT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentrt-db-runtime
                  key: password
                  optional: true
