map $http_upgrade $harness_connection {
    default upgrade;
    ''      close;
}

# Traefik marks the TLS WebSocket handshake as wss.
map $http_x_forwarded_proto $harness_secure_transport {
    default 0;
    https   1;
    wss     1;
}

server {
    listen 80;
    server_name opencode-preview-stg.ops.bifrost.lan deepseek-preview-stg.ops.bifrost.lan;

    location / {
        if ($harness_secure_transport = 0) {
            return 426;
        }
        proxy_pass http://10.42.4.1:14201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $harness_connection;
        proxy_buffering off;
        proxy_redirect off;
        proxy_read_timeout 300s;
    }
}
