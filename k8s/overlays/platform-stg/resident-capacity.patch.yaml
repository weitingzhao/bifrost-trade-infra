# Seven-day STG measurements: workers CPU P95 101m (24h 114m), memory
# scrape peak 421Mi; API memory peak 123Mi. Memory includes >=15% headroom.
# Keep limits and update strategies; preference permits fallback outside general.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: bifrost.io/workload-pool
                    operator: In
                    values: [general]
      containers:
        - name: platform-api
          resources:
            requests:
              memory: 160Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-workers
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: bifrost.io/workload-pool
                    operator: In
                    values: [general]
      containers:
        - name: platform-api
          resources:
            requests:
              cpu: 125m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-console
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: bifrost.io/workload-pool
                    operator: In
                    values: [general]
