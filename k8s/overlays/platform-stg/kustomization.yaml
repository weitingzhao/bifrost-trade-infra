apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bifrost-platform-stg

resources:
  - namespace.yaml
  - ../../base-platform
  - ops-ingressroute.yaml
  - ops-http-redirect.yaml
  - sa-kubeconfig.yaml
  - redis-agents.yaml
  - owner-exec.yaml

# The config files both environments share come from the component; this
# overlay generates the ConfigMap with the ones that differ per environment.
components:
  - ../../components/platform-config

configMapGenerator:
  - name: bifrost-platform-config
    files:
      - config/environments.yaml
      - config/clusters.yaml
      - config/platform-auth.yaml
    options:
      disableNameSuffixHash: true

patches:
  - path: platform-serviceaccount.patch.yaml
  - path: images-pull-always.patch.yaml
  - path: platform-workers-env.patch.yaml
  - path: platform-api-observability-env.patch.yaml
  - path: platform-api-operator-plane.patch.yaml
  - path: platform-api-write-token.patch.yaml
  - path: platform-api-redis-ib-env.patch.yaml
  - path: platform-api-ib-autorepair-env.patch.yaml
  - path: platform-api-satellite-audit-token.patch.yaml
  - path: platform-api-reporter-token.patch.yaml
  - path: platform-api-role-tokens.patch.yaml
  - path: platform-api-recreate.patch.yaml
  - path: platform-agentrt-env.patch.yaml
  - path: platform-api-exam-set.patch.yaml
  - path: platform-gitea-reader.patch.yaml
  - path: platform-workers-landing-drill.patch.yaml

images:
  - name: registry.cicd.svc.cluster.local:5000/bifrost-platform-api
    newName: 192.168.10.73:30500/bifrost-platform-api
  - name: registry.cicd.svc.cluster.local:5000/bifrost-platform-console
    newName: 192.168.10.73:30500/bifrost-platform-console

commonAnnotations:
  bifrost.io/environment: platform-stg

labels:
  - pairs:
      bifrost.io/environment: platform-stg
    includeSelectors: false
