apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harness-preview
  labels:
    app.kubernetes.io/name: harness-preview
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`opencode-preview-stg.ops.bifrost.lan`) || Host(`deepseek-preview-stg.ops.bifrost.lan`)
      kind: Rule
      services:
        - name: platform-console
          port: 80
