# Bifrost Ops Platform auth for L1+ actuation.
# No inline tokens anywhere: every role comes from its token_env. Local :8780 reads
# them from bifrost-platform/.env (scripts/run_platform_api.sh); the cluster copies
# (bifrost-trade-infra k8s/overlays/platform-*/config) read them from Secrets.
# A role whose env var is unset cannot sign in.

tokens:
  - name: viewer
    role: viewer
    token_env: PLATFORM_VIEWER_TOKEN
  # Workloads that record their own outcomes and nothing else — the Research
  # Loop CronJob reporting to the trust matrix. Deliberately below operator:
  # operator also carries cluster scale (D10 forbids scaling the trade daemon)
  # and trust-override writes, which would let a skill grant itself autonomy.
  - name: reporter
    role: reporter
    token_env: PLATFORM_REPORTER_TOKEN
  - name: operator
    role: operator
    token_env: PLATFORM_OPERATOR_TOKEN
  - name: admin
    role: admin
    token_env: PLATFORM_ADMIN_TOKEN
  - name: trade-satellite
    role: operator
    token_env: PLATFORM_SATELLITE_AUDIT_TOKEN
  # agentd:mbp-dev (the dev Mac) and agentd:gate-b (2.2 acceptance) were removed
  # on 2026-10-17 when the Mac agentd retired and 06 took over (W-31 2.3); their
  # keys in the Secret bifrost-platform-role-tokens are the Owner's to delete.
  # W-31 2.3 (决定 2026-10-17): the STG agentd on the agent host ubt-k3s-06
  # (out of the cluster), user bifrost-agentd-stg; bound to host agent-06-stg.
  - name: agentd:agent-06-stg
    role: agentd
    token_env: PLATFORM_AGENTD_AGENT_06_STG_TOKEN
  # W-31 round 4 C-7 (DESIGN-coordinator-landing-v3 §2.1): the coordinator's
  # proposer seat (the only writer allowed to pin a task, once the signed
  # envelope names it) and its Mac's agentd principal (exact claim only).
  - name: seat:coordinator
    role: reporter
    token_env: PLATFORM_SEAT_COORDINATOR_STG_TOKEN
  - name: agentd:coordinator-mbp
    role: agentd
    token_env: PLATFORM_AGENTD_COORDINATOR_MBP_STG_TOKEN
  # Hosted 4090 mailbox pilot. Each role signs with its own STG credential.
  - name: seat:stg-4090-station
    role: reporter
    token_env: PLATFORM_SEAT_4090_STATION_STG_TOKEN
  - name: seat:stg-4090-pi
    role: reporter
    token_env: PLATFORM_SEAT_4090_PI_STG_TOKEN
  - name: seat:stg-4090-audit
    role: reporter
    token_env: PLATFORM_SEAT_4090_AUDIT_STG_TOKEN
  # Named-machine executors have distinct optional, STG-only credentials.
  - name: host-work-mac
    role: executor
    token_env: OWNER_EXEC_WORK_MAC_TOKEN
  - name: host-ops-mac-agent-01
    role: executor
    token_env: OWNER_EXEC_MINI_01_TOKEN
  - name: host-ops-mac-agent-02
    role: executor
    token_env: OWNER_EXEC_MINI_02_TOKEN
  - name: host-ubt-k3s-06
    role: executor
    token_env: OWNER_EXEC_AGENT_06_TOKEN
