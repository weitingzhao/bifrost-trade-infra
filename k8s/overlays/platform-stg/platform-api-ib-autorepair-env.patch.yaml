# L1 IB Gateway auto-repair — rollout restart when plugin reports rollout_recommended (D-IB-Heal).
# D10 BLOCKED: reconnect/observe only; no place_order.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: OPS_IB_AUTOREPAIR_ENABLED
              value: "true"
            - name: OPS_IB_AUTO_ROLLOUT_COOLDOWN_SEC
              value: "900"
            - name: OPS_IB_SNAPSHOT_STALE_SEC
              value: "90"
            - name: OPS_IB_SNAPSHOT_STALE_MAX_BEFORE_ROLLOUT
              value: "3"
