# Browser-reachable Grafana URL for Cluster → Observability deep links.
# Complements clusters.yaml observability_urls.grafana (platform-api loads config at startup).
# The remediation runner (:8781) was removed (LANE-W33); do not put
# REMEDIATION_RUNNER_* back. OPERATOR_PLANE_URL is a separate patch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  template:
    spec:
      containers:
        - name: platform-api
          env:
            - name: OPS_VIEWER_ENV
              value: "stg"
            - name: PLATFORM_GRAFANA_URL
              value: "https://ops.bifrost.lan/grafana"
            - name: NOUS_HERMES_URL
              value: "http://192.168.10.50:9119"
