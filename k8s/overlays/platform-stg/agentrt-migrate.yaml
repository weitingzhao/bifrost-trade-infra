# W-31: suspended template, run only by create_job_from_cronjob after approval.
# The overlay images transformer keeps this image identical to platform-api.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentrt-migrate
  labels:
    app.kubernetes.io/name: agentrt-migrate
spec:
  schedule: "0 0 1 1 *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agentrt-migrate
        spec:
          serviceAccountName: default
          automountServiceAccountToken: false
          restartPolicy: Never
          # NetworkPolicy propagation can lag a new pod IP (TD-210).
          initContainers:
            - name: wait-pg
              image: ghcr.io/cloudnative-pg/postgresql:17.9
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -c
                - |
                  for i in $(seq 1 60); do
                    if pg_isready -q -t 2; then echo ready; exit 0; fi
                    sleep 2
                  done
                  echo "Postgres not reachable after 60 attempts"; exit 1
              env:
                - name: PGHOST
                  value: bifrost-postgres-rw.data.svc.cluster.local
                - name: PGPORT
                  value: "5432"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          containers:
            - name: migrate
              image: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg
              imagePullPolicy: Always
              command: [/usr/local/bin/platform-api]
              args: [agentrt-migrate]
              env:
                - name: AGENTRT_ENV
                  value: stg
                - name: PGHOST
                  value: bifrost-postgres-rw.data.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: bifrost_platform_stg
                - name: PGUSER
                  value: agentrt_owner_stg
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: agentrt-db-owner
                      key: password
                # Same TLS mode as the existing logical-backup libpq client.
                - name: PGSSLMODE
                  value: require
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 256Mi
