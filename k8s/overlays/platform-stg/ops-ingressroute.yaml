# Rocket Ops Console — Traefik Host on VIP :80.
# Primary: stg.ops.bifrost.lan → platform-console (nginx proxies /api → platform-api).
# Escape hatch remains NodePort :30879.
# Smoke: curl -sS -o /dev/null -w '%{http_code}\n' -H 'Host: stg.ops.bifrost.lan' https://192.168.10.100/
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-gateway
  labels:
    app.kubernetes.io/name: ops-gateway
    app.kubernetes.io/component: ingress
    bifrost.io/gateway-host: stg.ops.bifrost.lan
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    # owner-exec takes its one route straight from Traefik, not through the
    # Console's nginx: the request carries a one-time code and the admin
    # sign-in, and nginx logs a line per request. Higher priority than the
    # Console host rule, which would otherwise swallow it.
    - match: Host(`stg.ops.bifrost.lan`) && PathPrefix(`/api/owner-exec/`)
      kind: Rule
      priority: 100
      services:
        - name: owner-exec
          port: 8787
    - match: Host(`stg.ops.bifrost.lan`)
      kind: Rule
      priority: 10
      services:
        - name: platform-console
          port: 80
