# Daily at 09:10 UTC. One repository for the first round (bifrost-trade-infra).
# Alert BifrostRenovateStale watches its last success.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "10 9 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/component: renovate
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
              image: ghcr.io/renovatebot/renovate:44.237.2
              env:
                - name: RENOVATE_PLATFORM
                  value: gitea
                - name: RENOVATE_ENDPOINT
                  value: http://gitea.cicd.svc.cluster.local:3000
                - name: RENOVATE_REPOSITORIES
                  value: bifrost/bifrost-trade-infra
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: required
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@bifrost.lan>"
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate
                      key: gitea-token
                # Read-only github.com token: release notes and release lists
                # without the anonymous rate limit.
                - name: RENOVATE_GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate
                      key: github-com-token
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /tmp/renovate
              resources:
                requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 1Gi}
                limits: {memory: 2Gi, ephemeral-storage: 4Gi}
          volumes:
            - name: work
              emptyDir: {}
