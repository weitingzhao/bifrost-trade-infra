# Nightly backup of the in-cluster Gitea, and its monthly restore drill.
# Apply on its own:  kubectl apply -k k8s/cicd/gitea-backup
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cicd

resources:
  - nas-volume.yaml
  - network-policy.yaml
  - cronjob-backup.yaml
  - cronjob-drill.yaml

configMapGenerator:
  - name: gitea-backup-scripts
    files:
      - backup.sh
      - drill.sh

labels:
  - pairs:
      app.kubernetes.io/part-of: bifrost
      app.kubernetes.io/component: gitea-backup
    includeSelectors: false
