# Nightly backup of the in-cluster Gitea, see backup.sh.
#
# 03:10 UTC, before the 04:30 logical backup. The image is the same one the
# Gitea Deployment runs. That image's entrypoint is root, then s6 does
# `su-exec git` (uid/gid 1000); this job runs as that uid the whole time.
# No ServiceAccount token, no Role, no API access. The live claim is mounted
# read-only, on the same node as the Gitea pod (the local-path volume is
# node-bound) with the Deployment's tolerations — not a node name.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-backup
  labels:
    app.kubernetes.io/name: gitea-backup
spec:
  schedule: "10 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitea-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: gitea
                  topologyKey: kubernetes.io/hostname
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node-role.kubernetes.io/etcd
              operator: Exists
              effect: NoSchedule
            - key: node.kubernetes.io/unschedulable
              operator: Exists
              effect: NoSchedule
          enableServiceLinks: false
          initContainers:
            - name: fetch-tools
              image: alpine:3.22
              command: ["sh", "/scripts/fetch-tools.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: tools, mountPath: /tools}
          containers:
            - name: backup
              image: gitea/gitea:1.21.11
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/backup.sh"]
              env:
                - {name: PATH, value: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"}
                - {name: HOME, value: /work}
                - {name: TMPDIR, value: /work}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: gitea-data
                  mountPath: /data
                  readOnly: true
                - {name: work, mountPath: /work}
                - {name: tools, mountPath: /tools, readOnly: true}
                - {name: recipient, mountPath: /etc/gitea-backup, readOnly: true}
                - name: backup
                  mountPath: /backup
          volumes:
            # emptyDir starts mode 0777; uid 1000 needs no fsGroup.
            - name: work
              emptyDir: {}
            - name: tools
              emptyDir: {sizeLimit: 64Mi}
            - name: recipient
              configMap:
                name: gitea-backup-recipient
            - name: scripts
              configMap:
                name: gitea-backup-scripts
            - name: gitea-data
              persistentVolumeClaim:
                claimName: gitea-data
                readOnly: true
            - name: backup
              persistentVolumeClaim:
                claimName: gitea-backup
