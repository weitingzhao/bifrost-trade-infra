# GitOps Application for Bifrost Trade staging stack (Session S4).
# Source: k8s/overlays/stg in bifrost-trade-infra (frontend + api-monitor smoke).
#
# The source is Gitea, the primary since Gitea-primary batch C (CUT-gitea-primary-2026-10-17);
# Argo reads it as argocd-reader through Secret cicd/repo-creds-gitea-bifrost
# (scripts/gitea/put-argocd-reader-token.sh), and scripts/gitea/apply-argo-gitea.sh applies
# this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bifrost-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: trade-stg
spec:
  project: bifrost
  source:
    repoURL: http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-trade-infra.git
    path: k8s/overlays/stg
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: bifrost-stg
  ignoreDifferences:
    # Completed db-init Job spec is immutable — Argo OutOfSync here is not workload drift.
    - group: batch
      kind: Job
      name: db-init-stg
      jsonPointers:
        - /spec
        - /status
        - /metadata/annotations
        - /metadata/labels
  # Manual sync, as the live Application runs: the deliver pipeline's gitops-sync step syncs it.
  # Never re-add `automated` here — re-applying this file would turn on prune + selfHeal (TD-12).
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
