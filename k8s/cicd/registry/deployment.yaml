# Internal container registry for cicd namespace (Session S3 smoke).
#
# TD-282: images live on a NAS-backed PersistentVolume. Until 2026-10-10 the
# registry wrote to its container filesystem; a containerd restart on
# ubt-k3s-01 at 01:19:43Z emptied it while 30 running containers pulled
# `Always` from it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: cicd
  labels:
    app: registry
    bifrost.io/component: registry
spec:
  storageClassName: nfs-cold
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: cicd
  labels:
    app: registry
    bifrost.io/component: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: cicd
  labels:
    app: registry
    bifrost.io/component: registry
spec:
  replicas: 1
  # One writer at a time on the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        bifrost.io/component: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
