# Gitea Service, split from deployment.yaml 2026-11-19 so the Deployment can go by
# plan_manifest + apply_manifest (a Service is not a kind the applier writes in cicd).
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: cicd
  labels:
    app: gitea
    bifrost.io/component: gitea
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
