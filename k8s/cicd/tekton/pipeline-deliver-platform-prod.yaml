# Ops Platform PROD deliver — preflight STG health → Kaniko (:prod) → rollout → Argo sync.
# Conservative L1 rollout: only proceeds when platform-stg is healthy.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-deliver-platform-prod
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver-prod
    bifrost.io/layer: L1
spec:
  description: >-
    L1 prod deploy for Ops Platform. Preflight checks platform-stg health,
    then builds :prod images, rolls out bifrost-platform-prod, and syncs Argo.
  params:
    - name: revision
      type: string
      default: main
    # bifrost-ui is its own repo, so it gets its own ref: a pinned run names the ui
    # commit here (TD-234). Callers pass the same ref as revision unless they pin.
    - name: uiRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    - name: platformApiImage
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:prod
    - name: platformConsoleImage
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-console:prod
  workspaces:
    - name: build-context
  tasks:
    # One check, before either image push. A run that passes it is past the cut:
    # rollout is not checked again.
    - name: freeze-check
      taskRef:
        name: bifrost-release-freeze-check
    # Gate: verify platform-stg is healthy before touching prod
    - name: preflight-stg
      runAfter: [freeze-check]
      taskSpec:
        steps:
          - name: check-stg-health
            image: alpine:3.20
            script: |
              #!/usr/bin/env sh
              set -eu
              apk add --no-cache curl >/dev/null 2>&1
              echo "==> Preflight: checking platform-stg health"
              HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
                http://platform-api.bifrost-platform-stg.svc.cluster.local:8780/health || echo 000)
              if [ "$HTTP" != "200" ]; then
                echo "FAIL: platform-stg API returned $HTTP — aborting prod deploy"
                exit 1
              fi
              echo "OK: platform-stg API healthy ($HTTP)"
              HTTP2=$(curl -s -o /dev/null -w '%{http_code}' \
                http://platform-console.bifrost-platform-stg.svc.cluster.local:80/ || echo 000)
              if [ "$HTTP2" != "200" ]; then
                echo "FAIL: platform-stg Console returned $HTTP2 — aborting prod deploy"
                exit 1
              fi
              echo "OK: platform-stg Console healthy ($HTTP2)"
              echo "==> Preflight passed — proceeding to prod deploy"

    - name: mirror-sync
      runAfter: [preflight-stg]
      taskRef:
        name: bifrost-gitea-mirror-sync
      params:
        - name: giteaBase
          value: $(params.giteaBase)
        - name: mirrorRepos
          value: bifrost-platform bifrost-ui

    # W-56: source gate runs read-only as tekton-deliver via platform taskRunSpecs.
    - name: check-source
      runAfter: [mirror-sync]
      params:
        - name: revision
          value: $(params.revision)
        - name: uiRevision
          value: $(params.uiRevision)
        - name: giteaBase
          value: $(params.giteaBase)
      taskSpec:
        params:
          - name: revision
            type: string
          - name: uiRevision
            type: string
          - name: giteaBase
            type: string
        results:
          - name: commit
          - name: ui-commit
        steps:
          - name: check
            image: alpine/k8s:1.31.4
            env:
              - name: GIT_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: gitea-git-credentials
                    key: username
              - name: GIT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: gitea-git-credentials
                    key: password
              - name: REVISION
                value: $(params.revision)
              - name: UI_REVISION
                value: $(params.uiRevision)
              - name: GITEA_BASE
                value: $(params.giteaBase)
              - name: COMMIT_PATH
                value: $(results.commit.path)
              - name: UI_COMMIT_PATH
                value: $(results.ui-commit.path)
            script: |
              #!/usr/bin/env python3
              """Read-only, bounded platform PROD source gate; embedded in the Pipeline task."""

              import base64
              import json
              import os
              import re
              import subprocess
              import tempfile
              from datetime import datetime
              from pathlib import Path

              """Decide whether a SHA's CI run may ship (TD-95, TD-155).

              Exit 0: a Succeeded ci-* run matches the repo and SHA, or --allow-red is set.
              Exit 1: a terminal failure and no --allow-red.
              Exit 2: no terminal run yet (the caller may wait and retry).

              A run matches when its repo (spec.params repo, else the bifrost.io/repo label)
              and spec.params revision equal the pair, and the
              PipelineRun belongs to bifrost-ci-python, bifrost-ci-frontend, or bifrost-ci-platform.
              """


              import argparse
              import json
              import sys
              from typing import Iterable, Optional


              CI_PIPELINES = frozenset({"bifrost-ci-python", "bifrost-ci-frontend", "bifrost-ci-platform"})


              def _params(run: dict) -> dict[str, str]:
                  out: dict[str, str] = {}
                  for item in (run.get("spec") or {}).get("params") or []:
                      name = str(item.get("name", ""))
                      if name:
                          out[name] = str(item.get("value", ""))
                  return out


              def _repo(run: dict, params: dict[str, str]) -> str:
                  """The repo a CI run checked. bifrost-ci-python carries it as a param;
                  bifrost-ci-frontend (and the ui-push binding) only as the bifrost.io/repo label."""
                  if params.get("repo"):
                      return params["repo"]
                  labels = ((run.get("metadata") or {}).get("labels") or {})
                  return str(labels.get("bifrost.io/repo") or "")


              def _pipeline_name(run: dict) -> str:
                  labels = ((run.get("metadata") or {}).get("labels") or {})
                  named = labels.get("tekton.dev/pipeline") or ""
                  if named:
                      return str(named)
                  ref = ((run.get("spec") or {}).get("pipelineRef") or {}).get("name") or ""
                  return str(ref)


              def _succeeded(run: dict) -> Optional[str]:
                  """Return True/False/None (still running) for the Succeeded condition."""
                  for cond in ((run.get("status") or {}).get("conditions") or []):
                      if cond.get("type") == "Succeeded":
                          status = str(cond.get("status", ""))
                          if status == "True":
                              return "True"
                          if status == "False":
                              return "False"
                          return None
                  return None


              def classify(runs: Iterable[dict], repo: str, sha: str) -> str:
                  """Return succeeded, failed, or missing for repo@sha."""
                  saw_failure = False
                  for run in runs:
                      if _pipeline_name(run) not in CI_PIPELINES:
                          continue
                      params = _params(run)
                      if _repo(run, params) != repo or params.get("revision") != sha:
                          continue
                      state = _succeeded(run)
                      if state == "True":
                          return "succeeded"
                      if state == "False":
                          saw_failure = True
                  return "failed" if saw_failure else "missing"



              SHA_RE = re.compile(r"[0-9a-f]{40}\Z")
              BUDGET = 20


              def command(args):
                  env = os.environ.copy()
                  env["GIT_TERMINAL_PROMPT"] = "0"
                  if args[0] == "git" and env.get("GIT_USERNAME") and env.get("GIT_PASSWORD"):
                      credential = base64.b64encode(
                          (env["GIT_USERNAME"] + ":" + env["GIT_PASSWORD"]).encode()
                      ).decode()
                      # Reuse clone's Secret without putting credentials in argv or log lines.
                      env.update(
                          GIT_CONFIG_COUNT="1",
                          GIT_CONFIG_KEY_0="http.extraHeader",
                          GIT_CONFIG_VALUE_0="Authorization: Basic " + credential,
                      )
                  return subprocess.run(
                      args, check=True, capture_output=True, text=True, timeout=BUDGET, env=env
                  ).stdout


              def resolve(url, revision, directory):
                  if not revision or revision.startswith("-") or any(c.isspace() for c in revision):
                      raise ValueError("invalid revision")
                  command(["git", "init", "--quiet", directory])
                  if not SHA_RE.fullmatch(revision):
                      refs = command(
                          [
                              "git",
                              "ls-remote",
                              "--",
                              url,
                              "refs/heads/" + revision,
                              "refs/tags/" + revision,
                              "refs/tags/" + revision + "^{}",
                          ]
                      )
                      candidates = set()
                      for line in refs.splitlines():
                          sha, ref = line.split("\t")
                          if not SHA_RE.fullmatch(sha):
                              raise ValueError("invalid mirror SHA")
                          candidates.add(ref.removesuffix("^{}"))
                      if len(candidates) != 1:
                          raise ValueError("empty or ambiguous mirror revision")
                      revision = candidates.pop()
                  command(
                      ["git", "-C", directory, "fetch", "--quiet", "--depth=1", "--", url, revision]
                  )
                  sha = command(["git", "-C", directory, "rev-parse", "FETCH_HEAD^{commit}"]).strip()
                  if not SHA_RE.fullmatch(sha):
                      raise ValueError("invalid resolved SHA")
                  if SHA_RE.fullmatch(revision) and sha != revision:
                      raise ValueError("mirror returned another SHA")
                  return sha


              def unique_object(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError("duplicate JSON key")
                      result[key] = value
                  return result


              def read_json(args):
                  # kubectl's own request budget plus a whole-process deadline; never retry.
                  try:
                      return json.loads(
                          command(
                              ["kubectl", "--request-timeout=10s", "-n", "cicd", *args, "-o", "json"]
                          ),
                          object_pairs_hook=unique_object,
                      )
                  except subprocess.CalledProcessError as exc:
                      if "forbidden" in exc.stderr.lower() or "unauthorized" in exc.stderr.lower():
                          raise ValueError(
                              "identity cannot read PipelineRuns/TaskRuns in cicd"
                          ) from exc
                      raise ValueError("query failed") from exc


              def validate_run(run):
                  if not isinstance(run, dict) or not isinstance(run.get("metadata"), dict):
                      raise ValueError("malformed run")
                  spec = run["spec"]
                  if not isinstance(spec, dict):
                      raise ValueError("malformed spec")
                  params = spec.get("params", [])
                  if not isinstance(params, list):
                      raise ValueError("malformed params")
                  names = [p["name"] for p in params]
                  if len(names) != len(set(names)) or any(
                      not isinstance(p["value"], str)
                      for p in params
                      if p["name"] in ("repo", "revision")
                  ):
                      raise ValueError("ambiguous params")
                  conditions = run.get("status", {}).get("conditions", [])
                  states = [c["status"] for c in conditions if c["type"] == "Succeeded"]
                  if len(states) > 1 or any(s not in ("True", "False", "Unknown") for s in states):
                      raise ValueError("ambiguous status")


              def run_time(run, field):
                  name = run["metadata"]["name"]
                  value = (
                      run.get("status", {}).get(field)
                      if field == "completionTime"
                      else run["metadata"].get(field)
                  )
                  try:
                      stamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
                      if stamp.tzinfo is None:
                          raise ValueError("timezone missing")
                      return stamp
                  except (AttributeError, TypeError, ValueError) as exc:
                      raise ValueError(f"STG run {name} has missing or unparsable {field}") from exc


              def latest_stg(runs):
                  stg = [r for r in runs if _pipeline_name(r) == "bifrost-deliver-platform"]
                  if not stg:
                      raise ValueError("no STG delivery")
                  latest = max(run_time(r, "creationTimestamp") for r in stg)
                  chosen = [r for r in stg if run_time(r, "creationTimestamp") == latest]
                  if len(chosen) != 1:
                      raise ValueError("ambiguous latest STG delivery")
                  chosen = chosen[0]
                  state = _succeeded(chosen)
                  if state != "True":
                      raise ValueError(
                          f"STG run {chosen['metadata']['name']} is {state or 'running/no Succeeded condition'}"
                      )
                  run_time(chosen, "completionTime")
                  # This check stands for "STG is running this commit"; any other run that had not
                  # finished before the newest one was created may have rolled STG after it.
                  for run in stg:
                      if run is not chosen and run_time(run, "completionTime") >= latest:
                          raise ValueError(
                              f"STG run {run['metadata']['name']} had not finished before the newest run started"
                          )
                  return chosen


              def pipeline_runs(pipeline):
                  doc = read_json(["get", "pipelineruns", "-l", "tekton.dev/pipeline=" + pipeline])
                  if (
                      not isinstance(doc, dict)
                      or not isinstance(doc.get("items"), list)
                      or not isinstance(doc.get("metadata", {}), dict)
                      or doc.get("metadata", {}).get("continue")
                  ):
                      raise ValueError("malformed or incomplete PipelineRun list")
                  for run in doc["items"]:
                      validate_run(run)
                      ref = run["spec"].get("pipelineRef")
                      if (
                          _pipeline_name(run) != pipeline
                          or not isinstance(ref, dict)
                          or ref.get("name") != pipeline
                      ):
                          raise ValueError("PipelineRun does not match selector " + pipeline)
                  return doc["items"]


              def main():
                  sha = os.environ.get("REVISION", "unresolved")
                  condition = "CI/STG"
                  try:
                      with tempfile.TemporaryDirectory() as tmp:
                          base = os.environ["GITEA_BASE"]
                          sha = resolve(
                              base + "/bifrost-platform.git",
                              os.environ["REVISION"],
                              tmp + "/platform",
                          )
                          condition = "CI"
                          runs = pipeline_runs("bifrost-ci-platform")
                          if classify(runs, "bifrost-platform", sha) != "succeeded":
                              raise ValueError("no exact-SHA Succeeded CI")
                          condition = "STG"
                          stg = latest_stg(pipeline_runs("bifrost-deliver-platform"))
                          children = [
                              c
                              for c in stg["status"]["childReferences"]
                              if c["pipelineTaskName"] == "clone-platform" and c["kind"] == "TaskRun"
                          ]
                          if len(children) != 1:
                              raise ValueError("missing or ambiguous clone-platform TaskRun")
                          task = read_json(["get", "taskrun", children[0]["name"]])
                          validate_run(task)
                          if (
                              task["metadata"]["name"] != children[0]["name"]
                              or task["metadata"]["labels"]["tekton.dev/pipelineRun"]
                              != stg["metadata"]["name"]
                              or _succeeded(task) != "True"
                          ):
                              raise ValueError("clone TaskRun identity/status mismatch")
                          commits = [
                              r["value"] for r in task["status"]["results"] if r["name"] == "commit"
                          ]
                          if len(commits) != 1 or commits[0] != sha:
                              raise ValueError("STG clone commit differs or is ambiguous")
                          condition = "CI/STG"
                          ui = resolve(
                              base + "/bifrost-ui.git", os.environ["UI_REVISION"], tmp + "/ui"
                          )
                          Path(os.environ["COMMIT_PATH"]).write_text(sha)
                          Path(os.environ["UI_COMMIT_PATH"]).write_text(ui)
                      return 0
                  except Exception as exc:
                      reason = str(exc) if isinstance(exc, ValueError) else type(exc).__name__
                      sha = " ".join(sha.split())
                      print(f"REFUSED: {condition} cannot be shown for {sha}: {reason}")
                      return 1


              if __name__ == "__main__":
                  raise SystemExit(main())

    - name: clone-platform
      runAfter: [check-source]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-platform.git
        - name: revision
          value: $(tasks.check-source.results.commit)
        - name: subdir
          value: bifrost-platform
      workspaces:
        - name: output
          workspace: build-context

    - name: clone-ui
      runAfter: [check-source]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-ui.git
        - name: revision
          value: $(tasks.check-source.results.ui-commit)
        - name: subdir
          value: bifrost-ui
      workspaces:
        - name: output
          workspace: build-context

    - name: stage-api-dockerfile
      runAfter: [clone-platform]
      workspaces:
        - name: source
          workspace: build-context
      taskSpec:
        workspaces:
          - name: source
        volumes:
          - name: dockerfile-cm
            configMap:
              name: bifrost-platform-api-stg-dockerfile
        steps:
          - name: copy
            image: alpine:3.20
            volumeMounts:
              - name: dockerfile-cm
                mountPath: /cm
            script: |
              #!/usr/bin/env sh
              set -eu
              cp /cm/Dockerfile.platform-api-stg "$(workspaces.source.path)/Dockerfile.platform-api-stg"

    - name: stage-console-dockerfile
      runAfter: [clone-platform, clone-ui]
      workspaces:
        - name: source
          workspace: build-context
      taskSpec:
        workspaces:
          - name: source
        volumes:
          - name: dockerfile-cm
            configMap:
              name: bifrost-platform-console-stg-dockerfile
        steps:
          - name: copy
            image: alpine:3.20
            volumeMounts:
              - name: dockerfile-cm
                mountPath: /cm
            script: |
              #!/usr/bin/env sh
              set -eu
              cp /cm/Dockerfile.platform-console-stg "$(workspaces.source.path)/Dockerfile.platform-console-stg"

    - name: build-platform-api
      runAfter: [stage-api-dockerfile]
      taskRef:
        name: bifrost-kaniko-platform-api-stg
      params:
        - name: image
          value: $(params.platformApiImage)
      workspaces:
        - name: source
          workspace: build-context

    - name: build-platform-console
      runAfter: [stage-console-dockerfile]
      taskRef:
        name: bifrost-kaniko-platform-console-stg
      params:
        - name: image
          value: $(params.platformConsoleImage)
      workspaces:
        - name: source
          workspace: build-context

    - name: rollout
      runAfter: [build-platform-api, build-platform-console]
      taskRef:
        name: bifrost-rollout-platform-stg
      params:
        - name: namespace
          value: bifrost-platform-prod

    - name: gitops-sync
      runAfter: [rollout]
      taskRef:
        name: bifrost-argocd-sync-platform-stg
      params:
        - name: application
          value: bifrost-platform-prod
