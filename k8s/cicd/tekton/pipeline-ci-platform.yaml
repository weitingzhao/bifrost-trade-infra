# CI gate for bifrost-platform (L1 control plane).
# Monorepo: Go API (api/) + TypeScript Console (console/) + spine check.
# The Console imports @bifrost/ui from its sibling checkout (file:../../bifrost-ui,
# tsconfig paths → bifrost-ui/dist), so bifrost-ui is cloned and built first.
# Lightweight: clone → go vet + go test → console type-check, lint, test and build → check-spine.
# No deploy. The infra copies of config/ are compared in ci-infra (statics), not here.
# R5:5.7-1: task changes reads which files the commit changes against main; when all of
# them are console/** outside console/src/api, or Markdown outside api/ and config/, test-api runs
# only the Go tests that read files outside api/ (it still runs, so the run's reason
# stays Succeeded: no task is skipped). Anything it cannot tell runs every Go test.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-ci-platform
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-gate
    bifrost.io/layer: L1
spec:
  description: >-
    CI gate for bifrost-platform — go vet + go test + console type-check, lint, test and build + check-spine.
    Triggered by Gitea push webhook or manual Console run.
    L1 control plane: conservative gate, must not break ops visibility.
  # Actual clone identities, not the requested (possibly moving) refs. S3 reads
  # ui-commit from the successful CI of P to pin its STG snapshot U.
  results:
    - name: platform-commit
      value: $(tasks.clone.results.commit)
    - name: platform-tree
      value: $(tasks.clone.results.tree)
    - name: ui-commit
      value: $(tasks.clone-ui.results.commit)
    - name: infra-commit
      value: $(tasks.clone-infra.results.commit)
    # What test-api actually ran: full, incremental, or the console reader checks.
    - name: api-scope
      value: $(tasks.test-api.results.api-scope)
    - name: failed-tests
      value: $(tasks.test-api.results.failed-tests)
    - name: api-packages
      value: $(tasks.test-api.results.api-packages)
    - name: api-store-run
      value: $(tasks.test-api.results.api-store-run)
    - name: api-scope-why
      value: $(tasks.test-api.results.api-scope-why)
    - name: tested-by
      value: $(tasks.reuse.results.tested-by)
  params:
    - name: revision
      type: string
      default: main
      description: The bifrost-platform commit or branch under test — a push webhook sends a SHA.
    # Infra is cloned at its own default branch. It was cloned at `revision`
    # too, which is the platform SHA and does not exist in infra, so every
    # webhook run failed at clone-infra.
    - name: infraRevision
      type: string
      default: main
    # Same for bifrost-ui. Without it the Console type-check could not resolve
    # @bifrost/ui, and all 10 runs that reached test-console failed there.
    - name: uiRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    # W-31 B5 (DESIGN-B5-v3 §4.2): the repository P is cloned from, as run
    # identity. The B5 release reader requires every run to carry it in
    # spec.params and never infers it from this default; the trigger and the
    # platform pass it explicitly, and admission allows only this value.
    - name: repo-url
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-platform.git
    - name: base
      type: string
      default: ""
    - name: api-scope-request
      type: string
      default: ""
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: bifrost-platform
      workspaces:
        - name: output
          workspace: source
    - name: clone-ui
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-ui.git
        - name: revision
          value: $(params.uiRevision)
        - name: subdir
          value: bifrost-ui
      workspaces:
        - name: output
          workspace: source
    - name: clone-infra
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-infra.git
        - name: revision
          value: $(params.infraRevision)
        - name: subdir
          value: bifrost-trade-infra
      workspaces:
        - name: output
          workspace: source
    - name: reuse
      taskRef:
        name: bifrost-ci-platform-reuse
      params:
        - name: run
          value: $(context.pipelineRun.name)
        - name: tree
          value: $(tasks.clone.results.tree)
        - name: ui
          value: $(tasks.clone-ui.results.commit)
        - name: infra
          value: $(tasks.clone-infra.results.commit)
        - name: repo-url
          value: $(params.repo-url)
        - name: base
          value: $(params.base)
      workspaces:
        - name: source
          workspace: source
    # T50 compiles the real pre-0010 API from its own pinned checkout.
    - name: clone-legacy
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-platform.git
        - name: revision
          value: 5a8edd550aaa49474a320eb15ed7c9c33f0e1bc5
        - name: subdir
          value: legacy-5a8edd55
      workspaces:
        - name: output
          workspace: source
    # api-scope: full or console, and why (task-ci-platform-changes.yaml, R5:5.7-1).
    - name: changes
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      taskRef:
        name: bifrost-ci-platform-changes
    - name: test-api
      runAfter: [clone, clone-legacy]
      # R5:5.7-1: the scope task changes chose (Tekton runs this task after it, as it
      # reads its result). full runs go vet and every Go test, as before.
      # A full run (main push, daily full, a landing run with no base) splits
      # in two side by side as before: this one is go vet and every package but
      # ./internal/agentrt/store, test-api-store below is that package alone.
      # An incremental landing run hands the whole selection to this one.
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
        - name: scope
          value: $(tasks.changes.results.api-scope)
        - name: base
          value: $(params.base)
        - name: api-scope-request
          value: $(params.api-scope-request)
        - name: part
          value: rest
      workspaces:
        - name: source
          workspace: source
      taskRef:
        name: bifrost-ci-platform-test-api
    - name: test-api-store
      runAfter: [clone, clone-legacy]
      # ./internal/agentrt/store alone on a full run, beside test-api; on an
      # incremental run test-api's selector picks the store tests and this
      # one runs none. Console scope still performs its existing safety check.
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
        - name: scope
          value: $(tasks.changes.results.api-scope)
        - name: base
          value: $(params.base)
        - name: api-scope-request
          value: $(params.api-scope-request)
        - name: part
          value: store
      workspaces:
        - name: source
          workspace: source
      taskRef:
        name: bifrost-ci-platform-test-api
    - name: test-console
      # A ceiling for a hung step, not a speed check. 2026-11-06 measured
      # full runs took 6.2-7.8 min on a busy cluster, and two runs of one
      # commit hit the old 8m0s (TD-313's 3 x 157s) with nothing wrong.
      timeout: 20m0s
      runAfter: [clone, clone-ui]
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: reuse
        workspaces:
          - name: source
        # CI-7: npm's download cache, shared by every run on every node
        # (pvc-ci-build-cache.yaml, NFS ReadWriteMany). A Task volume, not a
        # workspace, so the runs' creators pass nothing new.
        volumes:
          - name: build-cache
            persistentVolumeClaim:
              claimName: ci-build-cache
        steps:
          - name: typecheck-lint-test-build
            image: node:20-slim
            volumeMounts:
              - name: build-cache
                mountPath: /ci-cache
            computeResources:
              # The CPU request equals the limit: with a smaller share than it
              # was measured with, the same tests time out (2026-10-11).
              # Four CPUs since 2026-11-13: over 24 hours this step was held
              # back by its two-CPU limit in 82% of its CPU periods and used at
              # most 0.9 Gi of memory, and it was the longest task of the run
              # (median 325 s of 345 s). On a developer machine four workers
              # took 42% off the tests with none failing.
              requests:
                cpu: "4"
                memory: 1Gi
              limits:
                cpu: "4"
                memory: 4Gi
            env:
              - name: REUSE
                value: $(params.reuse)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              [ "${REUSE:-no}" != yes ] || exit 0
              ws="$(workspaces.source.path)"

              # CI-7: npm ci still builds node_modules from nothing, but takes the
              # packages from the shared cache instead of the registry
              # (--prefer-offline: no freshness check of cached metadata; the
              # lockfile pins every version and integrity). npm's cache is made for
              # concurrent use. npm never trims it, so it has a directory per month
              # and a run deletes only the months before last, which no running run
              # uses; nothing clears or locks the directory in use.
              cache=/ci-cache/npm
              month="$(date -u +%Y-%m)"
              year="${month%-*}" mon="${month#*-}"
              if [ "${mon}" = 01 ]; then last="$((year - 1))-12"; else last="$(printf '%s-%02d' "${year}" "$((10#${mon} - 1))")"; fi
              export npm_config_cache="${cache}/${month}"
              mkdir -p "${npm_config_cache}"
              for old in "${cache}"/*; do
                case "${old##*/}" in "${month}"|"${last}") continue ;; esac
                [ -d "${old}" ] || continue
                echo "==> removing the npm cache of ${old##*/}"
                rm -rf "${old}" 2>/dev/null || true
              done

              # Scripts on: bifrost-ui's prepare builds dist/, which is not in git.
              echo "==> Installing bifrost-ui"
              cd "${ws}/bifrost-ui"
              npm ci --prefer-offline --no-audit --no-fund
              test -f dist/index.d.ts || { echo "bifrost-ui dist/index.d.ts missing after npm ci"; exit 1; }

              cd "${ws}/bifrost-platform/console"

              echo "==> npm ci"
              npm ci --prefer-offline --no-audit --no-fund

              echo "==> tsc --noEmit"
              npx tsc --noEmit

              echo "==> npm run lint"
              npm run lint

              echo "==> vitest run"
              # The pod sees the node's cores; the limit is four CPUs.
              # Measured 2026-10-11: without it, 7 of 814 tests time out.
              npx vitest run --maxWorkers=4

              echo "==> npm run build"
              npm run build

              echo "==> Console type-check, lint, tests and build passed"
    - name: check-spine
      runAfter: [clone]
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: reuse
        workspaces:
          - name: source
        steps:
          - name: spine-catalog-check
            image: alpine:3.20
            env:
              - name: REUSE
                value: $(params.reuse)
            script: |
              #!/usr/bin/env sh
              set -eu
              [ "${REUSE:-no}" != yes ] || exit 0
              ws="$(workspaces.source.path)"
              cd "${ws}/bifrost-platform"

              if [ -f scripts/ci/check_spine_catalog.sh ]; then
                apk add --no-cache bash grep sed >/dev/null 2>&1
                bash scripts/ci/check_spine_catalog.sh
              else
                echo "check_spine_catalog.sh not found — skipping"
              fi

              echo "==> Spine catalog check passed"
    - name: code-health
      runAfter: [clone, clone-infra]
      taskRef:
        name: bifrost-code-health
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
        - name: repo
          value: bifrost-platform
      workspaces:
        - name: source
          workspace: source
