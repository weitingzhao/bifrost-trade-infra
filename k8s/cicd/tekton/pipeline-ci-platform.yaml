# CI gate for bifrost-platform (L1 control plane).
# Monorepo: Go API (api/) + TypeScript Console (console/) + spine check.
# The Console imports @bifrost/ui from its sibling checkout (file:../../bifrost-ui,
# tsconfig paths → bifrost-ui/dist), so bifrost-ui is cloned and built first.
# Lightweight: clone → go vet + go test → console type-check, lint, test and build → check-spine →
# ops-context parity against the infra copies. No deploy.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-ci-platform
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-gate
    bifrost.io/layer: L1
spec:
  description: >-
    CI gate for bifrost-platform — go vet + go test + console type-check, lint, test and build + check-spine
    + ops-context parity against the infra overlay copies.
    Triggered by Gitea push webhook or manual Console run.
    L1 control plane: conservative gate, must not break ops visibility.
  # Actual clone identities, not the requested (possibly moving) refs. S3 reads
  # ui-commit from the successful CI of P to pin its STG snapshot U.
  results:
    - name: platform-commit
      value: $(tasks.clone.results.commit)
    - name: ui-commit
      value: $(tasks.clone-ui.results.commit)
    - name: infra-commit
      value: $(tasks.clone-infra.results.commit)
  params:
    - name: revision
      type: string
      default: main
      description: The bifrost-platform commit or branch under test — a push webhook sends a SHA.
    # Infra is cloned at its own default branch. It was cloned at `revision`
    # too, which is the platform SHA and does not exist in infra, so every
    # webhook run failed at clone-infra.
    - name: infraRevision
      type: string
      default: main
    # Same for bifrost-ui. Without it the Console type-check could not resolve
    # @bifrost/ui, and all 10 runs that reached test-console failed there.
    - name: uiRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-platform.git
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: bifrost-platform
      workspaces:
        - name: output
          workspace: source
    - name: clone-ui
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-ui.git
        - name: revision
          value: $(params.uiRevision)
        - name: subdir
          value: bifrost-ui
      workspaces:
        - name: output
          workspace: source
    - name: clone-infra
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-infra.git
        - name: revision
          value: $(params.infraRevision)
        - name: subdir
          value: bifrost-trade-infra
      workspaces:
        - name: output
          workspace: source
    # T50 compiles the real pre-0010 API. The candidate's shallow clone has no
    # historical objects, and the test step has no Git credentials to fetch them.
    - name: clone-legacy
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-platform.git
        - name: revision
          value: 5a8edd550aaa49474a320eb15ed7c9c33f0e1bc5
        - name: subdir
          value: legacy-5a8edd55
      workspaces:
        - name: output
          workspace: source
    - name: test-api
      runAfter: [clone, clone-legacy]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        # The agent runtime's database and Redis tests (W-31 2.1) need a real
        # PostgreSQL and Redis. Tekton starts the steps only after both sidecars
        # are ready; the Postgres sidecar creates the roles the tests log in as
        # before it reports ready. Images are the ones the data namespace already
        # runs, pinned by digest.
        volumes:
          - name: pgdata
            emptyDir: {}
        sidecars:
          - name: postgres
            image: ghcr.io/cloudnative-pg/postgresql:17.9@sha256:ae81813008a9ef66ee9b348114c96d11c204981ac0d74b38f07fae4174c2973e
            volumeMounts:
              - name: pgdata
                mountPath: /pgdata
            computeResources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            readinessProbe:
              exec:
                command: [test, -f, /pgdata/roles-ready]
              periodSeconds: 2
            script: |
              #!/bin/sh
              set -eu
              # Whatever stops this sidecar, show the server log first.
              trap 'cat /pgdata/log 2>/dev/null || true' EXIT
              export PATH="/usr/lib/postgresql/17/bin:$PATH" LC_ALL=C
              initdb -D /pgdata/data -U postgres --auth=trust -E UTF8 --locale=C >/dev/null
              pg_ctl -D /pgdata/data -l /pgdata/log -o "-c listen_addresses=127.0.0.1 -p 5432 -k /pgdata" -w start >/dev/null
              psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -q \
                -c "CREATE ROLE agentrt_owner_dev LOGIN" -c "CREATE ROLE platform_agentrt_dev LOGIN" \
                -c "CREATE ROLE platform_agentrt_stg LOGIN" -c "CREATE ROLE agent_reader LOGIN"
              touch /pgdata/roles-ready
              while kill -0 "$(head -1 /pgdata/data/postmaster.pid)" 2>/dev/null; do sleep 2; done
              exit 1
          - name: redis
            image: docker.io/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
            args: [redis-server, --bind, 127.0.0.1, --port, "6379", --save, "", --appendonly, "no"]
            computeResources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            readinessProbe:
              exec:
                command: [redis-cli, -h, 127.0.0.1, ping]
              periodSeconds: 2
        steps:
          - name: go-test
            # api/go.mod says go 1.25.0; the image's GOTOOLCHAIN=local refused to
            # build it on 1.23. `auto` fetches a newer toolchain if go.mod moves on.
            image: golang:1.25-bookworm
            env:
              - name: GOTOOLCHAIN
                value: auto
              # T50 verifies this checkout's HEAD before exporting its API.
              - name: AGENTRT_T50_LEGACY_SRC
                value: $(workspaces.source.path)/legacy-5a8edd55/api
              # With these set the agentrt tests must run: a missing server
              # fails them instead of skipping them.
              - name: AGENTRT_TEST_PG
                value: host=127.0.0.1 port=5432 user=postgres sslmode=disable
              - name: AGENTRT_TEST_REDIS
                value: redis://127.0.0.1:6379/0
              - name: AGENTRT_TEST_REQUIRED
                value: "1"
            computeResources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              ws="$(workspaces.source.path)"
              cd "${ws}/bifrost-platform/api"

              echo "==> go mod download"
              go mod download

              echo "==> go vet ./..."
              go vet ./...

              echo "==> go test ./..."
              go test ./... -count=1 -timeout=300s

              echo "==> Go API tests passed"
    - name: test-console
      # 3 × 157s = 471s, rounded up to 8m0s. TD-313.
      # 157s is the slowest full step measured in node:20-slim at --cpus=2
      # and --memory=4g on 2026-10-11 (the other run was 150s). The 8m0s
      # includes scheduling and image pull.
      timeout: 8m0s
      runAfter: [clone, clone-ui]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: typecheck-lint-test-build
            image: node:20-slim
            computeResources:
              # The CPU request equals the limit: the suite was measured with
              # two CPUs, and with a smaller share the same tests time out.
              requests:
                cpu: "2"
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              ws="$(workspaces.source.path)"

              # Scripts on: bifrost-ui's prepare builds dist/, which is not in git.
              echo "==> Installing bifrost-ui"
              cd "${ws}/bifrost-ui"
              npm ci --no-audit --no-fund
              test -f dist/index.d.ts || { echo "bifrost-ui dist/index.d.ts missing after npm ci"; exit 1; }

              cd "${ws}/bifrost-platform/console"

              echo "==> npm ci"
              npm ci --no-audit --no-fund

              echo "==> tsc --noEmit"
              npx tsc --noEmit

              echo "==> npm run lint"
              npm run lint

              echo "==> vitest run"
              # The pod sees the node's cores; the limit is two CPUs.
              # Measured 2026-10-11: without it, 7 of 814 tests time out.
              npx vitest run --maxWorkers=2

              echo "==> npm run build"
              npm run build

              echo "==> Console type-check, lint, tests and build passed"
    - name: check-spine
      runAfter: [clone]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: spine-catalog-check
            image: alpine:3.20
            script: |
              #!/usr/bin/env sh
              set -eu
              ws="$(workspaces.source.path)"
              cd "${ws}/bifrost-platform"

              if [ -f scripts/ci/check_spine_catalog.sh ]; then
                apk add --no-cache bash grep sed >/dev/null 2>&1
                bash scripts/ci/check_spine_catalog.sh
              else
                echo "check_spine_catalog.sh not found — skipping"
              fi

              echo "==> Spine catalog check passed"
    - name: check-ops-context
      runAfter: [clone, clone-infra]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: ops-context-parity
            image: alpine:3.20
            script: |
              #!/usr/bin/env sh
              set -eu
              apk add --no-cache python3 >/dev/null
              ws="$(workspaces.source.path)"
              # The platform SHA under test must match the spine copies on
              # infraRevision (default main). A spine edit fails here until
              # those copies are synced.
              export PLATFORM_ROOT="${ws}/bifrost-platform"
              python3 "${ws}/bifrost-trade-infra/scripts/check_ops_context_parity.py" --self-test
              python3 "${ws}/bifrost-trade-infra/scripts/check_ops_context_parity.py"
              echo "==> ops-context parity passed"
    - name: code-health
      runAfter: [clone, clone-infra]
      taskRef:
        name: bifrost-code-health
      params:
        - name: repo
          value: bifrost-platform
      workspaces:
        - name: source
          workspace: source
