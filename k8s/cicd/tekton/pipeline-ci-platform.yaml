# CI gate for bifrost-platform (L1 control plane).
# Monorepo: Go API (api/) + TypeScript Console (console/) + spine check.
# The Console imports @bifrost/ui from its sibling checkout (file:../../bifrost-ui,
# tsconfig paths → bifrost-ui/dist), so bifrost-ui is cloned and built first.
# Lightweight: clone → go vet + go test → console type-check, lint, test and build → check-spine.
# No deploy. The infra copies of config/ are compared in ci-infra (statics), not here.
# R5:5.7-1: task changes reads which files the commit changes against main; when all of
# them are console/** outside console/src/api, or Markdown outside api/ and config/, test-api runs
# only the Go tests that read files outside api/ (it still runs, so the run's reason
# stays Succeeded: no task is skipped). Anything it cannot tell runs every Go test.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-ci-platform
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-gate
    bifrost.io/layer: L1
spec:
  description: >-
    CI gate for bifrost-platform — go vet + go test + console type-check, lint, test and build + check-spine.
    Triggered by Gitea push webhook or manual Console run.
    L1 control plane: conservative gate, must not break ops visibility.
  # Actual clone identities, not the requested (possibly moving) refs. S3 reads
  # ui-commit from the successful CI of P to pin its STG snapshot U.
  results:
    - name: platform-commit
      value: $(tasks.clone.results.commit)
    - name: platform-tree
      value: $(tasks.clone.results.tree)
    - name: ui-commit
      value: $(tasks.clone-ui.results.commit)
    - name: infra-commit
      value: $(tasks.clone-infra.results.commit)
    # What test-api actually ran: full, incremental, or the console reader checks.
    - name: api-scope
      value: $(tasks.test-api.results.api-scope)
    - name: failed-tests
      value: $(tasks.test-api.results.failed-tests)
    - name: api-packages
      value: $(tasks.test-api.results.api-packages)
    - name: api-store-run
      value: $(tasks.test-api.results.api-store-run)
    - name: api-scope-why
      value: $(tasks.test-api.results.api-scope-why)
    - name: tested-by
      value: $(tasks.reuse.results.tested-by)
  params:
    - name: revision
      type: string
      default: main
      description: The bifrost-platform commit or branch under test — a push webhook sends a SHA.
    # Infra is cloned at its own default branch. It was cloned at `revision`
    # too, which is the platform SHA and does not exist in infra, so every
    # webhook run failed at clone-infra.
    - name: infraRevision
      type: string
      default: main
    # Same for bifrost-ui. Without it the Console type-check could not resolve
    # @bifrost/ui, and all 10 runs that reached test-console failed there.
    - name: uiRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    # W-31 B5 (DESIGN-B5-v3 §4.2): the repository P is cloned from, as run
    # identity. The B5 release reader requires every run to carry it in
    # spec.params and never infers it from this default; the trigger and the
    # platform pass it explicitly, and admission allows only this value.
    - name: repo-url
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-platform.git
    - name: base
      type: string
      default: ""
    - name: api-scope-request
      type: string
      default: ""
    - name: land
      type: string
      default: "no"
      description: >-
        "yes" only from the ready/ webhook trigger (trigger-trade-ci.yaml platform-ci-land).
        A run the platform starts cannot set it (ci_run.go accepts revision alone).
    - name: branch
      type: string
      default: ""
      description: The pushed ref (refs/heads/ready/<name>) of a landing run.
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: bifrost-platform
      workspaces:
        - name: output
          workspace: source
    - name: clone-ui
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-ui.git
        - name: revision
          value: $(params.uiRevision)
        - name: subdir
          value: bifrost-ui
      workspaces:
        - name: output
          workspace: source
    - name: clone-infra
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-infra.git
        - name: revision
          value: $(params.infraRevision)
        - name: subdir
          value: bifrost-trade-infra
      workspaces:
        - name: output
          workspace: source
    - name: reuse
      taskRef:
        name: bifrost-ci-platform-reuse
      params:
        - name: run
          value: $(context.pipelineRun.name)
        - name: tree
          value: $(tasks.clone.results.tree)
        - name: ui
          value: $(tasks.clone-ui.results.commit)
        - name: infra
          value: $(tasks.clone-infra.results.commit)
        - name: repo-url
          value: $(params.repo-url)
        - name: base
          value: $(params.base)
      workspaces:
        - name: source
          workspace: source
    # T50 compiles the real pre-0010 API from its own pinned checkout.
    - name: clone-legacy
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-platform.git
        - name: revision
          value: 5a8edd550aaa49474a320eb15ed7c9c33f0e1bc5
        - name: subdir
          value: legacy-5a8edd55
      workspaces:
        - name: output
          workspace: source
    # api-scope: full or console, and why (task-ci-platform-changes.yaml, R5:5.7-1).
    - name: changes
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      taskRef:
        name: bifrost-ci-platform-changes
    - name: test-api
      runAfter: [clone, clone-legacy]
      # R5:5.7-1: the scope task changes chose (Tekton runs this task after it, as it
      # reads its result). full runs go vet and every Go test, as before.
      # A full run (main push, daily full, a landing run with no base) splits
      # in two side by side as before: this one is go vet and every package but
      # ./internal/agentrt/store, test-api-store below is that package alone.
      # An incremental landing run hands the whole selection to this one.
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
        - name: scope
          value: $(tasks.changes.results.api-scope)
        - name: base
          value: $(params.base)
        - name: api-scope-request
          value: $(params.api-scope-request)
        - name: part
          value: rest
      workspaces:
        - name: source
          workspace: source
      taskRef:
        name: bifrost-ci-platform-test-api
    - name: test-api-store
      runAfter: [clone, clone-legacy]
      # ./internal/agentrt/store alone on a full run, beside test-api; on an
      # incremental run test-api's selector picks the store tests and this
      # one runs none. Console scope still performs its existing safety check.
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
        - name: scope
          value: $(tasks.changes.results.api-scope)
        - name: base
          value: $(params.base)
        - name: api-scope-request
          value: $(params.api-scope-request)
        - name: part
          value: store
      workspaces:
        - name: source
          workspace: source
      taskRef:
        name: bifrost-ci-platform-test-api
    - name: test-console
      # A ceiling for a hung step, not a speed check. 2026-11-06 measured
      # full runs took 6.2-7.8 min on a busy cluster, and two runs of one
      # commit hit the old 8m0s (TD-313's 3 x 157s) with nothing wrong.
      timeout: 20m0s
      runAfter: [clone, clone-ui]
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: reuse
        workspaces:
          - name: source
        # CI-7: npm's download cache, shared by every run on every node
        # (pvc-ci-build-cache.yaml, NFS ReadWriteMany). A Task volume, not a
        # workspace, so the runs' creators pass nothing new.
        volumes:
          - name: build-cache
            persistentVolumeClaim:
              claimName: ci-build-cache
        steps:
          - name: typecheck-lint-test-build
            image: node:20-slim
            volumeMounts:
              - name: build-cache
                mountPath: /ci-cache
            computeResources:
              # The CPU request equals the limit: the suite was measured with
              # two CPUs, and with a smaller share the same tests time out.
              requests:
                cpu: "2"
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
            env:
              - name: REUSE
                value: $(params.reuse)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              [ "${REUSE:-no}" != yes ] || exit 0
              ws="$(workspaces.source.path)"

              # CI-7: npm ci still builds node_modules from nothing, but takes the
              # packages from the shared cache instead of the registry
              # (--prefer-offline: no freshness check of cached metadata; the
              # lockfile pins every version and integrity). npm's cache is made for
              # concurrent use. npm never trims it, so it has a directory per month
              # and a run deletes only the months before last, which no running run
              # uses; nothing clears or locks the directory in use.
              cache=/ci-cache/npm
              month="$(date -u +%Y-%m)"
              year="${month%-*}" mon="${month#*-}"
              if [ "${mon}" = 01 ]; then last="$((year - 1))-12"; else last="$(printf '%s-%02d' "${year}" "$((10#${mon} - 1))")"; fi
              export npm_config_cache="${cache}/${month}"
              mkdir -p "${npm_config_cache}"
              for old in "${cache}"/*; do
                case "${old##*/}" in "${month}"|"${last}") continue ;; esac
                [ -d "${old}" ] || continue
                echo "==> removing the npm cache of ${old##*/}"
                rm -rf "${old}" 2>/dev/null || true
              done

              # Scripts on: bifrost-ui's prepare builds dist/, which is not in git.
              echo "==> Installing bifrost-ui"
              cd "${ws}/bifrost-ui"
              npm ci --prefer-offline --no-audit --no-fund
              test -f dist/index.d.ts || { echo "bifrost-ui dist/index.d.ts missing after npm ci"; exit 1; }

              cd "${ws}/bifrost-platform/console"

              echo "==> npm ci"
              npm ci --prefer-offline --no-audit --no-fund

              echo "==> tsc --noEmit"
              npx tsc --noEmit

              echo "==> npm run lint"
              npm run lint

              echo "==> vitest run"
              # The pod sees the node's cores; the limit is two CPUs.
              # Measured 2026-10-11: without it, 7 of 814 tests time out.
              npx vitest run --maxWorkers=2

              echo "==> npm run build"
              npm run build

              echo "==> Console type-check, lint, tests and build passed"
    - name: check-spine
      runAfter: [clone]
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: reuse
        workspaces:
          - name: source
        steps:
          - name: spine-catalog-check
            image: alpine:3.20
            env:
              - name: REUSE
                value: $(params.reuse)
            script: |
              #!/usr/bin/env sh
              set -eu
              [ "${REUSE:-no}" != yes ] || exit 0
              ws="$(workspaces.source.path)"
              cd "${ws}/bifrost-platform"

              if [ -f scripts/ci/check_spine_catalog.sh ]; then
                apk add --no-cache bash grep sed >/dev/null 2>&1
                bash scripts/ci/check_spine_catalog.sh
              else
                echo "check_spine_catalog.sh not found — skipping"
              fi

              echo "==> Spine catalog check passed"
    - name: code-health
      runAfter: [clone, clone-infra]
      taskRef:
        name: bifrost-code-health
      params:
        - name: reuse
          value: $(tasks.reuse.results.reuse)
        - name: repo
          value: bifrost-platform
      workspaces:
        - name: source
          workspace: source
    # Owner 2026-11-12: main takes a change only through a pull request, and the only identity
    # on main's merge whitelist besides the Owner is bifrost-merger, whose token is mounted in
    # this one task. It merges the commit this run tested. It runs after every other task, so
    # Tekton starts it only when all of them passed; a commit status, which anyone with write
    # access can post, decides nothing. It is a task and not `finally`, and has no `when`: a
    # skipped task would change the run's reason (test_ci_platform_scope.py); a run that is
    # not a landing starts it and it exits at once. Inline, so that no TaskRun can call it
    # with a commit of the caller's choosing. The Secret is optional so that CI runs before
    # the Owner has installed it.
    - name: land
      timeout: 5m0s
      runAfter: [clone, clone-ui, clone-infra, reuse, clone-legacy, changes, test-api, test-api-store, test-console, check-spine, code-health]
      params:
        - name: commit
          value: $(tasks.clone.results.commit)
        - name: branch
          value: $(params.branch)
        - name: land
          value: $(params.land)
      taskSpec:
        params:
          - name: commit
          - name: branch
          - name: land
        volumes:
          - name: gitea-merger
            secret:
              secretName: gitea-merger
              optional: true
        steps:
          - name: merge
            image: python:3.11-slim-bookworm
            volumeMounts:
              - name: gitea-merger
                mountPath: /etc/gitea-merger
                readOnly: true
            env:
              - name: COMMIT
                value: $(params.commit)
              - name: BRANCH
                value: $(params.branch)
              - name: LAND
                value: $(params.land)
            script: |
              #!/usr/bin/env python3
              """Open the pull request for a green ready/ branch and merge it (rebase, same commit)."""
              import json
              import os
              import re
              import sys
              import time
              import urllib.error
              import urllib.request

              # Fixed: the token is never sent to an address a caller chose.
              API = 'http://gitea.cicd.svc.cluster.local:3000/api/v1/repos/bifrost/bifrost-platform'
              TOKEN_FILE = '/etc/gitea-merger/password'  # kubernetes.io/basic-auth, put-reader-token.sh merger

              def call(token, method, path, body=None):
                  data = None if body is None else json.dumps(body).encode()
                  req = urllib.request.Request(API + path, method=method, data=data, headers={
                      'Authorization': 'token ' + token, 'Content-Type': 'application/json'})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          raw = response.read()
                          return response.status, (json.loads(raw) if raw.strip() else None)
                  except urllib.error.HTTPError as err:
                      try:
                          message = str(json.loads(err.read()).get('message', ''))[:300]
                      except Exception:
                          message = ''
                      return err.code, {'message': message}

              def land(token, ref, commit, tries=24, pause=5):
                  found = re.fullmatch(r'refs/heads/(ready/[A-Za-z0-9._/-]{1,100})', ref)
                  if not found or not re.fullmatch(r'[0-9a-f]{40}', commit):
                      return 'refused: not a ready/ branch with a full commit id'
                  branch = found.group(1)
                  code, pull = call(token, 'POST', '/pulls', {
                      'head': branch, 'base': 'main', 'title': 'Land ' + branch,
                      'body': 'Opened by bifrost-ci-platform for commit ' + commit + '.'})
                  if code == 409:
                      code, pulls = call(token, 'GET', '/pulls?state=open&limit=50')
                      pull = next((p for p in pulls or [] if isinstance(p, dict)
                                   and p.get('head', {}).get('ref') == branch
                                   and p.get('base', {}).get('ref') == 'main'), None) if code == 200 else None
                      if pull is None:
                          return 'refused: a pull request for this branch exists but could not be read'
                  elif code != 201:
                      return 'refused: could not open the pull request (%s %s)' % (code, (pull or {}).get('message', ''))
                  if pull.get('head', {}).get('sha') != commit:
                      return 'refused: the branch moved after this run started; its new push has its own run'
                  code, main = call(token, 'GET', '/branches/main')
                  if code != 200:
                      return 'refused: could not read main (%s)' % code
                  if pull.get('merge_base') != main.get('commit', {}).get('id'):
                      return ('refused: the branch is behind main. Rebase it onto main and push ready/ again; '
                              'the new commit gets its own run')
                  last = ''
                  for _ in range(tries):
                      code, out = call(token, 'POST', '/pulls/%d/merge' % pull['number'], {
                          'Do': 'rebase', 'head_commit_id': commit, 'delete_branch_after_merge': True})
                      if code == 200:
                          break
                      last = '%s %s' % (code, (out or {}).get('message', ''))
                      if code not in (405, 409):
                          return 'refused: merge failed (%s)' % last
                      time.sleep(pause)  # Gitea is still checking the new pull request
                  else:
                      return 'refused: Gitea did not accept the merge (%s)' % last
                  code, main = call(token, 'GET', '/branches/main')
                  landed = main.get('commit', {}).get('id') if code == 200 else None
                  if landed != commit:
                      print('WARNING: merged pull request #%d but main reads %s, not %s' % (pull['number'], landed, commit))
                  print('landed %s on main through pull request #%d' % (commit, pull['number']))
                  return ''

              if __name__ == '__main__':
                  if os.environ.get('LAND') != 'yes':
                      print('not a landing run (land is not "yes"): nothing to merge')
                      sys.exit(0)
                  if not os.path.exists(TOKEN_FILE):
                      sys.exit('refused: Secret cicd/gitea-merger is not installed')
                  with open(TOKEN_FILE) as handle:
                      problem = land(handle.read().strip(), os.environ['BRANCH'], os.environ['COMMIT'])
                  if problem:
                      sys.exit(problem)
