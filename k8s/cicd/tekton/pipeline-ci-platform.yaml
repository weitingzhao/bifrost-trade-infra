# CI gate for bifrost-platform (L1 control plane).
# Monorepo: Go API (api/) + TypeScript Console (console/) + spine check.
# The Console imports @bifrost/ui from its sibling checkout (file:../../bifrost-ui,
# tsconfig paths → bifrost-ui/dist), so bifrost-ui is cloned and built first.
# Lightweight: clone → go vet + go test → console type-check, lint, test and build → check-spine →
# ops-context parity against the infra copies. No deploy.
# R5:5.7-1: task changes reads which files the commit changes against main; when all of
# them are console/** outside console/src/api, or Markdown outside api/ and config/, test-api runs
# only the Go tests that read files outside api/ (it still runs, so the run's reason
# stays Succeeded: no task is skipped). Anything it cannot tell runs every Go test.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-ci-platform
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-gate
    bifrost.io/layer: L1
spec:
  description: >-
    CI gate for bifrost-platform — go vet + go test + console type-check, lint, test and build + check-spine
    + ops-context parity against the infra overlay copies.
    Triggered by Gitea push webhook or manual Console run.
    L1 control plane: conservative gate, must not break ops visibility.
  # Actual clone identities, not the requested (possibly moving) refs. S3 reads
  # ui-commit from the successful CI of P to pin its STG snapshot U.
  results:
    - name: platform-commit
      value: $(tasks.clone.results.commit)
    - name: ui-commit
      value: $(tasks.clone-ui.results.commit)
    - name: infra-commit
      value: $(tasks.clone-infra.results.commit)
    # R5:5.7-1: how much of the Go tests this run ran (task changes): full, or console
    # (only those a console change can reach). Never empty: changes writes full first.
    # A release takes only a full run as a commit's CI (scripts/release/ci_gate.py
    # --require-full); a run without this result is from before it and ran in full.
    - name: api-scope
      value: $(tasks.changes.results.api-scope)
  params:
    - name: revision
      type: string
      default: main
      description: The bifrost-platform commit or branch under test — a push webhook sends a SHA.
    # Infra is cloned at its own default branch. It was cloned at `revision`
    # too, which is the platform SHA and does not exist in infra, so every
    # webhook run failed at clone-infra.
    - name: infraRevision
      type: string
      default: main
    # Same for bifrost-ui. Without it the Console type-check could not resolve
    # @bifrost/ui, and all 10 runs that reached test-console failed there.
    - name: uiRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    # W-31 B5 (DESIGN-B5-v3 §4.2): the repository P is cloned from, as run
    # identity. The B5 release reader requires every run to carry it in
    # spec.params and never infers it from this default; the trigger and the
    # platform pass it explicitly, and admission allows only this value.
    - name: repo-url
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-platform.git
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: bifrost-platform
      workspaces:
        - name: output
          workspace: source
    - name: clone-ui
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-ui.git
        - name: revision
          value: $(params.uiRevision)
        - name: subdir
          value: bifrost-ui
      workspaces:
        - name: output
          workspace: source
    - name: clone-infra
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-infra.git
        - name: revision
          value: $(params.infraRevision)
        - name: subdir
          value: bifrost-trade-infra
      workspaces:
        - name: output
          workspace: source
    # T50 compiles the real pre-0010 API. The candidate's shallow clone has no
    # historical objects, and the test step has no Git credentials to fetch them.
    - name: clone-legacy
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-platform.git
        - name: revision
          value: 5a8edd550aaa49474a320eb15ed7c9c33f0e1bc5
        - name: subdir
          value: legacy-5a8edd55
      workspaces:
        - name: output
          workspace: source
    # R5:5.7-1: the files revision changes against main, from its merge base with Gitea's
    # main (a branch push, and a landing run, whose commit is prepared on main). It answers
    # api-scope=console only when every change is a plain file under console/ outside
    # console/src/api, or a Markdown file outside api/ and config/ (Go tests read both
    # trees). Anything else answers full: another path, a commit on main (no change
    # against main), a revision that is not a SHA (a bifrost-ui push runs main), a list
    # it cannot read or of more than 2000 files, any failure. It writes full before
    # anything else and always exits 0, so it never fails a run. No workspace: it clones
    # into its own container (blobless).
    - name: changes
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      taskSpec:
        params:
          - name: repo-url
            type: string
          - name: revision
            type: string
        results:
          - name: api-scope
            description: full, or console when the Go code is main's and only console or Markdown changed
          - name: why
            description: One line on how api-scope was chosen
        steps:
          - name: diff
            image: alpine/git:2.45.2
            computeResources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                cpu: "1"
                memory: 512Mi
            env:
              - name: GIT_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-reader
                    key: username
              - name: GIT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-reader
                    key: password
              - name: REPO_URL
                value: $(params.repo-url)
              - name: REVISION
                value: $(params.revision)
            script: |
              #!/bin/sh
              set -u
              scope_file="$(results.api-scope.path)"
              why_file="$(results.why.path)"
              printf 'full' > "$scope_file"
              printf 'not decided' > "$why_file"
              answer() {
                printf '%s' "$1" > "$scope_file"
                printf '%s' "$2" | cut -c1-300 | tr -d '\n' > "$why_file"
                echo "api-scope: $1 ($2)"
                exit 0
              }
              full() { answer full "$1"; }
              user="${GIT_USERNAME:-}"
              password="${GIT_PASSWORD:-}"
              unset GIT_USERNAME GIT_PASSWORD
              [ -n "$user" ] && [ -n "$password" ] || full "no Gitea reader credential"
              auth="$(printf '%s:%s' "$user" "$password" | base64 | tr -d '\n')"
              unset user password
              limit=""
              command -v timeout >/dev/null 2>&1 && limit="timeout 120"
              git_read() {
                # shellcheck disable=SC2086
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
                GIT_CONFIG_COUNT=5 \
                GIT_CONFIG_KEY_0=http.http://gitea.cicd.svc.cluster.local:3000/.extraHeader \
                GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
                GIT_CONFIG_KEY_1=http.followRedirects GIT_CONFIG_VALUE_1=false \
                GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2= \
                GIT_CONFIG_KEY_3=http.lowSpeedLimit GIT_CONFIG_VALUE_3=1000 \
                GIT_CONFIG_KEY_4=http.lowSpeedTime GIT_CONFIG_VALUE_4=30 \
                $limit git "$@"
              }
              url="${REPO_URL:-}"
              rev="${REVISION:-}"
              case "$url" in *[!A-Za-z0-9._:/-]*|'') full "the repository address is not one this task reads" ;; esac
              printf '%s' "$url" | grep -Eq '^http://gitea\.cicd\.svc\.cluster\.local:3000/[A-Za-z0-9_-]+/[A-Za-z0-9_-][A-Za-z0-9._-]*\.git$' ||
                full "the repository is not in the in-cluster Gitea"
              case "$rev" in *[!0-9a-f]*|'') full "revision is not a commit SHA" ;; esac
              [ "${#rev}" -eq 40 ] || full "revision is not a commit SHA"
              work="$(mktemp -d)" || full "no temporary directory"
              repo="$work/repo.git"
              # Blobless: the names of changed files need commits and trees only.
              git_read clone -q --bare --filter=blob:none --no-tags "$url" "$repo" >/dev/null 2>&1 ||
                full "cannot clone the repository from Gitea"
              cd "$repo" || full "no clone"
              # Nothing below may fetch a missing object on its own (git 2.44+).
              export GIT_NO_LAZY_FETCH=1
              if ! git cat-file -e "$rev^{commit}" 2>/dev/null; then
                git_read fetch -q --no-tags origin "$rev" >/dev/null 2>&1 || true
              fi
              git cat-file -e "$rev^{commit}" 2>/dev/null || full "commit $rev is not in Gitea"
              main="$(git rev-parse -q --verify 'refs/heads/main^{commit}')" || full "Gitea has no main"
              base="$(git merge-base "$main" "$rev")" || full "no common history with main"
              [ "$base" != "$rev" ] || full "the commit is on main: nothing to compare it with"
              git diff --raw -z --no-renames --no-abbrev --ignore-submodules=none --no-ext-diff "$base" "$rev" > "$work/raw" ||
                full "cannot read the changes against main"
              echo "changes of $rev against main (merge base $base):"
              tr '\0' '\n' < "$work/raw" | awk 'NR % 2 == 0' | head -50
              # Records alternate: ":<old mode> <new mode> <old> <new> <status>", then the path.
              verdict="$(tr '\0' '\n' < "$work/raw" | awk -v max=2000 '
                BEGIN { n = 0; meta = 1; bad = ""; shown = 0; list = "" }
                meta == 1 {
                  if ($0 !~ /^:[0-7][0-7][0-7][0-7][0-7][0-7] [0-7][0-7][0-7][0-7][0-7][0-7] [0-9a-f]+ [0-9a-f]+ [ADM]$/) {
                    bad = "a change that is not an add, delete or edit of one file"; exit
                  }
                  old = substr($0, 2, 6); new = substr($0, 9, 6); meta = 0; next
                }
                {
                  meta = 1; n++; path = $0
                  if (n > max) { bad = "more than " max " files changed"; exit }
                  if (path !~ /^[A-Za-z0-9._@+-][A-Za-z0-9._@+\/-]*$/ || path ~ /(^|\/)\.\.?(\/|$)/ || path ~ /\/\// || path ~ /\/$/) {
                    bad = "a path this task does not read"; exit
                  }
                  if (!((old == "000000" || old == "100644" || old == "100755") && (new == "000000" || new == "100644" || new == "100755"))) {
                    bad = path " is not a plain file"; exit
                  }
                  console = (substr(path, 1, 8) == "console/" && substr(path, 1, 16) != "console/src/api/")
                  doc = (path ~ /\.md$/ && substr(path, 1, 4) != "api/" && substr(path, 1, 7) != "config/")
                  if (!console && !doc) { bad = path " is outside console scope"; exit }
                  if (shown < 3) { list = list (shown ? ", " : "") path; shown++ }
                }
                END {
                  if (bad == "" && meta == 0) bad = "the change list ends inside a record"
                  if (bad == "" && n == 0) bad = "no change against main"
                  if (bad != "") { print "full"; print bad; exit }
                  print "console"
                  print n " file(s), each console/** outside console/src/api or Markdown outside api/ and config/: " list
                }')" || full "cannot classify the changes"
              scope="$(printf '%s\n' "$verdict" | sed -n 1p)"
              why="$(printf '%s\n' "$verdict" | sed -n 2p)"
              case "$scope" in
                console) answer console "$why" ;;
                *) full "${why:-cannot classify the changes}" ;;
              esac
    - name: test-api
      runAfter: [clone, clone-legacy]
      # R5:5.7-1: the scope task changes chose (Tekton runs this task after it, as it
      # reads its result). full runs go vet and every Go test, as before.
      params:
        - name: scope
          value: $(tasks.changes.results.api-scope)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: scope
            type: string
            default: full
        workspaces:
          - name: source
        # The agent runtime's database and Redis tests (W-31 2.1) need a real
        # PostgreSQL and Redis. Tekton starts the steps only after both sidecars
        # are ready; the Postgres sidecar creates the roles the tests log in as
        # before it reports ready. Images are the ones the data namespace already
        # runs, pinned by digest.
        volumes:
          - name: pgdata
            emptyDir: {}
        sidecars:
          - name: postgres
            image: ghcr.io/cloudnative-pg/postgresql:17.9@sha256:ae81813008a9ef66ee9b348114c96d11c204981ac0d74b38f07fae4174c2973e
            volumeMounts:
              - name: pgdata
                mountPath: /pgdata
            computeResources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            readinessProbe:
              exec:
                command: [test, -f, /pgdata/roles-ready]
              periodSeconds: 2
            script: |
              #!/bin/sh
              set -eu
              # Whatever stops this sidecar, show the server log first.
              trap 'cat /pgdata/log 2>/dev/null || true' EXIT
              export PATH="/usr/lib/postgresql/17/bin:$PATH" LC_ALL=C
              initdb -D /pgdata/data -U postgres --auth=trust -E UTF8 --locale=C >/dev/null
              pg_ctl -D /pgdata/data -l /pgdata/log -o "-c listen_addresses=127.0.0.1 -p 5432 -k /pgdata" -w start >/dev/null
              psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -q \
                -c "CREATE ROLE agentrt_owner_dev LOGIN" -c "CREATE ROLE platform_agentrt_dev LOGIN" \
                -c "CREATE ROLE platform_agentrt_stg LOGIN" -c "CREATE ROLE agent_reader LOGIN"
              touch /pgdata/roles-ready
              while kill -0 "$(head -1 /pgdata/data/postmaster.pid)" 2>/dev/null; do sleep 2; done
              exit 1
          - name: redis
            image: docker.io/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
            args: [redis-server, --bind, 127.0.0.1, --port, "6379", --save, "", --appendonly, "no"]
            computeResources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            readinessProbe:
              exec:
                command: [redis-cli, -h, 127.0.0.1, ping]
              periodSeconds: 2
        steps:
          - name: go-test
            # api/go.mod says go 1.25.0; the image's GOTOOLCHAIN=local refused to
            # build it on 1.23. `auto` fetches a newer toolchain if go.mod moves on.
            image: golang:1.25-bookworm
            env:
              - name: GOTOOLCHAIN
                value: auto
              # T50 verifies this checkout's HEAD before exporting its API.
              - name: AGENTRT_T50_LEGACY_SRC
                value: $(workspaces.source.path)/legacy-5a8edd55/api
              # With these set the agentrt tests must run: a missing server
              # fails them instead of skipping them.
              - name: AGENTRT_TEST_PG
                value: host=127.0.0.1 port=5432 user=postgres sslmode=disable
              - name: AGENTRT_TEST_REDIS
                value: redis://127.0.0.1:6379/0
              - name: AGENTRT_TEST_REQUIRED
                value: "1"
              # R5:5.7-1: full, or console (see task changes).
              - name: API_SCOPE
                value: $(params.scope)
            computeResources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              ws="$(workspaces.source.path)"
              cd "${ws}/bifrost-platform/api"

              echo "==> go mod download"
              go mod download

              # R5:5.7-1: console scope means every change since main is console/**
              # outside console/src/api, or Markdown outside api/ and config/ (task changes): the Go
              # code is main's, and only Go tests that read files outside api/ can answer
              # differently: the landing hard-floor scans of console/src and the catalog
              # (agentrt/rules) and the whole-repository scan (cluster). The fixtures the
              # other tests read are under console/src/api and config/, which are always full.
              # scripts/release/test_ci_platform_scope.py checks this list against the
              # platform's Go tests.
              CONSOLE_SCOPE_PACKAGES="./internal/agentrt/rules/... ./internal/cluster"
              if [ "${API_SCOPE:-full}" = "console" ]; then
                echo "==> console scope: go test ${CONSOLE_SCOPE_PACKAGES}; no go vet (the Go code is main's)"
                # shellcheck disable=SC2086
                go test ${CONSOLE_SCOPE_PACKAGES} -count=1 -timeout=900s
                echo "==> Go API tests passed (console scope)"
                exit 0
              fi

              echo "==> go vet ./..."
              go vet ./...

              echo "==> go test ./..."
              # 900s: agentrt/store alone takes ~230s on a dev Mac with its PostgreSQL
              # tests (W-31 core landing block); 300s timed out on the CI node.
              go test ./... -count=1 -timeout=900s

              echo "==> Go API tests passed"
    - name: test-console
      # 3 × 157s = 471s, rounded up to 8m0s. TD-313.
      # 157s is the slowest full step measured in node:20-slim at --cpus=2
      # and --memory=4g on 2026-10-11 (the other run was 150s). The 8m0s
      # includes scheduling and image pull.
      timeout: 8m0s
      runAfter: [clone, clone-ui]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: typecheck-lint-test-build
            image: node:20-slim
            computeResources:
              # The CPU request equals the limit: the suite was measured with
              # two CPUs, and with a smaller share the same tests time out.
              requests:
                cpu: "2"
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              ws="$(workspaces.source.path)"

              # Scripts on: bifrost-ui's prepare builds dist/, which is not in git.
              echo "==> Installing bifrost-ui"
              cd "${ws}/bifrost-ui"
              npm ci --no-audit --no-fund
              test -f dist/index.d.ts || { echo "bifrost-ui dist/index.d.ts missing after npm ci"; exit 1; }

              cd "${ws}/bifrost-platform/console"

              echo "==> npm ci"
              npm ci --no-audit --no-fund

              echo "==> tsc --noEmit"
              npx tsc --noEmit

              echo "==> npm run lint"
              npm run lint

              echo "==> vitest run"
              # The pod sees the node's cores; the limit is two CPUs.
              # Measured 2026-10-11: without it, 7 of 814 tests time out.
              npx vitest run --maxWorkers=2

              echo "==> npm run build"
              npm run build

              echo "==> Console type-check, lint, tests and build passed"
    - name: check-spine
      runAfter: [clone]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: spine-catalog-check
            image: alpine:3.20
            script: |
              #!/usr/bin/env sh
              set -eu
              ws="$(workspaces.source.path)"
              cd "${ws}/bifrost-platform"

              if [ -f scripts/ci/check_spine_catalog.sh ]; then
                apk add --no-cache bash grep sed >/dev/null 2>&1
                bash scripts/ci/check_spine_catalog.sh
              else
                echo "check_spine_catalog.sh not found — skipping"
              fi

              echo "==> Spine catalog check passed"
    - name: check-ops-context
      runAfter: [clone, clone-infra]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: ops-context-parity
            image: alpine:3.20
            script: |
              #!/usr/bin/env sh
              set -eu
              apk add --no-cache python3 >/dev/null
              ws="$(workspaces.source.path)"
              # The platform SHA under test must match the spine copies on
              # infraRevision (default main). A spine edit fails here until
              # those copies are synced.
              export PLATFORM_ROOT="${ws}/bifrost-platform"
              python3 "${ws}/bifrost-trade-infra/scripts/check_ops_context_parity.py" --self-test
              python3 "${ws}/bifrost-trade-infra/scripts/check_ops_context_parity.py"
              echo "==> ops-context parity passed"
    - name: code-health
      runAfter: [clone, clone-infra]
      taskRef:
        name: bifrost-code-health
      params:
        - name: repo
          value: bifrost-platform
      workspaces:
        - name: source
          workspace: source
