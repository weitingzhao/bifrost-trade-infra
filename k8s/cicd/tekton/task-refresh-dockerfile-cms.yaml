# Refresh Kaniko Dockerfile ConfigMaps from Gitea bifrost-trade-infra (Supply Chain actuation).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-refresh-dockerfile-cms
  namespace: cicd
  labels:
    bifrost.io/purpose: stg-deliver
spec:
  params:
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone-infra
      image: alpine/git:2.45.2
      env:
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: gitea-ci-reader
              key: username
        - name: GIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitea-ci-reader
              key: password
        - name: GITEA_BASE
          value: $(params.giteaBase)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/usr/bin/env sh
        set -eu
        user="${GIT_USERNAME:?}"
        password="${GIT_PASSWORD:?}"
        unset GIT_USERNAME GIT_PASSWORD
        auth="$(printf '%s:%s' "$user" "$password" | base64 | tr -d '\n')"
        unset user password
        git_read() {
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_COUNT=3 \
          GIT_CONFIG_KEY_0=http.http://gitea.cicd.svc.cluster.local:3000/.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
          GIT_CONFIG_KEY_1=http.followRedirects GIT_CONFIG_VALUE_1=false \
          GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2= git "$@"
        }
        [ "$GITEA_BASE" = http://gitea.cicd.svc.cluster.local:3000/bifrost ] || { echo "invalid Gitea base" >&2; exit 1; }
        rev="$REVISION"
        case "$rev" in *[!A-Za-z0-9.-]*) echo "invalid revision" >&2; exit 1 ;; esac
        case "$rev" in
          main) ;;
          v[0-9]*)
            printf '%s' "$rev" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9.-]*)?$' || { echo "invalid release tag" >&2; exit 1; } ;;
          *) echo "revision must be main or a release tag" >&2; exit 1 ;;
        esac
        out="$(workspaces.source.path)/bifrost-trade-infra"
        url="$GITEA_BASE/bifrost-trade-infra.git"
        mkdir -p "$out"
        rm -rf "${out}"/* "${out}"/.[!.]* "${out}"/..?*
        if [ "$rev" = main ]; then
          git_read clone --depth=1 --branch main "$url" "$out"
        else
          git init -q "$out"
          git -C "$out" remote add origin "$url"
          git_read -C "$out" fetch --depth=1 origin "refs/tags/$rev"
          git -C "$out" checkout -q --detach FETCH_HEAD
        fi
        unset auth
        cd "${out}"
        echo "=== infra HEAD $(git rev-parse --short HEAD) @ ${rev} ==="
    - name: dockerfile-configmaps
      image: alpine/k8s:1.31.4
      script: |
        #!/bin/sh
        set -eu
        root="$(workspaces.source.path)/bifrost-trade-infra/k8s/cicd/docker"
        ns="cicd"
        for pair in \
          "bifrost-api-stg-dockerfile:Dockerfile.api-stg" \
          "bifrost-frontend-stg-dockerfile:Dockerfile.frontend-stg" \
          "bifrost-worker-stg-dockerfile:Dockerfile.worker-stg" \
          "bifrost-platform-api-stg-dockerfile:Dockerfile.platform-api-stg" \
          "bifrost-platform-console-stg-dockerfile:Dockerfile.platform-console-stg"; do
          # Dockerfile.remediation-runner-stg was dropped with the Mac mini runner (LANE-W33).
          cm="${pair%%:*}"
          file="${pair##*:}"
          path="${root}/${file}"
          test -f "${path}" || { echo "missing ${path}" >&2; exit 1; }
          kubectl create configmap "${cm}" \
            --from-file="${file}=${path}" \
            -n "${ns}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Applied ConfigMap ${cm}"
        done
