# PipelineRun TTL janitor — Tekton v1.6 CRD rejects spec.ttlSecondsAfterFinished
# (strict decoding). Hourly CronJob, two passes:
#  1. deletes terminal PipelineRuns older than 7d (MAX_AGE_SECONDS) so Completed step
#     pods / PVCs do not pile up on the CI node (Promtail OOM);
#  2. deletes the pods of finished TaskRuns older than 2d (POD_MAX_AGE_SECONDS) while
#     the PipelineRun/TaskRun objects stay their full 7d. On 2026-10-03 there were
#     3,248 such pods: kube-state-metrics emitted 206k series for them (a 1.3 MB
#     Prometheus WAL burst every 30s on the etcd disk), and every cluster-wide cache
#     (CNPG operator, Traefik, …) carried them. Keeping the run objects keeps the
#     Promote gate's "last deliver success" checks and the Console run list intact;
#     what goes is the step log via the API for runs older than 2d (Loki keeps 30d).
#     Tekton logs one "pods … not found" reconcile error and one Event per deleted pod,
#     then leaves the TaskRun Succeeded/Failed as it was.
#
# Apply: kubectl apply -f k8s/cicd/tekton/pipelinerun-ttl.yaml
# Also applied by scripts/k3s/install-stack-tekton.sh and install-cicd-stack.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pipelinerun-ttl
  namespace: cicd
  labels:
    bifrost.io/purpose: pipelinerun-ttl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-pipelinerun-ttl
  namespace: cicd
  labels:
    bifrost.io/purpose: pipelinerun-ttl
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-pipelinerun-ttl
  namespace: cicd
  labels:
    bifrost.io/purpose: pipelinerun-ttl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-pipelinerun-ttl
subjects:
  - kind: ServiceAccount
    name: tekton-pipelinerun-ttl
    namespace: cicd
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tekton-pipelinerun-ttl
  namespace: cicd
  labels:
    bifrost.io/purpose: pipelinerun-ttl
spec:
  schedule: "20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: tekton-pipelinerun-ttl
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: prune
              image: docker.io/library/alpine:3.20
              imagePullPolicy: IfNotPresent
              env:
                - name: NAMESPACE
                  value: cicd
                - name: MAX_AGE_SECONDS
                  value: "604800"
                - name: POD_MAX_AGE_SECONDS
                  value: "172800"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache kubectl jq >/dev/null
                  NS="${NAMESPACE:-cicd}"
                  MAX_AGE_SECONDS="${MAX_AGE_SECONDS:-604800}"
                  NOW="$(date -u +%s)"
                  # DRY_RUN=1: same listing and counts, deletes sent with --dry-run=server.
                  DRY="${DRY_RUN:+--dry-run=server}"
                  deleted=0
                  skipped=0
                  list="$(mktemp)"
                  kubectl get pipelinerun -n "${NS}" -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.completionTime}{"\n"}{end}' >"${list}"
                  while IFS='|' read -r name completed; do
                    [ -z "${name}" ] && continue
                    [ -z "${completed}" ] && continue
                    clean=$(printf '%s' "${completed}" | sed 's/\.[0-9]*Z$/Z/')
                    epoch=$(date -u -D '%Y-%m-%dT%H:%M:%SZ' -d "${clean}" +%s 2>/dev/null || true)
                    if [ -z "${epoch}" ]; then
                      skipped=$((skipped + 1))
                      continue
                    fi
                    age=$((NOW - epoch))
                    if [ "${age}" -lt "${MAX_AGE_SECONDS}" ]; then
                      skipped=$((skipped + 1))
                      continue
                    fi
                    echo "delete PipelineRun ${name} completionTime=${completed} age=${age}s"
                    kubectl delete pipelinerun "${name}" -n "${NS}" --wait=false ${DRY}
                    deleted=$((deleted + 1))
                  done <"${list}"
                  rm -f "${list}"
                  echo "pipelinerun-ttl done${DRY:+ (dry-run)} deleted=${deleted} kept=${skipped} maxAge=${MAX_AGE_SECONDS}s"
                  # Pass 2: pods of finished TaskRuns older than POD_MAX_AGE_SECONDS.
                  # Paged (250 pods/page) through the raw API and filtered with jq: decoding the
                  # whole list in one `kubectl get` was OOMKilled at 256Mi with ~3,300 pods.
                  POD_MAX_AGE_SECONDS="${POD_MAX_AGE_SECONDS:-172800}"
                  page="$(mktemp)"
                  dlist="$(mktemp)"
                  pkept=0
                  cont=""
                  while :; do
                    url="/api/v1/namespaces/${NS}/pods?limit=250"
                    [ -n "${cont}" ] && url="${url}&continue=${cont}"
                    kubectl get --raw "${url}" >"${page}"
                    jq -r --argjson now "${NOW}" --argjson max "${POD_MAX_AGE_SECONDS}" '
                      .items[]
                      | select(.metadata.ownerReferences[0].kind? == "TaskRun")
                      | select(.status.phase == "Succeeded" or .status.phase == "Failed")
                      | ([.status.containerStatuses[]?.state.terminated.finishedAt // empty] | max) as $f
                      | select($f != null)
                      | if ($now - ($f | fromdateiso8601)) >= $max then "D " + .metadata.name else "K" end
                    ' "${page}" >"${page}.sel"
                    grep '^D ' "${page}.sel" | cut -c3- >>"${dlist}" || true
                    pkept=$((pkept + $(grep -c '^K' "${page}.sel" || true)))
                    cont="$(jq -r '.metadata.continue // empty | @uri' "${page}")"
                    [ -z "${cont}" ] && break
                  done
                  pdeleted=$(wc -l <"${dlist}" | tr -d ' ')
                  xargs -r -n 50 kubectl delete pod -n "${NS}" --wait=false ${DRY} <"${dlist}" >/dev/null
                  rm -f "${page}" "${page}.sel" "${dlist}"
                  echo "taskrun-pod-ttl done${DRY:+ (dry-run)} deleted=${pdeleted} kept=${pkept} maxAge=${POD_MAX_AGE_SECONDS}s"
