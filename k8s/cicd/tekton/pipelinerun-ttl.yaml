# Identity of the PipelineRun TTL janitor (the CronJob is cronjob-pipelinerun-ttl.yaml,
# which says what it deletes and why). Split out 2026-11-19 so the CronJob can go by
# plan_manifest + apply_manifest: the applier writes no ServiceAccount or RBAC, so this
# file still goes by an owner card. Apply: kubectl apply -f k8s/cicd/tekton/pipelinerun-ttl.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pipelinerun-ttl
  namespace: cicd
  labels:
    bifrost.io/purpose: pipelinerun-ttl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-pipelinerun-ttl
  namespace: cicd
  labels:
    bifrost.io/purpose: pipelinerun-ttl
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-pipelinerun-ttl
  namespace: cicd
  labels:
    bifrost.io/purpose: pipelinerun-ttl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-pipelinerun-ttl
subjects:
  - kind: ServiceAccount
    name: tekton-pipelinerun-ttl
    namespace: cicd
