# The repositories whose main takes a green ready/ branch (pipeline-land.yaml), one row each.
# This is the one place a repository's landing facts are written: the pipeline mounts it, and
# the scripts and tests in this repository read this same file. Adding a repository is a row
# here, not another pipeline or trigger.
#
#   ci.pipeline     the repository's CI gate
#   ci.params       params a run of that gate must carry to count as the whole suite
#   ci.results      results it must report, each one of the listed values
#   ci.base_result  the result that names the commit the run was judged against; it must be
#                   main's head at the moment of the merge (a ready/ run of bifrost-ci-infra
#                   takes main as its base, task-ci-infra-resolve.yaml)
#   merger          the Secret in cicd that holds the merging account's token
apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-landing-repos
  namespace: cicd
  labels:
    bifrost.io/purpose: landing
data:
  repos.json: |
    {
      "bifrost-platform": {
        "ci": {
          "pipeline": "bifrost-ci-platform",
          "params": {
            "base": "",
            "repo-url": "http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-platform.git"
          },
          "results": {"api-scope": ["full", "console"]}
        },
        "merger": "gitea-merger"
      },
      "bifrost-trade-infra": {
        "ci": {
          "pipeline": "bifrost-ci-infra",
          "params": {"purpose": "push"},
          "base_result": "base-commit"
        },
        "merger": "gitea-merger"
      }
    }
