# Post-deliver HTTP smoke inside bifrost-prod (W1 Traefik IngressRoute + Host header).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-verify-prod-deliver
  namespace: cicd
  labels:
    bifrost.io/purpose: prod-deliver
spec:
  params:
    - name: traefikBase
      type: string
      default: http://traefik.kube-system.svc.cluster.local
    - name: gatewayHost
      type: string
      default: trader.bifrost.lan
  steps:
    - name: http-smoke
      image: curlimages/curl:8.11.1
      env:
        - name: TASK_TRAEFIK_BASE
          value: $(params.traefikBase)
        - name: TASK_GATEWAY_HOST
          value: $(params.gatewayHost)
      script: |
        #!/bin/sh
        set -eu
        printf '%s\n' "${TASK_TRAEFIK_BASE}" | grep -Eq '^https?://[A-Za-z0-9][A-Za-z0-9.:-]*(/[A-Za-z0-9._/-]*)?$' || { echo "invalid traefikBase" >&2; exit 1; }
        case "${TASK_TRAEFIK_BASE}" in *'
        '*) echo "invalid traefikBase" >&2; exit 1 ;; esac
        printf '%s\n' "${TASK_GATEWAY_HOST}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]+)?$' || { echo "invalid gatewayHost" >&2; exit 1; }
        case "${TASK_GATEWAY_HOST}" in *'
        '*) echo "invalid gatewayHost" >&2; exit 1 ;; esac
        trf="${TASK_TRAEFIK_BASE}"
        trf="${trf%/}"
        host="${TASK_GATEWAY_HOST}"
        fail=0
        check() {
          id="$1"
          path="$2"
          url="${trf}${path}"
          # Probe first hop only (no -L). Traefik may 301/308 → HTTPS;
          # that is reachability OK in-cluster (same as bifrost-verify-stg-deliver).
          code="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 15 -H "Host: ${host}" "${url}" || echo 000)"
          echo "${id} ${url} (Host: ${host}) → HTTP ${code}"
          case "${code}" in
            200|301|302|308|503) ;;
            *) fail=1 ;;
          esac
        }
        check prod-frontend /
        check prod-api-monitor /api/monitor/status
        for d in account market research; do
          check "prod-api-${d}" "/api/${d}/health"
        done
        if [ "${fail}" -ne 0 ]; then
          echo "Prod verify failed — one or more endpoints unreachable" >&2
          exit 1
        fi
        echo "Prod verify passed (Traefik gateway + 8 API domains; massive retired)"
