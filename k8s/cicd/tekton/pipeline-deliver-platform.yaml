# Ops Platform deliver — Gitea clone → Kaniko (api + console) → agentrt-migrate → promote → pin the
# application to the built digests and sync → rollout check (TD-411, TD-335, TD-419).
#
# Owner 2026-11-15, five-step method (question, delete, simplify, then accelerate): of 172 s on
# the critical path of the STG delivery 54 s were pod starts of tasks doing 0–2 s of work.
#   - mirror-sync is gone from this pipeline: Gitea holds the three repositories as its primary
#     since 2026-10-17, the task printed "nothing to fetch" three times and exited. The run
#     passes no expectSha, so it waited for nothing either. The Task object stays for the
#     pipelines that pass expectSha and for the Console's "Sync mirrors".
#   - freeze-check stays the first task, alone, and every other task comes after it. Letting
#     the read-only clones start beside it (the builds would wait for both) was tried and
#     taken back: scripts/release/freeze_chain.py holds every pipeline to "each path from a
#     root passes through freeze-check", and a clone that is a root is such a path. That
#     checker is a trust anchor; changing what it accepts is the Owner's.
#   - the two stage-*-dockerfile tasks are the first step of the build Tasks
#     (task-kaniko-platform-{api,console}-stg.yaml, step stage-dockerfile): the same copy out
#     of this run's infra clone, in the pod that builds.
#   - promote-images, gitops-sync and rollout stay three tasks: see the note above them.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-deliver-platform
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  description: >-
    Clone bifrost-platform, bifrost-ui and bifrost-trade-infra from Gitea →
    build platform-api + platform-console images →
    run STG's agentrt migrations with the api image built → pin
    bifrost-platform-stg to the built digests and sync → verify the rollout.
  params:
    - name: revision
      type: string
      default: main
    # bifrost-ui is its own repo, so it gets its own ref: a pinned run names the ui
    # commit here (TD-234). Callers pass the same ref as revision unless they pin.
    - name: uiRevision
      type: string
      default: main
    # The infra checkout the Dockerfiles come from (TD-448). Default main; a
    # pinned run names the infra commit, so every clone has its own ref param
    # (platform delivery ratchet TestPlatformCloneRefParamsFollowInfra).
    - name: infraRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    - name: platformApiImage
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg
    - name: platformConsoleImage
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-console:stg
  workspaces:
    - name: build-context
  tasks:
    - name: freeze-check
      taskRef:
        name: bifrost-release-freeze-check
    # revision belongs to platform; Dockerfiles come from infra's own main.
    # Clone once so both builds use the same infra commit (recorded by the task).
    - name: clone-infra
      runAfter: [freeze-check]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-infra.git
        - name: revision
          value: $(params.infraRevision)
        - name: subdir
          value: bifrost-trade-infra
      workspaces:
        - name: output
          workspace: build-context
    - name: clone-platform
      runAfter: [freeze-check]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-platform.git
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: bifrost-platform
      workspaces:
        - name: output
          workspace: build-context
    - name: clone-ui
      runAfter: [freeze-check]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-ui.git
        - name: revision
          value: $(params.uiRevision)
        - name: subdir
          value: bifrost-ui
      workspaces:
        - name: output
          workspace: build-context
    # Each build Task's first step copies its Dockerfile out of this run's infra clone
    # (TD-448), which is why both wait for clone-infra.
    # TD-411: built to the candidate tag; :stg moves only in promote-images.
    - name: build-platform-api
      runAfter: [clone-platform, clone-infra]
      taskRef:
        name: bifrost-kaniko-platform-api-stg
      params:
        - name: image
          value: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg-candidate
      workspaces:
        - name: source
          workspace: build-context
    - name: build-platform-console
      runAfter: [clone-platform, clone-ui, clone-infra]
      taskRef:
        name: bifrost-kaniko-platform-console-stg
      params:
        - name: image
          value: registry.cicd.svc.cluster.local:5000/bifrost-platform-console:stg-candidate
      workspaces:
        - name: source
          workspace: build-context
    # TD-411: the agentrt migrations of the api image just built (by digest) run on
    # STG's database before anything else moves; a Job that fails stops the run here.
    - name: agentrt-migrate
      runAfter: [build-platform-api, clone-ui]
      # a backstop: the step bounds itself to AGENTRT_MIGRATE_WAIT_S (960 s) (review 503)
      timeout: 20m
      taskRef:
        name: bifrost-agentrt-migrate-stg
      params:
        - name: apiDigest
          value: $(tasks.build-platform-api.results.digest)
        - name: deliverRun
          value: $(context.pipelineRun.name)
    # promote-images, gitops-sync and rollout are three pods on purpose (2026-11-15: merging
    # them was looked at and left). The platform starts the run with taskRunSpecs that name
    # rollout, gitops-sync and agentrt-migrate (tekton-deliver; platform
    # api/internal/delivery/stg_execution.go stgExecutionV1, service.go platformTaskRunSpecs),
    # and Tekton refuses a run whose taskRunSpecs name a task the Pipeline lacks: none of the
    # three names can go. PROD's check-source reads the rollout TaskRun's api-digest and
    # console-digest, the STG evidence reads the gitops-sync TaskRun's params and taskRef.
    # promote-images runs as cicd's default ServiceAccount (it only talks to the registry).
    # Folded into gitops-sync it would run as tekton-deliver, in a Task the PROD pipeline
    # shares; folded into agentrt-migrate a tag that did not move would read as a migration
    # that failed, and the tag move would again run as tekton-deliver.
    # Only now does :stg point at what this run built (review 498 A1).
    - name: promote-images
      runAfter: [agentrt-migrate, build-platform-console]
      taskRef:
        name: bifrost-promote-platform-images
      params:
        - name: apiImage
          value: $(params.platformApiImage)
        - name: apiDigest
          value: $(tasks.build-platform-api.results.digest)
        - name: consoleImage
          value: $(params.platformConsoleImage)
        - name: consoleDigest
          value: $(tasks.build-platform-console.results.digest)
    # Sync ConfigMap (clusters.yaml grafana_url, etc.) before rollout so platform-api
    # reads updated config on pod start — not stale in-memory config from prior mount.
    # TD-335, TD-419: STG deploys this run's digests, not :stg. The application's image
    # override is pinned to them in the same patch as the sync request, and the sync is
    # waited for; a run that overlaps another fails its own check instead of claiming
    # the other's build.
    - name: gitops-sync
      runAfter: [promote-images]
      taskRef:
        name: bifrost-argocd-pin-sync-platform
      params:
        - name: application
          value: bifrost-platform-stg
        - name: apiDigest
          value: $(tasks.build-platform-api.results.digest)
        - name: consoleDigest
          value: $(tasks.build-platform-console.results.digest)
        - name: deliverRun
          value: $(context.pipelineRun.name)
    - name: rollout
      runAfter: [gitops-sync]
      taskRef:
        name: bifrost-rollout-verify-platform
      params:
        - name: namespace
          value: bifrost-platform-stg
        - name: apiDigest
          value: $(tasks.build-platform-api.results.digest)
        - name: consoleDigest
          value: $(tasks.build-platform-console.results.digest)
        - name: requireSpecDigest
          value: "true"
        - name: recordApplication
          value: none
