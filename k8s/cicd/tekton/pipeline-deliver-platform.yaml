# Ops Platform deliver — Gitea clone → Kaniko (api + console) → agentrt-migrate → rollout → Argo sync.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-deliver-platform
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  description: >-
    Mirror-sync bifrost-platform → build platform-api + platform-console images →
    run STG's agentrt migrations with the api image built → rollout
    bifrost-platform-stg → Argo CD sync.
  params:
    - name: revision
      type: string
      default: main
    # bifrost-ui is its own repo, so it gets its own ref: a pinned run names the ui
    # commit here (TD-234). Callers pass the same ref as revision unless they pin.
    - name: uiRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    - name: platformApiImage
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg
    - name: platformConsoleImage
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-console:stg
  workspaces:
    - name: build-context
  tasks:
    - name: freeze-check
      taskRef:
        name: bifrost-release-freeze-check
    - name: mirror-sync
      runAfter: [freeze-check]
      taskRef:
        name: bifrost-gitea-mirror-sync
      params:
        - name: giteaBase
          value: $(params.giteaBase)
        - name: mirrorRepos
          value: bifrost-platform bifrost-ui
    - name: clone-platform
      runAfter: [mirror-sync]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-platform.git
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: bifrost-platform
      workspaces:
        - name: output
          workspace: build-context
    - name: clone-ui
      runAfter: [mirror-sync]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-ui.git
        - name: revision
          value: $(params.uiRevision)
        - name: subdir
          value: bifrost-ui
      workspaces:
        - name: output
          workspace: build-context
    - name: stage-api-dockerfile
      runAfter: [clone-platform]
      workspaces:
        - name: source
          workspace: build-context
      taskSpec:
        workspaces:
          - name: source
        volumes:
          - name: dockerfile-cm
            configMap:
              name: bifrost-platform-api-stg-dockerfile
        steps:
          - name: copy
            image: alpine:3.20
            volumeMounts:
              - name: dockerfile-cm
                mountPath: /cm
            script: |
              #!/usr/bin/env sh
              set -eu
              cp /cm/Dockerfile.platform-api-stg "$(workspaces.source.path)/Dockerfile.platform-api-stg"
    - name: stage-console-dockerfile
      runAfter: [clone-platform, clone-ui]
      workspaces:
        - name: source
          workspace: build-context
      taskSpec:
        workspaces:
          - name: source
        volumes:
          - name: dockerfile-cm
            configMap:
              name: bifrost-platform-console-stg-dockerfile
        steps:
          - name: copy
            image: alpine:3.20
            volumeMounts:
              - name: dockerfile-cm
                mountPath: /cm
            script: |
              #!/usr/bin/env sh
              set -eu
              cp /cm/Dockerfile.platform-console-stg "$(workspaces.source.path)/Dockerfile.platform-console-stg"
    # TD-411: built to the candidate tag; :stg moves only in promote-images.
    - name: build-platform-api
      runAfter: [stage-api-dockerfile]
      taskRef:
        name: bifrost-kaniko-platform-api-stg
      params:
        - name: image
          value: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg-candidate
      workspaces:
        - name: source
          workspace: build-context
    - name: build-platform-console
      runAfter: [stage-console-dockerfile]
      taskRef:
        name: bifrost-kaniko-platform-console-stg
      params:
        - name: image
          value: registry.cicd.svc.cluster.local:5000/bifrost-platform-console:stg-candidate
      workspaces:
        - name: source
          workspace: build-context
    # TD-411: the agentrt migrations of the api image just built (by digest) run on
    # STG's database before anything else moves; a Job that fails stops the run here.
    - name: agentrt-migrate
      runAfter: [build-platform-api]
      # a backstop: the step bounds itself to AGENTRT_MIGRATE_WAIT_S (960 s) (review 503)
      timeout: 20m
      taskRef:
        name: bifrost-agentrt-migrate-stg
      params:
        - name: apiDigest
          value: $(tasks.build-platform-api.results.digest)
        - name: deliverRun
          value: $(context.pipelineRun.name)
    # Only now does :stg point at what this run built (review 498 A1).
    - name: promote-images
      runAfter: [agentrt-migrate, build-platform-console]
      taskRef:
        name: bifrost-promote-platform-images
      params:
        - name: apiImage
          value: $(params.platformApiImage)
        - name: apiDigest
          value: $(tasks.build-platform-api.results.digest)
        - name: consoleImage
          value: $(params.platformConsoleImage)
        - name: consoleDigest
          value: $(tasks.build-platform-console.results.digest)
    # Sync ConfigMap (clusters.yaml grafana_url, etc.) before rollout so platform-api
    # reads updated config on pod start — not stale in-memory config from prior mount.
    - name: gitops-sync
      runAfter: [promote-images]
      taskRef:
        name: bifrost-argocd-sync-platform-stg
    - name: rollout
      runAfter: [gitops-sync]
      taskRef:
        name: bifrost-rollout-verify-platform
      params:
        - name: namespace
          value: bifrost-platform-stg
        - name: apiDigest
          value: $(tasks.build-platform-api.results.digest)
        - name: consoleDigest
          value: $(tasks.build-platform-console.results.digest)
        - name: requireSpecDigest
          value: "false"
        - name: recordApplication
          value: none
