apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-platform-ci-reuse
  namespace: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-platform-ci-reuse
  namespace: cicd
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-platform-ci-reuse
  namespace: cicd
subjects:
  - kind: ServiceAccount
    name: tekton-platform-ci-reuse
    namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-platform-ci-reuse
