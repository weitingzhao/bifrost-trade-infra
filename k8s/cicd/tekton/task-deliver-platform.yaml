apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-rollout-platform-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  params:
    - name: namespace
      type: string
      default: bifrost-platform-stg
  steps:
    - name: rollout-restart
      image: alpine/k8s:1.31.4
      env:
        - name: TASK_NAMESPACE
          value: $(params.namespace)
      script: |
        #!/bin/sh
        set -eu
        printf '%s\n' "${TASK_NAMESPACE}" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || { echo "invalid namespace" >&2; exit 1; }
        case "${TASK_NAMESPACE}" in *'
        '*) echo "invalid namespace" >&2; exit 1 ;; esac
        NS="${TASK_NAMESPACE}"
        # platform-workers runs the same image tag as platform-api. Left out of
        # this list, it stayed on its 2026-09-11 image through every release.
        for dep in platform-api platform-console platform-workers; do
          kubectl rollout restart "deployment/${dep}" -n "${NS}"
          kubectl rollout status "deployment/${dep}" -n "${NS}" --timeout=300s
        done
        echo "Platform rollout complete in ${NS}"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-argocd-sync-platform-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  params:
    - name: application
      type: string
      default: bifrost-platform-stg
    - name: namespace
      type: string
      default: cicd
  steps:
    - name: sync
      image: alpine/k8s:1.31.4
      env:
        - name: TASK_APPLICATION
          value: $(params.application)
        - name: TASK_NAMESPACE
          value: $(params.namespace)
      script: |
        #!/bin/sh
        set -eu
        printf '%s\n' "${TASK_APPLICATION}" | grep -Eq '^[a-z0-9][a-z0-9.-]*$' || { echo "invalid application" >&2; exit 1; }
        case "${TASK_APPLICATION}" in *'
        '*) echo "invalid application" >&2; exit 1 ;; esac
        printf '%s\n' "${TASK_NAMESPACE}" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || { echo "invalid namespace" >&2; exit 1; }
        case "${TASK_NAMESPACE}" in *'
        '*) echo "invalid namespace" >&2; exit 1 ;; esac
        APP="${TASK_APPLICATION}"
        NS="${TASK_NAMESPACE}"
        kubectl patch application "${APP}" -n "${NS}" --type merge -p \
          '{"operation":{"initiatedBy":{"username":"tekton-deliver-platform"},"sync":{"revision":"HEAD"}}}'
        echo "Sync requested for Application ${APP}"
