# TD-411 (Owner 2026-10-21: 「STG 的迁移由发布流水线先跑、PROD 照旧由我建 Job」).
# bifrost-deliver-platform runs this before it rolls STG out: the agentrt
# migrations of the api image it has just built, pinned by digest, as the STG
# migration role (agentrt_owner_stg), in the Job k8s/agentrt-migrate/stg/job.yaml
# describes (only the image differs, and one annotation naming the run). A Job
# that fails stops the pipeline before gitops-sync and rollout; the log names
# the migrations it applied. Only STG: the namespace is fixed here, not a
# param, and the deliver ServiceAccount may create Jobs in bifrost-platform-stg
# only (rbac-deliver-migrate-stg.yaml). PROD keeps the Owner's Job; its pipeline
# checks the database before it rolls out (pipeline-deliver-platform-prod.yaml).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-agentrt-migrate-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  params:
    - name: apiDigest
      type: string
      description: the digest (sha256:...) of the platform-api image this run built
  steps:
    - name: migrate
      image: alpine/k8s:1.31.4
      env:
        - name: API_DIGEST
          value: $(params.apiDigest)
        - name: DELIVER_RUN
          value: $(context.pipelineRun.name)
      script: |
        #!/usr/bin/env python3
        import json, os, re, subprocess, sys, time

        NS = "bifrost-platform-stg"
        REGISTRY = "192.168.10.73:30500/bifrost-platform-api"
        DIGEST_RE = re.compile(r"sha256:[0-9a-f]{64}\Z")
        # A PipelineRun's name is a DNS subdomain (review 498 B1); it only goes into an annotation.
        RUN_RE = re.compile(r"[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?\Z")
        APPLIED_RE = re.compile(r"^agentrt-migrate: env=stg database=bifrost_platform_stg applied=\[([0-9 ]*)\] seeded=(true|false)$", re.M)
        # The whole step's time, from its start (the Job's activeDeadlineSeconds is 900), and one
        # kubectl call's at most. Read from the environment only by the tests, which shorten them.
        WAIT_S = int(os.environ.get("AGENTRT_MIGRATE_WAIT_S", "960"))
        CALL_S = int(os.environ.get("AGENTRT_MIGRATE_CALL_S", "60"))
        DEADLINE = time.monotonic() + WAIT_S
        JOB = """\
        apiVersion: batch/v1
        kind: Job
        metadata:
          generateName: agentrt-migrate-
          namespace: bifrost-platform-stg
          labels:
            app.kubernetes.io/name: agentrt-migrate
          annotations:
            bifrost.io/deliver-run: "__RUN__"
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 900
          ttlSecondsAfterFinished: 604800
          template:
            metadata:
              labels:
                app.kubernetes.io/name: agentrt-migrate
            spec:
              serviceAccountName: default
              automountServiceAccountToken: false
              restartPolicy: Never
              initContainers:
                - name: wait-pg
                  image: ghcr.io/cloudnative-pg/postgresql:17.9
                  imagePullPolicy: IfNotPresent
                  command:
                    - bash
                    - -c
                    - |
                      for i in $(seq 1 60); do
                        if pg_isready -q -t 2; then echo ready; exit 0; fi
                        sleep 2
                      done
                      echo "Postgres not reachable after 60 attempts"; exit 1
                  env:
                    - name: PGHOST
                      value: bifrost-postgres-rw.data.svc.cluster.local
                    - name: PGPORT
                      value: "5432"
                  resources:
                    requests:
                      cpu: 10m
                      memory: 16Mi
                    limits:
                      cpu: 100m
                      memory: 64Mi
              containers:
                - name: migrate
                  image: __IMAGE__
                  imagePullPolicy: Always
                  command: [/usr/local/bin/platform-api]
                  args: [agentrt-migrate]
                  env:
                    - name: AGENTRT_ENV
                      value: stg
                    - name: PGHOST
                      value: bifrost-postgres-rw.data.svc.cluster.local
                    - name: PGPORT
                      value: "5432"
                    - name: PGDATABASE
                      value: bifrost_platform_stg
                    - name: PGUSER
                      value: agentrt_owner_stg
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: agentrt-db-owner
                          key: password
                    - name: PGSSLMODE
                      value: require
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: "1"
                      memory: 256Mi
        """


        def kubectl(*args, stdin=None):
            # One deadline for the whole step (review 500 B1): each call gets what is left of it,
            # at most CALL_S. No --request-timeout or other connection flag: with one, kubectl in a
            # pod stops falling back to the in-cluster identity and dials localhost:8080 (review 500
            # A1; the deliver gate's trial run of 2026-10-12 hit this).
            left = DEADLINE - time.monotonic()
            if left <= 0:
                return subprocess.CompletedProcess(args, 124, "", "no time left")
            try:
                return subprocess.run(["kubectl", *args], input=stdin, capture_output=True, text=True,
                                      timeout=min(CALL_S, left))
            except subprocess.TimeoutExpired:
                return subprocess.CompletedProcess(args, 124, "", "kubectl %s did not answer in time" % args[0])


        def nap(seconds):
            # never past the deadline (review 503 C)
            time.sleep(min(seconds, max(0.0, DEADLINE - time.monotonic())))


        def refuse(why, logs=""):
            if logs:
                print(logs.rstrip())
            print("REFUSED: agentrt migrations on STG: " + why + "; nothing is rolled out")
            sys.exit(1)


        def read_json(got):
            if got.returncode != 0:
                return None
            try:
                return json.loads(got.stdout)
            except ValueError:
                return None


        def job_pods(job, phase):
            """The pods this Job owns (by its uid), in phase or in any phase for None; None when unread."""
            uid = job["metadata"]["uid"]
            pods = read_json(kubectl("get", "pods", "-n", NS, "-l", "job-name=" + job["metadata"]["name"], "-o", "json"))
            if pods is None:
                return None
            return sorted(p["metadata"]["name"] for p in pods.get("items", [])
                          if any(o.get("uid") == uid for o in p["metadata"].get("ownerReferences", []))
                          and (phase is None or p.get("status", {}).get("phase") == phase))


        def pod_logs(job):
            out = []
            for pod in job_pods(job, None) or []:
                got = kubectl("logs", pod, "-n", NS, "--all-containers=true")
                out.append("--- %s ---\n%s%s" % (pod, got.stdout, got.stderr))
            return "\n".join(out)


        def main():
            digest = os.environ.get("API_DIGEST", "")
            run = os.environ.get("DELIVER_RUN", "")
            if not DIGEST_RE.fullmatch(digest):
                refuse("invalid api digest %r" % digest)
            if not RUN_RE.fullmatch(run):
                refuse("invalid pipeline run name %r" % run)
            manifest = JOB.replace("__IMAGE__", REGISTRY + "@" + digest).replace("__RUN__", run)
            created = kubectl("create", "-f", "-", "-o", "jsonpath={.metadata.name}", stdin=manifest)
            name = created.stdout.strip()
            if created.returncode != 0 or not name.startswith("agentrt-migrate-"):
                why = created.stderr.strip()
                if created.returncode != 124 and "forbidden" in why.lower():
                    refuse("the Job was not created: " + why)
                # No answer, a broken one or a name it cannot read: the server may still have
                # made the Job (review 503 B1).
                refuse("the Job create was not confirmed (%s); a Job may exist: look for agentrt-migrate-* "
                       "with annotation bifrost.io/deliver-run=%s in %s" % (why or "no error text", run, NS))
            print("==> agentrt-migrate Job %s/%s, image %s@%s" % (NS, name, REGISTRY, digest))
            # The Job's verdict is its conditions, not its pod counts (review 498 A2):
            # Failed or FailureTarget refuses; only Complete with no failed pod passes.
            while True:
                job = read_json(kubectl("get", "job", name, "-n", NS, "-o", "json"))
                cond = {c.get("type"): c.get("status") for c in (job or {}).get("status", {}).get("conditions", [])}
                if cond.get("Failed") == "True" or cond.get("FailureTarget") == "True":
                    refuse("Job %s failed" % name, pod_logs(job))
                if cond.get("Complete") == "True":
                    if job["status"].get("failed"):
                        refuse("Job %s is complete but counts a failed pod" % name, pod_logs(job))
                    break
                if time.monotonic() >= DEADLINE:
                    refuse("Job %s did not finish in %d s" % (name, WAIT_S))
                nap(5)
            # Its one succeeded pod, which may show a moment after Complete (review 500 B2).
            while True:
                pods = job_pods(job, "Succeeded")
                if pods is not None and len(pods) > 1:
                    refuse("Job %s is complete with %d succeeded pods, not one" % (name, len(pods)))
                if pods:
                    break
                if time.monotonic() >= DEADLINE:
                    refuse("Job %s is complete but its succeeded pod could not be read in %d s" % (name, WAIT_S))
                nap(2)
            logs = kubectl("logs", pods[0], "-n", NS, "-c", "migrate")
            print(logs.stdout.rstrip())
            m = APPLIED_RE.search(logs.stdout)
            if logs.returncode != 0 or not m:
                refuse("Job %s succeeded but its log does not say what it applied" % name)
            applied = m.group(1).split()
            print("agentrt migrations applied on STG by %s: %s" % (name, ", ".join(applied) if applied else "none (already current)"))


        main()
