# Post-deliver HTTP smoke inside cluster (Tier A — W1 Traefik IngressRoute + Host header).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-verify-stg-deliver
  namespace: cicd
  labels:
    bifrost.io/purpose: stg-deliver
spec:
  params:
    - name: traefikBase
      type: string
      default: http://traefik.kube-system.svc.cluster.local
    - name: gatewayHost
      type: string
      default: stg.trader.bifrost.lan
  steps:
    - name: http-smoke
      image: curlimages/curl:8.11.1
      env:
        - name: TASK_TRAEFIK_BASE
          value: $(params.traefikBase)
        - name: TASK_GATEWAY_HOST
          value: $(params.gatewayHost)
      script: |
        #!/bin/sh
        set -eu
        printf '%s\n' "${TASK_TRAEFIK_BASE}" | grep -Eq '^https?://[A-Za-z0-9][A-Za-z0-9.:-]*(/[A-Za-z0-9._/-]*)?$' || { echo "invalid traefikBase" >&2; exit 1; }
        case "${TASK_TRAEFIK_BASE}" in *'
        '*) echo "invalid traefikBase" >&2; exit 1 ;; esac
        printf '%s\n' "${TASK_GATEWAY_HOST}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]+)?$' || { echo "invalid gatewayHost" >&2; exit 1; }
        case "${TASK_GATEWAY_HOST}" in *'
        '*) echo "invalid gatewayHost" >&2; exit 1 ;; esac
        trf="${TASK_TRAEFIK_BASE}"
        trf="${trf%/}"
        host="${TASK_GATEWAY_HOST}"
        fail=0
        check() {
          id="$1"
          path="$2"
          url="${trf}${path}"
          # Probe first hop only (no -L). Traefik may 301 → HTTPS; that is
          # reachability OK in-cluster (HTTPS follow often fails on Host DNS).
          # Never append "000" after -w http_code: curl -L can exit non-zero
          # *after* writing 301, producing a bogus "301000" that fails the case.
          code="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 15 -H "Host: ${host}" "${url}" || echo 000)"
          echo "${id} ${url} (Host: ${host}) → HTTP ${code}"
          case "${code}" in
            200|301|302|503) ;;
            *) fail=1 ;;
          esac
        }
        check stg-frontend /
        check stg-api-monitor /api/monitor/status
        for d in account market research; do
          check "stg-api-${d}" "/api/${d}/health"
        done
        if [ "${fail}" -ne 0 ]; then
          echo "STG verify failed — one or more endpoints unreachable" >&2
          exit 1
        fi
        echo "STG verify passed (Traefik gateway + 8 API domains; massive retired)"
