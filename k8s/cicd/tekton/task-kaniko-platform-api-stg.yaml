# Kaniko build bifrost-platform-api from Gitea clone workspace.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-kaniko-platform-api-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  params:
    - name: image
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg
    - name: dockerfile
      type: string
      default: Dockerfile.platform-api-stg
  workspaces:
    - name: source
  results:
    - name: digest
      description: Registry digest (sha256:...) of the pushed image.
  steps:
    # TD-448: the Dockerfile is the one in this run's infra clone, at the infra revision the
    # run was given. This step was the pipeline task stage-api-dockerfile until 2026-11-15
    # (a pod of its own for a copy); the copy is the same. A missing file in the clone fails
    # the step even when an earlier copy is still in the workspace.
    - name: stage-dockerfile
      image: alpine:3.20
      script: |
        #!/usr/bin/env sh
        set -eu
        cp "$(workspaces.source.path)/bifrost-trade-infra/k8s/cicd/docker/Dockerfile.platform-api-stg" "$(workspaces.source.path)/Dockerfile.platform-api-stg"
        echo "=== Dockerfile.platform-api-stg from this run's infra clone ==="
        cat "$(workspaces.source.path)/Dockerfile.platform-api-stg"
    - name: assert-context
      image: alpine:3.20
      script: |
        #!/usr/bin/env sh
        set -eu
        root="$(workspaces.source.path)"
        test -f "${root}/Dockerfile.platform-api-stg"
        test -f "${root}/bifrost-platform/api/go.mod"
        echo "Platform API build context OK"
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      args:
        - --dockerfile=$(params.dockerfile)
        - --context=$(workspaces.source.path)
        - --destination=$(params.image)
        - --digest-file=$(results.digest.path)
        - --custom-platform=linux/amd64
        - --insecure
        - --skip-tls-verify
        - --insecure-registry=registry.cicd.svc.cluster.local:5000
      # 2026-11-14: of this step's 131 to 183 seconds, 124 were one go build
      # compiling from nothing on 2 cores (timestamps of run
      # bifrost-deliver-platform-1794703158), the longest stretch of a
      # delivery to STG. Go sizes its build to the CPU limit; 4 follows the
      # console build's. The request says what it uses for those two minutes.
      computeResources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 3Gi
