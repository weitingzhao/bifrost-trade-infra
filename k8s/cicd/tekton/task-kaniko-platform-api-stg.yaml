# Kaniko build bifrost-platform-api from Gitea clone workspace.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-kaniko-platform-api-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  params:
    - name: image
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-api:stg
    - name: dockerfile
      type: string
      default: Dockerfile.platform-api-prebuilt
  workspaces:
    - name: source
  # The delivery's own Go cache (pvc-deliver-build-cache.yaml): CI's cache is written by
  # code from ready/ branches before review, and a release binary is not linked from it.
  volumes:
    - name: go-cache
      persistentVolumeClaim:
        claimName: deliver-build-cache
  results:
    - name: digest
      description: Registry digest (sha256:...) of the pushed image.
  steps:
    # TD-448: the Dockerfile is the one in this run's infra clone, at the infra revision the
    # run was given. This step was the pipeline task stage-api-dockerfile until 2026-11-15
    # (a pod of its own for a copy); the copy is the same. A missing file in the clone fails
    # the step even when an earlier copy is still in the workspace.
    - name: stage-dockerfile
      image: alpine:3.20
      script: |
        #!/usr/bin/env sh
        set -eu
        cp "$(workspaces.source.path)/bifrost-trade-infra/k8s/cicd/docker/Dockerfile.platform-api-prebuilt" "$(workspaces.source.path)/Dockerfile.platform-api-prebuilt"
        echo "=== Dockerfile.platform-api-prebuilt from this run's infra clone ==="
        cat "$(workspaces.source.path)/Dockerfile.platform-api-prebuilt"
    - name: assert-context
      image: alpine:3.20
      script: |
        #!/usr/bin/env sh
        set -eu
        root="$(workspaces.source.path)"
        test -f "${root}/Dockerfile.platform-api-prebuilt"
        test -f "${root}/bifrost-platform/api/go.mod"
        echo "Platform API build context OK"
    # 2026-11-19: kaniko compiled platform-api from nothing in every delivery (149-296 s of
    # the step on the nodes the builds now go to). Here it compiles with a cache kept between
    # deliveries; kaniko only packages the two binaries (Dockerfile.platform-api-prebuilt).
    - name: compile
      image: golang:1.25-alpine
      env:
        - name: CGO_ENABLED
          value: "0"
        - name: GOOS
          value: linux
        - name: GOARCH
          value: amd64
        - name: GOTOOLCHAIN
          value: auto
      volumeMounts:
        - name: go-cache
          mountPath: /go-cache
      computeResources:
        requests:
          cpu: "2"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 3Gi
      script: |
        #!/usr/bin/env sh
        set -eu
        root="$(workspaces.source.path)"
        month="$(date -u +%Y-%m)"
        export GOCACHE=/go-cache/build GOMODCACHE="/go-cache/mod/${month}"
        mkdir -p "${GOCACHE}" "${GOMODCACHE}" "${root}/platform-bin"
        # The module cache goes by month; a delivery deletes the months before last.
        year="${month%-*}" mon="${month#*-}"
        if [ "${mon}" = 01 ]; then last="$((year - 1))-12"; else last="$(printf '%s-%02d' "${year}" "$((${mon#0} - 1))")"; fi
        for old in /go-cache/mod/*; do
          case "${old##*/}" in "${month}"|"${last}") ;; *) chmod -R u+w "${old}" 2>/dev/null || true; rm -rf "${old}" ;; esac
        done
        cd "${root}/bifrost-platform/api"
        go build -o "${root}/platform-bin/platform-api" ./cmd/platform-api
        go build -o "${root}/platform-bin/owner-exec" ./cmd/owner-exec
        ls -l "${root}/platform-bin"
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      args:
        - --dockerfile=$(params.dockerfile)
        - --context=$(workspaces.source.path)
        - --destination=$(params.image)
        - --digest-file=$(results.digest.path)
        - --custom-platform=linux/amd64
        - --insecure
        - --skip-tls-verify
        - --insecure-registry=registry.cicd.svc.cluster.local:5000
      # 2026-11-14: of this step's 131 to 183 seconds, 124 were one go build
      # compiling from nothing on 2 cores (timestamps of run
      # bifrost-deliver-platform-1794703158), the longest stretch of a
      # delivery to STG. Go sizes its build to the CPU limit; 4 follows the
      # console build's. The request says what it uses for those two minutes.
      computeResources:
        requests:
          cpu: "2"
          memory: 2560Mi
        limits:
          cpu: "4"
          memory: 3Gi
