# CI gate for Python Trade repos (core / api / worker). Socket retired Wave 14G-F.
# Lightweight: clone → install → lint → test. No image build, no deploy.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-ci-python
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-gate
    bifrost.io/layer: L2
spec:
  description: >-
    CI gate for Python repos — ruff lint + pytest (skipping IB/DB markers).
    Triggered by Gitea push webhook or manual Console run.
  params:
    - name: repo
      type: string
      description: "Repository name (e.g. bifrost-trade-core)"
    - name: revision
      type: string
      default: main
      description: The commit or branch of `repo` under test — a push webhook sends a SHA.
    # The peer repos are cloned at their own default branch. They were cloned at
    # `revision` too, which is the pushed repo's SHA and exists in neither, so
    # every webhook run failed at clone-infra (and clone-core, for api/worker)
    # and code-health never ran.
    - name: coreRevision
      type: string
      default: main
    - name: infraRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/$(params.repo).git
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: repo
      workspaces:
        - name: output
          workspace: source
    # Research does not depend on bifrost-trade-core (D13 OLAP boundary).
    - name: clone-core
      when:
        - input: $(params.repo)
          operator: notin
          values: [bifrost-research]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-core.git
        - name: revision
          value: $(params.coreRevision)
        - name: subdir
          value: bifrost-trade-core
      workspaces:
        - name: output
          workspace: source
    - name: clone-infra
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-infra.git
        - name: revision
          value: $(params.infraRevision)
        - name: subdir
          value: bifrost-trade-infra
      workspaces:
        - name: output
          workspace: source
    - name: lint-test
      runAfter: [clone, clone-core]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: repo
            type: string
        workspaces:
          - name: source
        steps:
          - name: install-and-test
            image: python:3.12-slim
            computeResources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              ws="$(workspaces.source.path)"
              repo="$(params.repo)"
              cd "${ws}/repo"

              echo "==> Installing dependencies for ${repo}"
              pip install --quiet --upgrade pip

              # Trade Python repos depend on bifrost-trade-core; research does not.
              if [ "${repo}" != "bifrost-trade-core" ] && [ "${repo}" != "bifrost-research" ] \
                && [ -d "${ws}/bifrost-trade-core" ]; then
                pip install --quiet -e "${ws}/bifrost-trade-core"
              fi

              # Install with EVERY extra the repo declares, not just [dev].
              # bifrost-research's tests import `agents` (from [copilot]) and
              # dagster (from [orchestration]); installing only [dev] failed
              # collection on 23 modules before pytest ran a single test. Reading
              # the extras from pyproject keeps this true as they change, with no
              # per-repo list here to drift. Falls back if an extra won't install.
              if [ -f pyproject.toml ]; then
                extras="$(python -c "import tomllib,sys; d=tomllib.load(open('pyproject.toml','rb')); sys.stdout.write(','.join(sorted(d.get('project',{}).get('optional-dependencies',{}))))" 2>/dev/null || true)"
                if [ -n "${extras}" ]; then
                  echo "    extras: ${extras}"
                  pip install --quiet -e ".[${extras}]" \
                    || pip install --quiet -e ".[dev]" \
                    || pip install --quiet -e .
                else
                  pip install --quiet -e .
                fi
              elif [ -f setup.py ]; then
                pip install --quiet -e .
              elif [ -f requirements.txt ]; then
                pip install --quiet -r requirements.txt
              fi

              # ruff comes only from the repo's own [dev] pin, never `pip install ruff`:
              # ruff 0.16 widened its default rules from 59 to 413, so an unpinned
              # install here linted with a different rule set than every local venv.
              #
              # Lint blocks for the repos that are clean on their pinned ruff; each
              # runs `ruff check .` in `make lint` too, so the verdict is the local
              # one. A new repo joins once `ruff check .` is clean on its own pin.
              # A blocking repo with no ruff fails: ruff and pytest both come from
              # [dev], so that is also the case where pytest would silently skip.
              case "${repo}" in
                bifrost-research|bifrost-trade-api|bifrost-trade-core|bifrost-trade-worker) lint_blocks=1 ;;
                *) lint_blocks=0 ;;
              esac
              lint_failed=0
              echo "==> Lint (ruff)"
              if command -v ruff >/dev/null 2>&1; then
                ruff --version
                if ! ruff check --output-format=concise .; then
                  if [ "${lint_blocks}" = 1 ]; then
                    echo "ERROR: ruff found issues (blocking for ${repo}; tests still run below)"
                    lint_failed=1
                  else
                    echo "WARN: ruff found issues (non-blocking for ${repo} until its findings are cleared)"
                  fi
                fi
              elif [ "${lint_blocks}" = 1 ]; then
                echo "ERROR: the repo's extras installed no ruff; pin it in [dev]" >&2
                exit 1
              else
                echo "WARN: the repo's extras installed no ruff; pin it in [dev] (lint skipped, non-blocking)"
              fi

              # SQL lint: `make lint` also runs `sqlfluff lint models/` in each dbt
              # project that carries a .sqlfluff (dialect, templater and rules live
              # there; today only bifrost-research's src/bifrost_research/dbt), so
              # the gate runs the same command there. sqlfluff, like ruff, comes only
              # from [dev]. python:3.12-slim has neither make nor git, hence find.
              for sqlfluff_cfg in $(find . -name .sqlfluff -not -path '*/.venv*' \
                  -not -path '*/node_modules/*' -not -path '*/dbt_packages/*'); do
                dbt_dir="$(dirname "${sqlfluff_cfg}")"
                [ -d "${dbt_dir}/models" ] || continue
                echo "==> SQL lint (sqlfluff) in ${dbt_dir#./}"
                if ! command -v sqlfluff >/dev/null 2>&1; then
                  if [ "${lint_blocks}" = 1 ]; then
                    echo "ERROR: ${dbt_dir#./} has a .sqlfluff but [dev] installed no sqlfluff" >&2
                    exit 1
                  fi
                  echo "WARN: ${dbt_dir#./} has a .sqlfluff but [dev] installed no sqlfluff (skipped)"
                  continue
                fi
                sqlfluff --version
                if ! (cd "${dbt_dir}" && sqlfluff lint models/); then
                  if [ "${lint_blocks}" = 1 ]; then
                    echo "ERROR: sqlfluff found issues in ${dbt_dir#./} (blocking for ${repo}; tests still run below)"
                    lint_failed=1
                  else
                    echo "WARN: sqlfluff found issues in ${dbt_dir#./} (non-blocking for ${repo})"
                  fi
                fi
              done

              echo "==> Test (pytest)"
              if command -v pytest >/dev/null 2>&1; then
                pytest -m 'not ib and not db' --tb=short -q
              else
                echo "pytest not found — skip (repo may have no tests yet)"
              fi

              if [ "${lint_failed}" = 1 ]; then
                echo "==> CI gate FAILED for ${repo}: lint (see ERROR above)" >&2
                exit 1
              fi
              echo "==> CI gate passed for ${repo}"
      params:
        - name: repo
          value: $(params.repo)
    # Python ratchet coverage: research + Trade OLTP (api/core/worker).
    # socket / infra intentionally not in scan.sh KNOWN_REPOS.
    - name: code-health
      runAfter: [clone, clone-infra]
      when:
        - input: $(params.repo)
          operator: in
          values:
            [
              bifrost-research,
              bifrost-trade-api,
              bifrost-trade-core,
              bifrost-trade-worker,
            ]
      taskRef:
        name: bifrost-code-health
      params:
        - name: repo
          value: $(params.repo)
        - name: sourceDir
          value: repo
      workspaces:
        - name: source
          workspace: source
