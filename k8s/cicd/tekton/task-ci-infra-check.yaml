  # The release and Gitea script suites (coverage_infra.py `release`): about 1400 tests the
  # quick list leaves out. TRIAL (2026-11-13): onError continue, so a failure here is
  # reported and does not fail the run, until every test passes in this image; then the
  # line goes and the stage gates like the others.
  - name: release
    onError: continue
    image: 192.168.10.73:30500/bifrost-ci-infra-tools@sha256:4ff505208b6cd977e36b7fb29c0f9faa4824a4ed9f4beb6e2f1ffc94b591a23e
