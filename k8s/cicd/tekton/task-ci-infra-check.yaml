    - name: PLATFORM_REVISION
      value: $(params.platformRevision)
    - name: PURPOSE
      value: $(params.purpose)
    - name: GENERATION
      value: $(params.generation)
    - name: CI_INFRA_RELEASE_WORKERS
      value: '6'
    computeResources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '6'
        memory: 4Gi
