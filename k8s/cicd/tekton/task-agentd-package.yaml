apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-agentd-package
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  description: Build and publish the delivered agentd commit, reusing CI without running tests.
  params:
    - name: platformCommit
      type: string
    - name: uiCommit
      type: string
    - name: infraCommit
      type: string
  results:
    - name: agentd-commit
    - name: agentd-sha256
  workspaces:
    - name: source
  steps:
    - name: evidence
      image: alpine/k8s:1.31.4
      env:
        - name: PLATFORM_COMMIT
          value: $(params.platformCommit)
        - name: UI_COMMIT
          value: $(params.uiCommit)
        - name: INFRA_COMMIT
          value: $(params.infraCommit)
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef: {name: gitea-ci-reader, key: username}
        - name: GIT_PASSWORD
          valueFrom:
            secretKeyRef: {name: gitea-ci-reader, key: password}
      script: |
        #!/bin/sh
        set -eu
        src="$(workspaces.source.path)"
        test "$(git -C "$src/bifrost-platform" rev-parse HEAD)" = "$PLATFORM_COMMIT"
        auth=$(printf '%s:%s' "$GIT_USERNAME" "$GIT_PASSWORD" | base64 | tr -d '\n')
        unset GIT_USERNAME GIT_PASSWORD
        main=$(GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
          GIT_CONFIG_KEY_1=http.followRedirects GIT_CONFIG_VALUE_1=false \
          git ls-remote http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-platform.git refs/heads/main)
        unset auth
        test "${main%%[[:space:]]*}" = "$PLATFORM_COMMIT" || { echo 'Main moved; no package published and no CI started' >&2; exit 1; }
        kubectl -n cicd get pipelineruns -o json > "$src/agentd-ci-evidence.json"
        python3 "$src/bifrost-trade-infra/scripts/release/agentd_package.py" evidence "$src/agentd-package" < "$src/agentd-ci-evidence.json"
    - name: build
      image: golang:1.25-bookworm
      env:
        - name: GOTOOLCHAIN
          value: auto
        - name: CGO_ENABLED
          value: "0"
        - name: GOOS
          value: linux
        - name: GOARCH
          value: amd64
      workingDir: $(workspaces.source.path)/bifrost-platform/api
      script: |
        #!/bin/sh
        set -eu
        git diff --quiet HEAD --
        go build -trimpath -buildvcs=true -o "$(workspaces.source.path)/agentd-package/agentd-linux-amd64" ./cmd/agentd
    - name: publish
      image: alpine/k8s:1.31.4
      env:
        - name: PUBLISH_USERNAME
          valueFrom:
            secretKeyRef: {name: gitea-agentd-publisher, key: username}
        - name: PUBLISH_PASSWORD
          valueFrom:
            secretKeyRef: {name: gitea-agentd-publisher, key: password}
        - name: COMMIT_RESULT
          value: $(results.agentd-commit.path)
        - name: SHA256_RESULT
          value: $(results.agentd-sha256.path)
      script: |
        #!/bin/sh
        set -eu
        python3 "$(workspaces.source.path)/bifrost-trade-infra/scripts/release/agentd_package.py" publish "$(workspaces.source.path)/agentd-package"
