# Run template for bifrost-build-research-dagster.
#
#   kubectl -n cicd create -f k8s/cicd/tekton/pipelinerun-build-research-dagster.yaml
#
# Replace REPLACE_WITH_FULL_40_HEX_SHA with the reviewed research commit and
# edit the image tag before each build; never pass main to expectSha. Confirm with
#   curl -s http://192.168.10.73:30500/v2/bifrost-research/tags/list
# before pointing k8s/orchestration/dagster.yaml at it.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: bifrost-build-research-dagster-
  namespace: cicd
spec:
  pipelineRef:
    name: bifrost-build-research-dagster
  params:
    - name: revision
      value: REPLACE_WITH_FULL_40_HEX_SHA
    - name: image
      value: registry.cicd.svc.cluster.local:5000/bifrost-research:0.95.1-dagster
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  workspaces:
    - name: build-context
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 8Gi
