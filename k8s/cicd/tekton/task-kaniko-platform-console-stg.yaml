# Kaniko build bifrost-platform-console (requires bifrost-ui sibling).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-kaniko-platform-console-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: platform-deliver
spec:
  params:
    - name: image
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-platform-console:stg
    - name: dockerfile
      type: string
      default: Dockerfile.platform-console-stg
  workspaces:
    - name: source
  results:
    - name: digest
      description: Registry digest (sha256:...) of the pushed image.
  steps:
    # TD-448: the Dockerfile is the one in this run's infra clone, at the infra revision the
    # run was given. This step was the pipeline task stage-console-dockerfile until 2026-11-15
    # (a pod of its own for a copy); the copy is the same. A missing file in the clone fails
    # the step even when an earlier copy is still in the workspace.
    - name: stage-dockerfile
      image: alpine:3.20
      script: |
        #!/usr/bin/env sh
        set -eu
        cp "$(workspaces.source.path)/bifrost-trade-infra/k8s/cicd/docker/Dockerfile.platform-console-stg" "$(workspaces.source.path)/Dockerfile.platform-console-stg"
        echo "=== Dockerfile.platform-console-stg from this run's infra clone ==="
        cat "$(workspaces.source.path)/Dockerfile.platform-console-stg"
    - name: assert-context
      image: alpine:3.20
      script: |
        #!/usr/bin/env sh
        set -eu
        root="$(workspaces.source.path)"
        test -f "${root}/Dockerfile.platform-console-stg"
        test -f "${root}/bifrost-platform/console/package.json"
        test -f "${root}/bifrost-ui/package.json"
        echo "Platform console build context OK"
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      args:
        - --dockerfile=$(params.dockerfile)
        - --context=$(workspaces.source.path)
        - --destination=$(params.image)
        - --digest-file=$(results.digest.path)
        - --custom-platform=linux/amd64
        - --insecure
        - --skip-tls-verify
        - --insecure-registry=registry.cicd.svc.cluster.local:5000
        # Layer cache (2026-11-19): of a 394 s build, 223 s were the snapshot after
        # `npm ci` of the console's dependencies, which change only with its
        # package-lock. A cached RUN layer is taken from the registry (on NFS)
        # instead of being run and snapshotted again on the node's disk. The cache
        # repository holds no image anything runs, so it can be emptied whole.
        - --cache=true
        - --cache-repo=registry.cicd.svc.cluster.local:5000/cache/bifrost-platform-console
        - --cache-ttl=168h
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 6Gi
