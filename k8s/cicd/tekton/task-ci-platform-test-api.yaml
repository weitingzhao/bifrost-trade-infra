# API test task of bifrost-ci-platform. The selector runs the full or incremental
# suite and records its scope; console scope keeps the existing reader checks.
# The legacy store share does no duplicate work when the selector owns the suite.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-ci-platform-test-api
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-gate
    bifrost.io/layer: L1
spec:
  params:
    - name: reuse
      type: string
      default: "no"
    - name: scope
      type: string
      default: full
    - name: part
      type: string
      default: all
      description: Legacy share identity; store skips when the scoped selector owns the suite
    - name: base
      type: string
      default: ""
    - name: api-scope-request
      type: string
      default: ""
  results:
    - name: api-scope
    - name: failed-tests
    - name: api-packages
    - name: api-store-run
    - name: api-scope-why
  workspaces:
    - name: source
  # The agent runtime's database and Redis tests (W-31 2.1) need a real
  # PostgreSQL and Redis. Tekton starts the steps only after both sidecars
  # are ready; the Postgres sidecar creates the roles the tests log in as
  # before it reports ready. Images are the ones the data namespace already
  # runs, pinned by digest.
  volumes:
    - name: pgdata
      emptyDir: {}
    # CI-7: Go's build and module cache, shared by every run on every node
    # (pvc-ci-build-cache.yaml, NFS ReadWriteMany). A Task volume, not a
    # workspace, so the runs' creators pass nothing new.
    - name: build-cache
      persistentVolumeClaim:
        claimName: ci-build-cache
  sidecars:
    - name: postgres
      image: ghcr.io/cloudnative-pg/postgresql:17.9@sha256:ae81813008a9ef66ee9b348114c96d11c204981ac0d74b38f07fae4174c2973e
      volumeMounts:
        - name: pgdata
          mountPath: /pgdata
      # R5:5.7 CI time (2026-11-06): the store share spent 13.5 min against
      # one CPU here; the same tests take 6.5 min on a Mac with the server
      # below unbounded and not syncing to disk.
      computeResources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "4"
          memory: 2Gi
      readinessProbe:
        exec:
          command: [test, -f, /pgdata/roles-ready]
        periodSeconds: 2
      script: |
        #!/bin/sh
        set -eu
        # Whatever stops this sidecar, show the server log first.
        trap 'cat /pgdata/log 2>/dev/null || true' EXIT
        export PATH="/usr/lib/postgresql/17/bin:$PATH" LC_ALL=C
        initdb -D /pgdata/data -U postgres --auth=trust -E UTF8 --locale=C >/dev/null
        # A throwaway server: nothing outlives the run, so it never waits for
        # the disk (fsync, full-page writes, synchronous commit all off).
        pg_ctl -D /pgdata/data -l /pgdata/log -o "-c listen_addresses=127.0.0.1 -p 5432 -k /pgdata -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=300" -w start >/dev/null
        psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -q \
          -c "CREATE ROLE agentrt_owner_dev LOGIN" -c "CREATE ROLE platform_agentrt_dev LOGIN" \
          -c "CREATE ROLE platform_agentrt_stg LOGIN" -c "CREATE ROLE agent_reader LOGIN"
        touch /pgdata/roles-ready
        while kill -0 "$(head -1 /pgdata/data/postmaster.pid)" 2>/dev/null; do sleep 2; done
        exit 1
    - name: redis
      image: docker.io/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
      args: [redis-server, --bind, 127.0.0.1, --port, "6379", --save, "", --appendonly, "no"]
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      readinessProbe:
        exec:
          command: [redis-cli, -h, 127.0.0.1, ping]
        periodSeconds: 2
  steps:
    - name: go-test
      # api/go.mod says go 1.25.0; the image's GOTOOLCHAIN=local refused to
      # build it on 1.23. `auto` fetches a newer toolchain if go.mod moves on.
      image: golang:1.25-bookworm
      env:
        - name: REUSE
          value: $(params.reuse)
        - name: GOTOOLCHAIN
          value: auto
        # T50 verifies this checkout's HEAD before exporting its API.
        - name: AGENTRT_T50_LEGACY_SRC
          value: $(workspaces.source.path)/legacy-5a8edd55/api
        # With these set the agentrt tests must run: a missing server
        # fails them instead of skipping them.
        # application_name names the Postgres sidecar's version: Go's test
        # cache keys a result by the environment the test read, so a new
        # server version (change it with the image above) reruns the
        # database tests instead of reusing results from the old one. pgx
        # sends it to the server as a session setting; no test parses it.
        - name: AGENTRT_TEST_PG
          value: host=127.0.0.1 port=5432 user=postgres sslmode=disable application_name=ci-pg17.9
        - name: AGENTRT_TEST_REDIS
          value: redis://127.0.0.1:6379/0
        - name: AGENTRT_TEST_REQUIRED
          value: "1"
        # R5:5.7-1: full, or console (see task changes).
        - name: API_SCOPE
          value: $(params.scope)
        # R5:5.7-5: all, store or rest.
        - name: API_PART
          value: $(params.part)
        # The clone does not persist credentials; history fetches need the same
        # read-only identity, supplied only as an HTTP header to git.
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: gitea-ci-reader
              key: username
        - name: GIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitea-ci-reader
              key: password
        - name: LANDING_BASE
          value: $(params.base)
        - name: API_SCOPE_REQUEST
          value: $(params.api-scope-request)
        - name: API_SCOPE_RESULT
          value: $(results.api-scope.path)
        - name: FAILED_TESTS_RESULT
          value: $(results.failed-tests.path)
        - name: API_PACKAGES_RESULT
          value: $(results.api-packages.path)
        - name: API_STORE_RUN_RESULT
          value: $(results.api-store-run.path)
        - name: API_SCOPE_WHY_RESULT
          value: $(results.api-scope-why.path)
      volumeMounts:
        - name: build-cache
          mountPath: /ci-cache
      # Go runs as many tests at once as it has CPUs (GOMAXPROCS follows this
      # limit); most of them wait on the database above (R5:5.7 CI time).
      computeResources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "4"
          memory: 3Gi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [ "${REUSE:-no}" = yes ]; then
          cp "$(workspaces.source.path)/ci-api-results/"* /tekton/results/
          exit 0
        fi
        export BIFROST_GO_TEST_TIMEOUT=1800s
        git_auth="$(printf '%s:%s' "${GIT_USERNAME:-}" "${GIT_PASSWORD:-}" | base64 | tr -d '\n')"
        unset GIT_USERNAME GIT_PASSWORD
        ws="$(workspaces.source.path)"
        cd "${ws}/bifrost-platform/api"
        part="${API_PART:-all}"
        case "${part}" in all|store|rest) ;; *) echo "unknown part ${part}"; exit 1 ;; esac
        STORE_PACKAGE=./internal/agentrt/store
        export LC_ALL=C
        # CI-7: the build cache on ci-build-cache. GOCACHE holds compiled
        # packages, vet results and test results; Go keys them by content, by
        # the package directory (the workspace is /workspace/source in every
        # run) and, for a test result, by the environment variables and files
        # the test read (see the mtimes below). go test has no -count=1, so a
        # package whose inputs did not change reports (cached). Go trims GOCACHE itself: entries unused for 5 days
        # go. The module cache is never trimmed, so it has a directory per
        # month, and a run deletes only the months before last, which no
        # running run uses. Nothing clears or locks the directory in use; Go's
        # caches are safe for concurrent use by many go commands.
        cache=/ci-cache/go
        month="$(date -u +%Y-%m)"
        year="${month%-*}" mon="${month#*-}"
        if [ "${mon}" = 01 ]; then last="$((year - 1))-12"; else last="$(printf '%s-%02d' "${year}" "$((10#${mon} - 1))")"; fi
        export GOCACHE="${cache}/build" GOMODCACHE="${cache}/mod/${month}"
        mkdir -p "${GOCACHE}" "${GOMODCACHE}"
        for old in "${cache}/mod"/*; do
          case "${old##*/}" in "${month}"|"${last}") continue ;; esac
          [ -d "${old}" ] || continue
          echo "==> removing the module cache of ${old##*/}"
          # Go writes the module cache read-only.
          chmod -R u+w "${old}" 2>/dev/null || true
          rm -rf "${old}" 2>/dev/null || true
        done
        # Go keys a cached test result by every path its tests opened: the
        # path's size, mode bits, mtime and whether it is a directory, and for
        # a directory also each entry's name with the same four fields
        # (cmd/go/internal/test hashOpen, hashWriteStat); one changed path
        # reruns the whole package. A fresh clone stamps every file and
        # directory with the clone's time, so a package whose tests read a
        # checkout file (the store's guards parse its own source; the infra
        # and console scans) would never hit. So before any go command each
        # tracked file of the three checkouts (the clone's HEAD tree) gets an
        # mtime derived from its blob hash (same content, same mtime; new content, a new mtime and
        # usually a new size), and the directories that hold tracked files one
        # fixed time. One perl process per checkout. A failure costs only
        # cache hits, so it warns and the run goes on.
        for repo in bifrost-platform bifrost-trade-infra bifrost-ui; do
          [ -d "${ws}/${repo}" ] || continue
          if ! git -C "${ws}/${repo}" ls-tree -r -z HEAD | (cd "${ws}/${repo}" && perl -0ne '
            chomp;
            my ($meta, $path) = split /\t/, $_, 2;
            my ($mode, $type, $blob) = split / /, $meta;
            next if $type ne "blob" || -l $path || !-e $path;
            my $t = 946684800 + hex(substr($blob, 0, 8)) % 100000000;
            utime($t, $t, $path) or die "utime $path: $!\n";
            my $dir = $path;
            $dirs{$dir} = 1 while $dir =~ s{/[^/]*$}{};
            END { $? ||= (utime(946684800, 946684800, ".", keys %dirs) == 1 + keys %dirs ? 0 : 1) }'); then
            echo "WARN: could not set the mtimes of ${repo}; its readers miss Go's test cache this run"
          fi
        done
        # The daily full CI (the platform's controller/fullci.go, runs named
        # ci-full-<commit>-<day>) is the one run creator that sends
        # api-scope-request=full. There the slow tests, which skip without
        # BIFROST_SLOW_TESTS=1, run as well; every other run skips them.
        # It is the safety net, so it also runs every test afresh (-count=1):
        # a flaky test cannot pass on a cached result there.
        if [ "${API_SCOPE_REQUEST:-}" = full ]; then
          export BIFROST_SLOW_TESTS=1 GOFLAGS="${GOFLAGS:+${GOFLAGS} }-count=1"
          echo "==> api-scope-request=full (daily full CI): BIFROST_SLOW_TESTS=1, GOFLAGS=${GOFLAGS}"
        fi
        printf full > "$API_SCOPE_RESULT"
        for result in "$FAILED_TESTS_RESULT" "$API_PACKAGES_RESULT" "$API_STORE_RUN_RESULT" "$API_SCOPE_WHY_RESULT"; do
          : > "$result"
        done

        echo "==> go mod download"
        go mod download

        # R5:5.7-1: console scope means every change since main is console/**
        # outside console/src/api, or Markdown outside api/ and config/ (task changes): the Go
        # code is main's, and only Go tests that read files outside api/ can answer
        # differently: the landing hard-floor scans of console/src and the catalog
        # (agentrt/rules) and the whole-repository scan (cluster). The fixtures the
        # other tests read are under console/src/api and config/, which are always full.
        # Before it narrows, the run checks that this still holds for this checkout
        # (scope-check below); a reader it does not know turns the run to full.
        CONSOLE_SCOPE_PACKAGES="./internal/agentrt/rules/... ./internal/cluster"
        # Reads outside api/ that touch nothing a console-scope change can, one file and the one
        # target it may reach (file=target); any other target of the same file counts as new:
        # devsession/catalog_repo_test.go joins ../../.. (".") with config/sessions-catalog.yaml;
        # codehealth/scanner.go walks up to ".", the workspace of a running platform-api.
        CONSOLE_SCOPE_KNOWN="api/internal/devsession/catalog_repo_test.go=. api/internal/codehealth/scanner.go=."
        if [ "${API_SCOPE:-full}" = "console" ] && [ -z "${LANDING_BASE:-}" ] && [ "${API_SCOPE_REQUEST:-}" != full ]; then
          scope_check="$(mktemp -d)"
          cat > "${scope_check}/main.go" <<'GO'
        package main

        // R5:5.7-1 self-check of the console scope, run before it narrows the Go tests: every
        // literal in api/**/*.go that climbs out of its directory ("..", "../x", and the
        // literals Join takes after it), resolved from that file's directory (where go test
        // runs a package and runtime.Caller roots a path). A read that reaches outside api/
        // where a console-scope change could be (anything but a sibling repository,
        // console/src/api, config/, or one file that is neither console/** nor Markdown) must
        // be from an allowed package, or be a known file's known target (file=target, the
        // target as resolved here). Prints each other one, and an allowed package with no Go
        // file (go test would fail on it), and exits 1.
        //
        //   go run . <repository root> <allowed package>... -- <file=target>...

        import (
            "fmt"
            "io/fs"
            "os"
            "path"
            "path/filepath"
            "regexp"
            "strings"
        )

        var climb = regexp.MustCompile(`"(\.\.(?:/[^"\\]*)?)"((?:\s*,\s*"[^"\\]*")*)`)
        var literal = regexp.MustCompile(`"([^"\\]*)"`)

        func consoleScope(p string) bool {
            return (strings.HasPrefix(p, "console/") && !strings.HasPrefix(p, "console/src/api/")) ||
                (strings.HasSuffix(p, ".md") && !strings.HasPrefix(p, "api/") && !strings.HasPrefix(p, "config/"))
        }

        func under(p, dir string) bool { return p == dir || strings.HasPrefix(p, dir+"/") }

        func main() {
            if len(os.Args) < 2 {
                fmt.Println("usage: <repository root> <allowed package>... -- <known file>...")
                os.Exit(2)
            }
            root := os.Args[1]
            var allowed []string
            known := map[string]bool{}
            seen := false
            for _, a := range os.Args[2:] {
                switch {
                case a == "--":
                    seen = true
                case seen:
                    if !strings.Contains(a, "=") {
                        fmt.Println("a known read is file=target:", a)
                        os.Exit(2)
                    }
                    known[a] = true
                default:
                    allowed = append(allowed, a)
                }
            }
            covered := func(dir string) bool {
                for _, a := range allowed {
                    base := path.Join("api", strings.TrimSuffix(a, "/..."))
                    if dir == base || (strings.HasSuffix(a, "/...") && under(dir, base)) {
                        return true
                    }
                }
                return false
            }
            bad := 0
            for _, a := range allowed {
                dir := filepath.Join(root, "api", filepath.FromSlash(strings.TrimSuffix(a, "/...")))
                if found, _ := filepath.Glob(filepath.Join(dir, "*.go")); len(found) == 0 {
                    fmt.Printf("allowed package %s has no Go file\n", a)
                    bad++
                }
            }
            err := filepath.WalkDir(filepath.Join(root, "api"), func(p string, d fs.DirEntry, err error) error {
                if err != nil || d.IsDir() || !strings.HasSuffix(p, ".go") {
                    return err
                }
                rel, err := filepath.Rel(root, p)
                if err != nil {
                    return err
                }
                rel = filepath.ToSlash(rel)
                data, err := os.ReadFile(p)
                if err != nil {
                    return err
                }
                for _, line := range strings.Split(string(data), "\n") {
                    for _, m := range climb.FindAllStringSubmatch(line, -1) {
                        parts := []string{path.Dir(rel), m[1]}
                        for _, l := range literal.FindAllStringSubmatch(m[2], -1) {
                            parts = append(parts, l[1])
                        }
                        target := path.Join(parts...)
                        if under(target, "api") || strings.HasPrefix(target, "../") || under(target, "console/src/api") || under(target, "config") {
                            continue
                        }
                        if info, err := os.Lstat(filepath.Join(root, filepath.FromSlash(target))); err == nil && info.Mode().IsRegular() && !consoleScope(target) {
                            continue
                        }
                        if covered(path.Dir(rel)) || known[rel+"="+target] {
                            continue
                        }
                        fmt.Printf("%s reads %s outside api/\n", rel, target)
                        bad++
                    }
                }
                return nil
            })
            if err != nil {
                fmt.Println("cannot read the Go files:", err)
                os.Exit(2)
            }
            if bad > 0 {
                os.Exit(1)
            }
        }
        GO
          printf 'module scopecheck\n\ngo 1.21\n' > "${scope_check}/go.mod"
          # shellcheck disable=SC2086
          if found="$(cd "${scope_check}" && GOFLAGS= go run . "${ws}/bifrost-platform" ${CONSOLE_SCOPE_PACKAGES} -- ${CONSOLE_SCOPE_KNOWN} 2>&1)"; then
            printf console > "$API_SCOPE_RESULT"
            printf '%s' 'console scope' > "$API_SCOPE_WHY_RESULT"
            # Both parts run this same check on the same checkout, so they agree: the
            # console packages are not the store package, and store runs nothing here.
            if [ "${part}" = store ]; then
              echo "==> console scope: part store runs no test (${STORE_PACKAGE} is not among ${CONSOLE_SCOPE_PACKAGES})"
              exit 0
            fi
            echo "==> console scope: go test ${CONSOLE_SCOPE_PACKAGES}; no go vet (the Go code is main's)"
            # shellcheck disable=SC2086
            go test ${CONSOLE_SCOPE_PACKAGES} -timeout="${BIFROST_GO_TEST_TIMEOUT}"
            echo "==> Go API tests passed (console scope)"
            exit 0
          fi
          echo "==> console scope refused, every Go test runs: Go code reads outside api/ beyond ${CONSOLE_SCOPE_PACKAGES}:"
          echo "${found}"
        fi

        cd "${ws}/bifrost-platform"
        revision=""
        base="${LANDING_BASE:-}"
        why=""
        if [ "${API_SCOPE_REQUEST:-}" = full ]; then
          why="API_SCOPE_REQUEST=full"
        elif [ -z "$base" ]; then
          why="no base (main push)"
        elif [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
          why="invalid base"
        else
          # Only a run with a base reads the checkout's commit: a full run
          # needs none.
          revision="$(git rev-parse HEAD)"
          git_read() {
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              GIT_CONFIG_COUNT=3 \
              GIT_CONFIG_KEY_0=http.http://gitea.cicd.svc.cluster.local:3000/.extraHeader \
              GIT_CONFIG_VALUE_0="Authorization: Basic $git_auth" \
              GIT_CONFIG_KEY_1=http.followRedirects GIT_CONFIG_VALUE_1=false \
              GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2= git "$@"
          }
          # A bare-SHA shallow clone lacks the ancestry the selector needs.
          # Fetch failure is allowed: the selector explains an unreadable base.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git_read fetch --unshallow origin || true
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git_read fetch origin "$base" || true
          fi
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git diff --quiet "$base" "$revision" -- scripts/ci/test_api_scoped.sh api/cmd/testscope api/internal/testscope; then
              why="selector changed"
            fi
          fi
        fi
        unset git_auth
        if [ -n "$why" ]; then
          # A full run keeps the two shares side by side (R5:5.7-5): part store
          # tests the store package alone, part rest every other package, so a
          # full run takes as long as before. Only an incremental landing run
          # hands the whole suite to the selector below.
          printf '%s' "$why" > "$API_SCOPE_WHY_RESULT"
          cd api
          if [ "${part}" = store ]; then
            echo "==> go test ${STORE_PACKAGE} (part store); full: ${why}"
            go test "${STORE_PACKAGE}" -timeout="${BIFROST_GO_TEST_TIMEOUT}"
            echo "==> Go API tests passed (part store)"
            exit 0
          fi
          echo "==> go vet ./..."
          go vet ./...
          if [ "${part}" = rest ]; then
            store_import="$(go list "${STORE_PACKAGE}")"
            # Import paths have no spaces: one per line, then go test takes them as words.
            packages="$(go list ./... | grep -vxF "${store_import}")"
            echo "==> go test: $(printf '%s\n' "${packages}" | wc -l | tr -d ' ') packages, every one but ${store_import} (part rest); full: ${why}"
            # shellcheck disable=SC2086
            go test ${packages} -timeout="${BIFROST_GO_TEST_TIMEOUT}"
            echo "==> Go API tests passed (part rest)"
            exit 0
          fi
          echo "==> go test ./... (full: ${why})"
          go test ./... -timeout="${BIFROST_GO_TEST_TIMEOUT}"
          echo "==> Go API tests passed"
          exit 0
        fi
        # Incremental: each share runs its part of the selection side by side,
        # as a full run does (part store the store tests it picks, part rest
        # the other packages); test_api_scoped.sh reads API_SCOPED_PART.
        case "${part}" in store|rest) export API_SCOPED_PART="${part}" ;; esac
        echo "==> go vet ./..."
        (cd api && go vet ./...)

        log="$(mktemp)"
        # Preserve the selector's exit status while retaining its first four
        # key=value lines, including on test failure. Print all values in full.
        set +e
        bash scripts/ci/test_api_scoped.sh "$base" "$revision" 2>&1 |
          awk -v why="$why" 'NR <= 4 && /^why=/ && why != "" { $0 = "why=" why } { print }' |
          tee "$log"
        status=${PIPESTATUS[0]}
        set -e
        header="$(head -n 4 "$log")"
        packages="$(printf '%s\n' "$header" | sed -n 's/^packages=//p' | sed 's|github.com/weitingzhao/bifrost-platform/api/||g')"
        store_run="$(printf '%s\n' "$header" | sed -n 's/^store_run=//p')"
        reason="$(printf '%s\n' "$header" | sed -n 's/^why=//p')"
        if [ "$(cat "$API_SCOPE_RESULT")" = full ]; then packages=""; fi
        cut_result() {
          local value="$1" limit="$2" target="$3" suffix="... (cut, see the log)"
          if [ "${#value}" -gt "$limit" ]; then
            printf '%s%s' "${value:0:limit-${#suffix}}" "$suffix" > "$target"
          else
            printf '%s' "$value" > "$target"
          fi
        }
        cut_result "$packages" 1200 "$API_PACKAGES_RESULT"
        cut_result "$store_run" 600 "$API_STORE_RUN_RESULT"
        printf '%s' "$reason" > "$API_SCOPE_WHY_RESULT"
        # No results-from=sidecar-logs feature flag is configured in k8s/cicd.
        # Reserve 512 bytes for Tekton's JSON result names/framing as well.
        used=$(wc -c < "$API_SCOPE_RESULT")
        for result in "$API_PACKAGES_RESULT" "$API_STORE_RUN_RESULT" "$API_SCOPE_WHY_RESULT"; do
          used=$((used + $(wc -c < "$result")))
        done
        remaining=$((4096 - 512 - used))
        if [ "$remaining" -gt 3500 ]; then remaining=3500; fi
        cut_result "$(cat "$FAILED_TESTS_RESULT")" "$remaining" "$FAILED_TESTS_RESULT"
        rm -f "$log"
        exit "$status"
