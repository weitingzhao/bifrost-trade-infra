# Wraps task-ci-cache-trim.yaml so the platform action start_pipeline_run can
# start it (that action starts Pipelines). revision is unused: the platform
# passes one to every run it starts. LANE-ci-w1, 2026-11-19.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-ci-cache-trim
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-cache
    bifrost.io/workload: ci
spec:
  params:
    - {name: revision, type: string, default: main}
    - {name: mode, type: string, default: measure}
    - {name: cap-gb, type: string, default: "200"}
    - {name: idle-days, type: string, default: "14"}
  tasks:
    - name: trim
      timeout: 2h
      taskRef: {name: bifrost-ci-cache-trim}
      params:
        - {name: mode, value: $(params.mode)}
        - {name: cap-gb, value: $(params.cap-gb)}
        - {name: idle-days, value: $(params.idle-days)}
