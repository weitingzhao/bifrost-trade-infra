# CI gate for bifrost-trade-frontend (+ bifrost-ui peer dep).
# Lightweight: clone → npm ci → lint → type-check → build. No deploy.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-ci-frontend
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-gate
    bifrost.io/layer: L2
spec:
  description: >-
    CI gate for frontend — npm lint + type-check + build.
    Triggered by Gitea push webhook or manual Console run.
  params:
    - name: revision
      type: string
      default: main
      description: The frontend commit or branch under test — a push webhook sends a SHA.
    # The peer repos are cloned at their own default branch. They were cloned at
    # `revision` too, which is the frontend's SHA and exists in neither, so every
    # webhook run failed at clone before any check could run.
    # R0E (2026-11-25): "stable" clones bifrost-ui's stable pin, the newest ui commit the
    # console passed with (resolve-ui; no pin readable, ui main as before). A ui push still
    # names its own commit (binding bifrost-gitea-push-ui).
    - name: uiRevision
      type: string
      default: stable
    - name: infraRevision
      type: string
      default: main
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
  # What this run actually checked out, commit and tree per repository: the
  # inputs a later run with the same trees does not need to test again
  # (CI root design, wave 1). A skipped clone emits nothing.
  results:
    - name: frontend-commit
      value: $(tasks.clone-frontend.results.commit)
    - name: frontend-tree
      value: $(tasks.clone-frontend.results.tree)
    - name: ui-commit
      value: $(tasks.clone-ui.results.commit)
    - name: ui-tree
      value: $(tasks.clone-ui.results.tree)
    - name: infra-commit
      value: $(tasks.clone-infra.results.commit)
    - name: infra-tree
      value: $(tasks.clone-infra.results.tree)
  workspaces:
    - name: source
  tasks:
    - name: clone-frontend
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-frontend.git
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: bifrost-trade-frontend
      workspaces:
        - name: output
          workspace: source
    # R0E (CI line 2026-11-25): uiRevision "stable" is bifrost-ui's stable pin, the newest ui
    # commit the console passed with (ConfigMap bifrost-platform-prod/platform-state-ui-stable,
    # moved by PROD platform's agentrt-ui-check loop; read with rbac-ui-pin.yaml's Role). Any other value passes through. A pin that cannot be read is main,
    # and the log says so: no worse than before the pin.
    - name: resolve-ui
      params:
        - name: requested
          value: $(params.uiRevision)
      taskSpec:
        params:
          - name: requested
            type: string
        results:
          - name: revision
        steps:
          - name: resolve
            image: python:3.11-slim-bookworm
            env:
              - name: REQUESTED
                value: $(params.requested)
            script: |
              #!/usr/bin/env python3
              import json, os, ssl, urllib.error, urllib.request
              requested = os.environ["REQUESTED"].strip() or "main"
              out = requested
              if requested == "stable":
                  out = "main"
                  sa = "/var/run/secrets/kubernetes.io/serviceaccount/"
                  url = "https://kubernetes.default.svc/api/v1/namespaces/bifrost-platform-prod/configmaps/platform-state-ui-stable"
                  try:
                      token = open(sa + "token", encoding="utf-8").read().strip()
                      req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
                      with urllib.request.urlopen(req, context=ssl.create_default_context(cafile=sa + "ca.crt"), timeout=15) as resp:
                          data = json.loads(resp.read().decode()).get("data") or {}
                      commit = (data.get("commit") or "").strip()
                      if len(commit) == 40 and all(c in "0123456789abcdef" for c in commit):
                          out = commit
                          print("ui stable pin: %s (%s), checked by %s" % (commit, data.get("version", "?"), data.get("run", "?")))
                      else:
                          print("ui stable pin holds no commit; cloning ui main")
                  except (OSError, ValueError, urllib.error.URLError) as exc:
                      print("ui stable pin unreadable (%s); cloning ui main" % exc)
              print("uiRevision %s -> %s" % (requested, out))
              with open("$(results.revision.path)", "w") as handle:
                  handle.write(out)
    - name: clone-ui
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-ui.git
        - name: revision
          value: $(tasks.resolve-ui.results.revision)
        - name: subdir
          value: bifrost-ui
      workspaces:
        - name: output
          workspace: source
    - name: clone-infra
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-infra.git
        - name: revision
          value: $(params.infraRevision)
        - name: subdir
          value: bifrost-trade-infra
      workspaces:
        - name: output
          workspace: source
    - name: lint-build
      runAfter: [clone-frontend, clone-ui]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: npm-ci-lint-build
            image: node:20-slim
            computeResources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              ws="$(workspaces.source.path)"

              echo "==> Installing bifrost-ui"
              cd "${ws}/bifrost-ui"
              npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

              echo "==> Installing bifrost-trade-frontend"
              cd "${ws}/bifrost-trade-frontend"
              npm ci 2>/dev/null || npm install

              echo "==> Lint"
              npm run lint || {
                echo "WARN: lint found issues (non-blocking for now)"
              }

              echo "==> Build (includes type-check)"
              npm run build

              echo "==> Legacy CSS check"
              if [ -f scripts/check-legacy-css.sh ]; then
                bash scripts/check-legacy-css.sh || {
                  echo "WARN: legacy CSS check found issues"
                }
              fi

              echo "==> CI gate passed for bifrost-trade-frontend"
    - name: code-health
      runAfter: [clone-frontend, clone-infra]
      taskRef:
        name: bifrost-code-health
      params:
        - name: repo
          value: bifrost-trade-frontend
      workspaces:
        - name: source
          workspace: source
