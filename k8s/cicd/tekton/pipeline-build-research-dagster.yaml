# Build the bifrost-research Dagster image (`orchestration` Dockerfile target).
#
# Separate from bifrost-deliver-research because that pipeline rolls out and
# verifies the research-api Deployment; the Dagster image belongs to a different
# Deployment (k8s/orchestration/dagster.yaml) and must not trigger that rollout.
# Build only — bump k8s/orchestration/dagster.yaml once the tag is in registry.
#
# The run refuses a non-SHA revision, refuses while the release window is held
# for another repo, syncs the Gitea mirror until that SHA is present, then
# runs ruff + pytest + code-health on the clone before Kaniko.
#
# The orchestration stage runs `dbt deps && dbt parse` so the image ships
# dbt/target/manifest.json. Without it dagster-dbt loads zero assets and the
# trading-day job silently skips dbt while still reporting success.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-build-research-dagster
  namespace: cicd
  labels:
    bifrost.io/payload: research
    bifrost.io/purpose: dagster-build
spec:
  description: >-
    Clone one bifrost-research SHA from Gitea, lint and test it, then build
    the Dagster (orchestration) image with Kaniko.
  params:
    - name: revision
      type: string
      description: 40-character lowercase git SHA. Branch names, including main, are refused.
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    - name: image
      type: string
      default: registry.cicd.svc.cluster.local:5000/bifrost-research:0.58.0-dagster
  workspaces:
    - name: build-context
  tasks:
    - name: release-window
      taskRef:
        name: bifrost-release-window
      params:
        - name: pipeline
          value: bifrost-build-research-dagster
    - name: validate-revision
      taskRef:
        name: bifrost-validate-git-sha
      params:
        - name: revision
          value: $(params.revision)
    - name: mirror-sync
      runAfter: [release-window, validate-revision]
      taskRef:
        name: bifrost-gitea-mirror-sync
      params:
        - name: giteaBase
          value: $(params.giteaBase)
        - name: mirrorRepos
          value: "bifrost-research"
        - name: expectSha
          value: $(params.revision)
        - name: expectRepo
          value: bifrost-research
    - name: clone-research
      runAfter: [mirror-sync]
      taskRef:
        kind: Task
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-research.git
        - name: revision
          value: $(params.revision)
        - name: subdir
          value: research
      workspaces:
        - name: output
          workspace: build-context
    - name: clone-infra
      runAfter: [clone-research]
      taskRef:
        name: bifrost-git-clone-gitea
      params:
        - name: url
          value: $(params.giteaBase)/bifrost-trade-infra.git
        - name: revision
          value: main
        - name: subdir
          value: bifrost-trade-infra
      workspaces:
        - name: output
          workspace: build-context
    - name: lint-test
      runAfter: [clone-research, clone-infra]
      taskRef:
        name: bifrost-research-lint-test
      params:
        - name: sourceDir
          value: research
      workspaces:
        - name: source
          workspace: build-context
    - name: kaniko
      runAfter:
        - lint-test
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: build-context
      taskSpec:
        params:
          - name: image
            type: string
        workspaces:
          - name: source
        steps:
          - name: build-and-push
            image: gcr.io/kaniko-project/executor:v1.23.2
            args:
              - --dockerfile=Dockerfile
              - --context=$(workspaces.source.path)/research
              - --target=orchestration
              - --destination=$(params.image)
              - --custom-platform=linux/amd64
              - --insecure
              - --skip-tls-verify
              - --insecure-registry=registry.cicd.svc.cluster.local:5000
