# Wave 14G-F — build bifrost-worker only (bifrost-socket image retired; IB edge = Plugin → redis-ib).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-kaniko-worker-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: stg-build
spec:
  description: Kaniko build bifrost-worker (socket image build removed — Wave 14G-F)
  params:
    - name: registry
      type: string
      default: registry.cicd.svc.cluster.local:5000
    - name: tag
      type: string
      default: stg
    - name: coreSha
      type: string
      default: unknown
      description: >-
        bifrost-trade-core commit cloned into the build context (clone-core's
        commit result). Baked in as BIFROST_CORE_SHA and an image label (TD-37).
  workspaces:
    - name: source
  volumes:
    - name: worker-dockerfile-cm
      configMap:
        name: bifrost-worker-stg-dockerfile
  steps:
    - name: stage-dockerfiles
      image: alpine:3.20
      volumeMounts:
        - name: worker-dockerfile-cm
          mountPath: /cm-worker
      script: |
        #!/usr/bin/env sh
        set -eu
        root="$(workspaces.source.path)"
        cp /cm-worker/Dockerfile.worker-stg "${root}/Dockerfile.worker-stg"
    - name: assert-context
      image: alpine:3.20
      script: |
        #!/usr/bin/env sh
        set -eu
        root="$(workspaces.source.path)"
        test -f "${root}/Dockerfile.worker-stg"
        test -f "${root}/bifrost-trade-worker/pyproject.toml"
        test -f "${root}/bifrost-trade-worker/scripts/run_daemon.py"
        echo "worker build context OK (socket image retired Wave 14G-F)"
    - name: build-worker
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
      env:
        - name: REGISTRY
          value: $(params.registry)
        - name: TAG
          value: $(params.tag)
        - name: CORE_SHA
          value: $(params.coreSha)
      script: |
        #!/busybox/sh
        set -eu
        ctx="$(workspaces.source.path)"
        # Release identity of core is the cloned SHA; the pyproject version is a
        # compatibility floor. Record both in the image (TD-37).
        core_ver="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' "${ctx}/bifrost-trade-core/pyproject.toml" | head -n 1)"
        core_ver="${core_ver:-unknown}"
        echo "=== bifrost-core ${core_ver} @ ${CORE_SHA} ==="
        /kaniko/executor \
          --dockerfile="${ctx}/Dockerfile.worker-stg" \
          --context="${ctx}" \
          --destination="${REGISTRY}/bifrost-worker:${TAG}" \
          --build-arg="BIFROST_CORE_SHA=${CORE_SHA}" \
          --build-arg="BIFROST_CORE_VERSION=${core_ver}" \
          --custom-platform=linux/amd64 \
          --insecure \
          --skip-tls-verify \
          --insecure-registry="${REGISTRY}"
      computeResources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 3Gi
