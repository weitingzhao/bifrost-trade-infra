# Standalone Gitea mirror-sync (Ops Console Supply Chain → Sync mirrors).
# Each repository is asked whether it is a pull mirror first: a mirror is
# fetched, a repository Gitea holds as its primary is not (step 0a of
# agent-config/work/multi-agent/CUT-gitea-primary-2026-10-17.md); a commit
# given in expectSha is waited for on both. Python, so that the answer is read
# as JSON (the top-level "mirror", not one in a fork's parent; review 243 A1)
# and the token goes in a request header, never on a command line (review 243
# B). Tested by scripts/cicd/test_task_gitea_mirror_sync.py.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-gitea-mirror-sync
  namespace: cicd
  labels:
    bifrost.io/purpose: stg-deliver
spec:
  params:
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
    - name: mirrorRepos
      type: string
      default: "bifrost-trade-core bifrost-trade-worker bifrost-trade-api bifrost-trade-frontend bifrost-trade-infra bifrost-ui bifrost-platform"
    - name: expectSha
      type: string
      default: ""
      description: When a 40-character SHA, poll until this commit is on expectRepo (or every mirrorRepos entry).
    - name: expectRepo
      type: string
      default: ""
      description: Repo that must contain expectSha. Empty polls every repo in mirrorRepos.
  steps:
    - name: mirror-sync
      image: alpine/k8s:1.31.4
      env:
        - name: GITEA_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-bootstrap
              key: gitea_admin_token
              optional: true
        - name: GITEA_BASE
          value: $(params.giteaBase)
        - name: MIRROR_REPOS
          value: $(params.mirrorRepos)
        - name: EXPECT_SHA
          value: $(params.expectSha)
        - name: EXPECT_REPO
          value: $(params.expectRepo)
      script: |
        #!/usr/bin/env python3
        import json
        import os
        import re
        import sys
        import time
        import urllib.error
        import urllib.request

        token = os.environ.get("GITEA_TOKEN", "")
        if not token:
            sys.exit("ERROR: gitea-bootstrap/gitea_admin_token missing — cannot mirror-sync")
        base = os.environ["GITEA_BASE"].rstrip("/")
        org = base.rsplit("/", 1)[-1]
        api = base.rsplit("/", 1)[0] + "/api/v1"
        repos = os.environ.get("MIRROR_REPOS", "").split()
        sha = os.environ.get("EXPECT_SHA", "").strip()
        only = os.environ.get("EXPECT_REPO", "").strip()
        poll = float(os.environ.get("MIRROR_SYNC_POLL_SECONDS", "4"))
        settle = float(os.environ.get("MIRROR_SYNC_SETTLE_SECONDS", "8"))


        def call(method, path, body=None):
            req = urllib.request.Request(api + path, data=body, method=method,
                                         headers={"Authorization": "token " + token, "Content-Type": "application/json"})
            try:
                with urllib.request.urlopen(req, timeout=30) as r:
                    return r.status, r.read()
            except urllib.error.HTTPError as e:
                return e.code, e.read()
            except (urllib.error.URLError, OSError) as e:
                return 0, str(e).encode()


        fetched = False
        for repo in repos:
            code, raw = call("GET", f"/repos/{org}/{repo}")
            if code != 200:
                sys.exit(f"ERROR: repository {org}/{repo} → HTTP {code}")
            try:
                doc = json.loads(raw)
            except ValueError:
                doc = None
            mirror = doc.get("mirror") if isinstance(doc, dict) else None
            if mirror is True:
                code, _ = call("POST", f"/repos/{org}/{repo}/mirror-sync", b"{}")
                print(f"mirror-sync {org}/{repo} → HTTP {code}", flush=True)
                if code not in (200, 201, 202, 204):
                    sys.exit(1)
                fetched = True
            elif mirror is False:
                print(f"{org}/{repo} is Gitea's primary: nothing to fetch", flush=True)
            else:
                sys.exit(f"ERROR: Gitea did not say whether {org}/{repo} is a mirror")

        # Gitea mirror-sync is async. A release passes expectSha so the clone
        # cannot start on the previous mirror contents (TD-155).
        if re.fullmatch(r"[0-9a-f]{40}", sha):
            for _ in range(30):
                ready = True
                for repo in repos:
                    if only and repo != only:
                        continue
                    code, _ = call("GET", f"/repos/{org}/{repo}/git/commits/{sha}")
                    print(f"commit {org}/{repo}@{sha} → HTTP {code}", flush=True)
                    ready = ready and code == 200
                if ready:
                    print(f"Gitea mirror has {sha}")
                    sys.exit(0)
                time.sleep(poll)
            sys.exit(f"ERROR: {sha} was not on the Gitea mirror after mirror-sync")
        if fetched:
            print("waiting 8s for Gitea mirror fetch to settle", flush=True)
            time.sleep(settle)
        print("Gitea mirror-sync complete")
