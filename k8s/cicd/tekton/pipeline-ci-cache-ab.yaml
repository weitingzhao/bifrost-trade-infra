# One-off measure (Owner 2026-11-24): is a CI build cache on the node's own SSD
# faster than the shared one on the NAS SSD (ci-build-cache, nfs-fast)? If it is
# clearly faster, each domain's CI moves to its own node with a local cache and
# the NAS keeps only a way back; if not, the NAS cache stays (capped at 100 GB).
#
# One pod, so one node and one checkout: the same Go work four times, each timed.
#   nfs-1       GOCACHE on the NAS cache, as test-api uses it (warm)
#   local-cold  GOCACHE on an emptyDir on the node's disk, empty
#   local-warm  the same emptyDir again
#   nfs-2       the NAS cache again (run-to-run noise)
# The work is go vet ./... and go test -count=1 -run '^$' ./... in api/: it
# compiles and links every test binary and runs no test, which is the part of
# test-api a build cache changes; no database or Redis is needed.
# The module cache is the NAS one for every pass (0.3 GB, read only here).
#
# Started by start_pipeline_run (revision: the bifrost-platform commit), which
# binds no workspace, so the step clones the commit itself into an emptyDir at
# /workspace/source (test-api's path, so the cache keys match). It
# writes only the NAS cache's go/build (as every CI run does) and its emptyDir.
# Delete this file and the Pipeline after the measure (LANE-ci-w1).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-ci-cache-ab
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-cache
    bifrost.io/workload: ci
spec:
  params:
    - name: revision
      type: string
      description: The bifrost-platform commit (40 hex).
    - name: giteaBase
      type: string
      default: http://gitea.cicd.svc.cluster.local:3000/bifrost
  results:
    - name: timings
      value: $(tasks.measure.results.timings)
  tasks:
    - name: freeze-check
      taskRef:
        name: bifrost-release-freeze-check
    - name: measure
      runAfter: [freeze-check]
      timeout: 1h
      params:
        - name: revision
          value: $(params.revision)
        - name: giteaBase
          value: $(params.giteaBase)
      taskSpec:
        params:
          - name: revision
            type: string
          - name: giteaBase
            type: string
        results:
          - name: timings
        volumes:
          - name: source
            emptyDir: {}
          - name: build-cache
            persistentVolumeClaim:
              claimName: ci-build-cache
          - name: local-cache
            emptyDir:
              sizeLimit: 20Gi
        steps:
          - name: measure
            image: golang:1.25-bookworm
            env:
              - name: GOTOOLCHAIN
                value: auto
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: REVISION
                value: $(params.revision)
              - name: REPO
                value: $(params.giteaBase)/bifrost-platform.git
              # The read-only identity test-api clones with, as an HTTP header only.
              - name: GIT_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-reader
                    key: username
              - name: GIT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-reader
                    key: password
            volumeMounts:
              - name: source
                mountPath: /workspace/source
              - name: build-cache
                mountPath: /ci-cache
              - name: local-cache
                mountPath: /local-cache
            computeResources:
              requests:
                cpu: "4"
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 4Gi
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              git_auth="$(printf '%s:%s' "${GIT_USERNAME}" "${GIT_PASSWORD}" | base64 | tr -d '\n')"
              unset GIT_USERNAME GIT_PASSWORD
              src=/workspace/source/bifrost-platform
              git init -q "${src}"
              git -C "${src}" -c http.extraHeader="Authorization: Basic ${git_auth}" fetch -q --depth 1 "${REPO}" "${REVISION}"
              git -C "${src}" checkout -q FETCH_HEAD
              unset git_auth
              cd "${src}/api"
              export GOMODCACHE="/ci-cache/go/mod/$(date -u +%Y-%m)"
              go mod download
              out=""
              pass() {
                local name="$1" cache="$2" t0 t1
                export GOCACHE="${cache}"
                mkdir -p "${GOCACHE}"
                t0=$(date +%s)
                go vet ./... >/dev/null
                go test -count=1 -run '^$' ./... >/dev/null
                t1=$(date +%s)
                echo "${name} $((t1 - t0))s"
                out="${out}${name}=$((t1 - t0))s "
              }
              echo "node ${NODE_NAME:-?} $(nproc) cpus"
              pass nfs-1 /ci-cache/go/build
              pass local-cold /local-cache/build
              pass local-warm /local-cache/build
              pass nfs-2 /ci-cache/go/build
              du -sm /local-cache/build
              printf '%s' "${out} node=${NODE_NAME:-?}" > "$(results.timings.path)"
