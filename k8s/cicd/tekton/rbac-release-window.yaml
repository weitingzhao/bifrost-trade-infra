# The release-window task reads two ConfigMaps: the window, and the release freeze
# (W-42; written only by platform-api). Nothing else in cicd is granted here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-release-window
  namespace: cicd
  labels:
    bifrost.io/purpose: release-window
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["bifrost-release-window", "bifrost-release-freeze"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-release-window-default
  namespace: cicd
  labels:
    bifrost.io/purpose: release-window
subjects:
  - kind: ServiceAccount
    name: default
    namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-release-window
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-release-window-deliver
  namespace: cicd
  labels:
    bifrost.io/purpose: release-window
subjects:
  - kind: ServiceAccount
    name: tekton-deliver
    namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-release-window
---
# The apply pipeline (bifrost-apply-manifest) runs as bifrost-applier. Since the
# freeze check became its first task (W-56 slice B) it must be able to read the
# freeze object too; without this binding the check answers 403 and, failing
# closed, refuses every plan and apply. Read-only: get on the two named ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-release-window-applier
  namespace: cicd
  labels:
    bifrost.io/purpose: release-window
subjects:
  - kind: ServiceAccount
    name: bifrost-applier
    namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-release-window
