# Phase B — build ONE Trade API image, retag for all 9 domains (same layers; API_DOMAIN set in K8s).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-kaniko-all-apis-stg
  namespace: cicd
  labels:
    bifrost.io/purpose: stg-build
spec:
  description: Kaniko build bifrost-api-monitor:stg once; crane copy to bifrost-api-{domain}:stg
  params:
    - name: registry
      type: string
      default: registry.cicd.svc.cluster.local:5000
    - name: tag
      type: string
      default: stg
    - name: coreSha
      type: string
      default: unknown
      description: >-
        bifrost-trade-core commit cloned into the build context (clone-core's
        commit result). Baked in as BIFROST_CORE_SHA and an image label (TD-37).
  workspaces:
    - name: source
  steps:
    - name: assert-context
      image: alpine:3.20
      script: |
        #!/usr/bin/env sh
        set -eu
        root="$(workspaces.source.path)"
        test -f "${root}/Dockerfile.api-stg"
        test -f "${root}/bifrost-trade-core/pyproject.toml"
        test -f "${root}/bifrost-trade-api/pyproject.toml"
        test -f "${root}/bifrost-trade-worker/pyproject.toml"
        test -f "${root}/bifrost-trade-worker/scripts/run_daemon.py"
        # Wave 14G-F: socket not required for API image
        echo "API build context OK"
    - name: build-api-base
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
      env:
        - name: REGISTRY
          value: $(params.registry)
        - name: TAG
          value: $(params.tag)
        - name: CORE_SHA
          value: $(params.coreSha)
      script: |
        #!/busybox/sh
        set -eu
        ctx="$(workspaces.source.path)"
        # Release identity of core is the cloned SHA; the pyproject version is a
        # compatibility floor. Record both in the image (TD-37).
        core_ver="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' "${ctx}/bifrost-trade-core/pyproject.toml" | head -n 1)"
        core_ver="${core_ver:-unknown}"
        echo "=== bifrost-core ${core_ver} @ ${CORE_SHA} ==="
        echo "=== Kaniko build shared bifrost-api-monitor:${TAG} ==="
        /kaniko/executor \
          --dockerfile="${ctx}/Dockerfile.api-stg" \
          --context="${ctx}" \
          --destination="${REGISTRY}/bifrost-api-monitor:${TAG}" \
          --build-arg="API_DOMAIN=monitor" \
          --build-arg="BIFROST_CORE_SHA=${CORE_SHA}" \
          --build-arg="BIFROST_CORE_VERSION=${core_ver}" \
          --custom-platform=linux/amd64 \
          --insecure \
          --skip-tls-verify \
          --insecure-registry="${REGISTRY}"
        echo "Base API image pushed."
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 6Gi
    - name: tag-all-domains
      image: gcr.io/go-containerregistry/crane:debug
      env:
        - name: REGISTRY
          value: $(params.registry)
        - name: TAG
          value: $(params.tag)
      script: |
        #!/busybox/sh
        set -eu
        src="${REGISTRY}/bifrost-api-monitor:${TAG}"
        # P7: massive REST API domain retired — do not publish bifrost-api-massive tag.
        domains="monitor account market research"
        for d in ${domains}; do
          dest="${REGISTRY}/bifrost-api-${d}:${TAG}"
          echo "=== crane copy ${src} -> ${dest} ==="
          crane copy --insecure "${src}" "${dest}"
        done
        echo "All 4 API tags point at the same image digest."
