# Owner 2026-11-12 / 2026-11-13: main takes a change through this pipeline, and nobody clicks
# merge. (2026-11-12 it was "only through a pull request"; since 2026-11-13, with the Owner's
# word, the pull request is still opened but the last step is the merging account's
# fast-forward push of the tested commit.) A push to refs/heads/ready/<name> of a repository listed in LANDING_REPOS below
# starts that repository's CI gate and this pipeline beside it (trigger-trade-ci.yaml `land`).
# It opens the pull request, brings a branch that is behind main up to date (a rebase by
# Gitea, which this same run then follows: one push, one run, Succeeded means on main), waits
# for the commit's CI to be green, read from the cluster's own PipelineRuns, then pushes that
# commit to main as it is: a push Gitea takes only as a fast-forward, so main becomes the
# tested commit or does not move. Where bifrost-merger is not on main's push whitelist it asks
# Gitea to rebase-merge instead, which cannot promise that. bifrost-merger is the only identity
# besides the Owner that reaches main. A commit status decides nothing here: on Gitea 1.21 any
# account with write access can post one.
# There is one landing pipeline. What differs between repositories is a row in the
# LANDING_REPOS value below, the one place those facts are written (the scripts and tests of
# this repository read it from this file); a second pipeline that mounts the merger token
# fails scripts/landing/test_land.py. It is in this file and not a ConfigMap because the apply
# lane takes no ConfigMap in cicd (apply-manifest/actuation-policy.yaml).
# It is its own pipeline because a task that writes must come after the release freeze check
# (scripts/release/freeze_chain.py), and CI itself must keep running during a freeze.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-land
  namespace: cicd
  labels:
    bifrost.io/purpose: landing
    bifrost.io/layer: L1
spec:
  description: Merge a green ready/ branch into main through a pull request.
  params:
    - name: repo
      type: string
      description: The repository's name; a key of LANDING_REPOS, nothing else is taken from it.
    - name: revision
      type: string
      description: The pushed commit (40 hex).
    - name: branch
      type: string
      description: The pushed ref, refs/heads/ready/<name>.
  results:
    - name: outcome
      description: landed (the tested commit is on main), or landed-not-as-tested (Gitea rebased it once more inside the merge; `commit` is what is on main). A run that did not land fails; the land task's refusal result (and its last log line) says why.
      value: $(tasks.land.results.outcome)
    - name: commit
      description: The commit now on main. Not the pushed one when the branch had to be rebased.
      value: $(tasks.land.results.commit)
    - name: change-ids
      description: The Change-Id trailers of the landed commits, comma separated; they do not change in a rebase.
      value: $(tasks.land.results.change-ids)
    - name: rerun
      description: none (the pushed commit landed), ran (CI judged the rebased commit again), skipped (main's new commits touched none of the change's directories) or own (only the change's own thread moved main); for skipped and own main's own CI run tests what landed.
      value: $(tasks.land.results.rerun)
    # Why a run did not land. Tekton gives a PipelineRun no result of a task that
    # failed, so the refused run's own sentence (the land task's refusal) is
    # copied by the finally task below, which succeeds, and reaches the run's
    # results: the platform records them as pipeline_seen in the event log.
    # 2026-11-21: land refusals lived only in the TaskRun, kept one day (7 days:
    # 107 refused, 61 of them with a green CI), so the reasons could not be counted.
    - name: refusal
      description: Why the run did not land (the land task's refusal); absent when it landed.
      value: $(finally.refusal.results.refusal)
    - name: refused-change-ids
      description: The pushed commit's Change-Id when the run did not land (copied like refusal); absent when it landed.
      value: $(finally.refusal.results.change-ids)
  tasks:
    - name: freeze-check
      taskRef:
        name: bifrost-release-freeze-check
    # Inline, so that no TaskRun can call it with a commit of the caller's choosing.
    - name: land
      runAfter: [freeze-check]
      # Up to 3 h waiting for its turn (land's queue), then 50 min of work (budget).
      timeout: 3h55m0s
      params:
        - name: repo
          value: $(params.repo)
        - name: commit
          value: $(params.revision)
        - name: branch
          value: $(params.branch)
      taskSpec:
        params:
          - name: repo
          - name: commit
          - name: branch
        results:
          - name: outcome
          - name: commit
          - name: change-ids
          # Why a run did not land, the sentence its log ends with. 2026-11-17: two
          # pushes of one line were refused (a rebase conflict; main moved twice
          # under the check) and the line learned of it an hour later from a
          # reading that had not moved; the sentence was only in the pod's log,
          # which the bus that wakes the pusher does not read.
          - name: refusal
          # The watched paths a landed change touched, comma-separated; empty when none.
          # 2026-11-17: the head-release loop starts its delivery runs in the service
          # layer, which the signed release policy does not judge, so two lines of
          # api/internal/headrelease decide whether it could deliver to PROD. A change
          # to them lands as any other (this is no gate); the result says so, and the
          # bus wakes the CI line and the coordinator on it.
          - name: tripwire
          # none, ran or skipped: whether CI judged a rebased commit again (LANDING_REPOS rerun).
          - name: rerun
          # The commits the landing gave a Change-Id it could not find in their last paragraph
          # (walls review [74], 2026-11-25); empty when none.
          - name: trailers
        volumes:
          - name: gitea-merger
            secret:
              secretName: gitea-merger
          # The policy the Owner signed (release.sh policy sign). Its no_d10_paths group is the
          # one list of trade-execution guard paths; this lane does not take a change to them.
          - name: release-policy
            configMap:
              name: bifrost-release-policy
        steps:
          - name: land
            # The CI tools image: this step needs git beside python, to push the tested commit.
            image: 192.168.10.73:30500/bifrost-ci-infra-tools@sha256:9d80f7f121db286bc7b08eee29a5694e80ba7e9e9c347acabebe839e4a9f7617
            volumeMounts:
              - name: gitea-merger
                mountPath: /etc/gitea-merger
                readOnly: true
              - name: release-policy
                mountPath: /etc/release-policy
                readOnly: true
            env:
              # One row for each repository whose main takes a green ready/ branch.
              #   ci.pipeline     the repository's CI gate
              #   ci.params       params a run of that gate must carry to count as the whole suite
              #   ci.results      results it must report, each one of the listed values
              #   ci.base_result  the result that names the commit the run was judged against; it
              #                   must be main's head at the merge (a ready/ run of bifrost-ci-infra
              #                   takes main as its base, task-ci-infra-clone.yaml; since 2026-11-15
              #                   the backend step of bifrost-ci-platform does too)
              #   ci.no_base      a run that names no base (its base_result is not a commit id: the
              #                   word none, empty, or no such result) counts only when it reports
              #                   these results, each one of the listed values: such a run was not
              #                   judged against a commit (every test ran, or the console scope,
              #                   which is measured from main by its own task). Without it a run
              #                   must name its base.
              # Owner 2026-11-15: a backend-only landing's CI is 67-128 s and 49-111 s of it is the
              # whole Go suite; the landing gate takes main as its base like the infra gate. So an
              # incremental run of bifrost-ci-platform counts, when the base it names is main's head.
              #   merger          the Secret in cicd that holds the merging account's token
              #   rerun           "overlap": after Gitea rebases the branch, CI runs again on the rebased
              #                   commit only when main's new commits touch a directory (or a go.mod,
              #                   go.sum, package.json, package-lock.json) this change touches; otherwise
              #                   the pushed commit's green run on the commit it sat on is the check and
              #                   main's own CI run after the landing tests the rebased tree (CI line
              #                   2026-11-24: 38 of 97 platform landings in a day were rebased, each
              #                   rerun added about 3 minutes, and none caught a conflict). Also when only
              #                   this change's own thread (Claude-Session) moved main: it split one change
              #                   into several ready/ branches (8 of the 38). Absent: every rebase runs CI
              #                   again, as before.
              - name: LANDING_REPOS
                value: |
                  {
                    "bifrost-platform": {
                      "ci": {
                        "pipeline": "bifrost-ci-platform",
                        "params": {
                          "base": "",
                          "repo-url": "http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-platform.git"
                        },
                        "results": {"api-scope": ["full", "console", "incremental"]},
                        "base_result": "base-commit",
                        "no_base": {"api-scope": ["full", "console"]}
                      },
                      "merger": "gitea-merger",
                      "rerun": "overlap",
                      "watched": ["api/internal/headrelease/**", "api/internal/delivery/head_release_start.go"]
                    },
                    "bifrost-trade-infra": {
                      "ci": {
                        "pipeline": "bifrost-ci-infra",
                        "params": {"purpose": "push"},
                        "base_result": "base-commit"
                      },
                      "merger": "gitea-merger",
                      "rerun": "overlap"
                    },
                    "bifrost-engine": {
                      "ci": {
                        "pipeline": "bifrost-ci-engine",
                        "params": {}
                      },
                      "merger": "gitea-merger",
                      "rerun": "overlap"
                    }
                  }
              - name: REPO
                value: $(params.repo)
              - name: COMMIT
                value: $(params.commit)
              - name: BRANCH
                value: $(params.branch)
              - name: RUN
                value: $(context.pipelineRun.name)
            script: |
              #!/usr/bin/env python3
              """Land a green ready/ branch: pull request, up to date with main, CI green, merge."""
              import base64
              import hashlib
              import json
              import os
              import re
              import socket
              import ssl
              import subprocess
              import sys
              import tempfile
              import time
              import urllib.parse
              import urllib.error
              import urllib.request

              # Fixed: the token is never sent to an address a caller chose.
              GITEA = 'http://gitea.cicd.svc.cluster.local:3000'
              TOKEN_FILE = '/etc/gitea-merger/password'  # kubernetes.io/basic-auth, put-reader-token.sh merger
              USER_FILE = '/etc/gitea-merger/username'
              POLICY = '/etc/release-policy/policy.yaml'  # canonical JSON
              RUNS = 'https://kubernetes.default.svc/apis/tekton.dev/v1/namespaces/cicd/pipelineruns'
              SA = '/var/run/secrets/kubernetes.io/serviceaccount/'
              RESULTS = '/tekton/results/'

              def row(table, repo):
                  """The repository's row, or None: only a listed repository lands."""
                  found = table.get(repo) if isinstance(repo, str) and re.fullmatch(r'[a-z0-9-]{1,100}', repo) else None
                  return found if isinstance(found, dict) and isinstance(found.get('ci'), dict) else None

              def resolver():
                  """The nameservers this Pod asks, for the log of a failed lookup: errno -3 (EAI_AGAIN) is
                  no answer in time, -2 (EAI_NONAME) is an answer that the name does not exist."""
                  try:
                      with open('/etc/resolv.conf') as handle:
                          return ' '.join(l.strip() for l in handle if l.startswith('nameserver'))
                  except OSError:
                      return 'resolv.conf unreadable'

              def opened(req, **kw):
                  """urlopen, tried again when the request never left: a name that did not resolve or a
                  refused connection (2026-11-19: land-pcs8m and land-grklw died on one DNS failure, and
                  the queue behind the first waited for its hour). A timeout is not retried: a merge may
                  have happened."""
                  for attempt in range(4):
                      try:
                          return urllib.request.urlopen(req, **kw)
                      except urllib.error.HTTPError:
                          raise
                      except urllib.error.URLError as err:
                          if attempt == 3 or not isinstance(err.reason, (socket.gaierror, ConnectionRefusedError)):
                              raise
                          print('%s: %s; trying again' % (req.full_url.split('?')[0], err.reason))
                          print('dns: %s pod=%s errno=%s %s' % (time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                                socket.gethostname(), getattr(err.reason, 'errno', None), resolver()))
                          time.sleep(5 * (attempt + 1))

              def call(token, method, url, body=None):
                  data = None if body is None else json.dumps(body).encode()
                  req = urllib.request.Request(url, method=method, data=data, headers={
                      'Authorization': 'token ' + token, 'Content-Type': 'application/json'})
                  try:
                      with opened(req, timeout=30) as response:
                          raw = response.read()
                          return response.status, (json.loads(raw) if raw.strip() else None)
                  except urllib.error.HTTPError as err:
                      try:
                          message = str(json.loads(err.read()).get('message', ''))[:300]
                      except Exception:
                          message = ''
                      return err.code, {'message': message}

              def values(rows):
                  return {r.get('name'): r.get('value') for r in rows or [] if isinstance(r, dict)}

              def verdict(runs, commit, ci, base):
                  """'green', 'red', 'stale' or 'wait'. A run counts when it is the row's CI pipeline for
                  this commit with the row's params (an empty base, say: not the increment since an
                  earlier push). Where the row names base_result, a finished run that was judged
                  against another commit than main as it is now is 'stale'; so is one that names no
                  base, unless the row's no_base lists what it reports (a run of every test)."""
                  mine = []
                  for run in runs:
                      spec, status = run.get('spec', {}), run.get('status', {})
                      params = values(spec.get('params'))
                      if spec.get('pipelineRef', {}).get('name') != ci.get('pipeline') or params.get('revision') != commit:
                          continue
                      if any(params.get(k, '') != v for k, v in (ci.get('params') or {}).items()):
                          continue
                      state = [c.get('status') for c in status.get('conditions') or [] if c.get('type') == 'Succeeded']
                      results = values(status.get('results'))
                      if state not in (['True'], ['False']):
                          mine.append('wait')
                      elif ci.get('base_result') and results.get(ci['base_result']) != base and not (
                              ci.get('no_base') and not re.fullmatch(r'[0-9a-f]{40}', str(results.get(ci['base_result'])))
                              and all(results.get(k) in allowed for k, allowed in ci['no_base'].items())):
                          mine.append('stale')
                      elif state == ['True'] and all(results.get(k) in allowed
                                                     for k, allowed in (ci.get('results') or {}).items()):
                          mine.append('green')
                      else:
                          mine.append('red')
                  for answer in ('green', 'wait', 'red', 'stale'):
                      if answer in mine:
                          return answer
                  return 'wait'

              def cluster_runs(pipeline):
                  with open(SA + 'token') as handle:
                      token = handle.read().strip()
                  ctx = ssl.create_default_context(cafile=SA + 'ca.crt')
                  req = urllib.request.Request(RUNS + '?labelSelector=tekton.dev%2Fpipeline%3D' + pipeline,
                                               headers={'Authorization': 'Bearer ' + token})
                  with opened(req, context=ctx, timeout=30) as response:
                      listing = json.load(response)
                  if listing.get('metadata', {}).get('continue'):
                      raise SystemExit('refused: the run list is paged; this check reads one page only')
                  return listing.get('items') or []

              def failed_run(commit, ci, runs=cluster_runs):
                  """The newest finished run of the row's CI for this commit that failed, or ''. A failed
                  run writes no pipeline results, so verdict() reads it as stale (no base); this names it
                  in the refusal (2026-11-24: land-z2dj5 told the pusher main had moved while
                  ci-platform-24h5m had failed test-api)."""
                  try:
                      found = []
                      for run in runs(ci['pipeline']):
                          spec, status = run.get('spec', {}), run.get('status', {})
                          params = values(spec.get('params'))
                          if spec.get('pipelineRef', {}).get('name') != ci.get('pipeline') or params.get('revision') != commit:
                              continue
                          if any(params.get(k, '') != v for k, v in (ci.get('params') or {}).items()):
                              continue
                          if [c.get('status') for c in status.get('conditions') or [] if c.get('type') == 'Succeeded'] == ['False']:
                              found.append((status.get('completionTime') or '', run.get('metadata', {}).get('name', '')))
                      return max(found)[1] if found else ''
                  except Exception:  # the refusal stands without the name
                      return ''

              def ci_wait(commit, ci, base, runs=cluster_runs, limit=45 * 60, grace=3 * 60, pause=15):
                  """'green', 'stale', or a refusal."""
                  deadline, patience = time.time() + limit, time.time() + grace
                  while True:
                      got = verdict(runs(ci['pipeline']), commit, ci, base)
                      if got == 'green':
                          print('a %s run of %s that counts succeeded' % (ci['pipeline'], commit))
                          return got
                      if got == 'stale' and time.time() > patience:
                          return got
                      if got == 'red' and time.time() > patience:
                          return 'refused: no CI run of %s that counts succeeded' % commit
                      if time.time() > deadline:
                          return 'refused: CI for %s did not finish in %d minutes' % (commit, limit // 60)
                      time.sleep(pause)

              def pull_request(token, api, branch, commit, repo):
                  """(pull, '') or (None, refusal)."""
                  code, pull = call(token, 'POST', api + '/pulls', {
                      'head': branch, 'base': 'main', 'title': 'Land ' + branch,
                      'body': 'Opened by bifrost-land for commit ' + commit + ' of ' + repo + '.'})
                  if code == 409:
                      code, pulls = call(token, 'GET', api + '/pulls?state=open&limit=50')
                      pull = next((p for p in pulls or [] if isinstance(p, dict)
                                   and p.get('head', {}).get('ref') == branch
                                   and p.get('base', {}).get('ref') == 'main'), None) if code == 200 else None
                      if pull is None:
                          return None, 'refused: a pull request for this branch exists but could not be read'
                  elif code != 201:
                      return None, 'refused: could not open the pull request (%s %s)' % (code, (pull or {}).get('message', ''))
                  if pull.get('head', {}).get('sha') != commit:
                      return None, 'refused: the branch moved after this run started; its new push has its own run'
                  return pull, ''

              # BEGIN shared trailer rules: scripts/landing/trailers.py and the land task of pipeline-land.yaml hold this block alike (walls review [79]).
              TRAILER = re.compile(r'^[A-Za-z0-9-]+: \S')

              def change_id(message):
                  """The Change-Id trailer of a commit message, or None. A trailer is a line of the last
                  paragraph, and that paragraph holds trailers only: the same words in the body are text."""
                  parts = re.split(r'\n[ \t]*\n', message.strip())
                  # git counts the line it writes for a cherry-pick as part of the trailer block.
                  last = [line for line in (parts[-1].splitlines() if len(parts) > 1 else [])
                          if not line.startswith('(cherry picked from commit ')]
                  if not last or not all(TRAILER.match(line) or line[:1] in (' ', '\t') for line in last):
                      return None
                  found = [line.split(': ', 1)[1].strip() for line in last if line.startswith('Change-Id: ')]
                  return found[-1] if found and re.fullmatch(r'\S+', found[-1]) else None

              def misplaced_change_id(message):
                  """True when a paragraph before the last is a trailer block with a Change-Id and every
                  paragraph after it holds trailers only: the trailers were split by a blank line (plan's
                  986bef69 on 2026-11-23 had Co-Authored-By alone below the block)."""
                  parts = re.split(r'\n[ \t]*\n', message.strip())
                  for i in range(1, len(parts) - 1):
                      if change_id('x\n\n' + parts[i]):
                          rest = [line for part in parts[i + 1:] for line in part.splitlines()
                                  if not line.startswith('(cherry picked from commit ')]
                          if rest and all(TRAILER.match(line) for line in rest):
                              return True
                  return False

              def fixed_message(message, sha):
                  """`message` with a Change-Id in its last paragraph: trailers split by a blank line are joined
                  into one block; a message with none gets one made from `sha`, the same however often this
                  runs (walls review [74], 2026-11-25: a missing trailer was refused, and a branch whose pusher
                  never heard of it sat for an hour or more; now the landing adds it and goes on)."""
                  if change_id(message):
                      return message
                  body = message.strip()
                  parts = re.split(r'\n[ \t]*\n', body)
                  if misplaced_change_id(message):
                      for i in range(1, len(parts) - 1):
                          if change_id('x\n\n' + parts[i]):
                              return '\n\n'.join(parts[:i] + ['\n'.join(parts[i:])]) + '\n'
                  made = 'I' + hashlib.sha1(('land:' + sha).encode()).hexdigest()
                  last = parts[-1].splitlines() if len(parts) > 1 else []
                  if last and all(TRAILER.match(line) or line[:1] in (' ', '\t') or line.startswith('(cherry picked from commit ')
                                  for line in last) and not any(line.startswith('Change-Id:') for line in last):
                      return body + '\nChange-Id: ' + made + '\n'
                  return body + '\n\nChange-Id: ' + made + '\n'

              def session_of(message):
                  """The commit's Claude-Session trailer (the thread that made it), or ''."""
                  found = re.findall(r'^Claude-Session:\s*(\S+)\s*$', message or '', re.M)
                  return found[-1] if found else ''
              # END shared trailer rules

              def amend_trailers(user, token, remote, branch, head, commits, fixes, host=GITEA):
                  """(the branch's new head, '') after the commits of `fixes` ({sha: message}) were given those
                  messages and the branch pushed back as `branch`; (None, why) otherwise. The trees stay as they
                  were, so the CI of `head` still judges the change. The push names the head it replaces: a push
                  that came meanwhile is not overwritten."""
                  auth = base64.b64encode(('%s:%s' % (user, token)).encode()).decode()
                  env = dict(os.environ, GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL='/dev/null', GIT_TERMINAL_PROMPT='0',
                             GIT_CONFIG_COUNT='2', GIT_CONFIG_KEY_0='http.' + host + '/.extraHeader',
                             GIT_CONFIG_VALUE_0='Authorization: Basic ' + auth,
                             GIT_CONFIG_KEY_1='credential.helper', GIT_CONFIG_VALUE_1='',
                             GIT_COMMITTER_NAME=user, GIT_COMMITTER_EMAIL=user + '@bifrost.lan')
                  with tempfile.TemporaryDirectory() as tmp:
                      def git(*args):
                          done = subprocess.run(['git', '-C', tmp] + list(args), env=env, capture_output=True, text=True, timeout=180)
                          if done.returncode:
                              said = (done.stdout + done.stderr).replace(auth, '***').strip().splitlines()
                              raise RuntimeError('git %s: %s' % (args[0], said[-1][:200] if said else done.returncode))
                          return done.stdout.strip()
                      try:
                          git('init', '-q')
                          git('fetch', '-q', '--depth=%d' % (len(commits) + 1), remote, head)
                          git('checkout', '-q', '--detach', commits[0] + '~1')
                          for sha in commits:
                              git('cherry-pick', '--allow-empty', '--keep-redundant-commits', sha)
                              if sha in fixes:
                                  note = os.path.join(tmp, '.git', 'LAND_MESSAGE')
                                  with open(note, 'w') as handle:
                                      handle.write(fixes[sha])
                                  git('commit', '-q', '--amend', '--allow-empty', '-F', note)
                          new = git('rev-parse', 'HEAD')
                          if git('rev-parse', 'HEAD^{tree}') != git('rev-parse', head + '^{tree}'):
                              return None, 'the rewritten branch has another tree'
                          git('push', '-q', '--force-with-lease=refs/heads/%s:%s' % (branch, head), remote, 'HEAD:refs/heads/' + branch)
                      except (OSError, subprocess.TimeoutExpired, RuntimeError) as err:
                          return None, str(err)[:300]
                  return new, ''

              def listed(token, api, number, commit):
                  """(the pull request's commit ids, '') for a pull request this run has just opened or
                  found, whose list is fresh; it must hold the commit this run is for."""
                  commits = []
                  for page in range(1, 11):
                      code, rows = call(token, 'GET', api + '/pulls/%d/commits?limit=50&page=%d' % (number, page))
                      if code != 200 or not isinstance(rows, list):
                          return [], 'refused: could not read the commits of the pull request (%s)' % code
                      commits += [str(row.get('sha')) for row in rows]
                      if len(rows) < 50:
                          break
                  else:
                      return [], 'refused: more than 500 commits in one pull request'
                  if commit not in commits or not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in commits):
                      return [], 'refused: the branch moved while this run read it; its new push has its own run'
                  return commits[::-1], ''  # Gitea lists newest first; oldest first, like the walk

              def walked(token, api, commit, count):
                  """(the `count` commits that end in `commit`, oldest first, and the commit they sit on, '')
                  for a branch Gitea has just rebased. Read by commit id from the new head down its
                  parents, as many commits as the change has: right after a rebase the pull request's
                  own list still shows the old commits (2026-11-13, land-wbnxq), and the commit the
                  branch was put on is whatever main was when Gitea did it, which is not always what
                  this run read a moment before (independent review 2, finding 6). A rebase leaves
                  one parent each."""
                  commits, sha = [], commit
                  for _ in range(count):
                      code, row = call(token, 'GET', api + '/git/commits/' + sha)
                      parents = row.get('parents') if code == 200 and isinstance(row, dict) else None
                      if not isinstance(parents, list) or len(parents) != 1 or not re.fullmatch(
                              r'[0-9a-f]{40}', str(parents[0].get('sha'))):
                          return [], None, 'refused: could not follow the rebased branch down from %s' % sha[:12]
                      commits.append(sha)
                      sha = parents[0]['sha']
                  return commits[::-1], sha, ''

              SHARED_FILES = ('go.mod', 'go.sum', 'package.json', 'package-lock.json')

              def messages(token, api, shas):
                  """The commit messages of `shas` ('' for one that cannot be read)."""
                  out = []
                  for sha in shas:
                      code, row = call(token, 'GET', api + '/git/commits/' + sha)
                      out.append(((row or {}).get('commit') or {}).get('message', '') if code == 200 and isinstance(row, dict) else '')
                  return out

              def main_paths(token, api, old, new, limit=40, sessions=None):
                  """(the paths main's commits after `old` up to `new` touched, '') following first
                  parents; (None, why) when `old` is not reached within `limit` commits or a commit
                  cannot be read: then the rebased commit is tested as before. `sessions`, a set,
                  gets each of those commits' Claude-Session ('' for a commit without one)."""
                  names, sha = set(), new
                  for _ in range(limit):
                      if sha == old:
                          return names, ''
                      code, row = call(token, 'GET', api + '/git/commits/' + sha)
                      if code != 200 or not isinstance(row, dict) or not isinstance(row.get('files'), list):
                          return None, 'could not read %s' % sha[:12]
                      if sessions is not None:
                          sessions.add(session_of((row.get('commit') or {}).get('message')))
                      names.update(str(item.get(key)) for item in row['files'] if isinstance(item, dict)
                                   for key in ('filename', 'previous_filename') if item.get(key))
                      parents = row.get('parents')
                      if not isinstance(parents, list) or not parents or not re.fullmatch(
                              r'[0-9a-f]{40}', str(parents[0].get('sha'))):
                          return None, 'could not follow main down from %s' % sha[:12]
                      sha = parents[0]['sha']
                  return None, 'more than %d commits on main since the branch was pushed' % limit

              def overlap(mine, theirs):
                  """The directories (and the SHARED_FILES by name) both sets of paths touch, sorted."""
                  dirs = lambda names: {os.path.dirname(n) for n in names}
                  shared = dirs(mine) & dirs(theirs)
                  shared |= {n for n in SHARED_FILES if n in {os.path.basename(m) for m in mine}
                             and n in {os.path.basename(t) for t in theirs}}
                  return sorted(shared)

              def tripwired(entry, names):
                  """The changed paths of the row's `watched` globs (the release policy's glob syntax),
                  sorted: a landing is not stopped for them but reported (result tripwire). Not the
                  signed policy: this is a reading, and the policy is the Owner's."""
                  globs = entry.get('watched') or []
                  return [n for n in sorted(names) if any(matches(p, n) for p in globs)]

              def checked(token, api, commits, policy, repo, seen=None):
                  """(Change-Ids, '') when these commits may land. Each is read by its id, so what is
                  checked is what is merged: every commit carries a Change-Id trailer (the agents share
                  one Gitea account; the trailers are the record of which change a commit is, Owner
                  2026-10-06), and none touches a path of the signed release policy's no_d10_paths
                  group for the repository."""
                  ids, names = [], set()
                  for sha in commits:
                      code, row = call(token, 'GET', api + '/git/commits/' + sha)
                      if code != 200 or not isinstance(row, dict) or row.get('sha') != sha:
                          return [], 'refused: could not read commit %s (%s)' % (sha[:12], code)
                      message = (row.get('commit') or {}).get('message') or ''
                      found = change_id(message)
                      if not found and misplaced_change_id(message):
                          # 2026-11-23 (plan's 986bef69, land-fd7bz): the Change-Id was there, but a
                          # blank line put Co-Authored-By in a paragraph of its own below it, and
                          # "has no Change-Id" sent the pusher looking for a missing line.
                          return [], ('refused: commit %s has its Change-Id outside the last paragraph: the '
                                      'trailers go in the last paragraph, with no blank line between them' % sha[:12])
                      if not found:
                          return [], ('refused: commit %s has no Change-Id trailer (scripts/git-hooks adds it; '
                                      'a clone without the hook adds it by hand)' % sha[:12])
                      ids.append(found)
                      if not isinstance(row.get('files'), list):
                          return [], 'refused: could not read the files of commit %s' % sha[:12]
                      # Gitea lists a rename as the old name removed and the new one added (it reads
                      # the commit with --no-renames); a previous_filename, should a version send one,
                      # is read as well, so a guarded file moved away is seen under its old name.
                      names.update(str(item.get(key)) for item in row['files'] if isinstance(item, dict)
                                   for key in ('filename', 'previous_filename') if item.get(key))
                  if seen is not None:
                      seen.update(names)
                  hit = guarded(policy, repo, names)
                  if hit:
                      return [], ('refused: %s is a trade-execution guard path (release policy no_d10_paths); this lane '
                                  'does not take it' % hit)
                  return ids, ''

              def matches(pattern, name):
                  """The release policy's globs: ** spans directories, * and ? stay inside one segment."""
                  out, i = '', 0
                  while i < len(pattern):
                      if pattern[i:i + 3] == '**/':
                          out, i = out + '(?:.*/)?', i + 3
                      elif pattern[i:i + 2] == '**':
                          out, i = out + '.*', i + 2
                      elif pattern[i] in '*?':
                          out, i = out + ('[^/]*' if pattern[i] == '*' else '[^/]'), i + 1
                      else:
                          out, i = out + re.escape(pattern[i]), i + 1
                  return re.fullmatch(out, name) is not None

              def guarded(policy, repo, names):
                  """The first changed path in the signed policy's no_d10_paths group for this repository."""
                  globs = [p for group in policy['paths']['no_d10_paths'] if group['repo'] in (repo, '*')
                           for p in group['paths']]
                  return next((n for n in sorted(names) if any(matches(p, n) for p in globs)), '')

              def first_in_line(run, repo, runs=cluster_runs):
                  """Whether this run is the oldest unfinished landing of its repository. Every rebase
                  makes Gitea check out the whole repository and starts a CI run, and all but one of
                  the rebases of a queue are undone by the next landing (2026-11-18: 65 in two hours,
                  with ubt-k3s-01's disk, which etcd shares, at 100 MB/s). Not knowing is a yes: this
                  only saves work, and must never hold a landing back."""
                  try:
                      waiting = [r['metadata'] for r in runs('bifrost-land')
                                 if not r.get('status', {}).get('completionTime')
                                 and r['metadata'].get('labels', {}).get('bifrost.io/repo') == repo]
                  except Exception:
                      return True
                  names = [m['name'] for m in sorted(waiting, key=lambda m: (m['creationTimestamp'], m['name']))]
                  return not names or run not in names or names[0] == run

              def close_abandoned(token, api, repo, runs=cluster_runs):
                  """Close the open landing pull requests no unfinished run owns, and say how many stay
                  open. A refused landing leaves its pull request open, and Gitea tests every open
                  pull request again each time main moves (2026-11-18: about 20 GB written after each
                  landing). The branch stays, and pushing it again opens a new one. Best effort."""
                  try:
                      alive = {p.get('value') for r in runs('bifrost-land')
                               if not r.get('status', {}).get('completionTime')
                               and r['metadata'].get('labels', {}).get('bifrost.io/repo') == repo
                               for p in r['spec'].get('params', []) if p.get('name') == 'branch'}
                      code, pulls = call(token, 'GET', api + '/pulls?state=open&limit=50')
                      if code != 200:
                          return
                      left = 0
                      for pull in pulls:
                          ref = pull.get('head', {}).get('ref', '')
                          if ref.startswith('ready/') and 'refs/heads/' + ref not in alive:
                              call(token, 'PATCH', api + '/pulls/%d' % pull['number'], {'state': 'closed'})
                          else:
                              left += 1
                      print('open pull requests of %s: %d (of %d before closing abandoned ones)'
                            % (repo, left, len(pulls)), flush=True)
                  except Exception as problem:
                      print('NOTICE: abandoned pull requests were not closed: %s' % problem, flush=True)

              def up_to_date(token, api, number, on, turn=lambda: True):
                  """(main's head, '') when the branch sits on it (`on` is the commit the branch is known
                  to sit on); (None, 'rebased') after Gitea rebased the branch; (None, 'waiting') while
                  an older landing goes first; (None, refusal) when it cannot be rebased."""
                  code, main = call(token, 'GET', api + '/branches/main')
                  head = main.get('commit', {}).get('id') if code == 200 else None
                  if not head:
                      return None, 'refused: could not read main (%s)' % code
                  if on == head:
                      return head, ''
                  if not turn():
                      return None, 'waiting'
                  code, out = call(token, 'POST', api + '/pulls/%d/update?style=rebase' % number)
                  if code == 200:
                      return None, 'rebased'
                  return None, ('refused: the branch is behind main and Gitea could not rebase it (%s %s).%s Rebase it '
                                'onto main and push it to a ready/ branch again'
                                % (code, (out or {}).get('message', ''), stacked(token, api, number)))

              def stacked(token, api, number):
                  """' Commits X of this branch are already on main ...' when a commit of the pull request
                  has a Change-Id that one of main's last 50 commits has: the branch was stacked on a commit
                  that landed first. Gitea answers such a rebase with a bare 500 (2026-11-23, land-fdqjc),
                  which left the pusher to guess. Best effort: '' when nothing is found or read."""
                  try:
                      code, rows = call(token, 'GET', api + '/pulls/%d/commits?limit=50' % number)
                      code_main, recent = call(token, 'GET', api + '/commits?sha=main&limit=50&stat=false&files=false')
                      if code != 200 or code_main != 200 or not isinstance(rows, list) or not isinstance(recent, list):
                          return ''
                      on_main = {change_id(c.get('commit', {}).get('message', '')) for c in recent if isinstance(c, dict)}
                      on_main.discard(None)
                      dup = [str(r.get('sha', ''))[:8] for r in rows if isinstance(r, dict)
                             and change_id(r.get('commit', {}).get('message', '')) in on_main]
                  except Exception:
                      return ''
                  if not dup:
                      return ''
                  return (' Commits %s of this branch are already on main with the same Change-Id: the branch '
                          'was stacked on a commit that landed first; a rebase onto main drops them.' % ', '.join(dup))

              def merge(token, api, pull, commit, base, tries=24, pause=5):
                  """(the commit now on main for this pull request, '') after the merge; ('', 'moved') when
                  main is no longer the commit CI judged against, with nothing merged; ('', refusal).
                  main is read again before every attempt, so a wait for Gitea is not a window in which
                  another landing goes unseen. What landed is read from the pull request, not from
                  main's head, which the next landing may already have moved."""
                  last = ''
                  for _ in range(tries):
                      code, main = call(token, 'GET', api + '/branches/main')
                      if code != 200 or main.get('commit', {}).get('id') != base:
                          return '', 'moved'
                      code, out = call(token, 'POST', api + '/pulls/%d/merge' % pull['number'], {
                          'Do': 'rebase', 'head_commit_id': commit, 'delete_branch_after_merge': True})
                      if code == 200:
                          break
                      last = '%s %s' % (code, (out or {}).get('message', ''))
                      if code not in (405, 409):
                          return '', 'refused: merge failed (%s)' % last
                      time.sleep(pause)  # Gitea is still checking the new pull request
                  else:
                      return '', 'refused: Gitea did not accept the merge (%s)' % last
                  for _ in range(tries):
                      code, now = call(token, 'GET', api + '/pulls/%d' % pull['number'])
                      landed = (now or {}).get('merge_commit_sha') if code == 200 and (now or {}).get('merged') else None
                      if landed and re.fullmatch(r'[0-9a-f]{40}', landed):
                          return landed, ''
                      time.sleep(pause)
                  return '', ('refused: Gitea accepted the merge of pull request #%d but what landed could not be read; '
                              'look at the pull request before pushing again' % pull['number'])

              def fast_forward(user, token, remote, commit, depth, host=GITEA):
                  """Push the tested commit to main as it is: 'landed', 'moved', 'closed' or 'failed: why'.
                  This is the one step the server makes atomic. A push to a protected branch is taken
                  only when the branch's old head is an ancestor of the new commit (Gitea 1.21
                  hook_pre_receive, "protected from force push"; git writes the ref only if its old
                  value still holds). So main becomes exactly the commit CI ran on, or does not move:
                  'moved'. The commit is fetched `depth` deep, the change's commits and the one under
                  them: git refuses a push ("fetch first") when it does not hold the branch's present
                  head and so cannot see that the push is a fast-forward. Gitea's merge cannot promise that: its rebase style rebases once more when
                  main has moved, and 1.21 has no fast-forward-only style (independent review 2,
                  finding 1). 'closed': this account is not on main's push whitelist for the repository."""
                  auth = base64.b64encode(('%s:%s' % (user, token)).encode()).decode()
                  env = dict(os.environ, GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL='/dev/null', GIT_TERMINAL_PROMPT='0',
                             GIT_CONFIG_COUNT='2', GIT_CONFIG_KEY_0='http.' + host + '/.extraHeader',
                             GIT_CONFIG_VALUE_0='Authorization: Basic ' + auth,
                             GIT_CONFIG_KEY_1='credential.helper', GIT_CONFIG_VALUE_1='')
                  with tempfile.TemporaryDirectory() as tmp:
                      for step in (['init', '-q', tmp], ['-C', tmp, 'fetch', '-q', '--depth=%d' % depth, remote, commit],
                                   ['-C', tmp, 'push', remote, commit + ':refs/heads/main']):
                          try:
                              done = subprocess.run(['git'] + step, env=env, capture_output=True, text=True, timeout=180)
                          except (OSError, subprocess.TimeoutExpired) as err:
                              return 'failed: git %s: %s' % (step[-3] if len(step) > 3 else step[0], type(err).__name__)
                          if done.returncode:
                              break
                  if not done.returncode:
                      return 'landed'
                  said = (done.stdout + done.stderr).replace(auth, '***')
                  low = said.lower()
                  if 'not allowed to push' in low:
                      return 'closed'
                  if 'force push' in low or 'non-fast-forward' in low or 'fetch first' in low:
                      return 'moved'
                  lines = [line.strip() for line in said.splitlines() if line.strip()]
                  return 'failed: ' + (lines[-1][:200] if lines else 'git exited %d' % done.returncode)

              def settled(token, api, pull, branch, commit):
                  """After the push: the pull request is marked merged (or closed) and the branch removed.
                  main already holds the commit; nothing here can undo or fail the landing."""
                  code, out = call(token, 'POST', api + '/pulls/%d/merge' % pull['number'],
                                   {'Do': 'manually-merged', 'MergeCommitID': commit})
                  if code != 200:
                      code, out = call(token, 'PATCH', api + '/pulls/%d' % pull['number'], {'state': 'closed'})
                  if code not in (200, 201):
                      print('NOTICE: pull request #%d is still open (%s); main holds the commit' % (pull['number'], code))
                  code, out = call(token, 'DELETE', api + '/branches/' + urllib.parse.quote(branch, safe=''))
                  if code not in (200, 204, 404):
                      print('NOTICE: branch %s was not removed (%s)' % (branch, code))

              def rebased_head(token, api, pull, tries=12, pause=5):
                  """(the branch's new head, '') once Gitea shows the rebase; (None, refusal) otherwise."""
                  for _ in range(tries):
                      code, now = call(token, 'GET', api + '/pulls/%d' % pull['number'])
                      head = (now or {}).get('head', {}).get('sha') if code == 200 else None
                      if head and head != pull.get('head', {}).get('sha') and re.fullmatch(r'[0-9a-f]{40}', head):
                          return head, ''
                      time.sleep(pause)
                  return None, ('refused: Gitea rebased the branch but its new head could not be read. No run '
                                'follows this one: push the branch as it is now to a new ready/ name')

              def still_open(token, api, pull, commit):
                  """'' when the pull request is open and its head is the commit this run goes on with.
                  Read by number: the list of open pull requests can show an old head after a rebase."""
                  code, now = call(token, 'GET', api + '/pulls/%d' % pull['number'])
                  if code != 200 or not isinstance(now, dict):
                      return 'refused: could not read pull request #%d (%s)' % (pull['number'], code)
                  if now.get('merged') or now.get('state') == 'closed':
                      return 'refused: pull request #%d was closed while this run worked on it' % pull['number']
                  if now.get('head', {}).get('sha') != commit:
                      return 'refused: the branch moved after this run started; its new push has its own run'
                  return ''

              def pushed_change_ids(token, repo, commit, gitea=GITEA):
                  """The Change-Id of the pushed commit, for a refused run: what lets a reader put the
                  refusal on its change's lane (2026-11-24, the delivery lanes: 18 of 21 refusals could
                  only stand as sha:<revision>). Read by id, whatever step refused; '' when it has none
                  or cannot be read. A landed run's change-ids are those of every commit it landed."""
                  if not re.fullmatch(r'[0-9a-f]{40}', commit or ''):
                      return ''
                  try:
                      code, got = call(token, 'GET', gitea + '/api/v1/repos/bifrost/%s/git/commits/%s' % (repo, commit))
                      return (change_id(got.get('commit', {}).get('message', '')) or '') if code == 200 else ''
                  except Exception:
                      return ''

              def land(token, table, policy, repo, ref, commit, wait=ci_wait, failed=None, gitea=GITEA, tries=24, pause=5,
                       budget=50 * 60, push=None, turn=lambda: True, tidy=lambda api: None, queue=3 * 60 * 60, rewrite=None):
                  """(what landed, refusal): ({'outcome': 'landed', 'commit': ..., 'change-ids': ...}, '') or
                  ({}, why not). One push is one run: a branch behind main is rebased by Gitea and this
                  run goes on with the new commit, as often as main moves, until it is merged or the
                  time is up. The trigger starts no second run for the merging account's own push."""
                  found = re.fullmatch(r'refs/heads/(ready/[A-Za-z0-9._/-]{1,100})', ref)
                  if not found or not re.fullmatch(r'[0-9a-f]{40}', commit):
                      return {}, 'refused: not a ready/ branch with a full commit id'
                  entry = row(table, repo)
                  if entry is None:
                      return {}, 'refused: this repository is not in LANDING_REPOS (pipeline-land.yaml)'
                  branch, api = found.group(1), gitea + '/api/v1/repos/bifrost/' + repo
                  # The pull request is opened only at this run's turn: every open one is tested
                  # again by Gitea whenever main moves. The wait for the turn has its own limit and
                  # budget starts at the turn (2026-11-19: with eight infra landings queued, one budget
                  # for both refused land-vzmdw before its turn and timed out land-m7wt8 after it,
                  # and each push again went to the back of the queue).
                  waited = time.time() + queue
                  while not turn():
                      if time.time() >= waited:
                          return {}, 'refused: older landings took %d minutes; push ready/ again' % (queue // 60)
                      time.sleep(pause * 3)
                  deadline = time.time() + budget
                  tidy(api)
                  pull, problem = pull_request(token, api, branch, commit, repo)
                  ids, commits, seen = [], [], set()
                  if not problem:
                      commits, problem = listed(token, api, pull['number'], commit)
                  if not problem:
                      ids, problem = checked(token, api, commits, policy, repo, seen)
                  first, fixes = commit, {}
                  if problem and rewrite is not None and ('no Change-Id trailer' in problem
                                                          or 'Change-Id outside the last paragraph' in problem):
                      fixes = {sha: fixed_message(message, sha) for sha, message in zip(commits, messages(token, api, commits))
                               if message and not change_id(message)}
                      new, why = rewrite(repo, branch, commit, commits, fixes) if fixes else (None, 'no message to fix')
                      if why:
                          return {}, problem + ' (the landing could not add it: %s)' % why
                      head, problem = rebased_head(token, api, pull, pause=pause)
                      if not problem and head != new:
                          problem = 'refused: the branch moved after this run started; its new push has its own run'
                      if problem:
                          return {}, problem
                      print('NOTICE: %s had no Change-Id in its last paragraph; the landing added it and goes on with %s '
                            '(the CI of %s judges the same tree)' % (', '.join(s[:12] for s in fixes), new[:12], first[:12]),
                            flush=True)
                      commit, seen = new, set()
                      pull = dict(pull, head=dict(pull.get('head') or {}, sha=commit))
                      commits, _, problem = walked(token, api, commit, len(commits))
                      if not problem:
                          ids, problem = checked(token, api, commits, policy, repo, seen)

                  def done(result):
                      # rerun: none (the pushed commit landed), ran (CI judged the rebased commit) or
                      # skipped (rerun=overlap: main's new commits touched none of this change's
                      # directories; main's own CI run tests the rebased tree).
                      result['rerun'] = 'none' if commit == pushed else (
                          ('own' if own else 'skipped') if skip == commit else 'ran')
                      if fixes:
                          result['trailers'] = 'Change-Id added to %s' % ','.join(s[:12] for s in fixes)
                      hit = tripwired(entry, seen)
                      if hit:
                          print('TRIPWIRE: this change touches %s (watched, not stopped)' % ', '.join(hit), flush=True)
                          result['tripwire'] = ','.join(hit)[:2000]
                      return result, ''
                  if problem:
                      return {}, problem
                  # `on` is the commit the branch sits on. For a pull request just opened it is the
                  # merge_base Gitea reports. After a rebase that field, the pull request's commit list
                  # and the list of open pull requests all lag (2026-11-13: land-79dsl, land-wbnxq), so
                  # from then on the run reads only by commit id and by the pull request's number.
                  pushed, stale, on = first, 0, pull.get('merge_base')
                  sat_on, skip, own = on, None, False  # the commit the pushed one sits on; a rebased commit to land on that run
                  if commit != first:
                      skip = commit  # only the messages changed: the pushed commit's CI on `on` is the check
                  while time.time() < deadline:
                      base, problem = up_to_date(token, api, pull['number'], on, turn)
                      if problem == 'waiting':
                          time.sleep(pause * 3)
                          continue
                      if problem == 'rebased':
                          commit, problem = rebased_head(token, api, pull, pause=pause)
                          if problem:
                              return {}, problem
                          print('the branch was behind main; Gitea rebased %s to %s and this run goes on with it'
                                % (pushed[:12], commit[:12]), flush=True)
                          pull = dict(pull, head=dict(pull.get('head') or {}, sha=commit))
                          # The new head is taken from Gitea, so it is checked like the pushed one, and it
                          # must be the same changes: a rebase keeps every Change-Id. `on` becomes the
                          # commit Gitea really put the branch on, which the walk finds.
                          commits, on, problem = walked(token, api, commit, len(ids))
                          again = []
                          if not problem:
                              again, problem = checked(token, api, commits, policy, repo, seen)
                          if not problem and sorted(again) != sorted(ids):
                              problem = ('refused: after its rebase the branch does not hold the same changes: someone '
                                         'pushed to it meanwhile, and that push has its own run')
                          if problem:
                              return {}, problem
                          skip, own = None, False
                          if entry.get('rerun') == 'overlap' and sat_on:
                              by = set()
                              theirs, why = main_paths(token, api, sat_on, on, sessions=by)
                              shared = overlap(seen, theirs) if theirs is not None else []
                              mine = {session_of(m) for m in messages(token, api, commits)}
                              # Only this change's own thread moved main (its earlier ready/ branch landed
                              # first): it wrote both and knows their order; main's CI run after the landing
                              # is the check. Said in the result (rerun=own), so the thread can see it pays
                              # a rebase for every branch it splits a change into (Owner 2026-11-24).
                              own = theirs is not None and bool(by) and '' not in by and '' not in mine and by <= mine
                              if own:
                                  skip = commit
                                  print('only this change\'s own thread (%s) moved main; the pushed commit\'s CI on %s '
                                        'is the check. Several commits of one change land faster on one ready/ branch'
                                        % (', '.join(sorted(by)), sat_on[:12]), flush=True)
                              elif theirs is None:
                                  print('CI runs on the rebased commit: %s' % why, flush=True)
                              elif shared:
                                  print('CI runs on the rebased commit: main touched %s, as this change does'
                                        % ', '.join(shared[:10]), flush=True)
                              else:
                                  skip = commit
                                  print('main touched none of this change\'s directories; the pushed commit\'s CI on %s '
                                        'is the check, and main\'s CI run tests %s after it lands'
                                        % (sat_on[:12], commit[:12]), flush=True)
                          continue
                      if problem:
                          return {}, problem
                      got = wait(pushed, entry['ci'], sat_on) if skip == commit else wait(commit, entry['ci'], base)
                      if skip == commit and got != 'green':
                          print('the pushed commit has no green CI on %s (%s); CI runs on %s'
                                % (sat_on[:12], got[:80], commit[:12]), flush=True)
                          skip, own = None, False
                          got = wait(commit, entry['ci'], base)
                      if got not in ('green', 'stale'):
                          return {}, got
                      problem = still_open(token, api, pull, commit)
                      if problem:
                          return {}, problem
                      code, main = call(token, 'GET', api + '/branches/main')
                      still = code == 200 and main.get('commit', {}).get('id') == base
                      if got == 'green' and still:
                          pushed_as = push(repo, commit, len(ids) + 1) if push else 'closed'
                          if pushed_as == 'landed':
                              settled(token, api, pull, branch, commit)
                              print('landed %s on main: pushed as tested (pull request #%d)' % (commit, pull['number']))
                              return done({'outcome': 'landed', 'commit': commit, 'change-ids': ','.join(ids[:40])})
                          if pushed_as == 'moved':
                              code, main = call(token, 'GET', api + '/branches/main')
                              if code != 200 or main.get('commit', {}).get('id') != base:
                                  print('main moved before the push; nothing was merged', flush=True)
                                  continue
                              pushed_as = 'failed: the push was refused though main had not moved'
                          # Not on the push whitelist here, or git could not do it: Gitea's merge, as before.
                          print('NOTICE: the tested commit was not pushed (%s); asking Gitea to merge instead' % pushed_as,
                                flush=True)
                          landed, problem = merge(token, api, pull, commit, base, tries, pause)
                          if problem == 'moved':
                              continue
                          if problem:
                              return {}, problem
                          if landed != commit:
                              # Gitea rebased once more inside the merge: main moved between this run's
                              # last read and Gitea's own. What is on main was not the commit CI ran on;
                              # main's own CI run of it is the check. Said, not passed off as landed.
                              print('WARNING: pull request #%d landed as %s, not as the tested %s'
                                    % (pull['number'], landed, commit), flush=True)
                              return done({'outcome': 'landed-not-as-tested', 'commit': landed,
                                           'change-ids': ','.join(ids[:40])})
                          print('landed %s on main through pull request #%d' % (commit, pull['number']))
                          return done({'outcome': 'landed', 'commit': commit, 'change-ids': ','.join(ids[:40])})
                      stale += still
                      if stale > 1:
                          red = (failed or failed_run)(commit, entry['ci'])
                          if red:
                              return {}, 'refused: CI of %s failed (%s); fix it and push ready/ again' % (commit, red)
                          return {}, 'refused: CI did not judge %s against main as it is now; push ready/ again' % commit
                  return {}, 'refused: main kept moving for %d minutes while this change was checked; push ready/ again' % (budget // 60)

              if __name__ == '__main__':
                  if not os.path.exists(TOKEN_FILE):
                      sys.exit('refused: Secret cicd/gitea-merger is not installed')
                  with open(TOKEN_FILE) as handle, open(USER_FILE) as name, open(POLICY) as signed:
                      secret, user = handle.read().strip(), name.read().strip()
                      landed, problem = land(secret, json.loads(os.environ['LANDING_REPOS']), json.load(signed),
                                             os.environ['REPO'], os.environ['BRANCH'], os.environ['COMMIT'],
                                             push=lambda repo, commit, depth: fast_forward(
                                                 user, secret, GITEA + '/bifrost/' + repo + '.git', commit, depth),
                                             rewrite=lambda repo, branch, head, commits, fixes: amend_trailers(
                                                 user, secret, GITEA + '/bifrost/' + repo + '.git', branch, head, commits, fixes),
                                             turn=lambda: first_in_line(os.environ['RUN'], os.environ['REPO']),
                                   tidy=lambda api: close_abandoned(secret, api, os.environ['REPO']))
                  if problem:
                      ids = pushed_change_ids(secret, os.environ['REPO'], os.environ['COMMIT'])
                      for name, value in (('outcome', 'refused'), ('refusal', problem[:2000]), ('change-ids', ids)):
                          with open(RESULTS + name, 'w') as handle:
                              handle.write(value)
                      sys.exit(problem)
                  for name, value in landed.items():
                      with open(RESULTS + name, 'w') as handle:
                          handle.write(value)
  finally:
    # Only after a refused land: copies its refusal into a result of a task that
    # succeeds (see results.refusal). Nothing to copy when it landed.
    - name: refusal
      when:
        - input: $(tasks.land.status)
          operator: in
          values: ["Failed"]
      params:
        - name: refusal
          value: $(tasks.land.results.refusal)
        - name: change-ids
          value: $(tasks.land.results.change-ids)
      taskSpec:
        params:
          - name: refusal
          - name: change-ids
        results:
          - name: refusal
          - name: change-ids
        steps:
          - name: copy
            image: alpine:3.20
            env:
              - name: REFUSAL
                value: $(params.refusal)
              - name: CHANGE_IDS
                value: $(params.change-ids)
            script: |
              #!/bin/sh
              printf '%s' "${REFUSAL}" | head -c 2000 > "$(results.refusal.path)"
              printf '%s' "${CHANGE_IDS}" | head -c 2000 > "$(results.change-ids.path)"
