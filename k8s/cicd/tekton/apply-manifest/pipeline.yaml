# Plan and apply a git path. The task image is alpine/k8s:1.31.4, already used
# by the other Tekton tasks. The platform starts this pipeline; it does not
# apply manifests with its own ServiceAccount.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-apply-manifest
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: bifrost-platform
spec:
  params:
    - name: mode
      type: string
    - name: repo
      type: string
    - name: path
      type: string
    - name: commit
      type: string
    - name: giteaBase
      type: string
    - name: giteaOrg
      type: string
    - name: requireOnMain
      type: string
      default: "false"
  # The platform reads PipelineRun results (workactions.Summarize), so the task
  # results are promoted here.
  results:
    - name: objects
      value: $(tasks.run.results.objects)
    - name: policy
      value: $(tasks.run.results.policy)
    - name: highest_tier
      value: $(tasks.run.results.highest_tier)
  tasks:
    - name: freeze-check
      taskRef:
        name: bifrost-release-freeze-check
    - name: run
      runAfter: [freeze-check]
      params:
        - name: mode
          value: $(params.mode)
        - name: repo
          value: $(params.repo)
        - name: path
          value: $(params.path)
        - name: commit
          value: $(params.commit)
        - name: giteaBase
          value: $(params.giteaBase)
        - name: giteaOrg
          value: $(params.giteaOrg)
        - name: requireOnMain
          value: $(params.requireOnMain)
      taskSpec:
        params:
          - name: mode
          - name: repo
          - name: path
          - name: commit
          - name: giteaBase
          - name: giteaOrg
          - name: requireOnMain
        results:
          - name: objects
            description: JSON list of rendered objects
          - name: policy
            description: pass when the allow-list check succeeded
          - name: highest_tier
            description: Highest namespace tier in the render
        steps:
          - name: run
            image: alpine/k8s:1.31.4
            env:
              - name: MODE
                value: $(params.mode)
              - name: REPO
                value: $(params.repo)
              - name: PATH_IN_REPO
                value: $(params.path)
              - name: COMMIT
                value: $(params.commit)
              - name: GITEA_BASE
                value: $(params.giteaBase)
              - name: GITEA_ORG
                value: $(params.giteaOrg)
              - name: REQUIRE_ON_MAIN
                value: $(params.requireOnMain)
              - name: GIT_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-reader
                    key: username
              - name: GIT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-reader
                    key: password
            volumeMounts:
              - name: policy
                mountPath: /policy
                readOnly: true
              - name: checker
                mountPath: /checks
                readOnly: true
            script: |
              #!/bin/sh
              set -eu
              user="${GIT_USERNAME:?}"
              password="${GIT_PASSWORD:?}"
              unset GIT_USERNAME GIT_PASSWORD
              auth="$(printf '%s:%s' "$user" "$password" | base64 | tr -d '\n')"
              unset user password
              git_read() {
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
                GIT_CONFIG_COUNT=3 \
                GIT_CONFIG_KEY_0=http.http://gitea.cicd.svc.cluster.local:3000/.extraHeader \
                GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
                GIT_CONFIG_KEY_1=http.followRedirects GIT_CONFIG_VALUE_1=false \
                GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2= git "$@"
              }
              mode="${MODE:?}"
              repo="${REPO:?}"
              path="${PATH_IN_REPO:?}"
              commit="${COMMIT:?}"
              base="${GITEA_BASE:?}"
              org="${GITEA_ORG:?}"
              case "$REQUIRE_ON_MAIN" in
                true|false) ;;
                *) echo "requireOnMain must be true or false" >&2; exit 1 ;;
              esac
              case "$mode" in
                plan|apply) ;;
                *) echo "mode must be plan or apply" >&2; exit 1 ;;
              esac
              if ! printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9._-]+$'; then
                echo "repo has characters outside the allow-list" >&2
                exit 1
              fi
              if ! printf '%s' "$path" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
                echo "path has characters outside the allow-list" >&2
                exit 1
              fi
              case "$path" in
                /*) echo "path must not start with /" >&2; exit 1 ;;
              esac
              oldifs=$IFS
              IFS=/
              for seg in $path; do
                case "$seg" in
                  ""|.) echo "path has an empty or dot segment" >&2; exit 1 ;;
                  ..) echo "path has a dot-dot segment" >&2; exit 1 ;;
                esac
              done
              IFS=$oldifs
              if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "commit must be a 40-character hex sha" >&2
                exit 1
              fi
              # Review 546: the repository, path and organisation come from the mounted policy,
              # not only from the platform code that started the run.
              if [ "$org" != "$(awk '/^  gitea_org:/ {print $2; exit}' /policy/actuation-policy.yaml)" ]; then
                echo "giteaOrg is not the policy's gitea_org" >&2
                exit 1
              fi
              if [ "$base" != "$(awk '/^  gitea_base:/ {print $2; exit}' /policy/actuation-policy.yaml)" ]; then
                echo "giteaBase is not the policy's gitea_base" >&2
                exit 1
              fi
              if ! awk -v repo="$repo" -v path="$path" '
                  /^apply:/ { inapply = 1; next }
                  inapply && /^[^ ]/ { inapply = 0 }
                  inapply && /^  repos:/ { inrepos = 1; next }
                  inrepos && /^  [^ ]/ { inrepos = 0 }
                  inrepos && /^    - name: / { cur = $3; next }
                  inrepos && /^        - / { if (cur == repo && (path == $2 || index(path, $2 "/") == 1)) ok = 1 }
                  END { exit !ok }' /policy/actuation-policy.yaml; then
                echo "repo ${repo} path ${path} is not in the policy's apply list" >&2
                exit 1
              fi
              if [ "${REQUIRE_ON_MAIN}" = "true" ]; then
                # Gitea 1.21 has no compare API (it answered 404 and refused every
                # tier C apply, TD-275). Ask git: fetch main's history without
                # blobs and check that the commit is an ancestor of main.
                apk add --no-cache git >/dev/null
                remote="${base}/${repo}.git"
                if ! git_read clone -q --bare --filter=blob:none --single-branch --branch main \
                    "${remote}" /tmp/main.git 2>/dev/null; then
                  echo "could not read main of ${repo}" >&2
                  exit 1
                fi
                if ! git_read -C /tmp/main.git merge-base --is-ancestor "$commit" main 2>/dev/null; then
                  echo "commit is not reachable from main" >&2
                  exit 1
                fi
              fi
              apk add --no-cache jq curl >/dev/null
              # render SHA DIR OUT: fetch repo@SHA, render path, write the normalized List to OUT.
              render() {
                archive="$2.tar.gz"
                # The API route accepts basic auth; the web archive route answers 404 for a private repo.
                url="${base%%/bifrost}/api/v1/repos/${org}/${repo}/archive/$1.tar.gz"
                if ! printf 'header = "Authorization: Basic %s"\n' "$auth" | \
                    curl --config - --fail --silent --show-error --max-redirs 0 --output "$archive" "$url"; then
                  echo "could not fetch ${repo}@$1" >&2
                  exit 1
                fi
                mkdir -p "$2"
                tar -xzf "$archive" -C "$2"
                root=$(find "$2" -mindepth 1 -maxdepth 1 -type d | head -n 1)
                target="${root}/${path}"
                if [ -d "$target" ]; then
                  kubectl kustomize "$target" > "$2.rendered.yaml"
                elif [ -f "$target" ]; then
                  cp "$target" "$2.rendered.yaml"
                else
                  echo "path not in ${repo}@$1" >&2
                  exit 1
                fi
                # Two steps, not a pipe: under sh a failed kubectl would leave jq's exit status.
                kubectl create --dry-run=client -o json -f "$2.rendered.yaml" > "$2.objects.json"
                jq -s '{apiVersion:"v1",kind:"List",items:.}' "$2.objects.json" > "$3"
              }
              render "$commit" /tmp/src /tmp/normalized.json
              # The checker below rewrites normalized.json (it drops existing Namespaces); keep the
              # render as it came for the comparison with main's head (review 548 R1).
              cp /tmp/normalized.json /tmp/commit-rendered.json
              tier=$(sh /checks/apply-manifest-check.sh /policy/actuation-policy.yaml /tmp/normalized.json /tmp/objects.json)
              # Review 545 F1: the tier comes from what this commit renders, not from the caller.
              # The platform asks for main on tier C and D (workactions/service.go); a run that
              # names a tier C or D change without requireOnMain=true is refused here, so a
              # caller cannot apply Task or Pipeline definitions from a branch.
              if [ "$mode" = "apply" ] && [ "${REQUIRE_ON_MAIN}" != "true" ]; then
                case "$tier" in
                  A|B) ;;
                  *) echo "tier ${tier} is applied only from main: requireOnMain must be true" >&2; exit 1 ;;
                esac
              fi
              # Review 546: an older main commit is also "on main", and applying it would bring
              # back an older definition (this pipeline's included). Tier C and D apply only
              # what main's head renders at the same path; a plan made before main changed
              # that path is refused and has to be made again.
              if [ "$mode" = "apply" ]; then
                case "$tier" in
                  A|B) ;;
                  *)
                    head=$(git -C /tmp/main.git rev-parse refs/heads/main)
                    if [ "$head" != "$commit" ]; then
                      render "$head" /tmp/head /tmp/head-normalized.json
                      jq -S . /tmp/commit-rendered.json > /tmp/commit.sorted.json
                      jq -S . /tmp/head-normalized.json > /tmp/head.sorted.json
                      if ! cmp -s /tmp/commit.sorted.json /tmp/head.sorted.json; then
                        echo "${path} renders differently at main's head ${head}; plan again from main" >&2
                        exit 1
                      fi
                    fi
                    ;;
                esac
              fi
              # Keep this embedded helper identical to apply-manifest-ownership.sh.
              # Embedding makes the Pipeline-only owner bootstrap sufficient.
              cat > /tmp/apply-manifest-ownership.sh <<'OWNERSHIP'
              #!/bin/sh
              # Run only after apply-manifest-check.sh has validated the normalized List.
              # apply builds the same ownership plan, then rechecks each migration immediately.
              set -eu
              mode=${1:?mode}
              rendered=${2:?normalized List}
              objects=${3:?objects result}
              KUBECTL=${KUBECTL:-kubectl}
              work=$(mktemp -d)
              trap 'rm -rf "$work"' EXIT

              classify() {
                ownership=ssa
                if [ "$eligible" = true ]; then
                  "$KUBECTL" get "$kind" "$name" -n "$ns" --ignore-not-found -o json --show-managed-fields > "$work/live.json"
                fi
                if "$KUBECTL" apply --server-side --field-manager=bifrost-applier --dry-run=server -f "$work/object.json" > /dev/null 2> "$work/error"; then
                  return
                fi
                # Only recognized SSA conflicts may enter the migration path. Errors such as
                # admission failures, missing permissions or transport failures remain errors.
                managers=$(sed -n 's/.*conflicts\{0,1\} with "\([^"]*\)".*/\1/p' "$work/error" | sort -u)
                if [ "$eligible" != true ] || [ -z "$managers" ]; then
                  cat "$work/error" >&2
                  return 1
                fi
                "$KUBECTL" get "$kind" "$name" -n "$ns" -o json --show-managed-fields > "$work/live.json"
                printf '%s\n' "$managers" > "$work/managers"
                while IFS= read -r manager; do
                  if ! jq -e --arg m "$manager" '
                    .metadata as $meta |
                    [$meta.managedFields[]? | select(.manager == $m)] as $entries |
                    ($entries | length > 0) and
                    ($entries | all(
                      .manager == "kubectl-client-side-apply" or
                      .manager == "kubectl-last-applied" or
                      (.manager == "kubectl" and .operation == "Update" and
                       ($meta.annotations | has("kubectl.kubernetes.io/last-applied-configuration")))
                    ))
                  ' "$work/live.json" > /dev/null; then
                    echo "refusing ownership conflict with manager ${manager} on ${ns}/${kind}/${name}" >&2
                    return 1
                  fi
                done < "$work/managers"
                ownership=migrate
              }

              jq '. | map(. + {ownership:"ssa"})' "$objects" > "$work/plan.json"
              count=$(jq '.items | length' "$rendered")
              i=0
              while [ "$i" -lt "$count" ]; do
                jq --argjson i "$i" '.items[$i]' "$rendered" > "$work/object.json"
                ns=$(jq -r '.metadata.namespace' "$work/object.json")
                kind=$(jq -r '.kind' "$work/object.json")
                name=$(jq -r '.metadata.name' "$work/object.json")
                eligible=false
                # The policy checker has already verified group/kind against cicd_resources.
                case "$ns/$kind" in
                  cicd/Pipeline|cicd/Task|cicd/TriggerTemplate|cicd/TriggerBinding|cicd/EventListener) eligible=true ;;
                esac
                classify
                jq --arg ns "$ns" --arg kind "$kind" --arg name "$name" --arg ownership "$ownership" '
                  map(if .namespace == $ns and .kind == $kind and .name == $name
                      then . + {ownership:$ownership} else . end)
                ' "$work/plan.json" > "$work/next.json"
                mv "$work/next.json" "$work/plan.json"
                i=$((i + 1))
              done
              cp "$work/plan.json" "$objects"
              i=0
              while [ "$i" -lt "$count" ]; do
                jq --argjson i "$i" '.items[$i]' "$rendered" > "$work/object.json"
                ns=$(jq -r '.metadata.namespace' "$work/object.json")
                kind=$(jq -r '.kind' "$work/object.json")
                name=$(jq -r '.metadata.name' "$work/object.json")
                planned=$(jq -r --arg ns "$ns" --arg kind "$kind" --arg name "$name" '.[] | select(.namespace == $ns and .kind == $kind and .name == $name) | .ownership' "$objects")
                set --
                if [ "$planned" = migrate ]; then
                  eligible=true
                  classify
                  # A vanished conflict needs no force. A new foreign manager fails classify.
                  if [ "$ownership" = migrate ]; then set -- --force-conflicts; fi
                fi
                if [ "$mode" = plan ]; then
                  rc=0
                  "$KUBECTL" diff --server-side --field-manager=bifrost-applier "$@" -f "$work/object.json" || rc=$?
                  [ "$rc" -le 1 ] || exit "$rc"
                else
                  "$KUBECTL" apply --server-side --field-manager=bifrost-applier "$@" -f "$work/object.json"
                  if [ "$planned" = migrate ]; then
                    "$KUBECTL" annotate "$kind" "$name" -n "$ns" kubectl.kubernetes.io/last-applied-configuration-
                  fi
                fi
                i=$((i + 1))
              done
              OWNERSHIP
              sh /tmp/apply-manifest-ownership.sh "$mode" /tmp/normalized.json /tmp/objects.json
              cp /tmp/objects.json "$(results.objects.path)"
              printf '%s' pass > "$(results.policy.path)"
              printf '%s' "$tier" > "$(results.highest_tier.path)"
        volumes:
          - name: policy
            configMap:
              name: bifrost-actuation-policy
          - name: checker
            configMap:
              name: bifrost-apply-manifest-check
              defaultMode: 0555
