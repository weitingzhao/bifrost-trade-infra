# Plan and apply a git path. The task image is alpine/k8s:1.31.4, already used
# by the other Tekton tasks. The platform starts this pipeline; it does not
# apply manifests with its own ServiceAccount.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bifrost-apply-manifest
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: bifrost-platform
spec:
  params:
    - name: mode
      type: string
    - name: repo
      type: string
    - name: path
      type: string
    - name: commit
      type: string
    - name: giteaBase
      type: string
    - name: giteaOrg
      type: string
    - name: requireOnMain
      type: string
      default: "false"
  # The platform reads PipelineRun results (workactions.Summarize), so the task
  # results are promoted here.
  results:
    - name: objects
      value: $(tasks.run.results.objects)
    - name: policy
      value: $(tasks.run.results.policy)
    - name: highest_tier
      value: $(tasks.run.results.highest_tier)
  tasks:
    - name: run
      params:
        - name: mode
          value: $(params.mode)
        - name: repo
          value: $(params.repo)
        - name: path
          value: $(params.path)
        - name: commit
          value: $(params.commit)
        - name: giteaBase
          value: $(params.giteaBase)
        - name: giteaOrg
          value: $(params.giteaOrg)
        - name: requireOnMain
          value: $(params.requireOnMain)
      taskSpec:
        params:
          - name: mode
          - name: repo
          - name: path
          - name: commit
          - name: giteaBase
          - name: giteaOrg
          - name: requireOnMain
        results:
          - name: objects
            description: JSON list of rendered objects
          - name: policy
            description: pass when the allow-list check succeeded
          - name: highest_tier
            description: Highest namespace tier in the render
        steps:
          - name: run
            image: alpine/k8s:1.31.4
            env:
              - name: MODE
                value: $(params.mode)
              - name: REPO
                value: $(params.repo)
              - name: PATH_IN_REPO
                value: $(params.path)
              - name: COMMIT
                value: $(params.commit)
              - name: GITEA_BASE
                value: $(params.giteaBase)
              - name: GITEA_ORG
                value: $(params.giteaOrg)
              - name: REQUIRE_ON_MAIN
                value: $(params.requireOnMain)
              - name: GIT_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: gitea-git-credentials
                    key: username
              - name: GIT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: gitea-git-credentials
                    key: password
            volumeMounts:
              - name: policy
                mountPath: /policy
                readOnly: true
              - name: checker
                mountPath: /checks
                readOnly: true
            script: |
              #!/bin/sh
              set -eu
              mode="${MODE:?}"
              repo="${REPO:?}"
              path="${PATH_IN_REPO:?}"
              commit="${COMMIT:?}"
              base="${GITEA_BASE:?}"
              org="${GITEA_ORG:?}"
              case "$mode" in
                plan|apply) ;;
                *) echo "mode must be plan or apply" >&2; exit 1 ;;
              esac
              if ! printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9._-]+$'; then
                echo "repo has characters outside the allow-list" >&2
                exit 1
              fi
              if ! printf '%s' "$path" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
                echo "path has characters outside the allow-list" >&2
                exit 1
              fi
              case "$path" in
                /*) echo "path must not start with /" >&2; exit 1 ;;
              esac
              oldifs=$IFS
              IFS=/
              for seg in $path; do
                case "$seg" in
                  ""|.) echo "path has an empty or dot segment" >&2; exit 1 ;;
                  ..) echo "path has a dot-dot segment" >&2; exit 1 ;;
                esac
              done
              IFS=$oldifs
              if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "commit must be a 40-character hex sha" >&2
                exit 1
              fi
              if [ "${REQUIRE_ON_MAIN}" = "true" ]; then
                api="${base%%/bifrost}/api/v1/repos/${org}/${repo}/compare/${commit}...main"
                host_path="${api#http://}"
                host_path="${host_path#https://}"
                body=$(wget -q -O - "http://${GIT_USERNAME}:${GIT_PASSWORD}@${host_path}" || true)
                base_sha=$(printf '%s' "$body" | sed -n 's/.*"merge_base_commit":{"sha":"\([0-9a-f][0-9a-f]*\)".*/\1/p' | head -n 1)
                if [ "$base_sha" != "$commit" ]; then
                  echo "commit is not reachable from main" >&2
                  exit 1
                fi
              fi
              archive=/tmp/src.tar.gz
              # The API route accepts basic auth; the web archive route answers 404 for a private repo.
              url="${base%%/bifrost}/api/v1/repos/${org}/${repo}/archive/${commit}.tar.gz"
              host_path="${url#http://}"
              host_path="${host_path#https://}"
              if ! wget -q -O "$archive" "http://${GIT_USERNAME}:${GIT_PASSWORD}@${host_path}"; then
                echo "could not fetch ${repo}@${commit}" >&2
                exit 1
              fi
              mkdir -p /tmp/src
              tar -xzf "$archive" -C /tmp/src
              root=$(find /tmp/src -mindepth 1 -maxdepth 1 -type d | head -n 1)
              target="${root}/${path}"
              if [ -d "$target" ]; then
                kubectl kustomize "$target" > /tmp/rendered.yaml
              elif [ -f "$target" ]; then
                cp "$target" /tmp/rendered.yaml
              else
                echo "path not in the commit" >&2
                exit 1
              fi
              apk add --no-cache jq >/dev/null
              kubectl create --dry-run=client -o json -f /tmp/rendered.yaml \
                | jq -s '{apiVersion:"v1",kind:"List",items:.}' > /tmp/normalized.json
              tier=$(sh /checks/apply-manifest-check.sh /policy/actuation-policy.yaml /tmp/normalized.json /tmp/objects.json)
              if [ "$mode" = "plan" ]; then
                kubectl diff -f /tmp/normalized.json --server-side > /tmp/diff.txt 2>&1 || test "$?" -eq 1
                echo "=== kubectl diff ==="
                cat /tmp/diff.txt
              else
                kubectl apply -f /tmp/normalized.json --server-side --field-manager=bifrost-applier
              fi
              cp /tmp/objects.json "$(results.objects.path)"
              printf '%s' pass > "$(results.policy.path)"
              printf '%s' "$tier" > "$(results.highest_tier.path)"
        volumes:
          - name: policy
            configMap:
              name: bifrost-actuation-policy
          - name: checker
            configMap:
              name: bifrost-apply-manifest-check
              defaultMode: 0555
