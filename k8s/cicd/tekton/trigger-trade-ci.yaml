# Tekton Triggers for Bifrost CI gate — Gitea push webhook → CI pipeline.
#
# Flow: Gitea fires a push webhook (any branch; a pull mirror's sync too) → EventListener →
#       CEL filter routes to python-ci, frontend-ci, or platform-ci TriggerTemplate → PipelineRun.
#       A push to a repository Gitea holds as its primary also starts github-sync
#       (a TaskRun that copies main and tags to GitHub; k8s/cicd/github-sync).
#
# PipelineRun TTL: Tekton v1.6 CRD rejects spec.ttlSecondsAfterFinished.
# Finished runs are pruned by k8s/cicd/tekton/pipelinerun-ttl.yaml (7d).
#
# Gitea webhook config (per repo):
#   URL:  http://el-bifrost-ci.cicd.svc.cluster.local:8080
#   Type: application/json
#   Event: Push
#   Secret: (value from gitea-webhook-secret/token, optional)

# --- TriggerBinding: extract repo name + revision from Gitea push payload ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: repo
      value: $(body.repository.name)
    - name: revision
      value: $(body.after)
    - name: ref
      value: $(body.ref)
    - name: clone_url
      value: $(body.repository.clone_url)

---
# --- TriggerBinding: a bifrost-platform push, with the commit the ref moved from ---
# R5:5.7 CI time (Owner 2026-11-06): a platform push tests what it changed since
# that commit (scripts/ci/test_api_scoped.sh base head); a new branch (before is
# all zeros), a force push or any unreadable base runs the whole suite.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push-platform
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: revision
      value: $(body.after)
    - name: base
      value: $(body.before)

---
# --- TriggerBinding: a push to refs/heads/ready/<name> of bifrost-platform asks for a landing ---
# Owner 2026-11-12 (pipeline-land-platform.yaml). No `base`: the CI run of a ready/ push tests
# the whole suite (or the console scope, which is measured from main), never the increment
# since the last push to the branch. The same binding feeds the landing run.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push-platform-ready
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: revision
      value: $(body.after)
    - name: branch
      value: $(body.ref)

---
# --- TriggerTemplate: a ready/ push of bifrost-platform → bifrost-land-platform ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-land-platform-template
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
    bifrost.io/layer: L1
spec:
  params:
    - name: revision
    - name: branch
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: land-platform-
        namespace: cicd
        labels:
          tekton.dev/pipeline: bifrost-land-platform
          bifrost.io/trigger: gitea-webhook
          bifrost.io/repo: bifrost-platform
          bifrost.io/layer: L1
      spec:
        pipelineRef:
          name: bifrost-land-platform
        params:
          - name: revision
            value: $(tt.params.revision)
          - name: branch
            value: $(tt.params.branch)
        # ci-wait reads the CI runs with the reader identity the reuse task already has.
        taskRunSpecs:
          - pipelineTaskName: ci-wait
            serviceAccountName: tekton-platform-ci-reuse
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule

---
# --- TriggerBinding and TriggerTemplate: a ready/ push → bifrost-land (pipeline-land.yaml) ---
# The one landing pipeline for every repository listed in LANDING_REPOS (pipeline-land.yaml). The
# repository's name is passed on only to be looked up there.
# MIGRATION (2026-11-13, hours): bifrost-platform still lands through bifrost-land-platform
# above, untouched, until this pipeline has landed bifrost-trade-infra for real. The next
# commit moves it here and removes bifrost-land-platform, its template, its binding and the
# repository name in the `land` filter below.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push-ready
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: repo
      value: $(body.repository.name)
    - name: revision
      value: $(body.after)
    - name: branch
      value: $(body.ref)

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-land-template
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
    bifrost.io/layer: L1
spec:
  params:
    - name: repo
    - name: revision
    - name: branch
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: land-
        namespace: cicd
        labels:
          tekton.dev/pipeline: bifrost-land
          bifrost.io/trigger: gitea-webhook
          bifrost.io/repo: $(tt.params.repo)
          bifrost.io/layer: L1
      spec:
        pipelineRef:
          name: bifrost-land
        params:
          - name: repo
            value: $(tt.params.repo)
          - name: revision
            value: $(tt.params.revision)
          - name: branch
            value: $(tt.params.branch)
        # land reads the CI runs with the reader identity the reuse task already has.
        taskRunSpecs:
          - pipelineTaskName: land
            serviceAccountName: tekton-platform-ci-reuse
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule

---
# --- TriggerBinding: a bifrost-ui push runs the frontend and platform gates against that ui commit ---
# The pushed SHA is bifrost-ui's: it goes to uiRevision, and the frontend under test stays on
# main. Bound as `revision` (the frontend's) it named a commit the frontend repo does not have,
# and every ui push failed the gate at clone (ci-frontend-5jvmh, 2026-10-05).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push-ui
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: revision
      value: main
    - name: uiRevision
      value: $(body.after)

---
# --- TriggerTemplate: Python repos → bifrost-ci-python pipeline ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-ci-python-template
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: repo
    - name: revision
      default: main
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ci-python-$(tt.params.repo)-
        namespace: cicd
        labels:
          tekton.dev/pipeline: bifrost-ci-python
          bifrost.io/trigger: gitea-webhook
          bifrost.io/repo: $(tt.params.repo)
      spec:
        pipelineRef:
          name: bifrost-ci-python
        params:
          - name: repo
            value: $(tt.params.repo)
          - name: revision
            value: $(tt.params.revision)
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 2Gi

---
# --- TriggerTemplate: Frontend repo → bifrost-ci-frontend pipeline ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-ci-frontend-template
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: revision
      default: main
    - name: uiRevision
      default: main
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ci-frontend-
        namespace: cicd
        labels:
          tekton.dev/pipeline: bifrost-ci-frontend
          bifrost.io/trigger: gitea-webhook
          bifrost.io/repo: bifrost-trade-frontend
      spec:
        pipelineRef:
          name: bifrost-ci-frontend
        params:
          - name: revision
            value: $(tt.params.revision)
          - name: uiRevision
            value: $(tt.params.uiRevision)
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 3Gi

---
# --- TriggerTemplate: Platform repo → bifrost-ci-platform pipeline (L1) ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-ci-platform-template
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
    bifrost.io/layer: L1
spec:
  params:
    - name: revision
      default: main
    - name: uiRevision
      default: main
    # The commit a push moved from; empty for a ui push (the whole suite).
    - name: base
      default: ""
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ci-platform-
        namespace: cicd
        labels:
          tekton.dev/pipeline: bifrost-ci-platform
          bifrost.io/trigger: gitea-webhook
          bifrost.io/repo: bifrost-platform
          bifrost.io/layer: L1
      spec:
        pipelineRef:
          name: bifrost-ci-platform
        params:
          - name: revision
            value: $(tt.params.revision)
          - name: uiRevision
            value: $(tt.params.uiRevision)
          - name: base
            value: $(tt.params.base)
          # W-31 B5: explicit, not a template param a payload could set.
          - name: repo-url
            value: http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-platform.git
        taskRunSpecs:
          - pipelineTaskName: reuse
            serviceAccountName: tekton-platform-ci-reuse
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 2Gi

---
# --- EventListener: receives Gitea push webhooks, routes by repo name ---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: bifrost-ci
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  serviceAccountName: tekton-trigger
  triggers:
    # TD-435: the listener does not check who posted the body (no webhook secret), so every
    # filter requires a 40-hex `after`: it becomes the pipelines' `revision`, which Task
    # scripts use as $(params.revision). CI does not take the branch name, so a CI trigger
    # does not narrow it (review 546); github-sync passes the ref on and pins it.
    # W-31 3.4 ② (Owner 2026-10-21 「D3 A」): CI runs on every branch push, not only main,
    # so a lane's commit has its CI before it is merged; push-main.sh requires a
    # Succeeded ci-* run for the exact commit it pushes. A push that deletes a branch
    # (after = forty zeros) runs nothing. github-sync below stays main and tags only.
    # Platform attempt branches (agent/…) run no CI of their own (R5:5.7-1, platform-ci).
    # L2: Python repos (Trade + Research). This filter is the one list of repos
    # bifrost-ci-python runs for; its lint gate and code-health Task apply to
    # every repo listed here.
    - name: python-ci
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name in ['bifrost-trade-core', 'bifrost-trade-api',
                  'bifrost-trade-worker', 'bifrost-research']
            - name: overlays
              value:
                - key: repo_name
                  expression: body.repository.name
      bindings:
        - ref: bifrost-gitea-push
      template:
        ref: bifrost-ci-python-template
    # L2: Frontend repo — the pushed SHA is the frontend's
    - name: frontend-ci
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name == 'bifrost-trade-frontend'
      bindings:
        - ref: bifrost-gitea-push
      template:
        ref: bifrost-ci-frontend-template
    # L2: bifrost-ui — the same frontend gate, frontend on main, ui at the pushed SHA
    - name: frontend-ci-ui
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name == 'bifrost-ui'
      bindings:
        - ref: bifrost-gitea-push-ui
      template:
        ref: bifrost-ci-frontend-template
    # Landing CI already checked the commit promoted to main by agentrt-lander.
    - name: infra-ci
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.repository.full_name == 'bifrost/bifrost-trade-infra' &&
                (body.ref != 'refs/heads/main' || !has(body.pusher) ||
                  ((!has(body.pusher.login) || body.pusher.login != 'agentrt-lander') &&
                   (!has(body.pusher.username) || body.pusher.username != 'agentrt-lander'))) &&
                body.ref.startsWith('refs/heads/') &&
                !body.ref.startsWith('refs/heads/land/') &&
                !body.ref.startsWith('refs/heads/agent/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000'
      bindings:
        - ref: bifrost-gitea-push-infra
      template:
        ref: bifrost-ci-infra-template
    # L1: Platform repo (control plane)
    # R5:5.7-1: not an attempt branch (refs/heads/agent/<task>/a<n>, which agentd and handin
    # push). Its commit reaches main only through a landing: the landing pushes the same
    # change, prepared on main, to refs/heads/land/<env>/<task>/<k> (platform
    # api/internal/agentrt/controller/landing_branch.go).
    # R5:5.7-5: nor a land branch. The landing drill makes its own landing-ci-* for that
    # commit (pinned for a grant at once, uiRevision=main otherwise 30 s after preparing),
    # so a webhook run there only doubled the load (11-05: 16-20 min landing CIs beside it).
    # R5:5.7-10: agentrt-lander pushes the same commit only after landing CI is green.
    # That landing-ci-* run is main's CI record for the commit; skip a second webhook CI.
    - name: platform-ci
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                !body.ref.startsWith('refs/heads/agent/') &&
                !body.ref.startsWith('refs/heads/land/') &&
                !body.ref.startsWith('refs/heads/ready/') &&
                (!has(body.pusher) ||
                  ((!has(body.pusher.login) || body.pusher.login != 'agentrt-lander') &&
                   (!has(body.pusher.username) || body.pusher.username != 'agentrt-lander'))) &&
                body.repository.name == 'bifrost-platform'
      bindings:
        - ref: bifrost-gitea-push-platform
      template:
        ref: bifrost-ci-platform-template
    # Owner 2026-11-12: a push to ready/<name> is the request to land that commit. Two runs
    # start: the CI gate without a base (the whole suite), and bifrost-land-platform, which
    # waits for that gate and merges. The ref is pinned to a plain name: it is passed on as data.
    - name: platform-ci-ready
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.ref.matches('^refs/heads/ready/[A-Za-z0-9._/-]{1,100}$') &&
                (!has(body.pusher) ||
                  ((!has(body.pusher.login) || body.pusher.login != 'agentrt-lander') &&
                   (!has(body.pusher.username) || body.pusher.username != 'agentrt-lander'))) &&
                body.repository.name == 'bifrost-platform'
      bindings:
        - ref: bifrost-gitea-push-platform-ready
      template:
        ref: bifrost-ci-platform-template
    - name: platform-land
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.ref.matches('^refs/heads/ready/[A-Za-z0-9._/-]{1,100}$') &&
                (!has(body.pusher) ||
                  ((!has(body.pusher.login) || body.pusher.login != 'agentrt-lander') &&
                   (!has(body.pusher.username) || body.pusher.username != 'agentrt-lander'))) &&
                body.repository.name == 'bifrost-platform'
      bindings:
        - ref: bifrost-gitea-push-platform-ready
      template:
        ref: bifrost-land-platform-template
    # One landing trigger for every repository: which ones land is LANDING_REPOS (pipeline-land.yaml), read
    # by the pipeline; the name is pinned to a plain one and is data. A repository's CI gate
    # starts beside it from its own trigger (bifrost-trade-infra: infra-ci above, whose clone
    # task takes main as the base of a commit that heads a ready/ branch).
    # MIGRATION: the last line keeps bifrost-platform on platform-land until the next commit.
    - name: land
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.ref.matches('^refs/heads/ready/[A-Za-z0-9._/-]{1,100}$') &&
                (!has(body.pusher) ||
                  ((!has(body.pusher.login) || body.pusher.login != 'agentrt-lander') &&
                   (!has(body.pusher.username) || body.pusher.username != 'agentrt-lander'))) &&
                body.repository.name.matches('^[a-z0-9-]{1,100}$') &&
                body.repository.name != 'bifrost-platform'
      bindings:
        - ref: bifrost-gitea-push-ready
      template:
        ref: bifrost-land-template
    # L1: bifrost-ui — the Console builds against it too, so a ui push runs the platform
    # gate with platform on main and ui at the pushed SHA (TD-234)
    - name: platform-ci-ui
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name == 'bifrost-ui'
      bindings:
        - ref: bifrost-gitea-push-ui
      template:
        ref: bifrost-ci-platform-template
    # CUT-gitea-primary-2026-10-17 step 0e: a push to main or a tag of a repository Gitea holds
    # as its primary is copied to GitHub (Task bifrost-github-sync, k8s/cicd/github-sync). A pull
    # mirror's push (Gitea fetching from GitHub) carries repository.mirror and is not; the Task
    # checks again, and the reconcile CronJob catches a lost webhook. Not a CI run.
    - name: github-sync
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                !body.repository.mirror &&
                body.after.matches('^[0-9a-f]{40}$') &&
                (body.ref == 'refs/heads/main' || body.ref.matches('^refs/tags/[A-Za-z0-9._/+-]{1,200}$')) &&
                body.repository.name in ['bifrost-trade-core', 'bifrost-trade-worker',
                  'bifrost-trade-api', 'bifrost-trade-frontend', 'bifrost-trade-infra',
                  'bifrost-ui', 'bifrost-platform', 'bifrost-research', 'bifrost-platform-plugin',
                  'bifrost-platform-plugin-market-data', 'bifrost-platform-plugin-flex-query']
      bindings:
        - ref: bifrost-gitea-push
      template:
        ref: bifrost-github-sync-template

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push-infra
  namespace: cicd
spec:
  params:
  - name: revision
    value: $(body.after)
  - name: base
    value: $(body.before)
  - name: purpose
    value: push

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-ci-infra-template
  namespace: cicd
spec:
  params:
  - name: revision
  - name: base
  - name: purpose
  resourcetemplates:
  - apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: ci-infra-
      namespace: cicd
      labels:
        tekton.dev/pipeline: bifrost-ci-infra
        bifrost.io/repo: bifrost-trade-infra
        bifrost.io/purpose: push
        bifrost.io/revision: $(tt.params.revision)
    spec:
      pipelineRef:
        name: bifrost-ci-infra
      params:
      - name: revision
        value: $(tt.params.revision)
      - name: base
        value: $(tt.params.base)
      - name: purpose
        value: $(tt.params.purpose)
      - name: platformRevision
        value: ''
      - name: generation
        value: ''
      taskRunTemplate:
        podTemplate:
          nodeSelector:
            kubernetes.io/arch: amd64
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
      workspaces:
      - name: source
        volumeClaimTemplate:
          spec:
            accessModes:
            - ReadWriteOnce
            storageClassName: local-path
            resources:
              requests:
                storage: 2Gi
