# Tekton Triggers for Bifrost CI gate — Gitea push webhook → CI pipeline.
#
# Flow: Gitea fires a push webhook (any branch; a pull mirror's sync too) → EventListener →
#       CEL filter routes to python-ci, frontend-ci, or platform-ci TriggerTemplate → PipelineRun.
#       A push to a repository Gitea holds as its primary also starts github-sync
#       (a TaskRun that copies main and tags to GitHub; k8s/cicd/github-sync).
#
# PipelineRun TTL: Tekton v1.6 CRD rejects spec.ttlSecondsAfterFinished.
# Finished runs are pruned by k8s/cicd/tekton/pipelinerun-ttl.yaml (7d).
#
# Gitea webhook config (per repo):
#   URL:  http://el-bifrost-ci.cicd.svc.cluster.local:8080
#   Type: application/json
#   Event: Push
#   Secret: (value from gitea-webhook-secret/token, optional)

# --- TriggerBinding: extract repo name + revision from Gitea push payload ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: repo
      value: $(body.repository.name)
    - name: revision
      value: $(body.after)
    - name: ref
      value: $(body.ref)
    - name: clone_url
      value: $(body.repository.clone_url)

---
# --- TriggerBinding: a bifrost-ui push runs the frontend and platform gates against that ui commit ---
# The pushed SHA is bifrost-ui's: it goes to uiRevision, and the frontend under test stays on
# main. Bound as `revision` (the frontend's) it named a commit the frontend repo does not have,
# and every ui push failed the gate at clone (ci-frontend-5jvmh, 2026-10-05).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push-ui
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: revision
      value: main
    - name: uiRevision
      value: $(body.after)

---
# --- TriggerTemplate: Python repos → bifrost-ci-python pipeline ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-ci-python-template
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: repo
    - name: revision
      default: main
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ci-python-$(tt.params.repo)-
        namespace: cicd
        labels:
          tekton.dev/pipeline: bifrost-ci-python
          bifrost.io/trigger: gitea-webhook
          bifrost.io/repo: $(tt.params.repo)
      spec:
        pipelineRef:
          name: bifrost-ci-python
        params:
          - name: repo
            value: $(tt.params.repo)
          - name: revision
            value: $(tt.params.revision)
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 2Gi

---
# --- TriggerTemplate: Frontend repo → bifrost-ci-frontend pipeline ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-ci-frontend-template
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  params:
    - name: revision
      default: main
    - name: uiRevision
      default: main
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ci-frontend-
        namespace: cicd
        labels:
          tekton.dev/pipeline: bifrost-ci-frontend
          bifrost.io/trigger: gitea-webhook
          bifrost.io/repo: bifrost-trade-frontend
      spec:
        pipelineRef:
          name: bifrost-ci-frontend
        params:
          - name: revision
            value: $(tt.params.revision)
          - name: uiRevision
            value: $(tt.params.uiRevision)
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 3Gi

---
# --- TriggerTemplate: Platform repo → bifrost-ci-platform pipeline (L1) ---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-ci-platform-template
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
    bifrost.io/layer: L1
spec:
  params:
    - name: revision
      default: main
    - name: uiRevision
      default: main
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ci-platform-
        namespace: cicd
        labels:
          tekton.dev/pipeline: bifrost-ci-platform
          bifrost.io/trigger: gitea-webhook
          bifrost.io/repo: bifrost-platform
          bifrost.io/layer: L1
      spec:
        pipelineRef:
          name: bifrost-ci-platform
        params:
          - name: revision
            value: $(tt.params.revision)
          - name: uiRevision
            value: $(tt.params.uiRevision)
          # W-31 B5: explicit, not a template param a payload could set.
          - name: repo-url
            value: http://gitea.cicd.svc.cluster.local:3000/bifrost/bifrost-platform.git
        taskRunTemplate:
          podTemplate:
            nodeSelector:
              kubernetes.io/arch: amd64
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 2Gi

---
# --- EventListener: receives Gitea push webhooks, routes by repo name ---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: bifrost-ci
  namespace: cicd
  labels:
    bifrost.io/purpose: ci-trigger
spec:
  serviceAccountName: tekton-trigger
  triggers:
    # TD-435: the listener does not check who posted the body (no webhook secret), so every
    # filter requires a 40-hex `after`: it becomes the pipelines' `revision`, which Task
    # scripts use as $(params.revision). CI does not take the branch name, so a CI trigger
    # does not narrow it (review 546); github-sync passes the ref on and pins it.
    # W-31 3.4 ② (Owner 2026-10-21 「D3 A」): CI runs on every branch push, not only main,
    # so a lane's commit has its CI before it is merged; push-main.sh requires a
    # Succeeded ci-* run for the exact commit it pushes. A push that deletes a branch
    # (after = forty zeros) runs nothing. github-sync below stays main and tags only.
    # L2: Python repos (Trade + Research). code-health Task runs for
    # research + trade-api/core/worker (see pipeline-ci-python when clause).
    - name: python-ci
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name in ['bifrost-trade-core', 'bifrost-trade-api',
                  'bifrost-trade-worker', 'bifrost-research']
            - name: overlays
              value:
                - key: repo_name
                  expression: body.repository.name
      bindings:
        - ref: bifrost-gitea-push
      template:
        ref: bifrost-ci-python-template
    # L2: Frontend repo — the pushed SHA is the frontend's
    - name: frontend-ci
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name == 'bifrost-trade-frontend'
      bindings:
        - ref: bifrost-gitea-push
      template:
        ref: bifrost-ci-frontend-template
    # L2: bifrost-ui — the same frontend gate, frontend on main, ui at the pushed SHA
    - name: frontend-ci-ui
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name == 'bifrost-ui'
      bindings:
        - ref: bifrost-gitea-push-ui
      template:
        ref: bifrost-ci-frontend-template
    - name: infra-ci
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.repository.full_name == 'bifrost/bifrost-trade-infra' &&
                body.ref.startsWith('refs/heads/') &&
                !body.ref.startsWith('refs/heads/land/') &&
                !body.ref.startsWith('refs/heads/agent/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000'
      bindings:
        - ref: bifrost-gitea-push-infra
      template:
        ref: bifrost-ci-infra-template
    # L1: Platform repo (control plane)
    - name: platform-ci
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name == 'bifrost-platform'
      bindings:
        - ref: bifrost-gitea-push
      template:
        ref: bifrost-ci-platform-template
    # L1: bifrost-ui — the Console builds against it too, so a ui push runs the platform
    # gate with platform on main and ui at the pushed SHA (TD-234)
    - name: platform-ci-ui
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.after.matches('^[0-9a-f]{40}$') &&
                body.after != '0000000000000000000000000000000000000000' &&
                body.repository.name == 'bifrost-ui'
      bindings:
        - ref: bifrost-gitea-push-ui
      template:
        ref: bifrost-ci-platform-template
    # CUT-gitea-primary-2026-10-17 step 0e: a push to main or a tag of a repository Gitea holds
    # as its primary is copied to GitHub (Task bifrost-github-sync, k8s/cicd/github-sync). A pull
    # mirror's push (Gitea fetching from GitHub) carries repository.mirror and is not; the Task
    # checks again, and the reconcile CronJob catches a lost webhook. Not a CI run.
    - name: github-sync
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: filter
              value: >-
                !body.repository.mirror &&
                body.after.matches('^[0-9a-f]{40}$') &&
                (body.ref == 'refs/heads/main' || body.ref.matches('^refs/tags/[A-Za-z0-9._/+-]{1,200}$')) &&
                body.repository.name in ['bifrost-trade-core', 'bifrost-trade-worker',
                  'bifrost-trade-api', 'bifrost-trade-frontend', 'bifrost-trade-infra',
                  'bifrost-ui', 'bifrost-platform', 'bifrost-research', 'bifrost-platform-plugin',
                  'bifrost-platform-plugin-market-data', 'bifrost-platform-plugin-flex-query']
      bindings:
        - ref: bifrost-gitea-push
      template:
        ref: bifrost-github-sync-template

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bifrost-gitea-push-infra
  namespace: cicd
spec:
  params:
  - name: revision
    value: $(body.after)
  - name: base
    value: $(body.before)
  - name: purpose
    value: push

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bifrost-ci-infra-template
  namespace: cicd
spec:
  params:
  - name: revision
  - name: base
  - name: purpose
  resourcetemplates:
  - apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: ci-infra-
      namespace: cicd
      labels:
        tekton.dev/pipeline: bifrost-ci-infra
        bifrost.io/repo: bifrost-trade-infra
        bifrost.io/purpose: push
        bifrost.io/revision: $(tt.params.revision)
    spec:
      pipelineRef:
        name: bifrost-ci-infra
      params:
      - name: revision
        value: $(tt.params.revision)
      - name: base
        value: $(tt.params.base)
      - name: purpose
        value: $(tt.params.purpose)
      - name: platformRevision
        value: ''
      - name: generation
        value: ''
      taskRunTemplate:
        podTemplate:
          nodeSelector:
            kubernetes.io/arch: amd64
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
      workspaces:
      - name: source
        volumeClaimTemplate:
          spec:
            accessModes:
            - ReadWriteOnce
            storageClassName: local-path
            resources:
              requests:
                storage: 2Gi
