# Scrape platform-api's /metrics in both platform namespaces (prod and stg).
#
# platform-api reports how the plugins under Trade are doing — market-data,
# flex-query, ib-gateway, research — from the same probes its
# /api/v1/plugins/*/status endpoints already run. The bifrost-platform-plugins
# alert group reads these series.
#
# Before this existed the plugins had no alerting at all: on 2026-09-07 the IB
# gateway could not reach TWS for seventeen hours while its pod stayed 1/1
# Running, so nothing derived from Kubernetes fired and no Bifrost rule covered
# it.
#
# STG is scraped too (TD-198), so a broken STG platform-api shows up as a
# down target and, once it exports http_requests_total, in the API error-rate
# and latency rules under its own namespace. Both namespaces probe the same
# plugin instances, so the bifrost-platform-plugins rules aggregate without
# namespace (max / min, as they already did across replicas) and a plugin
# outage still pages once.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bifrost-platform-api
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: control-plane
spec:
  namespaceSelector:
    matchNames:
      - bifrost-platform-prod
      - bifrost-platform-stg
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  endpoints:
    - port: http
      path: /metrics
      # The handler probes four plugins live and caps itself at 8s.
      interval: 60s
      scrapeTimeout: 20s
