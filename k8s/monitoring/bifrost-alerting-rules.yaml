# Bifrost Trade stack alerting rules — routed to bifrost-ops-agent webhook receiver.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bifrost-alerting-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: alerting
spec:
  groups:
    - name: bifrost-trade
      rules:
        - alert: BifrostAPICrashLooping
          expr: |
            kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",namespace=~"bifrost-.*"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Bifrost API pod crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff."

        - alert: BifrostAPIHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{namespace=~"bifrost-.*",status="5xx"}[5m])) by (namespace, service)
              /
              sum(rate(http_requests_total{namespace=~"bifrost-.*"}[5m])) by (namespace, service)
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Bifrost API high 5xx error rate"
            description: "Service {{ $labels.service }} in {{ $labels.namespace }} has 5xx rate above 5%."

        - alert: BifrostAPIHighLatency
          expr: |
            histogram_quantile(
              0.99,
              sum(rate(http_request_duration_seconds_bucket{namespace=~"bifrost-.*"}[5m])) by (le, namespace, service)
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Bifrost API high P99 latency"
            description: "Service {{ $labels.service }} in {{ $labels.namespace }} P99 latency exceeds 2s."

        - alert: BifrostRedisDown
          expr: |
            up{namespace="data", job=~".*redis.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redis exporter target down"
            description: "Redis metrics target {{ $labels.job }} is down."

        - alert: BifrostPostgresReplicationLag
          expr: |
            cnpg_pg_stat_replication_replay_lag_seconds{namespace="data"} > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL replication lag high"
            description: "CNPG pod {{ $labels.pod }} replication replay lag exceeds 30s."

        - alert: BifrostPostgresHighConnections
          expr: |
            sum(cnpg_backends_total{namespace="data"}) by (pod) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection count high"
            description: "CNPG pod {{ $labels.pod }} has more than 80 backends."

        # Capacity. Postgres had replication lag, connections and instance
        # presence and nothing about running out of room, which is the failure
        # that ends with writes rejected rather than slowed.
        #
        # The real ceiling is the node's root partition, not the CNPG
        # `spec.storage: 30Gi`: local-path is a hostPath provisioner with
        # allowVolumeExpansion off, and it does not enforce that number. For the
        # same reason `kubelet_volume_stats_*` reports the whole partition rather
        # than this PVC, so reading it as "how full is the database volume" is
        # wrong by two orders of magnitude.
        #
        # 50 GB rather than the kube-prometheus-stack default's 5% (25 GB of
        # 500 GB): measured 2026-09-25, free space on these two moves tens of GB
        # in a day from build workspaces and image layers while the database
        # itself grows about 0.3 GB, so 25 GB is inside one day's noise.
        - alert: BifrostPostgresNodeDiskLow
          expr: |
            node_filesystem_avail_bytes{mountpoint="/", instance=~"192.168.10.(70|75):9100"} < 50e9
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Postgres node root partition low"
            description: >-
              {{ $labels.instance }} has {{ $value | humanize1024 }}B free on /.
              This is the real limit for bifrost_golden_source: its local-path
              volume is not capped at the 30Gi written on the CNPG cluster.

        # One series, not one per pod. The metric is reported by the primary and
        # every replica, so the bare `delta()` would emit a result per pod and
        # extrapolate wildly for any pod younger than the window — a replica
        # rebuilt this week would read as the whole database appearing at once.
        #
        # 8 GB, not 3: measured 2026-09-25 the real 7-day delta was 3.01 GB
        # (1.5 GB of it that day alone, from the canonical PnL rewrite and the
        # IV history purge), so 3 GB is this week's normal and an alert set there
        # would fire on the day it was installed. 8 GB is about 2.7x a busy week
        # and still leaves months of warning before the disk rule above.
        - alert: BifrostPostgresDatabaseGrowth
          expr: |
            delta(max(cnpg_pg_database_size_bytes{namespace="data", datname="bifrost_golden_source"})[7d:1h]) > 8e9
          labels:
            severity: warning
          annotations:
            summary: "Golden Source grew unusually fast"
            description: >-
              bifrost_golden_source grew {{ $value | humanize1024 }}B in seven
              days. Check the plugin trim slot ran, and whether a backfill or a
              nightly rewrite is landing more than it retires.

        # WAL shares the data volume — there is no separate `walStorage` — so
        # anything that stops WAL being recycled eats the same space the database
        # does. NOT `cnpg_collector_pg_wal`: that series is scraped every 30s and
        # every sample is NaN, verified 2026-09-25 (count_over_time returns 2880
        # over a day while max_over_time returns nothing), so a threshold on it
        # would have been an alert that could never fire — worse than none,
        # because it reads as coverage.
        #
        # These two are the actual ways WAL accumulates, and both carry real
        # values: archiving stopped, or a slot holding segments for a replica
        # that has fallen behind.
        - alert: BifrostPostgresWalArchiveStalled
          expr: |
            cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="data"} > 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL WAL archiving stalled"
            description: >-
              {{ $labels.pod }} last archived a WAL segment
              {{ $value | humanizeDuration }} ago. WAL is on the data volume, so
              unarchived segments accumulate against the same free space.

        - alert: BifrostPostgresWalRetainedBySlot
          expr: |
            cnpg_pg_replication_slots_pg_wal_lsn_diff{namespace="data"} > 5e9
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Replication slot retaining WAL"
            description: >-
              Slot {{ $labels.slot_name }} on {{ $labels.pod }} is holding
              {{ $value | humanize1024 }}B of WAL. Postgres cannot recycle it
              while the slot lags.

        # Base backups. The 2026-10-03 daily backup failed (barman
        # CompleteMultipartUpload InvalidPart) and nothing alerted. CNPG moves
        # cnpg_collector_last_available_backup_timestamp at the end of every
        # backup, failed ones included (10-03: available 04:16:58, failed
        # 04:17:00), so it only says a backup ran. A failure shows as a
        # last_failed within minutes of last_available; the next successful
        # backup moves last_available hours ahead and resolves it. Replicas
        # export 0 for both, hence the > 0 guard.
        - alert: BifrostPostgresBackupFailed
          expr: |
            cnpg_collector_last_failed_backup_timestamp{namespace="data"} > 0
            and
            cnpg_collector_last_failed_backup_timestamp{namespace="data"}
              > cnpg_collector_last_available_backup_timestamp{namespace="data"} - 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL base backup failed"
            description: >-
              The most recent base backup reported by {{ $labels.pod }} failed.
              WAL archiving is separate, so point-in-time recovery still works
              from the previous base backup, with more WAL to replay. Check the
              Backup CRs in namespace data.

        - alert: BifrostPostgresBackupMissing
          expr: |
            time() - max(cnpg_collector_last_available_backup_timestamp{namespace="data"}) > 93600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No PostgreSQL base backup has run for 26 hours"
            description: >-
              The last base backup ended {{ $value | humanizeDuration }} ago. The
              daily ScheduledBackup runs at 03:00 UTC; it needs the CNPG operator
              (cnpg-system) to be up at that time.

        # Logical dump of hand-entered data (k8s/data/logical-backup, phase 0 W5).
        # Separate from the Barman backup above: it is the table-level copy on
        # the NAS that survives a broken CNPG / MinIO.
        - alert: BifrostLogicalBackupMissing
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="data",cronjob="logical-backup"}) > 93600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No successful logical backup of hand-entered data for 26 hours"
            description: >-
              CronJob data/logical-backup last succeeded {{ $value | humanizeDuration }} ago
              (it runs 04:30 UTC). A run that dumped some targets but not others
              still fails; read `kubectl -n data logs job/<latest logical-backup job>`
              and the STATUS file of the newest daily/ folder on k3s-hot.

        - alert: BifrostLogicalBackupDrillStale
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="data",cronjob="logical-backup-drill"}) > 3024000
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Monthly restore drill has not passed for 35 days"
            description: >-
              The restore drill (CronJob data/logical-backup-drill, 1st of the month
              06:00 UTC) last passed {{ $value | humanizeDuration }} ago. Its reports
              are under drills/ in the logical-backup-hot folder on k3s-hot.

    # Elastic / WOL standby — marker for Alertmanager inhibit (no GPU/warehouse demand).
    # Does NOT fire when ai/ollama or data-warehouse/minio want replicas > 0.
    - name: bifrost-elastic-standby
      rules:
        # Prefer kube_node_labels{label_bifrost_io_wol="enabled"} when KSM
        # metricLabelsAllowlist exposes it. Bootstrap clusters often omit
        # kube_node_labels entirely — fall back to known WOL elastic node
        # (gpu-server) via kube_node_info so inhibit/FE marker can fire.
        - alert: BifrostElasticStandbyMarker
          expr: |
            (
              (
                max by (node) (kube_node_labels{label_bifrost_io_wol="enabled"})
                or
                max by (node) (kube_node_info{node="gpu-server"})
              )
              and on (node)
              (
                max by (node) (kube_node_status_condition{condition="Ready",status="true"}) == bool 0
              )
            )
            unless on ()
            (
              (
                max(kube_deployment_spec_replicas{namespace="ai",deployment="ollama"}) > 0
              )
              or
              (
                max(kube_deployment_spec_replicas{namespace="data-warehouse",deployment="minio"}) > 0
              )
            )
          for: 2m
          labels:
            severity: info
            elastic_standby: "true"
          annotations:
            summary: "Elastic node {{ $labels.node }} standby (no demand)"
            description: "Node {{ $labels.node }} is NotReady with no GPU/warehouse demand — expected elastic standby (WOL). Console Observability also neutralizes related TargetDown/DaemonSet noise via FE standbyNodes."

    # ── Infrastructure that Prod depends on ────────────────────────────────
    #
    # The stock KubeNodeNotReady / KubeNodeUnreachable alerts fire correctly,
    # but Alertmanager routes only `alertname=~"Bifrost.*"` to the ops-agent
    # webhook; everything else falls through to the `default` receiver, which
    # has no configs and drops it. On 2026-09-06 a Prod node died at 00:43Z and
    # nothing reached a human for five hours because of exactly that. These
    # rules restate the same conditions under a Bifrost name so they take the
    # delivered route. They deliberately re-use the elastic-standby inhibit
    # label so a sleeping WOL node stays quiet.
    - name: bifrost-infrastructure
      rules:
        - alert: BifrostClusterNodeDown
          expr: |
            (
              max by (node) (kube_node_status_condition{condition="Ready",status="true"}) == 0
            )
            unless on (node)
            (
              max by (node) (kube_node_labels{label_bifrost_io_wol="enabled"})
              or
              max by (node) (kube_node_info{node="gpu-server"})
            )
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Cluster node {{ $labels.node }} is down"
            description: "Node {{ $labels.node }} has been NotReady for more than 3 minutes and is not the elastic WOL standby. Workloads pinned or scheduled there cannot run until it returns."

        - alert: BifrostProdWorkloadUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="bifrost-prod"} == 0
            and
            kube_deployment_spec_replicas{namespace="bifrost-prod"} > 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Prod deployment {{ $labels.deployment }} has no available replica"
            description: "bifrost-prod/{{ $labels.deployment }} wants {{ $value }} replica(s) and has none available — the Prod surface it serves is down."

        - alert: BifrostProdPodsUnschedulable
          expr: |
            count by (namespace) (
              kube_pod_status_scheduled{namespace="bifrost-prod",condition="false"} == 1
            ) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Prod pods cannot be scheduled"
            description: "{{ $value }} pod(s) in bifrost-prod have been unschedulable for 5 minutes — usually the node they are pinned to is gone, or the cluster has no node matching their placement rules."

        - alert: BifrostPostgresInstanceMissing
          expr: |
            cnpg_pg_replication_streaming_replicas < cnpg_pg_replication_expected_replicas
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Postgres cluster is short a streaming replica"
            description: "The CloudNativePG cluster has fewer streaming replicas than expected for 10 minutes — HA is degraded and a primary loss would mean downtime."

    # IB Flex ingest (plugin-flex-query). Every scheduled run from 2026-08-30 to
    # 09-05 failed and nobody was told: the Dagster asset only confirms the
    # enqueue and the plugin exported nothing. These read the plugin's /metrics.
    - name: bifrost-flex-ingest
      rules:
        - alert: BifrostFlexIngestFailed
          expr: |
            bifrost_flex_ingest_last_job_status{status="failed"} == 1
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Flex ingest {{ $labels.kind }} failed for good"
            description: "The newest {{ $labels.kind }} job ended failed (deferred retries exhausted or a config error such as an expired token). Check Ops Console → IB Flex → Ingest, then the error category on the job."

        - alert: BifrostFlexIngestMissedPlan
          expr: |
            (
              label_replace(bifrost_flex_planned_last_timestamp_seconds, "kind", "$1", "slot", "(.*)")
                > on (kind) bifrost_flex_ingest_last_success_timestamp_seconds
            )
            and on (kind)
            (
              time() - label_replace(bifrost_flex_planned_last_timestamp_seconds, "kind", "$1", "slot", "(.*)") > 6 * 3600
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Flex ingest {{ $labels.kind }} has not succeeded since its planned run"
            description: "The 06:30 America/New_York slot for {{ $labels.kind }} passed more than 6h ago without a completed run — Dagster research_flex_morning_schedule did not enqueue, or the job is still being deferred by IB."

        - alert: BifrostFlexIngestStale
          expr: |
            (time() - bifrost_flex_ingest_last_success_timestamp_seconds) > 96 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Flex ingest {{ $labels.kind }} stale for 4 days"
            description: "No completed {{ $labels.kind }} run in 96h (a Saturday run keeps Monday night under the limit). The Research husbandry gate blocks dbt on the same rule."

        # TD-88: raw_broker.transactions lost 2025-03 and 2026-03..07 while every run said ok
        # (fixed window, no catch-up). flex-query 0.10.0 exports, per account, the closed months
        # that have executions but no cash transactions; 0 since the 2026-10-06 backfill.
        - alert: BifrostFlexCashCoverageGap
          expr: |
            max by (account) (bifrost_flex_coverage_gap_months) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Flex cash transactions missing for {{ $value }} month(s) on {{ $labels.account }}"
            description: "A closed month has Flex executions but no raw_broker.transactions rows, so fees, dividends and interest are missing from Transfer & Pay and net cash flow. GET /flex/ops/check (coverage) lists the months; backfill with a flex-transactions job carrying from_date/to_date."

        - alert: BifrostFlexIngestScrapeDown
          expr: |
            up{job="flex-query-api"} == 0 or absent(up{job="flex-query-api"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Flex plugin /metrics not being scraped"
            description: "Prometheus cannot reach flex-query-api in plugin-flex-query; the other Flex alerts are blind while this fires."

        - alert: BifrostFlexWorkerDown
          expr: |
            kube_deployment_status_replicas_available{namespace="plugin-flex-query",deployment="flex-query-worker"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Flex worker has no available replica"
            description: "flex-query-worker in plugin-flex-query is not running; queued Flex jobs will not be claimed."

        - alert: BifrostFlexWorkerSilent
          expr: |
            (time() - bifrost_flex_worker_last_seen_timestamp_seconds) > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Flex worker stopped reporting in"
            description: "flex-query-worker has not written its heartbeat (ops_jobs.flex_worker_heartbeat) for {{ $value | humanizeDuration }} — the pod may be up but its loop stuck or unable to reach Postgres. The Console Self-check shows the same signal."

        - alert: BifrostFlexTokenMissing
          expr: |
            sum(bifrost_flex_token_configured) == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "No IB Flex token configured"
            description: "Secret bifrost-flex-tokens carries no FLEX_HOST_TOKEN / FLEX_SECONDARY_TOKEN; run make sync-flex-tokens in bifrost-trade-infra."

        - alert: BifrostFlexTokenExpiring
          expr: |
            bifrost_flex_token_age_seconds > 335 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "IB Flex tokens are {{ $value | humanizeDuration }} old"
            description: "IB expires Flex tokens after a year ([1012]). Generate new ones in IB Account Management and run make sync-flex-tokens (sets FLEX_TOKENS_ISSUED_AT)."

    # Massive market data (plugin-market-data). Same gap as Flex: a Dagster run
    # confirms only an enqueue, and the plugin exported nothing, so a slot that
    # never fired or a partial pull surfaced as a stale panel someone opened.
    # These read the plugin's /metrics — the doctor's own conclusion, which is
    # already session- and holiday-aware; no rule here re-derives a deadline.
    - name: bifrost-market-data
      rules:
        - alert: BifrostMarketDataCritical
          # 3h: the EOD chain drains past midnight UTC and the 00:45 self-heal
          # gets its turn; still critical at ~02:30 is when the Research
          # trading-day gate would block on it.
          expr: |
            bifrost_market_data_doctor_finding{severity="crit"} == 1
          for: 3h
          labels:
            severity: critical
          annotations:
            summary: "Market data: {{ $labels.title }} ({{ $labels.id }})"
            description: "The market-data doctor has held {{ $labels.id }} critical for 3h, through the self-heal. Ops Console → Massive → Doctor has the detail and prescription; slot {{ $labels.slot }}."

        - alert: BifrostMarketDataWarningLingering
          # Both nightly heals (00:45, 05:30 UTC) have had a go by 26h.
          expr: |
            bifrost_market_data_doctor_finding{severity="warn"} == 1
          for: 26h
          labels:
            severity: warning
          annotations:
            summary: "Market data: {{ $labels.title }} ({{ $labels.id }}) for a day"
            description: "{{ $labels.id }} has been a warning for 26h and neither self-heal cleared it; slot {{ $labels.slot }}. A narrow or short session the heal cannot refill is lost after the vendor moves on."

        - alert: BifrostMarketDataDoctorStale
          expr: |
            (time() - bifrost_market_data_doctor_report_timestamp_seconds) > 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Market data doctor has not completed a report in over an hour"
            description: "The served report is {{ $value | humanizeDuration }} old. The doctor recomputes every ten minutes behind each read, so the API cannot reach Postgres or the doctor is raising; every other market-data alert is blind while this fires."

        - alert: BifrostMarketDataScrapeDown
          expr: |
            up{job="market-data-api"} == 0 or absent(up{job="market-data-api"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Market data plugin /metrics not being scraped"
            description: "Prometheus cannot reach market-data-api in plugin-market-data; the other market-data alerts are blind while this fires."

        - alert: BifrostMarketDataWorkersDown
          expr: |
            kube_deployment_status_replicas_available{namespace="plugin-market-data",deployment=~"polygon-worker-.*"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Market data {{ $labels.deployment }} has no available replica"
            description: "{{ $labels.deployment }} in plugin-market-data is not running; its queued ingest jobs will not be claimed."


    # The plugins Trade runs on had no alerting until now. On 2026-09-07 the IB
    # gateway could not reach TWS for 17.5 hours — 1876 failed connects — and
    # nothing fired: the pod stayed 1/1 Running because it retried in a loop, so
    # every generic Kubernetes rule stayed quiet, and the gateway's own health
    # never reached Prometheus. Series come from platform-api /metrics.
    - name: bifrost-platform-plugins
      rules:
        - alert: BifrostIBGatewayDisconnected
          # platform-api runs two replicas and each publishes the same plugin
          # state, so the raw series would alert once per pod for one outage.
          # max: fire only when no replica sees the slot connected.
          expr: |
            max by (slot) (bifrost_ib_gateway_slot_connected) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "IB gateway slot {{ $labels.slot }} has no TWS session"
            description: "The {{ $labels.slot }} slot has held no live TWS session for 15m. Positions, account values and live streams all stop behind this. Check the ib-gateway pod logs in the data namespace for repeated 'API connection failed' against the Windows TWS host, then Ops Console → IB Gateway."

        - alert: BifrostIBGatewayIngestSilent
          expr: |
            min (bifrost_ib_gateway_ingest_last_msg_age_seconds) > 1800
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "IB market ingest silent for {{ $value | humanizeDuration }}"
            description: "The gateway holds a session but has received no message for over 30m. Outside market hours this is expected; during a session it means the subscription died without the connection dropping."

        - alert: BifrostIBGatewayOptCacheStalled
          # The heartbeat advances every loop iteration whether or not the host slot
          # is up, so no slot condition. max: collapse duplicate platform-api scrapes.
          # Absent until ib-gateway 0.2.5 + the platform-api that exports it.
          expr: |
            max(bifrost_ib_gateway_opt_cache_progress_age_seconds) > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "IB gateway option quote cache loop stalled for {{ $value | humanizeDuration }}"
            description: "The gateway's one-shot option quote loop has made no progress, so ib:option:cache:* is no longer refreshed and Trade's option quotes go missing after their 300s TTL. On 2026-09-28 this happened silently in a 20-day-old pod with both slots connected. The pod logs 'opt cache loop has made no progress'; restarting the ib-gateway Deployment clears it."

        - alert: BifrostPluginUnreachable
          # max: one replica timing out on a slow probe is not an outage; all
          # of them failing is.
          expr: |
            max by (plugin) (bifrost_plugin_reachable) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Platform plugin {{ $labels.plugin }} is unreachable"
            description: "platform-api could not reach {{ $labels.plugin }} for 15m. The Trade cockpit's footer panel shows the same reachability with the plugin's own summary line."

        - alert: BifrostPluginDegraded
          # min: every replica agrees it is degraded.
          expr: |
            min by (plugin) (bifrost_plugin_reachability{state="degraded"}) == 1
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Platform plugin {{ $labels.plugin }} degraded for 2h"
            description: "{{ $labels.plugin }} answers but reports degraded — for market-data this is usually stale freshness on part of the universe. Long window on purpose: degraded is common and self-clearing, and a short one would join the alerts that have been firing since August."

    - name: bifrost-logging
      rules:
        - alert: BifrostPromtailDroppingLogs
          # No `for`: a dropped entry is gone, waiting adds nothing. increase() over
          # 15m keeps it firing for 15m after the last drop.
          expr: |
            (sum by (namespace, pod, reason) (increase(promtail_dropped_entries_total[15m])) > 0)
              * on (namespace, pod) group_left (node)
                max by (namespace, pod, node) (kube_pod_info{namespace="monitoring"})
          labels:
            severity: warning
          annotations:
            summary: "Promtail on {{ $labels.node }} dropped {{ $value | humanize }} log lines ({{ $labels.reason }})"
            description: "Those lines never reached Loki and cannot be recovered. ingester_error means pushes kept failing until retries ran out, usually because loki-0 was NotReady (the loki Service had no endpoints); check loki-0 readiness and memory against its 1Gi limit. Until 2026-09-28 this happened silently, about 1.9M lines in total."

        - alert: BifrostPromtailScrapeDown
          expr: |
            up{job="monitoring/promtail"} == 0 or absent(up{job="monitoring/promtail"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Promtail {{ $labels.pod }} /metrics not being scraped"
            description: "BifrostPromtailDroppingLogs is blind for that node while this fires. On 2026-09-28 the ubt-k3s-04 promtail was CPU-throttled 99% at a 500m limit and its /metrics timed out."

    - name: bifrost-gateway
      rules:
        # 404s Traefik answered itself because no router matched, per trade entrypoint (cumulative).
        # Every trade-* entrypoint is bound only by its namespace's IngressRoute trade-gateway-ip, whose
        # services are all named bifrost-<env>-trade-gateway-ip-<sha256(match)[:20]>; the entrypoint
        # counter counts router misses too, the service counter only what a backend answered.
        # Raw counters, not increase(): a service series seen for the first time then still counts its
        # first 404. A Traefik restart resets both sides, so the difference only drops.
        - record: bifrost:traefik_route_miss_404:total
          expr: |
            sum by (entrypoint) (traefik_entrypoint_requests_total{entrypoint=~"trade-(stg|prod|dev)",code="404"})
            - (
                sum by (entrypoint) (
                  label_replace(
                    traefik_service_requests_total{code="404",service=~"bifrost-(stg|prod|dev)-trade-gateway-ip-.*"},
                    "entrypoint", "trade-$1", "service", "bifrost-(stg|prod|dev)-trade-gateway-ip-.*"
                  )
                )
                or on (entrypoint)
                0 * sum by (entrypoint) (traefik_entrypoint_requests_total{entrypoint=~"trade-(stg|prod|dev)",code="404"})
              )

        - alert: BifrostTraefikRouteMiss404
          # STG/PROD only: DEV's gateway-ip routes change with day-to-day work. No `for`: a miss is a
          # served error already; the 5m offset keeps it firing ~5m after the last one.
          expr: |
            (
              bifrost:traefik_route_miss_404:total{entrypoint=~"trade-(stg|prod)"}
              - bifrost:traefik_route_miss_404:total{entrypoint=~"trade-(stg|prod)"} offset 5m
            ) > 0.5
          labels:
            severity: warning
          annotations:
            summary: "Traefik {{ $labels.entrypoint }}: {{ $value | humanize }} requests in 5m matched no router (404 from the gateway itself)"
            description: "Requests on {{ $labels.entrypoint }} got Traefik's own 404 because no router matched, so they never reached an API pod. Check IngressRoute trade-gateway-ip and its Middlewares in that namespace (a missing Middleware drops the whole router and Traefik logs an ERROR) and the Traefik pod log. Backends with no endpoints answer 503, not 404 (allowEmptyServices). Known false positive: a service series Traefik expires after its route was removed or renamed shrinks the subtraction. From 2026-09-06 to 2026-10-03 the count was 0 on both entrypoints."

        # 503s Traefik answered itself because the backend had no server to pick, per trade entrypoint
        # (cumulative). The load balancer writes "no available server" (20 bytes) when the Service has no
        # serving endpoint (allowEmptyServices=true) or every endpoint is terminating, and Traefik wraps
        # the service metrics handler around each server, so these never reach the service counter; a
        # backend's own 503 does. The `or` on the entrypoint side keeps the series at 0 until the first
        # 503, so the first burst after a Traefik restart still shows as a step.
        - record: bifrost:traefik_empty_backend_503:total
          expr: |
            (
              sum by (entrypoint) (traefik_entrypoint_requests_total{entrypoint=~"trade-(stg|prod|dev)",code="503"})
              or on (entrypoint)
              0 * sum by (entrypoint) (traefik_entrypoint_requests_total{entrypoint=~"trade-(stg|prod|dev)"})
            )
            - (
                sum by (entrypoint) (
                  label_replace(
                    traefik_service_requests_total{code="503",service=~"bifrost-(stg|prod|dev)-trade-gateway-ip-.*"},
                    "entrypoint", "trade-$1", "service", "bifrost-(stg|prod|dev)-trade-gateway-ip-.*"
                  )
                )
                or on (entrypoint)
                0 * sum by (entrypoint) (traefik_entrypoint_requests_total{entrypoint=~"trade-(stg|prod|dev)"})
              )

        - alert: BifrostTraefikNoBackend503
          # STG/PROD only. The platform probe hits each gateway route about every 18s, so one route with
          # no backend for 5 minutes is ~17 of these; > 5 ignores a single pod swap. No `for`, as with 404.
          expr: |
            (
              bifrost:traefik_empty_backend_503:total{entrypoint=~"trade-(stg|prod)"}
              - bifrost:traefik_empty_backend_503:total{entrypoint=~"trade-(stg|prod)"} offset 5m
            ) > 5
          labels:
            severity: critical
          annotations:
            summary: "Traefik {{ $labels.entrypoint }}: {{ $value | humanize }} requests in 5m got 503 because a backend had no ready pod"
            description: "Traefik answered these itself (\"no available server\"): the Service behind the route had no serving endpoint, or all of them were terminating. Find the route in the Traefik access log (Loki {namespace=\"kube-system\",pod=~\"traefik-.*\"} | json | DownstreamStatus=\"503\", fields RouterName / ServiceName), then check that Deployment's ready replicas. The research-api, market-data-api and flex-query-api Deployments use strategy Recreate, so every release of them empties /api/plugin/* for a while. On 2026-09-06 the node all of Prod was pinned to went down and this count reached 45,041 over about five hours with nobody told. A Traefik restart resets its counters, so the difference drops and the alert can miss 503s for the next 5 minutes."

        - alert: BifrostTraefikScrapeDown
          expr: |
            up{job="monitoring/traefik"} == 0 or absent(up{job="monitoring/traefik"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Traefik /metrics not being scraped"
            description: "BifrostTraefikRouteMiss404 is blind while this fires. Traefik serves metrics on its metrics entrypoint (:9100) in kube-system; the PodMonitor is monitoring/traefik."
