# Prometheus Operator scrape configs — always namespace: monitoring (not transformed by trade overlays).
# Not under Argo: apply with `make k3s-apply-monitoring-scrape`. Each file also carries the namespace and
# the labels below itself, so a single-file `kubectl apply -f` yields the same object (without them it
# landed in `default`, or stripped `release` — and Prometheus silently dropped the rules).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - bifrost-trade-apis.yaml
  - bifrost-trade-daemon.yaml
  - bifrost-redis.yaml
  - bifrost-postgres.yaml
  - bifrost-minio-nas.yaml
  - bifrost-flex-query.yaml
  - bifrost-market-data.yaml
  - bifrost-research.yaml
  - bifrost-platform-api.yaml
  - bifrost-platform-workers.yaml
  - promtail.yaml
  - traefik.yaml
  - bifrost-alerting-rules.yaml
  - bifrost-db-role-matrix.yaml
  # td-d2-postgres-rules.yaml stays out of this kustomization: BifrostPostgresWalDailyHigh
  # waits until a full day has passed under the TD-134 parameters.
  # The recovery-drill alert does not wait on that rule (TD-258).
  - bifrost-postgres-recovery-drill-rules.yaml
  - bifrost-cluster-state-rules.yaml
  - bifrost-maintainer-rules.yaml
  - maintainer-reconcile
  # Secret alertmanager-webhook-auth (PROD reporter bearer for the platform-api
  # webhook) is not here: scripts/k3s/apply-platform-role-tokens.sh writes it.
  - alertmanager-webhook-network-policy.yaml
  - grafana-dashboards-configmap.yaml
  - grafana-dashboard-data-layer.yaml
  - grafana-dashboard-ib-gateway.yaml
  - grafana-dashboard-agent-operations.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: bifrost
      release: kube-prometheus-stack
    includeSelectors: false
