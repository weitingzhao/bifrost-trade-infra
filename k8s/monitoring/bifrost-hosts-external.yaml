# Hosts outside the cluster (W-68 B4 ①): ubt-k3s-06 (agent host, Ubuntu 24.04, systemd),
# the NAS (UGOS / Debian 12, Docker) and the two Mac minis (macOS 26, launchd user job).
# Each runs node_exporter on :9100 at the cluster DaemonSet's version; 06 and the NAS also
# run smartctl_exporter on :9633. What runs on each host and how it got there:
# scripts/host-exporters/ and agent-config/work/multi-agent/OWNER-STEPS-w68-b4-2026-10-24.md.
#
# Static targets, like bifrost-minio-nas.yaml: no Kubernetes object stands behind them.
# jobName node-exporter on purpose: the chart's node-exporter alerts (filesystem space,
# NodeRAIDDegraded / NodeRAIDDiskFailure, clock) and the stock dashboards "Node Exporter /
# Nodes" and "Node Exporter / MacOS" select job="node-exporter", so these hosts join them
# without a copy. scope="external" keeps them apart from the DaemonSet's targets:
# BifrostHostDown (bifrost-host-rules.yaml) looks only at scope="external", because cluster
# nodes already have KubeNodeNotReady. host is the name the alerts and the Bifrost Hosts
# dashboard print.
#
# Reachability: all four sit in 192.168.10.0/24 with the cluster nodes, and pod traffic
# leaves through the node's address, so no UniFi zone rule is involved (the NAS's MinIO
# on :9000 is scraped the same way). None of the four hosts filters inbound traffic today.
#
# Not under Argo. Apply this file on its own (OWNER-STEPS step 5).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: bifrost-hosts-node
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: hosts
spec:
  jobName: node-exporter
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets:
        - 192.168.10.79:9100
      labels:
        scope: external
        host: agent-06
    - targets:
        - 192.168.10.20:9100
      labels:
        scope: external
        host: nas
    - targets:
        - 192.168.10.50:9100
      labels:
        scope: external
        host: mini-50
    - targets:
        - 192.168.10.52:9100
      labels:
        scope: external
        host: mini-52
---
# SMART for the disks of 06 (one SATA SSD) and the NAS (three 12 TB SATA disks in RAID 5;
# the M.2 SSD joins by itself once fitted). The exporter refreshes every 60s, so a faster
# scrape gains nothing. The Mac minis have one soldered SSD each and no exporter here.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: bifrost-hosts-smartctl
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: hosts
spec:
  jobName: smartctl
  scrapeInterval: 60s
  scrapeTimeout: 30s
  staticConfigs:
    - targets:
        - 192.168.10.79:9633
      labels:
        scope: external
        host: agent-06
    - targets:
        - 192.168.10.20:9633
      labels:
        scope: external
        host: nas
