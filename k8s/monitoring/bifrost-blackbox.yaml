# Gitea availability probe (W-68 B4 ①): "Gitea 不可用也有告警".
#
# Gitea is the primary Git since 2026-10-17 (CUT-gitea-primary): CI, Argo CD and the two
# agentd on 06 all depend on it, and it runs as one pod on ubt-k3s-01 (local-path volume).
# Nothing measured it: /metrics is off (404), and kube-state-metrics only knows what the
# API server on that same node last said. So a blackbox_exporter probes the two addresses
# Gitea is used through, every 30s:
#   via=nodeport  http://192.168.10.73:30300/api/healthz   (06's agentd, people, the Mac)
#   via=service   http://gitea.cicd.svc.cluster.local:3000/api/healthz   (CI, Argo CD)
# /api/healthz answers 200 when Gitea and its database answer, and 500 when a check
# fails. Alerts: BifrostGiteaUnavailable / BifrostGiteaProbeDown in bifrost-host-rules.yaml.
#
# The prober prefers a node other than the control plane, so losing ubt-k3s-01 does not
# take the prober down with Gitea. Image pinned by digest (quay.io manifest list, read
# 2026-10-24); v0.28.0 (2025-12-06) rather than 0.29.x (October 2026, days old).
# A change to the ConfigMap needs a rollout restart of the Deployment to take effect.
#
# Not under Argo. Apply this file on its own (OWNER-STEPS step 5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/name: bifrost-blackbox-exporter
    app.kubernetes.io/component: probe
data:
  blackbox.yml: |
    modules:
      gitea_healthz:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_status_codes: [200]
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
          follow_redirects: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/name: bifrost-blackbox-exporter
    app.kubernetes.io/component: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-blackbox-exporter
        app.kubernetes.io/part-of: bifrost
        app.kubernetes.io/component: probe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          args:
            - --config.file=/etc/blackbox/blackbox.yml
            - --web.listen-address=:9115
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: bifrost-blackbox-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: bifrost-blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/name: bifrost-blackbox-exporter
    app.kubernetes.io/component: probe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bifrost-blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
# Each target is a URL; Prometheus asks the prober to fetch it (?module=…&target=…).
# instance becomes the URL, via says which path it is.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: bifrost-gitea-probe
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: probe
spec:
  jobName: gitea-probe
  scrapeInterval: 30s
  scrapeTimeout: 10s
  metricsPath: /probe
  params:
    module:
      - gitea_healthz
  staticConfigs:
    - targets:
        - http://192.168.10.73:30300/api/healthz
      labels:
        via: nodeport
    - targets:
        - http://gitea.cicd.svc.cluster.local:3000/api/healthz
      labels:
        via: service
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: bifrost-blackbox-exporter.monitoring.svc:9115
