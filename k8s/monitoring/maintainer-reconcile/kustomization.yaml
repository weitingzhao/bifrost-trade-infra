apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# The ConfigMap is in config/ (applied on its own when only it changes).
resources:
  - cronjob.yaml
  - config

labels:
  - pairs:
      app.kubernetes.io/name: maintainer-reconcile
      app.kubernetes.io/part-of: bifrost
    includeSelectors: false
