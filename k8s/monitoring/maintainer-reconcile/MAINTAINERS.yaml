    what: "Queue poll every 5s plus a catch-up that enqueues a missed flex slot after catchup_grace_sec. The planned fire is Dagster research_flex_morning_schedule; schedule.yaml is the slot table the catch-up reads."
    runs_on: cluster:plugin-flex-query/flex-query-worker
    schedule: "poll 5s; catch-up against 30 6 * * 1-6 America/New_York"
    env: prod
    max_tier: B
    detected_by: BifrostFlexWorkerSilent
    status: active
  - id: plugin/polygon-worker-stocks
    what: "Stocks ingest pool. Claims the market queue about every 5s and writes Golden Source market tables. 3 replicas on 2026-10-07."
    runs_on: cluster:plugin-market-data/polygon-worker-stocks
    schedule: "poll 5s"
    env: prod
    max_tier: B
    detected_by: BifrostMarketDataWorkersDown
    status: active
