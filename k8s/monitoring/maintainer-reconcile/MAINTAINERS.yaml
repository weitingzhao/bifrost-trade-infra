  - id: dagster/schedules/ensure-partitions
    what: "Monthly call of ensure_month_partitions (CREATE of month partitions on the research database)."
    runs_on: cluster:research/dagster
    schedule: "30 0 1 * * UTC"
    env: prod
    max_tier: D
    detected_by: BifrostDagsterScheduleMissedTick
    status: active
    members:
      - research_ensure_partitions_schedule
  - id: dagster/sensors/failure-alerts
    what: "Run-failure and asset-check sensors. Both RUNNING. They POST alerts into Alertmanager; they do not fix the run."
    runs_on: cluster:research/dagster
    schedule: "daemon sensor tick"
