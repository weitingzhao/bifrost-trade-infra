    status: active
  - id: plugin/market-data-api-queue-sampler
    what: "Thread inside market-data-api. Every 300s it writes ops_jobs.queue_sample so a Dagster miss is visible without Dagster."
    runs_on: cluster:plugin-market-data/market-data-api
    schedule: "every 300s"
