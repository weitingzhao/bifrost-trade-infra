# Maintainer inventory (ADR §7). A maintainer runs by itself and reads or writes
# the system or its data. --live reconciles only these id prefixes:
#   cronjob/  scheduledbackup/  dagster/schedules|sensors members  launchd/
# Platform loops, plugin timers, and Mac Pro entries are registered here and
# checked for complete fields; they are not in this script's --live reconcile.
# The in-cluster CronJob monitoring/maintainer-reconcile reads platform loop
# series (bifrost_maintainer_last_success_timestamp_seconds) and launchd from
# the operator planes. Its inventory file is a byte copy of this one.
#
# env: prod = the writes are production data (prod DB, Golden Source, the
# shared data/plugin namespaces). shared = the job's writes stay in STG or in
# cicd. dev-only = this Mac Pro, or bifrost-dev.
# max_tier: ADR §5. The highest action the process can take, not only what it
# did on the day this file was filled (2026-10-07, read-only).
maintainers:
  - id: cronjob/bifrost-prod/position-snapshot-capture
    what: "Weekday 16:20 America/New_York capture of position_snapshot_daily and account_nav_daily in bifrost_prod."
    runs_on: cluster:bifrost-prod/CronJob
    schedule: "20 16 * * 1-5 America/New_York"
    env: prod
    max_tier: B
    detected_by: BifrostPositionSnapshotStale
    status: active
  - id: cronjob/bifrost-prod/position-snapshot-enrich
    what: "Weekday 20:30 America/New_York recapture of stale prod accounts, then fill of vendor EOD Greeks, IV, and closes."
    runs_on: cluster:bifrost-prod/CronJob
    schedule: "30 20 * * 1-5 America/New_York"
    env: prod
    max_tier: B
    detected_by: BifrostPositionSnapshotStale
    status: active
  - id: cronjob/bifrost-stg/position-snapshot-capture
    what: "Same capture as prod, writing only bifrost_stg."
    runs_on: cluster:bifrost-stg/CronJob
    schedule: "20 16 * * 1-5 America/New_York"
    env: shared
    max_tier: B
    detected_by: BifrostPositionSnapshotStale
    status: active
  - id: cronjob/bifrost-stg/position-snapshot-enrich
    what: "Same enrich as prod, writing only bifrost_stg."
    runs_on: cluster:bifrost-stg/CronJob
    schedule: "30 20 * * 1-5 America/New_York"
    env: shared
    max_tier: B
    detected_by: BifrostPositionSnapshotStale
    status: active
  - id: cronjob/bifrost-dev/position-snapshot-capture
    what: "Same capture as prod, writing only bifrost_dev."
    runs_on: cluster:bifrost-dev/CronJob
    schedule: "20 16 * * 1-5 America/New_York"
    env: dev-only
    max_tier: B
    detected_by: BifrostPositionSnapshotStale
    status: active
  - id: cronjob/bifrost-dev/position-snapshot-enrich
    what: "Same enrich as prod, writing only bifrost_dev."
    runs_on: cluster:bifrost-dev/CronJob
    schedule: "30 20 * * 1-5 America/New_York"
    env: dev-only
    max_tier: B
    detected_by: BifrostPositionSnapshotStale
    status: active
  - id: cronjob/data/logical-backup
    what: "Nightly logical dump of the CNPG databases, including bifrost_prod and bifrost_golden_source."
    runs_on: cluster:data/CronJob
    schedule: "30 4 * * * UTC"
    env: prod
    max_tier: B
    detected_by: BifrostLogicalBackupMissing
    status: active
  - id: cronjob/data/logical-backup-drill
    what: "Monthly restore drill of the latest logical dump. Has not had a successful run yet (last schedule empty on 2026-10-07)."
    runs_on: cluster:data/CronJob
    schedule: "0 6 1 * * UTC"
    env: prod
    max_tier: B
    detected_by: BifrostLogicalBackupDrillStale
    status: active
  - id: cronjob/data/backup-retry
    what: "Every 15 minutes in the 04:00-09:00 UTC window, creates a retry Backup if today's CNPG backup failed."
    runs_on: cluster:data/CronJob
    schedule: "*/15 4-9 * * * UTC"
    env: prod
    max_tier: B
    detected_by: BifrostMaintainerBackupRetryStale
    status: active
  - id: cronjob/data/db-role-matrix
    what: "Daily read-only check that live database grants (CONNECT, schema CREATE, table INSERT/UPDATE/DELETE) match k8s/data/role-matrix/expected.yaml; exits 1 on any difference (TD-85)."
    runs_on: cluster:data/CronJob
    schedule: "15 5 * * * UTC"
    env: prod
    max_tier: A
    detected_by: BifrostDbPrivilegeDrift
    status: active
  - id: cronjob/cicd/tekton-pipelinerun-ttl
    what: "Hourly deletion of terminal Tekton PipelineRuns older than 7 days."
    runs_on: cluster:cicd/CronJob
    schedule: "20 * * * * UTC"
    env: shared
    max_tier: B
    detected_by: BifrostTektonPipelineRunTTLStale
    status: active
  - id: cronjob/kube-system/cluster-state-backup
    what: "Daily age-encrypted copy of the newest k3s etcd snapshot and the cluster Secrets onto the nfs-cold claim cluster-state-backup (LANE-A2)."
    runs_on: cluster:kube-system/CronJob
    schedule: "15 5 * * * UTC"
    env: prod
    max_tier: B
    detected_by: BifrostClusterStateBackupStale
    status: active
  - id: cronjob/research/research-harness
    what: "Weekday copilot harness batch (daily_open) outside Dagster, writing the research store."
    runs_on: cluster:research/CronJob
    schedule: "30 13 * * 1-5 UTC"
    env: prod
    max_tier: B
    detected_by: BifrostResearchCronJobStale
    status: active
  - id: scheduledbackup/data/bifrost-postgres-daily
    what: "CNPG ScheduledBackup of bifrost-postgres to the Barman object store (all databases on the cluster)."
    runs_on: cluster:data/ScheduledBackup
    schedule: "0 0 3 * * * UTC"
    env: prod
    max_tier: B
    detected_by: BifrostPostgresBackupMissing
    status: active
  - id: dagster/schedules/market-slots
    what: "Dagster crons that enqueue Massive plugin ingest slots. All RUNNING on 2026-10-07. Trim and self-heal are separate entries."
    runs_on: cluster:research/dagster
    schedule: "per member; UTC or America/New_York"
    env: prod
    max_tier: B
    detected_by: BifrostDagsterScheduleMissedTick
    status: active
    members:
      - market_corporate_backfill_schedule
      - market_corporate_schedule
      - market_fundamentals_market_schedule
      - market_fundamentals_rotate_schedule
      - market_intraday_chain_1030_schedule
      - market_intraday_chain_1300_schedule
      - market_intraday_chain_1530_schedule
      - market_minute_bars_schedule
      - market_movers_schedule
      - market_option_bars_schedule
      - market_option_depth_schedule
      - market_option_refresh_schedule
      - market_ratios_market_schedule
      - market_reference_schedule
      - market_related_schedule
      - market_snapshot_schedule
