    detected_by: "none: peer watchdog only kickstarts com.bifrost.remediation-runner; this label has no Prometheus series"
    status: active
  - id: launchd/.50/com.bifrost.peer-watchdog
    what: "Every 60s. The script uses curl, ssh, and launchctl, so it can restart the peer mini."
    runs_on: mini:.50/launchd
    schedule: "every 60s"
    env: prod
    max_tier: B
    detected_by: "none: nothing restarts this interval agent; it is not a PrometheusRule"
    status: active
  - id: launchd/.50/com.bifrost.remediation-runner
    what: "Keep-alive remediation runner, role primary. Executes jobs the platform posts."
    runs_on: mini:.50/launchd
    schedule: "keep-alive"
    env: prod
    max_tier: D
    detected_by: "none: peer watchdog com.bifrost.peer-watchdog on .52 polls :8781 and kickstarts this runner; that watchdog is not a PrometheusRule"
    status: active
  - id: launchd/.52/com.bifrost.hermes-gateway
