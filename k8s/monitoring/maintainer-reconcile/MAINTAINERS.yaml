  - id: platform/prod/ib-autorepair
    what: "PROD workers loop. OPS_IB_AUTOREPAIR_ENABLED=true, so every 30s it may rollout-restart the IB gateway after a stale streak. STG has the flag false and does not start it."
    runs_on: cluster:bifrost-platform-prod/platform-workers
    schedule: "every 30s"
    env: prod
    max_tier: B
    detected_by: BifrostMaintainerIBAutoRepairStale
    status: active
  - id: platform/prod/data-clone-scheduler
    what: "Hourly clone check on PROD workers. Starts whenever the workers role starts. ConfigMap platform-state-data-clone-schedule-json is absent, so the default (enabled false, source bifrost_prod) no-ops."
    runs_on: cluster:bifrost-platform-prod/platform-workers
    schedule: "every 1h"
    env: prod
    max_tier: B
    detected_by: BifrostMaintainerDataCloneStale
    status: active
  - id: platform/prod/failed-backup-sweep
    what: "Daily deletion of failed CNPG Backup objects older than 30 days. PLATFORM_BACKUP_CR_SWEEP=1 on PROD only. Logged a run at process start on 2026-10-07."
    runs_on: cluster:bifrost-platform-prod/platform-workers
    schedule: "every 24h"
    env: prod
    max_tier: D
    detected_by: BifrostMaintainerBackupSweepStale
    status: active
  - id: platform/prod/patrol-autopilot
    what: "30s scanner over ops-autopilot, fleet-drift-scan, and cert-expiry-check. PATROL_MODE=report, so it records the rollout it would do and does not call it. The massive-polygon fix is a rollout restart of polygon-worker-stocks."
    runs_on: cluster:bifrost-platform-prod/platform-workers
    schedule: "scan every 30s; skills */15 * * * *, 5 * * * *, 0 6 * * 1"
    env: prod
    max_tier: C
    detected_by: BifrostMaintainerPatrolScanStale
    status: active
    members:
      - ops-autopilot
      - fleet-drift-scan
      - cert-expiry-check
  - id: platform/prod/checklist-prober
    what: "CHECKLIST_PROBER=on. Every 10m it reads the platform API and writes checklist signals. Logged runs on 2026-10-07. It does not dispatch fixes."
    runs_on: cluster:bifrost-platform-prod/platform-workers
    schedule: "every 10m"
    env: prod
    max_tier: B
    detected_by: BifrostMaintainerChecklistProberStale
    status: active
  - id: platform/prod/release-recorder
    what: "In-cluster default (PLATFORM_RELEASE_RECORDER unset). Every 5m it records PipelineRuns from release-rules.yaml. First tick logged on 2026-10-07. STG sets the recorder off."
    runs_on: cluster:bifrost-platform-prod/platform-workers
    schedule: "every 5m"
    env: prod
    max_tier: B
    detected_by: BifrostMaintainerReleaseRecorderStale
    status: active
  - id: platform/stg/data-clone-scheduler
    what: "Same hourly loop as PROD, started because STG workers role is on. Its schedule ConfigMap is also absent, so it no-ops. Default source if someone enables it is bifrost_prod. PATROL_MODE is not set here."
    runs_on: cluster:bifrost-platform-stg/platform-workers
    schedule: "every 1h"
    env: shared
    max_tier: B
    detected_by: "none: STG platform-workers sets PLATFORM_DATA_CLONE_SCHEDULER=off (observe only); no success series"
    status: active
  - id: platform/stg/patrol-autopilot
    what: "Patrol loop starts (no OPERATOR_PLANE_URL) but /app/config/patrol-skills does not exist, so the scan has no skills. PATROL_MODE is unset, which is act, not report."
    runs_on: cluster:bifrost-platform-stg/platform-workers
    schedule: "scan every 30s"
    env: shared
    max_tier: C
    detected_by: "none: STG platform-workers sets PLATFORM_PATROL_LOOP=off (observe only); no success series"
    status: active
