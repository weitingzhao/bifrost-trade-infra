      - market_treasury_schedule
      - market_universe_calendar_schedule
  - id: dagster/schedules/market-self-heal
    what: "Doctor, heal (re-enqueue), drain, recheck. Does not rollout workers; the rollout prescription is auto_fixable false."
    runs_on: cluster:research/dagster
    schedule: "45 0 * * 2-6 UTC; 30 5 * * 2-6 UTC"
    env: prod
    max_tier: B
    detected_by: BifrostDagsterScheduleMissedTick
    status: active
    members:
      - market_self_heal_schedule
      - market_self_heal_late_schedule
  - id: dagster/schedules/market-trim
    what: "Nightly retention. Deletes old ingest-job rows, queue samples, and option_snapshot rows past the keep window."
    runs_on: cluster:research/dagster
