    schedule: "keep-alive"
    env: prod
    max_tier: C
    detected_by: "none: peer watchdog only kickstarts com.bifrost.remediation-runner; this label has no Prometheus series"
    status: active
  - id: launchd/.52/com.bifrost.peer-watchdog
    what: "Every 60s. The script uses curl, ssh, launchctl, and ntfy."
    runs_on: mini:.52/launchd
    schedule: "every 60s"
    env: prod
    max_tier: D
    detected_by: "none: nothing restarts this interval agent; it is not a PrometheusRule"
    status: active
