# Bifrost Hosts dashboard (W-68 B4 ①, "全机房面板") — Grafana sidecar (label grafana_dashboard=1).
# Links carry /grafana/: Grafana is served under that sub-path (ops.bifrost.lan routes only
# /grafana to it, review 537 C2), and a bare /d/... would land in the Console.
# One page for every machine Prometheus sees: reachable, uptime, filesystems, memory, CPU,
# RAID, SMART, and the Gitea probe. Cluster nodes come from the DaemonSet, the hosts
# outside the cluster from bifrost-hosts-external.yaml. Generated JSON; edit the panels in
# Grafana, export, and paste back here (the UI does not keep changes: TD-289).
# Not under Argo. Apply this file on its own (OWNER-STEPS step 5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-dashboard-hosts
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    grafana_dashboard: "1"
data:
  bifrost-hosts.json: |
    {
      "annotations": {
        "list": [
          {"builtIn": 1, "datasource": {"type": "grafana", "uid": "-- Grafana --"}, "enable": true, "hide": true, "iconColor": "rgba(0, 211, 255, 1)", "name": "Annotations & Alerts", "type": "dashboard"}
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "dashboard",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "Node Exporter / Nodes",
          "type": "link",
          "url": "/grafana/d/7d57716318ee0dddbac5a7f451fb7753"
        },
        {
          "asDropdown": false,
          "icon": "dashboard",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "Node Exporter / MacOS",
          "type": "link",
          "url": "/grafana/d/629701ea43bf69291922ea45f4a87d37"
        }
      ],
      "panels": [
        {
          "id": 1,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "text",
          "title": "",
          "gridPos": {"h": 3, "w": 24, "x": 0, "y": 0},
          "options": {"mode": "markdown", "content": "Every machine Prometheus watches: the k3s nodes (DaemonSet) and the hosts outside the cluster (agent-06, nas, mini-50, mini-52; `k8s/monitoring/bifrost-hosts-external.yaml`). gpu-server (192.168.10.60) reads DOWN while it sleeps (wake on LAN). Alerts: `bifrost-host-rules.yaml`. Per-host detail: [Node Exporter / Nodes](/grafana/d/7d57716318ee0dddbac5a7f451fb7753) (Linux) and [Node Exporter / MacOS](/grafana/d/629701ea43bf69291922ea45f4a87d37)."}
        },
        {
          "id": 2,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "stat",
          "title": "Reachable",
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 3},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (name) (label_replace(label_replace(label_replace(up{job=\"node-exporter\"} * on (instance) group_left (nodename) max by (instance, nodename) (last_over_time(node_uname_info{job=\"node-exporter\"}[7d])) or on (instance) up{job=\"node-exporter\"}, \"name\", \"$1\", \"instance\", \"([^:]+).*\"), \"name\", \"$1\", \"nodename\", \"(.+)\"), \"name\", \"$1\", \"host\", \"(.+)\"))", "legendFormat": "{{name}}", "refId": "A", "instant": true, "range": false}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red", "index": 0}, "1": {"text": "UP", "color": "green", "index": 1}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "none"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "vertical", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "wideLayout": true, "showPercentChange": false}
        },
        {
          "id": 3,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "stat",
          "title": "Uptime",
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 7},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (name) (label_replace(label_replace(label_replace((time() - node_boot_time_seconds{job=\"node-exporter\"}) * on (instance) group_left (nodename) max by (instance, nodename) (last_over_time(node_uname_info{job=\"node-exporter\"}[7d])), \"name\", \"$1\", \"instance\", \"([^:]+).*\"), \"name\", \"$1\", \"nodename\", \"(.+)\"), \"name\", \"$1\", \"host\", \"(.+)\"))", "legendFormat": "{{name}}", "refId": "A", "instant": true, "range": false}],
          "fieldConfig": {"defaults": {"unit": "s", "decimals": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "orange", "value": null}, {"color": "text", "value": 3600}]}}, "overrides": []},
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "vertical", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "wideLayout": true, "showPercentChange": false}
        },
        {
          "id": 4,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "bargauge",
          "title": "Filesystem used",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 11},
          "description": "Writable data filesystems only. BifrostHostDiskSpaceLow warns at 85% used on the external hosts; the chart's NodeFilesystemAlmostOutOfSpace pages at 97%.",
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (name, mountpoint) (label_replace(label_replace(label_replace((100 * (1 - node_filesystem_avail_bytes{job=\"node-exporter\",fstype!~\"tmpfs|vfat\",mountpoint=~\"/|/boot|/home|/overlay|/rootfs|/volume[0-9]+|/System/Volumes/Data\"} / node_filesystem_size_bytes{job=\"node-exporter\",fstype!~\"tmpfs|vfat\",mountpoint=~\"/|/boot|/home|/overlay|/rootfs|/volume[0-9]+|/System/Volumes/Data\"})) * on (instance) group_left (nodename) max by (instance, nodename) (last_over_time(node_uname_info{job=\"node-exporter\"}[7d])) and on (instance, device, mountpoint) node_filesystem_readonly{job=\"node-exporter\"} == 0, \"name\", \"$1\", \"instance\", \"([^:]+).*\"), \"name\", \"$1\", \"nodename\", \"(.+)\"), \"name\", \"$1\", \"host\", \"(.+)\"))", "legendFormat": "{{name}} {{mountpoint}}", "refId": "A", "instant": true, "range": false}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 85}, {"color": "red", "value": 95}]}}, "overrides": []},
          "options": {"displayMode": "gradient", "orientation": "horizontal", "showUnfilled": true, "valueMode": "color", "namePlacement": "left", "sizing": "auto", "minVizHeight": 16, "maxVizHeight": 24, "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 5,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "bargauge",
          "title": "Memory used",
          "gridPos": {"h": 5, "w": 12, "x": 12, "y": 11},
          "description": "Linux: 1 - MemAvailable / MemTotal. macOS: total - free - inactive.",
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (name) (label_replace(label_replace(label_replace((100 * (1 - node_memory_MemAvailable_bytes{job=\"node-exporter\"} / node_memory_MemTotal_bytes{job=\"node-exporter\"}) or 100 * (node_memory_total_bytes{job=\"node-exporter\"} - node_memory_free_bytes{job=\"node-exporter\"} - node_memory_inactive_bytes{job=\"node-exporter\"}) / node_memory_total_bytes{job=\"node-exporter\"}) * on (instance) group_left (nodename) max by (instance, nodename) (last_over_time(node_uname_info{job=\"node-exporter\"}[7d])), \"name\", \"$1\", \"instance\", \"([^:]+).*\"), \"name\", \"$1\", \"nodename\", \"(.+)\"), \"name\", \"$1\", \"host\", \"(.+)\"))", "legendFormat": "{{name}}", "refId": "A", "instant": true, "range": false}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 85}, {"color": "red", "value": 95}]}}, "overrides": []},
          "options": {"displayMode": "gradient", "orientation": "horizontal", "showUnfilled": true, "valueMode": "color", "namePlacement": "left", "sizing": "auto", "minVizHeight": 16, "maxVizHeight": 24, "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 6,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "bargauge",
          "title": "CPU busy (5m)",
          "gridPos": {"h": 5, "w": 12, "x": 12, "y": 16},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (name) (label_replace(label_replace(label_replace((100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])))) * on (instance) group_left (nodename) max by (instance, nodename) (last_over_time(node_uname_info{job=\"node-exporter\"}[7d])), \"name\", \"$1\", \"instance\", \"([^:]+).*\"), \"name\", \"$1\", \"nodename\", \"(.+)\"), \"name\", \"$1\", \"host\", \"(.+)\"))", "legendFormat": "{{name}}", "refId": "A", "instant": true, "range": false}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 95}]}}, "overrides": []},
          "options": {"displayMode": "gradient", "orientation": "horizontal", "showUnfilled": true, "valueMode": "color", "namePlacement": "left", "sizing": "auto", "minVizHeight": 16, "maxVizHeight": 24, "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 7,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "stat",
          "title": "RAID disks missing",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 21},
          "description": "Per md array: disks the array needs minus disks active. Non-zero means degraded (NodeRAIDDegraded pages after 15m).",
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (name, device) (label_replace(label_replace(label_replace((node_md_disks_required{job=\"node-exporter\"} - ignoring (state) node_md_disks{job=\"node-exporter\",state=\"active\"}) * on (instance) group_left (nodename) max by (instance, nodename) (last_over_time(node_uname_info{job=\"node-exporter\"}[7d])), \"name\", \"$1\", \"instance\", \"([^:]+).*\"), \"name\", \"$1\", \"nodename\", \"(.+)\"), \"name\", \"$1\", \"host\", \"(.+)\"))", "legendFormat": "{{name}} {{device}}", "refId": "A", "instant": true, "range": false}],
          "fieldConfig": {"defaults": {"unit": "none", "decimals": 0, "noValue": "no md array", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "wideLayout": true, "showPercentChange": false}
        },
        {
          "id": 8,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "stat",
          "title": "Gitea",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 21},
          "description": "blackbox_exporter GET /api/healthz every 30s, through the NodePort (.73:30300) and the Service. BifrostGiteaUnavailable pages after 2 minutes of failure.",
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (via) (probe_success{job=\"gitea-probe\"})", "legendFormat": "{{via}}", "refId": "A", "instant": true, "range": false}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red", "index": 0}, "1": {"text": "UP", "color": "green", "index": 1}}}], "noValue": "no probe", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "none"}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "wideLayout": true, "showPercentChange": false}
        },
        {
          "id": 9,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "timeseries",
          "title": "Gitea probe time",
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 21},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (via) (probe_duration_seconds{job=\"gitea-probe\"})", "legendFormat": "{{via}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}}
        },
        {
          "id": 10,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "type": "table",
          "title": "Disks (SMART)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 25},
          "description": "smartctl_exporter on agent-06 and nas, every disk read every minute (powermode-check=never). Alerts: BifrostHostDiskSmartFailing, BifrostHostDiskBadSectors, BifrostHostDiskMissing, BifrostNasSmartBlind (critical); reallocated growth, NVMe media errors, read errors (warning).",
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (host, device, model_name) (smartctl_device{job=\"smartctl\"})", "legendFormat": "", "refId": "A", "instant": true, "range": false, "format": "table"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (host, device) (smartctl_device_smart_status{job=\"smartctl\"})", "legendFormat": "", "refId": "B", "instant": true, "range": false, "format": "table"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (host, device) (smartctl_device_temperature{job=\"smartctl\",temperature_type=\"current\"})", "legendFormat": "", "refId": "C", "instant": true, "range": false, "format": "table"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (host, device) (smartctl_device_power_on_seconds{job=\"smartctl\"}) / 3600", "legendFormat": "", "refId": "D", "instant": true, "range": false, "format": "table"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (host, device) (smartctl_device_attribute{job=\"smartctl\",attribute_value_type=\"raw\",attribute_name=\"Reallocated_Sector_Ct\"})", "legendFormat": "", "refId": "E", "instant": true, "range": false, "format": "table"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (host, device) (smartctl_device_attribute{job=\"smartctl\",attribute_value_type=\"raw\",attribute_name=~\"Current_Pending_Sector|Offline_Uncorrectable\"})", "legendFormat": "", "refId": "F", "instant": true, "range": false, "format": "table"}, {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "max by (host, device) (smartctl_device_percentage_used{job=\"smartctl\"})", "legendFormat": "", "refId": "G", "instant": true, "range": false, "format": "table"}],
          "transformations": [{"id": "merge", "options": {}}, {"id": "organize", "options": {"excludeByName": {"Time": true, "Value #A": true}, "indexByName": {"host": 0, "device": 1, "model_name": 2, "Value #B": 3, "Value #C": 4, "Value #D": 5, "Value #E": 6, "Value #F": 7, "Value #G": 8}, "renameByName": {"host": "Host", "device": "Disk", "model_name": "Model", "Value #B": "SMART", "Value #C": "Temp °C", "Value #D": "Power-on h", "Value #E": "Reallocated", "Value #F": "Pending / uncorrectable", "Value #G": "NVMe used %"}}}],
          "fieldConfig": {"defaults": {"custom": {"align": "auto", "cellOptions": {"type": "auto"}}}, "overrides": [{"matcher": {"id": "byName", "options": "SMART"}, "properties": [{"id": "mappings", "value": [{"type": "value", "options": {"0": {"text": "FAILING", "color": "red", "index": 0}, "1": {"text": "passed", "color": "green", "index": 1}}}]}, {"id": "custom.cellOptions", "value": {"type": "color-text"}}]}, {"matcher": {"id": "byName", "options": "Pending / uncorrectable"}, "properties": [{"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, {"id": "custom.cellOptions", "value": {"type": "color-text"}}]}, {"matcher": {"id": "byName", "options": "Power-on h"}, "properties": [{"id": "decimals", "value": 0}]}]},
          "options": {"showHeader": true, "cellHeight": "sm", "footer": {"show": false, "reducer": ["sum"], "fields": ""}}
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "bifrost",
        "hosts"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Bifrost Hosts",
      "uid": "bifrost-hosts",
      "version": 1,
      "weekStart": ""
    }
