# Hosts outside the cluster and Gitea (W-68 B4 ①). Targets: bifrost-hosts-external.yaml
# (job node-exporter / smartctl, scope="external") and bifrost-blackbox.yaml (job gitea-probe).
#
# Paging is the existing route: severity=critical goes to owner-ntfy (the relay on Mac
# mini .50) and to the PROD webhook; warning goes to the webhook only. Nothing here needs
# a change to Alertmanager.
#
# Left to the chart's node-exporter rules, which see these hosts because the job label is
# node-exporter: NodeRAIDDegraded (critical, 15m: md1 on the NAS runs short of a disk),
# NodeRAIDDiskFailure (warning), NodeFilesystemAlmostOutOfSpace / SpaceFillingUp
# (critical at 3% free for 30m, or under 10% and full within 4h for 1h), clock skew.
#
# Every "the watcher is gone" alert names what it expects (review 537 A2): one absent()
# per host or per Gitea path, so losing one target out of two still fires. The NAS's
# SMART view has its own critical guard (BifrostNasSmartBlind, review 537 A3): the
# exporter answering is not enough, all three RAID disks must report health.
#
# Unit tests: rule-tests/host-rules.test.yaml (make check-alert-rules).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bifrost-host-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: alerting
spec:
  groups:
    - name: bifrost-hosts
      rules:
        # Time to the phone, from the last good scrape, while Prometheus, Alertmanager and
        # the relay on .50 work and no other BifrostHostDown is being notified: next scrape
        # fails at +30s (+10s timeout), the rule sees it by +70s, fires after 1m at +130s,
        # Alertmanager's group_wait adds 30s: about 2m40s, then the relay and ntfy.
        # Not covered by that figure (CUT-w68-b4-host-monitoring §6): mini-50 is the relay
        # itself (the .52 watchdog pages instead, 5.5-8 minutes); Prometheus and
        # Alertmanager keep their data on the NAS (may stall when it goes); a second
        # host going down while the first is notified waits for group_interval (5m).
        - alert: BifrostHostDown
          expr: up{job="node-exporter",scope="external"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Host {{ $labels.host }} ({{ $labels.instance }}) is not answering"
            description: >-
              node_exporter on {{ $labels.host }} has not answered for a minute: the host
              is off, hung or off the network, or only node_exporter stopped. agent-06: both
              agentd stop. nas: registry, MinIO backups, WAL archive and Prometheus's disk.
              mini-50: the ntfy relay (no other page gets through). mini-52: the watchdog
              over that relay. A Mac mini with FileVault waits at the unlock screen after
              a reboot until someone logs in.

        # Guards the target list itself: a target removed from the ScrapeConfig, or the
        # ScrapeConfig not loaded, would otherwise leave BifrostHostDown with nothing to see.
        # One absent() per host, so the alert names the one that is missing.
        - alert: BifrostHostTargetsMissing
          expr: |
            absent(up{job="node-exporter",scope="external",host="agent-06"})
            or absent(up{job="node-exporter",scope="external",host="nas"})
            or absent(up{job="node-exporter",scope="external",host="mini-50"})
            or absent(up{job="node-exporter",scope="external",host="mini-52"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Host {{ $labels.host }} is not among Prometheus's targets"
            description: >-
              ScrapeConfig monitoring/bifrost-hosts-node gives Prometheus no target for
              {{ $labels.host }}, so BifrostHostDown cannot fire for it. Check that
              k8s/monitoring/bifrost-hosts-external.yaml is applied and lists all four.

        - alert: BifrostHostDiskSpaceLow
          expr: |
            100 * node_filesystem_avail_bytes{job="node-exporter",scope="external",fstype!="tmpfs"}
              / node_filesystem_size_bytes{job="node-exporter",scope="external",fstype!="tmpfs"} < 15
            and
            node_filesystem_readonly{job="node-exporter",scope="external"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.host }} {{ $labels.mountpoint }} has {{ $value | printf \"%.1f\" }}% free"
            description: >-
              {{ $labels.mountpoint }} ({{ $labels.device }}, {{ $labels.fstype }}) on
              {{ $labels.host }} is under 15% free. The chart's
              NodeFilesystemAlmostOutOfSpace pages at 3% free held for 30 minutes.

    - name: bifrost-host-disks
      rules:
        # smartctl's own verdict: overall health FAILED (bit 3 of its exit status, the same
        # as smart_status 0) or a pre-failure attribute at or below its threshold (bit 4).
        - alert: BifrostHostDiskSmartFailing
          expr: |
            smartctl_device_smart_status{job="smartctl"} == 0
            or
            floor(smartctl_device_smartctl_exit_status{job="smartctl"} / 16) % 2 == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.host }} reports SMART failing"
            description: >-
              smartctl says {{ $labels.device }} on {{ $labels.host }} is failing or about
              to. On the NAS it is one of the three RAID 5 disks: a second failure loses
              /volume1. Replace it; read `smartctl -a /dev/{{ $labels.device }}` as root on
              the host first.

        # Sectors the disk could not read. On RAID 5 a rebuild after any other disk
        # failure would hit them.
        - alert: BifrostHostDiskBadSectors
          expr: |
            max by (instance, host, device, attribute_name) (
              smartctl_device_attribute{job="smartctl",attribute_value_type="raw",
                attribute_name=~"Current_Pending_Sector|Offline_Uncorrectable"}
            ) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.host }} has {{ $value }} unreadable sectors"
            description: >-
              {{ $labels.attribute_name }} is {{ $value }} on {{ $labels.device }}
              ({{ $labels.host }}). Plan the replacement; on the NAS check the array in
              UGOS Storage before anything else touches the disks.

        - alert: BifrostHostDiskReallocatedGrowing
          expr: |
            delta(smartctl_device_attribute{job="smartctl",attribute_value_type="raw",
              attribute_name="Reallocated_Sector_Ct"}[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.host }} reallocated sectors in the last day"
            description: >-
              Reallocated_Sector_Ct on {{ $labels.device }} ({{ $labels.host }}) grew by
              {{ $value }} in 24h. One step is wear; steady growth means the disk is going.

        - alert: BifrostHostNvmeCriticalWarning
          expr: smartctl_device_critical_warning{job="smartctl"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.host }} raised a critical warning"
            description: >-
              The NVMe critical-warning field is {{ $value }} on {{ $labels.device }}
              ({{ $labels.host }}): spare space, temperature, reliability or read-only
              mode. Read `smartctl -a /dev/{{ $labels.device }}` as root on the host.

        - alert: BifrostHostNvmeMediaErrors
          expr: delta(smartctl_device_media_errors{job="smartctl"}[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.host }} logged media errors"
            description: >-
              Media and data-integrity errors on {{ $labels.device }} ({{ $labels.host }})
              grew by {{ $value }} in 24h.

        # A disk the exporter saw in the last day is gone (died, dropped off the bus,
        # pulled). The exporter rescans every 10 minutes, so 25 minutes is two rescans.
        - alert: BifrostHostDiskMissing
          expr: |
            smartctl_devices{job="smartctl"}
              < max_over_time(smartctl_devices{job="smartctl"}[1d])
          for: 25m
          labels:
            severity: critical
          annotations:
            summary: "A disk disappeared from {{ $labels.host }}"
            description: >-
              smartctl_exporter on {{ $labels.host }} sees {{ $value }} disks, fewer than
              earlier today. On the NAS check UGOS Storage; NodeRAIDDegraded follows if it
              was a RAID member.

        # smartctl could not open or fully read a disk (exit status bits 0-2): its SMART
        # alerts above are blind until this clears. Warning on any host; on the NAS,
        # BifrostNasSmartBlind pages for the same thing after 2 hours.
        - alert: BifrostHostSmartReadFailing
          expr: smartctl_device_smartctl_exit_status{job="smartctl"} % 8 > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "smartctl cannot read {{ $labels.device }} on {{ $labels.host }}"
            description: >-
              smartctl's exit status for {{ $labels.device }} ({{ $labels.host }}) has its
              read-error bits set ({{ $value }}), so the SMART alerts for that disk cannot
              fire. Run `smartctl -a /dev/{{ $labels.device }}` as root on the host.

        # A target that answers 0, or one of the two expected targets missing altogether
        # (absent() per host: with only agent-06 left, nas still fires).
        - alert: BifrostHostSmartExporterDown
          expr: |
            up{job="smartctl"} == 0
            or absent(up{job="smartctl",host="agent-06"})
            or absent(up{job="smartctl",host="nas"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "No SMART data from {{ $labels.host }}"
            description: >-
              smartctl_exporter on {{ $labels.host }} has not answered for 15 minutes, or
              ScrapeConfig monitoring/bifrost-hosts-smartctl has no target for it. If the
              host is down, BifrostHostDown has paged already.

        # Review 537 A3: the NAS is "known the same day when a disk goes" only while all
        # three RAID disks are seen. Any of these for 2 hours pages: the exporter down or
        # missing; it sees fewer than 3 disks (including 0 from the start, which
        # BifrostHostDiskMissing cannot tell from normal); fewer than 3 disks report
        # health; smartctl cannot read one (exit bits 0-2). Not when the whole NAS is
        # down: BifrostHostDown has paged for that. 3 is the RAID members; the M.2 SSD,
        # once fitted, is watched by BifrostHostDiskMissing. powermode-check=never on the
        # NAS (compose.yaml), so a disk is never skipped for being asleep.
        - alert: BifrostNasSmartBlind
          expr: |
            (
                max by (host) (up{job="smartctl",host="nas"} == 0)
              or
                max by (host) (absent(up{job="smartctl",host="nas"}))
              or
                max by (host) (smartctl_devices{job="smartctl",host="nas"} < 3)
              or
                count by (host) (smartctl_device_smart_status{job="smartctl",host="nas"}) < 3
              or
                max by (host) (absent(smartctl_device_smart_status{job="smartctl",host="nas"}))
              or
                count by (host) (smartctl_device_smartctl_exit_status{job="smartctl",host="nas"} % 8 > 0)
            )
            unless on (host)
              (up{job="node-exporter",scope="external",host="nas"} == 0)
          for: 2h
          labels:
            severity: critical
          annotations:
            summary: "The NAS's disks have been out of SMART's sight for 2 hours"
            description: >-
              For 2 hours Prometheus has not had SMART health for all three RAID disks of
              the NAS: smartctl_exporter is down or not configured, sees fewer than 3
              disks, a disk reports no health, or smartctl cannot read one. Until this
              clears, a failing disk is not reported. As root on the NAS: docker compose -f
              /volume1/@bifrost/host-exporters/compose.yaml logs smartctl-exporter.

    - name: bifrost-gitea
      rules:
        # The primary Git (CI, Argo CD, both agentd). for 2m rides out a planned restart
        # (strategy Recreate, readiness after 15s).
        - alert: BifrostGiteaUnavailable
          expr: probe_success{job="gitea-probe"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Gitea is unavailable through the {{ $labels.via }} path"
            description: >-
              GET {{ $labels.instance }} has failed for 2 minutes. CI does not start,
              Argo CD cannot sync and the agentd on 06 cannot fetch or push. Gitea is one
              pod on ubt-k3s-01: `kubectl -n cicd get pod -l app=gitea -o wide`.

        # The prober unreachable, or one of the two paths missing from the ScrapeConfig
        # (absent() per path: with only via=service left, via=nodeport still fires).
        - alert: BifrostGiteaProbeDown
          expr: |
            up{job="gitea-probe"} == 0
            or absent(up{job="gitea-probe",via="nodeport"})
            or absent(up{job="gitea-probe",via="service"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The Gitea probe for the {{ $labels.via }} path is not running"
            description: >-
              Prometheus cannot reach the prober (Deployment
              monitoring/bifrost-blackbox-exporter) for the {{ $labels.via }} path, or
              ScrapeConfig monitoring/bifrost-gitea-probe has no target for it, so
              BifrostGiteaUnavailable cannot fire for that path.

    # TD-444 step 5 runbook §5.3. The weekly roll-up of the SSD backups onto RAID5
    # (scripts/nas/backup-rollup/rollup.sh) reports through the NAS node-exporter textfile
    # collector; the nightly market-archive replica is a CronJob (k8s/storage/nfs-fast/arc).
    # Every expected source is named in its own absent(), so losing one of five still fires;
    # the two Finance sources count once the roll-up has ever listed them (2b): rollup.sh keeps
    # source_expected for every source ever configured until --retire-source, so a source that
    # drops out of rollup.conf together with its metrics still alerts. Labels are folded
    # to {source} so one source never gives two alerts. These are warnings: they reach the
    # Owner's phone only once the ntfy route regex in values-kube-prometheus.yaml names them
    # (runbook §5.3, group 5). Unit tests: rule-tests/nas-rollup.test.yaml.
    - name: bifrost-nas-rollup
      rules:
        - alert: BifrostNasBackupRollupMissing
          expr: |
            max by (source) (absent(bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas",source="minio"}))
            or max by (source) (absent(bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas",source="registry-data"}))
            or max by (source) (absent(bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas",source="logical-backup-hot"}))
            or max by (source) (absent(bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas",source="gitea-backup"}))
            or max by (source) (absent(bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas",source="cluster-state-backup"}))
            or (
              max by (source) (absent(bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas",source="finance-backup-hot"}))
              and on (source) max by (source) (bifrost_nas_backup_rollup_source_expected{host="nas",source="finance-backup-hot"} == 1)
            )
            or (
              max by (source) (absent(bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas",source="finance-prod-validation-backup-hot"}))
              and on (source) max by (source) (bifrost_nas_backup_rollup_source_expected{host="nas",source="finance-prod-validation-backup-hot"} == 1)
            )
            or (
              max by (source) (bifrost_nas_backup_rollup_source_expected{host="nas"} == 1)
              unless on (source) max by (source) (bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas"})
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Weekly roll-up has never published source {{ $labels.source }}"
            description: >-
              No last-success time for {{ $labels.source }}: either the roll-up never published a
              generation with it, or rollup.conf / the textfile lost it. RAID5 holds no verified
              weekly copy of this source (runbook §5.4). On the NAS: systemctl status
              bifrost-backup-rollup.service and /volume1/@bifrost/backup-rollup/state/run-*.log.

        - alert: BifrostNasBackupRollupStale
          expr: |
            max by (source) (time() - bifrost_nas_backup_rollup_last_success_timestamp_seconds{host="nas"}) > 8 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Weekly roll-up of {{ $labels.source }} is {{ $value | humanizeDuration }} old"
            description: >-
              The newest verified RAID5 generation of {{ $labels.source }} is older than 8 days
              (the timer runs Sunday 12:30 UTC). Re-run it by hand within 24 hours (runbook §5.4):
              sudo /volume1/@bifrost/backup-rollup/rollup.sh, after reading the last run log.

        - alert: BifrostNasBackupRollupFailed
          expr: |
            max by (source) (bifrost_nas_backup_rollup_last_run_ok{host="nas"}) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Last weekly roll-up did not publish {{ $labels.source }}"
            description: >-
              The last run failed or did not publish, so nothing moved and nothing published was
              deleted. The run log names the failing source and why (in_progress at the deadline,
              completion mark, copy or verification); one .partial and one snapshot are kept for
              diagnosis for at most 7 days.

        - alert: BifrostNasTextfileBroken
          expr: |
            max by (host) (node_textfile_scrape_error{host="nas"}) == 1
            or max by (host) (absent(node_textfile_mtime_seconds{host="nas",file=~".*backup-rollup\\.prom"}))
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NAS textfile metrics are broken or backup-rollup.prom is missing"
            description: >-
              node-exporter on the NAS cannot read its textfile directory, or backup-rollup.prom is
              not there, so the roll-up alerts above see nothing. Check the node-exporter flag
              --collector.textfile.directory (scripts/host-exporters/nas/compose.yaml) and the file.

        - alert: BifrostMarketArchiveReplicaStale
          expr: |
            absent(kube_cronjob_info{namespace="plugin-market-data",cronjob="market-archive-replica"})
            or time() - max(kube_cronjob_status_last_successful_time{namespace="plugin-market-data",cronjob="market-archive-replica"}) > 30 * 3600
            or (
              (time() - max(kube_cronjob_created{namespace="plugin-market-data",cronjob="market-archive-replica"}) > 30 * 3600)
              and on ()
              absent(kube_cronjob_status_last_successful_time{namespace="plugin-market-data",cronjob="market-archive-replica"})
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Market-archive replica on the SSD is missing or stale"
            description: >-
              The CronJob plugin-market-data/market-archive-replica is gone, has not succeeded for
              30 hours, or has existed 30 hours without a success (runbook §5.2). The archive itself
              is the only primary copy on RAID5; read the last job's log for the failing ledger line.

        - alert: BifrostNasHddBusy
          expr: |
            count_over_time((rate(node_disk_io_time_seconds_total{host="nas",device="sda"}[5m]) > 0.3)[1d:5m]) > 20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "NAS HDDs were busy in {{ $value }} five-minute windows today"
            description: >-
              More than 20 windows over 30% busy in a day: something writes hot data onto the RAID5
              array again (TD-444 guard). On a Sunday, first rule out the weekly roll-up: its
              duration is not measured yet, and the threshold is to be checked against two real runs.
