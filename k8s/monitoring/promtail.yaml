# Scrape Promtail (DaemonSet, no Service) so dropped / failed pushes to Loki are measurable:
# promtail_dropped_entries_total, promtail_request_duration_seconds_count{status_code}.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: logging
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/instance: promtail
      app.kubernetes.io/name: promtail
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
