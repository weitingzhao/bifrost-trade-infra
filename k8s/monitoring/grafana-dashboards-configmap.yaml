# Bifrost Trade overview dashboard — auto-loaded by Grafana sidecar (label grafana_dashboard=1).
# Redis/PG panels live on bifrost-data-layer (W4 slim).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-trade-dashboards
  labels:
    grafana_dashboard: "1"
data:
  bifrost-trade-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "name": "Scope note",
            "iconColor": "blue",
            "type": "text",
            "text": "Trade API golden signals only. Shared Redis/CNPG → Bifrost Data Layer dashboard."
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "Data Layer",
          "tooltip": "Shared Redis + CNPG",
          "type": "link",
          "url": "/d/bifrost-data-layer/bifrost-data-layer"
        }
      ],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=~\"bifrost-.*\"}[5m])) by (service)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "title": "Trade API request rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1 }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=~\"bifrost-.*\",status=\"5xx\"}[5m])) by (service) / sum(rate(http_requests_total{namespace=~\"bifrost-.*\"}[5m])) by (service)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "title": "Trade API 5xx error rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=~\"bifrost-.*\"}[5m])) by (le, service))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "title": "Trade API P99 latency",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["bifrost", "trade"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Bifrost Trade Overview",
      "uid": "bifrost-trade-overview",
      "version": 2
    }
