# Scrape Bifrost Trade API /metrics from bifrost-* namespaces.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bifrost-trade-apis
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: api
spec:
  namespaceSelector:
    matchNames:
      - bifrost-stg
      - bifrost-dev
      - bifrost-prod
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: bifrost
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # One target per pod: keep the four process Services only. The routing
      # aliases api-docs/api-ops/api-trading/api-strategy/api-portfolio (they
      # stored each pod's series 3-4×) were deleted in TD-55 B2 (2026-10-04).
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          regex: api-(monitor|account|market|research)
          action: keep
