# Compute line: per-module "ask / use / given / from where" readings (record rules only; no alerts, nobody is paged).
# Module = namespace (an approximation, not a contract-level module). ask = requests of Running pods;
# use = container usage; given = requests are the reservation; from where = requests split by node.
# Series: 9 per-namespace rules x 18 namespaces + ~42 per-node pairs + 12 node series, plus 6 SSD rules x ~6 hosts and ~3 CI rules x ~40 classes: roughly 400 series (~2.7MB).
# Disk "ask" has no source (pods do not declare it); see compute notes, not faked here.
# Apply: plan_manifest + apply_manifest (monitoring is level C). Rollback: delete this PrometheusRule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bifrost-compute-module-readout
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: recording
spec:
  groups:
    - name: bifrost-compute-module
      interval: 5m
      rules:
        - record: bifrost_module:cpu_requests_cores
          expr: sum by (namespace)(kube_pod_container_resource_requests{resource="cpu"} * on(namespace,pod) group_left() (kube_pod_status_phase{phase="Running"} == 1))
        - record: bifrost_module:mem_requests_bytes
          expr: sum by (namespace)(kube_pod_container_resource_requests{resource="memory"} * on(namespace,pod) group_left() (kube_pod_status_phase{phase="Running"} == 1))
        - record: bifrost_module:cpu_usage_cores
          expr: sum by (namespace)(rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m]))
        - record: bifrost_module:mem_working_set_bytes
          expr: sum by (namespace)(container_memory_working_set_bytes{container!="",container!="POD"})
        - record: bifrost_module:fs_write_bytes_per_second
          expr: sum by (namespace)(rate(container_fs_writes_bytes_total{container!="",container!="POD",device=~"/dev/nvme0n1.*"}[5m]))
        - record: bifrost_module:cpu_requests_by_node_cores
          expr: sum by (namespace,node)(kube_pod_container_resource_requests{resource="cpu"} * on(namespace,pod) group_left() (kube_pod_status_phase{phase="Running"} == 1)) > 0
        # Ratios compare the SAME window on both sides (1h averages), never an instant of requests
        # against a windowed usage rate: requests count only pods Running at the instant, usage rates
        # also carry pods that just finished, so an instant ratio misleads for short-job modules
        # (cicd, tekton-*, bifrost-owner-exec). Even windowed, read those with the peak ratio too.
        - record: bifrost_module:cpu_request_over_usage_ratio_1h
          expr: avg_over_time(bifrost_module:cpu_requests_cores[1h]) / clamp_min(avg_over_time(bifrost_module:cpu_usage_cores[1h]), 0.01)
        - record: bifrost_module:mem_request_over_usage_ratio_1h
          expr: avg_over_time(bifrost_module:mem_requests_bytes[1h]) / clamp_min(avg_over_time(bifrost_module:mem_working_set_bytes[1h]), 1)
        - record: bifrost_module:cpu_request_over_peak_usage_ratio_1h
          expr: avg_over_time(bifrost_module:cpu_requests_cores[1h]) / clamp_min(max_over_time(bifrost_module:cpu_usage_cores[1h]), 0.01)
        - record: bifrost_module:mem_request_over_peak_usage_ratio_1h
          expr: avg_over_time(bifrost_module:mem_requests_bytes[1h]) / clamp_min(max_over_time(bifrost_module:mem_working_set_bytes[1h]), 1)
        - record: bifrost_node:cpu_requests_share
          expr: sum by (node)(kube_pod_container_resource_requests{resource="cpu"} * on(namespace,pod) group_left() (kube_pod_status_phase{phase="Running"} == 1)) / on(node) kube_node_status_allocatable{resource="cpu"}
        - record: bifrost_node:cpu_requests_share_1h
          expr: avg_over_time(bifrost_node:cpu_requests_share[1h])
    # SSD efficiency and wear (formal compute indicators, Owner 2026-11-19), per node (instance label; 01=.73 02=.70 04=.75 05=.77 07=.80).
    # node_exporter has no per-IO histogram: the "p95" below is the 95th percentile of 5-minute AVERAGE latencies over 1h.
    # Remaining life needs SMART percentage_used and rated TBW; neither is exported for the k3s nodes, so it is NOT recorded here
    # (kept as unknown in the ledger; formula: life_days = (100-used)/used * written_to_date_TB / written_TB_per_day).
    - name: bifrost-compute-ssd
      interval: 5m
      rules:
        - record: bifrost_node:disk_write_latency_seconds_5m
          expr: sum by (instance)(rate(node_disk_write_time_seconds_total{job="node-exporter",device="nvme0n1"}[5m])) / sum by (instance)(rate(node_disk_writes_completed_total{job="node-exporter",device="nvme0n1"}[5m]))
        - record: bifrost_node:disk_read_latency_seconds_5m
          expr: sum by (instance)(rate(node_disk_read_time_seconds_total{job="node-exporter",device="nvme0n1"}[5m])) / sum by (instance)(rate(node_disk_reads_completed_total{job="node-exporter",device="nvme0n1"}[5m]))
        - record: bifrost_node:disk_busy_ratio_5m
          expr: avg by (instance)(rate(node_disk_io_time_seconds_total{job="node-exporter",device="nvme0n1"}[5m]))
        - record: bifrost_node:disk_write_latency_seconds_p95_1h
          expr: quantile_over_time(0.95, bifrost_node:disk_write_latency_seconds_5m[1h])
        - record: bifrost_node:disk_read_latency_seconds_p95_1h
          expr: quantile_over_time(0.95, bifrost_node:disk_read_latency_seconds_5m[1h])
        - record: bifrost_node:disk_written_tb_per_day
          expr: increase(node_disk_written_bytes_total{job="node-exporter",device="nvme0n1"}[1d]) / 1e12
        # Write budget input for the CI node picker (Owner 2026-11-19: SSD wear is a formal indicator).
        # Budget: 150GB per rolling 6 hours per node, from one case (07 slowed after ~220GB sustained, then recovered when idle).
        # One sample only: the ratio is a reading for the picker to weigh, not a hard limit.
        - record: bifrost_node:disk_written_gb_6h
          expr: increase(node_disk_written_bytes_total{job="node-exporter",device="nvme0n1"}[6h]) / 1e9
        - record: bifrost_node:disk_write_budget_ratio_6h
          expr: bifrost_node:disk_written_gb_6h / 150
        # Same budget over 2 hours (75GB, the 6h figure scaled down): a faster signal for picking nodes.
        - record: bifrost_node:disk_written_gb_2h
          expr: increase(node_disk_written_bytes_total{job="node-exporter",device="nvme0n1"}[2h]) / 1e9
        - record: bifrost_node:disk_write_budget_ratio_2h
          expr: bifrost_node:disk_written_gb_2h / 75
        - record: bifrost_node:ci_write_gb_1h
          expr: sum by (node)(increase(container_fs_writes_bytes_total{namespace="cicd",container!="",container!="POD",device=~"/dev/nvme0n1.*",pod=~".*-pod"}[1h])) / 1e9
    # CI write volume per task class over the last hour (cadvisor container writes of the physical device only: on LVM nodes 01/02/04/05 cadvisor also reports the logical dm-0 series, which would double the sum).
    # class = pipeline family / task. Pods that match no class are summed into the series with an empty class label.
    - name: bifrost-compute-ci-writes
      interval: 5m
      rules:
        - record: bifrost_ci:fs_write_gb_1h
          expr: sum by (class)(label_replace(sum by (pod)(increase(container_fs_writes_bytes_total{namespace="cicd",container!="",container!="POD",device=~"/dev/nvme0n1.*",pod=~".*-pod"}[1h])), "class", "$1/$3", "pod", "((?:ci-[a-z]+|land|bifrost-deliver-platform(?:-prod)?))-([0-9a-z]{5}|[0-9]{10})-(.*)-pod")) / 1e9
        - record: bifrost_ci:runs_1h
          expr: count by (class)(label_replace(kube_pod_created{namespace="cicd",pod=~".*-pod"} > time()-3600, "class", "$1/$3", "pod", "((?:ci-[a-z]+|land|bifrost-deliver-platform(?:-prod)?))-([0-9a-z]{5}|[0-9]{10})-(.*)-pod"))
        - record: bifrost_ci:fs_write_gb_per_run_1h
          expr: bifrost_ci:fs_write_gb_1h / on(class) bifrost_ci:runs_1h
    # Temporary files written by PostgreSQL (sorts and hashes over work_mem), per database and instance. Counters are cumulative since the
    # stats were created (stats_reset is NULL), so only the 1-day increase says anything about the recent rate.
    - name: bifrost-compute-pg-temp
      interval: 15m
      rules:
        - record: bifrost_pg:temp_gb_1d
          expr: sum by (datname,pod)(increase(cnpg_pg_stat_database_temp_bytes{datname=~"bifrost.*"}[1d])) / 1e9
        - record: bifrost_pg:temp_files_1d
          expr: sum by (datname,pod)(increase(cnpg_pg_stat_database_temp_files{datname=~"bifrost.*"}[1d]))
    # Meta-alert (LANE-compute, 2026-11-19). On 2026-11-14 the live PrometheusRule bifrost-alerting-rules lost its `release: kube-prometheus-stack`
    # label (a single-file kubectl apply does that, see kustomization.yaml), Prometheus' ruleSelector stopped selecting it and all 71 of its rules
    # (BifrostClusterNodeDown, BifrostProdWorkloadUnavailable, the elastic-standby marker...) were silently not evaluated for about 4.5 days.
    # This fires when one group of each of the two big alert files is not loaded. It lives in a different file on purpose.
    - name: bifrost-compute-rule-load
      rules:
        - alert: BifrostAlertRuleFileNotLoaded
          expr: |
            absent(prometheus_rule_group_rules{rule_group=~".*monitoring-bifrost-alerting-rules.*;bifrost-infrastructure"})
            or
            absent(prometheus_rule_group_rules{rule_group=~".*monitoring-bifrost-host-rules.*;bifrost-hosts"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "A Bifrost alert rule file is not loaded by Prometheus"
            description: "No rules of bifrost-alerting-rules (group bifrost-infrastructure) or bifrost-host-rules (group bifrost-hosts) are loaded. Most likely the PrometheusRule lost its label release=kube-prometheus-stack: kubectl -n monitoring get prometheusrule <name> --show-labels. Re-apply the file from k8s/monitoring with plan_manifest / apply_manifest."
# 7 天峰值不单独录，读时用 quantile_over_time(0.95, bifrost_module:cpu_usage_cores[7d]) 一类（录入后才有数据，7 天后可读）。
# 磁盘的「要」没有来源（Pod 不申报），本组不假装；见 compute/disk-demand-line-2026-11-18.md。
