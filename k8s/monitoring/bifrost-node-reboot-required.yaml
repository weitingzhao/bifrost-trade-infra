# LANE-W33. Signal only: whether a node still has Ubuntu/Debian's reboot-required
# stamp. Nothing is installed on the node and no node config is changed.
# hostPath /var/run is read-only. The process publishes Prometheus text every
# 5 minutes. This is not a maintainer.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-reboot-required
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-reboot-required
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: bifrost
    release: kube-prometheus-stack
    app.kubernetes.io/component: signal
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-reboot-required
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-reboot-required
        app.kubernetes.io/part-of: bifrost
    spec:
      # /var/run also holds the containerd and k3s sockets, and a read-only
      # mount does not stop connect(). Run as nobody (the sockets are root:root
      # 0660) with no service-account token; reboot-required is world-readable.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: reboot-required
          image: docker.io/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9109
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              node="${NODE_NAME:?}"
              case "$node" in
                *[!A-Za-z0-9._-]*) echo "node name is not a prometheus label" >&2; exit 1 ;;
              esac
              write_metrics() {
                if [ -e /var/run/reboot-required ]; then
                  req=1
                  since="$(stat -c %Y /var/run/reboot-required)"
                else
                  req=0
                  since=0
                fi
                {
                  echo '# HELP bifrost_node_reboot_required 1 when /var/run/reboot-required exists on the node.'
                  echo '# TYPE bifrost_node_reboot_required gauge'
                  echo "bifrost_node_reboot_required{node=\"${node}\"} ${req}"
                  echo '# HELP bifrost_node_reboot_required_since_seconds Unix mtime of /var/run/reboot-required, or 0 when the file is absent.'
                  echo '# TYPE bifrost_node_reboot_required_since_seconds gauge'
                  echo "bifrost_node_reboot_required_since_seconds{node=\"${node}\"} ${since}"
                } > /tmp/metrics.tmp
                mv /tmp/metrics.tmp /tmp/metrics
              }
              last=0
              while true; do
                now="$(date +%s)"
                if [ ! -f /tmp/metrics ] || [ $((now - last)) -ge 300 ]; then
                  write_metrics
                  last="$now"
                fi
                {
                  printf 'HTTP/1.0 200 OK\r\nContent-Type: text/plain; version=0.0.4; charset=utf-8\r\nConnection: close\r\n\r\n'
                  cat /tmp/metrics
                } | nc -l -p 9109
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: var-run
          hostPath:
            path: /var/run
            type: Directory
        - name: tmp
          emptyDir: {}
