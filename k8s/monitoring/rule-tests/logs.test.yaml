# promtool test for BifrostLokiNotReady (LANE-metrics, 2026-11-20).
# Origin: loki-0 not ready 02:56Z-18:44Z on 2026-11-20 (volume on the shut-down ubt-k3s-05),
# and no alert. The ready case is the positive control for the firing ones. Promtail drops
# are BifrostPromtailDroppingLogs in bifrost-alerting-rules.yaml (one rule per name). Run: make check-alert-rules.
rule_files:
  - bifrost-logs.yaml

evaluation_interval: 1m

tests:
  - name: loki ready, nothing fires
    interval: 1m
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="monitoring",statefulset="loki"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: BifrostLokiNotReady
        exp_alerts: []

  - name: loki down for 10 minutes fires
    interval: 1m
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="monitoring",statefulset="loki"}'
        values: '1 0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BifrostLokiNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Loki has no ready replica"
              description: "StatefulSet monitoring/loki has had no ready pod for 10 minutes: cluster logs are not being kept and cannot be recovered later. Check where loki-0 is scheduled and its volume (loki-data-nfs): kubectl -n monitoring describe pod loki-0."

  - name: the StatefulSet series gone fires on absent
    interval: 1m
    input_series:
      - series: 'up{job="other"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: BifrostLokiNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              statefulset: loki
            exp_annotations:
              summary: "Loki has no ready replica"
              description: "StatefulSet monitoring/loki has had no ready pod for 10 minutes: cluster logs are not being kept and cannot be recovered later. Check where loki-0 is scheduled and its volume (loki-data-nfs): kubectl -n monitoring describe pod loki-0."
