# Work 558: long polls, real latency, and per-instance connection headroom.
rule_files:
- bifrost-alerting-rules.yaml
evaluation_interval: 1m
tests:
- name: 'bifrost-platform-prod: long polls do not page'
  interval: 1m
  input_series:
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/lineage",le="0.5"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/lineage",le="5"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/lineage",le="10"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/lineage",le="+Inf"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/claim",le="0.5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/claim",le="5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/claim",le="10"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/claim",le="+Inf"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/messages",le="0.5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/messages",le="5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/messages",le="10"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/messages",le="+Inf"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/approvals/claim",le="0.5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/approvals/claim",le="5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/approvals/claim",le="10"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/approvals/claim",le="+Inf"}
    values: 0+60x30
  alert_rule_test:
  - eval_time: 20m
    alertname: BifrostAPIHighLatency
    exp_alerts: []
- name: 'bifrost-platform-prod: ordinary slow reads still page'
  interval: 1m
  input_series:
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/lineage",le="0.5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/lineage",le="5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/lineage",le="10"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/lineage",le="+Inf"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/claim",le="0.5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/claim",le="5"}
    values: 0+0x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/claim",le="10"}
    values: 0+60x30
  - series: http_request_duration_seconds_bucket{namespace="bifrost-platform-prod",service="platform-api",handler="/api/v1/agentrt/claim",le="+Inf"}
    values: 0+60x30
  alert_rule_test:
  - eval_time: 20m
    alertname: BifrostAPIHighLatency
    exp_alerts:
    - exp_labels:
        namespace: bifrost-platform-prod
        service: platform-api
        severity: warning
      exp_annotations:
        summary: Bifrost API high P99 latency
        description: Service platform-api in bifrost-platform-prod P99 latency to
          the response headers has been above 5s for 10m.
