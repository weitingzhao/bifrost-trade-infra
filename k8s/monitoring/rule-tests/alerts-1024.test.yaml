- name: 103 backends with capacity 200
  interval: 1m
  input_series:
  - series: cnpg_backends_total{namespace="data",pod="pg-1",datname="a"}
    values: 93x20
  - series: cnpg_backends_total{namespace="data",pod="pg-1",datname="b"}
    values: 10x20
  - series: cnpg_pg_settings_setting{namespace="data",pod="pg-1",name="max_connections"}
    values: 200x20
  - series: cnpg_pg_settings_setting{namespace="data",pod="pg-2",name="max_connections"}
    values: 1000x20
  alert_rule_test:
  - eval_time: 10m
    alertname: BifrostPostgresHighConnections
    exp_alerts: []
