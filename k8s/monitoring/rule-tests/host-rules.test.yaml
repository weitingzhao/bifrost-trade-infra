# promtool unit tests for bifrost-host-rules.yaml (W-68 B4 ①).
# Run: make check-alert-rules. The rule file is extracted from the PrometheusRule of the
# same name in k8s/monitoring by scripts/check_alert_rules.py. The cluster evaluates
# every 30s (Prometheus CR evaluationInterval), so the host and Gitea timings are
# tested at 30s.
rule_files:
  - bifrost-host-rules.yaml

evaluation_interval: 30s

tests:
  - name: an external host that stops answering pages after 1 minute; a cluster node does not
    interval: 30s
    input_series:
      # The NAS answers until 120s and is gone from 150s.
      - series: 'up{job="node-exporter",scope="external",host="nas",instance="192.168.10.20:9100"}'
        values: '1x4 0x12'
      - series: 'up{job="node-exporter",scope="external",host="agent-06",instance="192.168.10.79:9100"}'
        values: '1x16'
      - series: 'up{job="node-exporter",scope="external",host="mini-50",instance="192.168.10.50:9100"}'
        values: '1x16'
      - series: 'up{job="node-exporter",scope="external",host="mini-52",instance="192.168.10.52:9100"}'
        values: '1x16'
      # A cluster node's target has no scope label: KubeNodeNotReady is its alert.
      - series: 'up{job="node-exporter",namespace="monitoring",instance="192.168.10.73:9100"}'
        values: '0x16'
    alert_rule_test:
      # First failed sample at 150s: pending.
      - eval_time: 3m
        alertname: BifrostHostDown
        exp_alerts: []
      - eval_time: 3m30s
        alertname: BifrostHostDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node-exporter
              scope: external
              host: nas
              instance: 192.168.10.20:9100
            exp_annotations:
              summary: "Host nas (192.168.10.20:9100) is not answering"
              description: "node_exporter on nas has not answered for a minute: the host is off, hung or off the network, or only node_exporter stopped. agent-06: both agentd stop. nas: registry, MinIO backups, WAL archive and Prometheus's disk. mini-50: the ntfy relay (no other page gets through). mini-52: the watchdog over that relay. A Mac mini with FileVault waits at the unlock screen after a reboot until someone logs in."
      - eval_time: 8m
        alertname: BifrostHostTargetsMissing
        exp_alerts: []

  - name: a host dropped from the target list is noticed
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter",scope="external",host="nas",instance="192.168.10.20:9100"}'
        values: '1x15'
      - series: 'up{job="node-exporter",scope="external",host="mini-50",instance="192.168.10.50:9100"}'
        values: '1x15'
      - series: 'up{job="node-exporter",scope="external",host="mini-52",instance="192.168.10.52:9100"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: BifrostHostTargetsMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: BifrostHostTargetsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              scope: external
              host: agent-06
            exp_annotations:
              summary: "Host agent-06 is not among Prometheus's targets"
              description: "ScrapeConfig monitoring/bifrost-hosts-node gives Prometheus no target for agent-06, so BifrostHostDown cannot fire for it. Check that k8s/monitoring/bifrost-hosts-external.yaml is applied and lists all four."

  - name: SMART failing, unreadable sectors and a vanished disk page; a healthy disk does not
    interval: 1m
    input_series:
      # sdb's health turns FAILED at 10m.
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdb"}'
        values: '1x9 0x30'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdb"}'
        values: '0x9 8x30'
      # sda stays healthy; its pending-sector count goes to 8 at 10m.
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sda"}'
        values: '1x39'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sda"}'
        values: '0x39'
      - series: 'smartctl_device_attribute{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sda",attribute_name="Current_Pending_Sector",attribute_id="197",attribute_value_type="raw",attribute_flags_short="-O--CK",attribute_flags_long="updateonline,eventcount,autokeep"}'
        values: '0x9 8x30'
      # The NAS saw 3 disks; from 5m it sees 2.
      - series: 'smartctl_devices{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633"}'
        values: '3x4 2x35'
    alert_rule_test:
      - eval_time: 9m
        alertname: BifrostHostDiskSmartFailing
        exp_alerts: []
      - eval_time: 16m
        alertname: BifrostHostDiskSmartFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: smartctl
              scope: external
              host: nas
              instance: 192.168.10.20:9633
              device: sdb
            exp_annotations:
              summary: "Disk sdb on nas reports SMART failing"
              description: "smartctl says sdb on nas is failing or about to. On the NAS it is one of the three RAID 5 disks: a second failure loses /volume1. Replace it; read `smartctl -a /dev/sdb` as root on the host first."
      - eval_time: 21m
        alertname: BifrostHostDiskBadSectors
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nas
              instance: 192.168.10.20:9633
              device: sda
              attribute_name: Current_Pending_Sector
            exp_annotations:
              summary: "Disk sda on nas has 8 unreadable sectors"
              description: "Current_Pending_Sector is 8 on sda (nas). Plan the replacement; on the NAS check the array in UGOS Storage before anything else touches the disks."
      - eval_time: 25m
        alertname: BifrostHostDiskMissing
        exp_alerts: []
      - eval_time: 31m
        alertname: BifrostHostDiskMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: smartctl
              scope: external
              host: nas
              instance: 192.168.10.20:9633
            exp_annotations:
              summary: "A disk disappeared from nas"
              description: "smartctl_exporter on nas sees 2 disks, fewer than earlier today. On the NAS check UGOS Storage; NodeRAIDDegraded follows if it was a RAID member."

  - name: a prefail attribute at threshold (exit status bit 4) pages even while health still says PASSED
    interval: 1m
    input_series:
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="agent-06",instance="192.168.10.79:9633",device="sda"}'
        values: '1x15'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="agent-06",instance="192.168.10.79:9633",device="sda"}'
        values: '0x4 16x10'
    alert_rule_test:
      - eval_time: 11m
        alertname: BifrostHostDiskSmartFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: smartctl
              scope: external
              host: agent-06
              instance: 192.168.10.79:9633
              device: sda
            exp_annotations:
              summary: "Disk sda on agent-06 reports SMART failing"
              description: "smartctl says sda on agent-06 is failing or about to. On the NAS it is one of the three RAID 5 disks: a second failure loses /volume1. Replace it; read `smartctl -a /dev/sda` as root on the host first."

  - name: Gitea failing through one path pages after 2 minutes
    interval: 30s
    input_series:
      # The NodePort path fails from 90s; the Service path stays up.
      - series: 'probe_success{job="gitea-probe",via="nodeport",instance="http://192.168.10.73:30300/api/healthz"}'
        values: '1x2 0x10'
      - series: 'probe_success{job="gitea-probe",via="service",instance="http://gitea.cicd.svc.cluster.local:3000/api/healthz"}'
        values: '1x12'
      - series: 'up{job="gitea-probe",via="nodeport",instance="http://192.168.10.73:30300/api/healthz"}'
        values: '1x12'
      - series: 'up{job="gitea-probe",via="service",instance="http://gitea.cicd.svc.cluster.local:3000/api/healthz"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 3m
        alertname: BifrostGiteaUnavailable
        exp_alerts: []
      - eval_time: 3m30s
        alertname: BifrostGiteaUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: gitea-probe
              via: nodeport
              instance: http://192.168.10.73:30300/api/healthz
            exp_annotations:
              summary: "Gitea is unavailable through the nodeport path"
              description: "GET http://192.168.10.73:30300/api/healthz has failed for 2 minutes. CI does not start, Argo CD cannot sync and the agentd on 06 cannot fetch or push. Gitea is one pod on ubt-k3s-01: `kubectl -n cicd get pod -l app=gitea -o wide`."
      - eval_time: 5m
        alertname: BifrostGiteaProbeDown
        exp_alerts: []

  # Review 537 A2: one of two SMART targets missing. The old rule (up == 0 or absent of the
  # whole job) stayed silent while agent-06 alone answered.
  - name: the NAS's SMART target missing while agent-06's answers still fires
    interval: 1m
    input_series:
      - series: 'up{job="smartctl",scope="external",host="agent-06",instance="192.168.10.79:9633"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: BifrostHostSmartExporterDown
        exp_alerts: []
      - eval_time: 16m
        alertname: BifrostHostSmartExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: smartctl
              host: nas
            exp_annotations:
              summary: "No SMART data from nas"
              description: "smartctl_exporter on nas has not answered for 15 minutes, or ScrapeConfig monitoring/bifrost-hosts-smartctl has no target for it. If the host is down, BifrostHostDown has paged already."

  # Review 540: every SMART target and every Gitea path missing at once. Each absent()
  # fires on its own, so each expected identity gets its own alert at its own for.
  - name: no SMART target and no Gitea path at all raise one alert per expected identity
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter",scope="external",host="nas",instance="192.168.10.20:9100"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: BifrostHostSmartExporterDown
        exp_alerts: []
      - eval_time: 16m
        alertname: BifrostHostSmartExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: smartctl
              host: agent-06
            exp_annotations:
              summary: "No SMART data from agent-06"
              description: "smartctl_exporter on agent-06 has not answered for 15 minutes, or ScrapeConfig monitoring/bifrost-hosts-smartctl has no target for it. If the host is down, BifrostHostDown has paged already."
          - exp_labels:
              severity: warning
              job: smartctl
              host: nas
            exp_annotations:
              summary: "No SMART data from nas"
              description: "smartctl_exporter on nas has not answered for 15 minutes, or ScrapeConfig monitoring/bifrost-hosts-smartctl has no target for it. If the host is down, BifrostHostDown has paged already."
      - eval_time: 9m
        alertname: BifrostGiteaProbeDown
        exp_alerts: []
      - eval_time: 11m
        alertname: BifrostGiteaProbeDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: gitea-probe
              via: nodeport
            exp_annotations:
              summary: "The Gitea probe for the nodeport path is not running"
              description: "Prometheus cannot reach the prober (Deployment monitoring/bifrost-blackbox-exporter) for the nodeport path, or ScrapeConfig monitoring/bifrost-gitea-probe has no target for it, so BifrostGiteaUnavailable cannot fire for that path."
          - exp_labels:
              severity: warning
              job: gitea-probe
              via: service
            exp_annotations:
              summary: "The Gitea probe for the service path is not running"
              description: "Prometheus cannot reach the prober (Deployment monitoring/bifrost-blackbox-exporter) for the service path, or ScrapeConfig monitoring/bifrost-gitea-probe has no target for it, so BifrostGiteaUnavailable cannot fire for that path."

  # Review 537 A2: one of the two Gitea paths missing from the ScrapeConfig.
  - name: the Gitea NodePort path missing while the Service path answers still fires
    interval: 1m
    input_series:
      - series: 'up{job="gitea-probe",via="service",instance="http://gitea.cicd.svc.cluster.local:3000/api/healthz"}'
        values: '1x15'
      - series: 'probe_success{job="gitea-probe",via="service",instance="http://gitea.cicd.svc.cluster.local:3000/api/healthz"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: BifrostGiteaProbeDown
        exp_alerts: []
      - eval_time: 11m
        alertname: BifrostGiteaProbeDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: gitea-probe
              via: nodeport
            exp_annotations:
              summary: "The Gitea probe for the nodeport path is not running"
              description: "Prometheus cannot reach the prober (Deployment monitoring/bifrost-blackbox-exporter) for the nodeport path, or ScrapeConfig monitoring/bifrost-gitea-probe has no target for it, so BifrostGiteaUnavailable cannot fire for that path."

  # Review 537 A3: the exporter answers (up = 1) but has seen no disk from the start, so
  # there is no health metric and no history for BifrostHostDiskMissing to compare with.
  - name: SMART up but blind to every NAS disk pages after 2 hours
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter",scope="external",host="nas",instance="192.168.10.20:9100"}'
        values: '1x130'
      - series: 'up{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633"}'
        values: '1x130'
      - series: 'smartctl_devices{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633"}'
        values: '0x130'
    alert_rule_test:
      - eval_time: 1h59m
        alertname: BifrostNasSmartBlind
        exp_alerts: []
      - eval_time: 2h1m
        alertname: BifrostNasSmartBlind
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nas
            exp_annotations:
              summary: "The NAS's disks have been out of SMART's sight for 2 hours"
              description: "For 2 hours Prometheus has not had SMART health for all three RAID disks of the NAS: smartctl_exporter is down or not configured, sees fewer than 3 disks, a disk reports no health, or smartctl cannot read one. Until this clears, a failing disk is not reported. As root on the NAS: docker compose -f /volume1/@bifrost/host-exporters/compose.yaml logs smartctl-exporter."
      - eval_time: 2h1m
        alertname: BifrostHostDiskMissing
        exp_alerts: []

  # Review 537 A3: three disks, all with health 1, but smartctl cannot read sdb (exit 2,
  # "device open failed"): no SMART failure is reported, only the read-error bit.
  - name: a read-error bit with no SMART failure pages after 2 hours on the NAS
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter",scope="external",host="nas",instance="192.168.10.20:9100"}'
        values: '1x130'
      - series: 'up{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633"}'
        values: '1x130'
      - series: 'smartctl_devices{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633"}'
        values: '3x130'
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sda"}'
        values: '1x130'
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdb"}'
        values: '1x130'
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdc"}'
        values: '1x130'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sda"}'
        values: '0x130'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdb"}'
        values: '2x130'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdc"}'
        values: '0x130'
    alert_rule_test:
      - eval_time: 2h1m
        alertname: BifrostHostDiskSmartFailing
        exp_alerts: []
      - eval_time: 1h59m
        alertname: BifrostNasSmartBlind
        exp_alerts: []
      - eval_time: 2h1m
        alertname: BifrostNasSmartBlind
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nas
            exp_annotations:
              summary: "The NAS's disks have been out of SMART's sight for 2 hours"
              description: "For 2 hours Prometheus has not had SMART health for all three RAID disks of the NAS: smartctl_exporter is down or not configured, sees fewer than 3 disks, a disk reports no health, or smartctl cannot read one. Until this clears, a failing disk is not reported. As root on the NAS: docker compose -f /volume1/@bifrost/host-exporters/compose.yaml logs smartctl-exporter."

  # The guard stays quiet when SMART sees all three disks, and when the whole NAS is down
  # (BifrostHostDown has paged for that).
  - name: a healthy NAS, and a NAS that is down altogether, do not raise the blind alert
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter",scope="external",host="nas",instance="192.168.10.20:9100"}'
        values: '1x60 0x150'
      - series: 'up{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633"}'
        values: '1x60 0x150'
      - series: 'smartctl_devices{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633"}'
        values: '3x60 _x150'
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sda"}'
        values: '1x60 _x150'
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdb"}'
        values: '1x60 _x150'
      - series: 'smartctl_device_smart_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdc"}'
        values: '1x60 _x150'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sda"}'
        values: '0x60 _x150'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdb"}'
        values: '0x60 _x150'
      - series: 'smartctl_device_smartctl_exit_status{job="smartctl",scope="external",host="nas",instance="192.168.10.20:9633",device="sdc"}'
        values: '0x60 _x150'
    alert_rule_test:
      - eval_time: 59m
        alertname: BifrostNasSmartBlind
        exp_alerts: []
      # Down from 61m: without the unless it would fire at 3h1m.
      - eval_time: 3h20m
        alertname: BifrostNasSmartBlind
        exp_alerts: []
