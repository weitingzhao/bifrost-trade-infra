# ValidatingAdmissionPolicy for TD-271. Built into Kubernetes; not a new dependency.
# Manual apply with the rest of k8s/platform-rbac. Not under Argo.
# tekton-trigger can still create PipelineRuns and is listed as a follow-up, not matched here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-pipelinerun
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pipelineruns"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cicd
  matchConditions:
    - name: platform-or-deliver
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform',
          'system:serviceaccount:cicd:tekton-deliver'
        ]
  validations:
    - expression: >-
        has(object.spec.pipelineRef) && has(object.spec.pipelineRef.name)
        && !has(object.spec.pipelineRef.resolver)
        && !has(object.spec.pipelineRef.params)
        && !has(object.spec.pipelineRef.bundle)
        && !has(object.spec.pipelineSpec)
      message: platform PipelineRuns must name a pipelineRef and must not use a resolver or an inline spec
    - expression: >-
        !has(object.spec.workspaces)
        || object.spec.workspaces.all(w,
          (has(w.volumeClaimTemplate) || has(w.emptyDir))
          && !has(w.secret) && !has(w.configMap) && !has(w.persistentVolumeClaim)
          && !has(w.projected) && !has(w.csi))
      message: platform PipelineRun workspaces may only be volumeClaimTemplate or emptyDir
    - expression: >-
        (
          !has(object.spec.taskRunTemplate) || !has(object.spec.taskRunTemplate.podTemplate)
          || (
            !has(object.spec.taskRunTemplate.podTemplate.automountServiceAccountToken)
            && !has(object.spec.taskRunTemplate.podTemplate.dnsConfig)
            && !has(object.spec.taskRunTemplate.podTemplate.dnsPolicy)
            && !has(object.spec.taskRunTemplate.podTemplate.enableServiceLinks)
            && !has(object.spec.taskRunTemplate.podTemplate.env)
            && !has(object.spec.taskRunTemplate.podTemplate.hostAliases)
            && !has(object.spec.taskRunTemplate.podTemplate.hostNetwork)
            && !has(object.spec.taskRunTemplate.podTemplate.imagePullSecrets)
            && !has(object.spec.taskRunTemplate.podTemplate.priorityClassName)
            && !has(object.spec.taskRunTemplate.podTemplate.runtimeClassName)
            && !has(object.spec.taskRunTemplate.podTemplate.schedulerName)
            && !has(object.spec.taskRunTemplate.podTemplate.securityContext)
            && !has(object.spec.taskRunTemplate.podTemplate.topologySpreadConstraints)
            && !has(object.spec.taskRunTemplate.podTemplate.volumes)
          )
        )
        && (
          !has(object.spec.taskRunSpecs)
          || object.spec.taskRunSpecs.all(s,
            !has(s.podTemplate)
            || (
              !has(s.podTemplate.automountServiceAccountToken)
              && !has(s.podTemplate.dnsConfig)
              && !has(s.podTemplate.dnsPolicy)
              && !has(s.podTemplate.enableServiceLinks)
              && !has(s.podTemplate.env)
              && !has(s.podTemplate.hostAliases)
              && !has(s.podTemplate.hostNetwork)
              && !has(s.podTemplate.imagePullSecrets)
              && !has(s.podTemplate.priorityClassName)
              && !has(s.podTemplate.runtimeClassName)
              && !has(s.podTemplate.schedulerName)
              && !has(s.podTemplate.securityContext)
              && !has(s.podTemplate.topologySpreadConstraints)
              && !has(s.podTemplate.volumes)
            ))
        )
      message: >-
        a platform PipelineRun podTemplate may set only nodeSelector, tolerations and affinity
        (no volumes, host network, host aliases, DNS settings, env or security context; review 545 F2)
    - expression: >-
        (
          !has(object.spec.taskRunTemplate)
          || !has(object.spec.taskRunTemplate.serviceAccountName)
          || (
            object.spec.taskRunTemplate.serviceAccountName in ['default', 'tekton-deliver', 'bifrost-applier']
            && !object.spec.taskRunTemplate.serviceAccountName.startsWith('argocd')
          )
        )
        && (
          !has(object.spec.taskRunSpecs)
          || object.spec.taskRunSpecs.all(s,
            !has(s.serviceAccountName)
            || (
              s.serviceAccountName in ['default', 'tekton-deliver', 'bifrost-applier']
              && !s.serviceAccountName.startsWith('argocd')
            )
          )
        )
      message: platform PipelineRun service accounts must be allow-listed and must not be argocd-*
    - expression: >-
        (
          (
            !has(object.spec.taskRunTemplate)
            || !has(object.spec.taskRunTemplate.serviceAccountName)
            || object.spec.taskRunTemplate.serviceAccountName != 'bifrost-applier'
          )
          && (
            !has(object.spec.taskRunSpecs)
            || object.spec.taskRunSpecs.all(s, !has(s.serviceAccountName) || s.serviceAccountName != 'bifrost-applier')
          )
        )
        || object.spec.pipelineRef.name == 'bifrost-apply-manifest'
      message: bifrost-applier may only run bifrost-apply-manifest
    - expression: >-
        (
          !has(object.spec.taskRunTemplate) || !has(object.spec.taskRunTemplate.serviceAccountName)
          || object.spec.taskRunTemplate.serviceAccountName == 'default'
          || (object.spec.taskRunTemplate.serviceAccountName == 'bifrost-applier'
              && object.spec.pipelineRef.name == 'bifrost-apply-manifest')
        )
        && (
          !has(object.spec.taskRunSpecs)
          || object.spec.taskRunSpecs.all(s,
            !has(s.serviceAccountName) || s.serviceAccountName == 'default'
            || (s.serviceAccountName == 'bifrost-applier' && object.spec.pipelineRef.name == 'bifrost-apply-manifest')
            || (s.serviceAccountName == 'tekton-deliver' && has(s.pipelineTaskName)
                && (object.spec.pipelineRef.name + '/' + s.pipelineTaskName) in [
              'bifrost-deliver-stg/prepare',
              'bifrost-deliver-stg/rollout',
              'bifrost-deliver-stg/gitops-sync',
              'bifrost-deliver-prod/prepare',
              'bifrost-deliver-prod/rollout',
              'bifrost-deliver-prod/gitops-sync',
              'bifrost-deliver-platform/rollout',
              'bifrost-deliver-platform/gitops-sync',
              'bifrost-deliver-platform/agentrt-migrate',
              'bifrost-deliver-platform-prod/rollout',
              'bifrost-deliver-platform-prod/gitops-sync',
              'bifrost-deliver-platform-prod/check-source',
              'bifrost-deliver-research/rollout-research',
              'bifrost-deliver-research/verify-research',
              'bifrost-deliver-research/gitops-sync'
            ]))
        )
      message: >-
        tekton-deliver runs only the listed delivery steps, bifrost-applier only bifrost-apply-manifest;
        every other step runs as default (TD-436)
    - expression: >-
        !has(object.spec.params)
        || object.spec.params.all(p,
          type(p.value) == string
          && p.value.matches('^([\\p{L}\\p{N}._/:@+=][\\p{L}\\p{N}._/:@+=-]{0,255})?$'))
      message: >-
        platform run parameters must be plain strings of letters, digits and ._/:@+=- (at most 256, no leading dash) (TD-435, TD-436)
    - expression: >-
        !has(object.spec.params)
        || object.spec.params.all(p,
          (p.name != 'giteaBase' || p.value == 'http://gitea.cicd.svc.cluster.local:3000/bifrost')
          && (p.name != 'url' || (type(p.value) == string
            && p.value.startsWith('http://gitea.cicd.svc.cluster.local:3000/bifrost/'))))
      message: >-
        platform run giteaBase must be the in-cluster Gitea and url must point into it (TD-435, TD-436, review 546 R2)
---
