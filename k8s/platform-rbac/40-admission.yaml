# ValidatingAdmissionPolicy for TD-271. Built into Kubernetes; not a new dependency.
# Manual apply with the rest of k8s/platform-rbac. Not under Argo.
# tekton-trigger can still create PipelineRuns and is listed as a follow-up, not matched here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-pipelinerun
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pipelineruns"]
    namespaceSelector:
      matchNames: ["cicd"]
  matchConditions:
    - name: platform-or-deliver
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform',
          'system:serviceaccount:cicd:tekton-deliver'
        ]
  validations:
    - expression: >-
        has(object.spec.pipelineRef) && !has(object.spec.pipelineSpec)
      message: platform PipelineRuns must use pipelineRef and must not inline a spec
    - expression: >-
        (
          !has(object.spec.taskRunTemplate)
          || !has(object.spec.taskRunTemplate.serviceAccountName)
          || (
            object.spec.taskRunTemplate.serviceAccountName in ['default', 'tekton-deliver', 'bifrost-applier']
            && !object.spec.taskRunTemplate.serviceAccountName.startsWith('argocd')
          )
        )
        && (
          !has(object.spec.taskRunSpecs)
          || object.spec.taskRunSpecs.all(s,
            !has(s.serviceAccountName)
            || (
              s.serviceAccountName in ['default', 'tekton-deliver', 'bifrost-applier']
              && !s.serviceAccountName.startsWith('argocd')
            )
          )
        )
      message: platform PipelineRun service accounts must be allow-listed and must not be argocd-*
    - expression: >-
        (
          (
            !has(object.spec.taskRunTemplate)
            || !has(object.spec.taskRunTemplate.serviceAccountName)
            || object.spec.taskRunTemplate.serviceAccountName != 'bifrost-applier'
          )
          && (
            !has(object.spec.taskRunSpecs)
            || object.spec.taskRunSpecs.all(s, !has(s.serviceAccountName) || s.serviceAccountName != 'bifrost-applier')
          )
        )
        || object.spec.pipelineRef.name == 'bifrost-apply-manifest'
      message: bifrost-applier may only run bifrost-apply-manifest
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-taskrun
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["taskruns"]
    namespaceSelector:
      matchNames: ["cicd"]
  matchConditions:
    - name: platform-or-deliver
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform',
          'system:serviceaccount:cicd:tekton-deliver'
        ]
  validations:
    - expression: has(object.spec.taskRef) && !has(object.spec.taskSpec)
      message: platform TaskRuns must use taskRef and must not inline a spec
    - expression: >-
        !has(object.spec.serviceAccountName)
        || (
          object.spec.serviceAccountName in ['default', 'tekton-deliver', 'bifrost-applier']
          && !object.spec.serviceAccountName.startsWith('argocd')
        )
      message: platform TaskRun service accounts must be allow-listed and must not be argocd-*
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-job-sa
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: platform-identity
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform'
        ]
  validations:
    - expression: >-
        (
          object.kind != 'Job'
          || !has(object.spec.template.spec.serviceAccountName)
          || object.spec.template.spec.serviceAccountName == ''
          || object.spec.template.spec.serviceAccountName in ['default', 'backup-retry', 'maintainer-reconcile']
        )
        && (
          object.kind != 'Pod'
          || !has(object.spec.serviceAccountName)
          || object.spec.serviceAccountName == ''
          || object.spec.serviceAccountName in ['default', 'backup-retry', 'maintainer-reconcile']
        )
      message: platform Jobs and Pods may only use an allow-listed service account
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-application
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["applications"]
    namespaceSelector:
      matchNames: ["cicd"]
  matchConditions:
    - name: platform-or-deliver
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform',
          'system:serviceaccount:cicd:tekton-deliver'
        ]
  validations:
    - expression: >-
        object.spec.source.repoURL == oldObject.spec.source.repoURL
        && object.spec.source.path == oldObject.spec.source.path
        && object.spec.project == oldObject.spec.project
        && object.spec.destination.namespace == oldObject.spec.destination.namespace
        && object.spec.destination.server == oldObject.spec.destination.server
      message: platform may change only the sync operation and targetRevision
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bifrost-platform-pipelinerun
spec:
  policyName: bifrost-platform-pipelinerun
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bifrost-platform-taskrun
spec:
  policyName: bifrost-platform-taskrun
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bifrost-platform-job-sa
spec:
  policyName: bifrost-platform-job-sa
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bifrost-platform-application
spec:
  policyName: bifrost-platform-application
  validationActions: [Deny]
