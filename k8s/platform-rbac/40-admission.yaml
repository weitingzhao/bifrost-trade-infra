          && !has(object.spec.podTemplate.env)
          && !has(object.spec.podTemplate.hostAliases)
          && !has(object.spec.podTemplate.hostNetwork)
          && !has(object.spec.podTemplate.imagePullSecrets)
          && !has(object.spec.podTemplate.priorityClassName)
          && !has(object.spec.podTemplate.runtimeClassName)
