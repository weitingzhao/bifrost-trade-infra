# ValidatingAdmissionPolicy for TD-271. Built into Kubernetes; not a new dependency.
# Manual apply with the rest of k8s/platform-rbac. Not under Argo.
# tekton-trigger can still create PipelineRuns and is listed as a follow-up, not matched here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-pipelinerun
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pipelineruns"]
    namespaceSelector:
      matchNames: ["cicd"]
  matchConditions:
    - name: platform-or-deliver
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform',
          'system:serviceaccount:cicd:tekton-deliver'
        ]
  validations:
    - expression: >-
        has(object.spec.pipelineRef) && has(object.spec.pipelineRef.name)
        && !has(object.spec.pipelineRef.resolver)
        && !has(object.spec.pipelineRef.params)
        && !has(object.spec.pipelineRef.bundle)
        && !has(object.spec.pipelineSpec)
      message: platform PipelineRuns must name a pipelineRef and must not use a resolver or an inline spec
    - expression: >-
        !has(object.spec.workspaces)
        || object.spec.workspaces.all(w,
          (has(w.volumeClaimTemplate) || has(w.emptyDir))
          && !has(w.secret) && !has(w.configMap) && !has(w.persistentVolumeClaim)
          && !has(w.projected) && !has(w.csi))
      message: platform PipelineRun workspaces may only be volumeClaimTemplate or emptyDir
    - expression: >-
        (
          !has(object.spec.taskRunTemplate) || !has(object.spec.taskRunTemplate.podTemplate)
          || (
            !has(object.spec.taskRunTemplate.podTemplate.volumes)
            && (!has(object.spec.taskRunTemplate.podTemplate.hostNetwork)
              || object.spec.taskRunTemplate.podTemplate.hostNetwork == false)
          )
        )
        && (
          !has(object.spec.taskRunSpecs)
          || object.spec.taskRunSpecs.all(s,
            !has(s.podTemplate)
            || (
              !has(s.podTemplate.volumes)
              && (!has(s.podTemplate.hostNetwork) || s.podTemplate.hostNetwork == false)
            ))
        )
      message: platform PipelineRun podTemplate must not set volumes or hostNetwork
    - expression: >-
        (
          !has(object.spec.taskRunTemplate)
          || !has(object.spec.taskRunTemplate.serviceAccountName)
          || (
            object.spec.taskRunTemplate.serviceAccountName in ['default', 'tekton-deliver', 'bifrost-applier']
            && !object.spec.taskRunTemplate.serviceAccountName.startsWith('argocd')
          )
        )
        && (
          !has(object.spec.taskRunSpecs)
          || object.spec.taskRunSpecs.all(s,
            !has(s.serviceAccountName)
            || (
              s.serviceAccountName in ['default', 'tekton-deliver', 'bifrost-applier']
              && !s.serviceAccountName.startsWith('argocd')
            )
          )
        )
      message: platform PipelineRun service accounts must be allow-listed and must not be argocd-*
    - expression: >-
        (
          (
            !has(object.spec.taskRunTemplate)
            || !has(object.spec.taskRunTemplate.serviceAccountName)
            || object.spec.taskRunTemplate.serviceAccountName != 'bifrost-applier'
          )
          && (
            !has(object.spec.taskRunSpecs)
            || object.spec.taskRunSpecs.all(s, !has(s.serviceAccountName) || s.serviceAccountName != 'bifrost-applier')
          )
        )
        || object.spec.pipelineRef.name == 'bifrost-apply-manifest'
      message: bifrost-applier may only run bifrost-apply-manifest
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-taskrun
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["taskruns"]
    namespaceSelector:
      matchNames: ["cicd"]
  matchConditions:
    - name: platform-or-deliver
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform',
          'system:serviceaccount:cicd:tekton-deliver'
        ]
  validations:
    - expression: >-
        has(object.spec.taskRef) && has(object.spec.taskRef.name)
        && !has(object.spec.taskRef.resolver)
        && !has(object.spec.taskRef.params)
        && !has(object.spec.taskRef.bundle)
        && !has(object.spec.taskSpec)
