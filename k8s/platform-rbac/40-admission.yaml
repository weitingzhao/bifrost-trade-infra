apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-job-sa
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: platform-identity
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform'
        ]
  validations:
    - expression: >-
        (
          object.kind != 'Job'
          || !has(object.spec.template.spec.serviceAccountName)
          || object.spec.template.spec.serviceAccountName == ''
          || object.spec.template.spec.serviceAccountName in ['default', 'backup-retry', 'maintainer-reconcile']
        )
        && (
          object.kind != 'Pod'
          || !has(object.spec.serviceAccountName)
          || object.spec.serviceAccountName == ''
          || object.spec.serviceAccountName in ['default', 'backup-retry', 'maintainer-reconcile']
        )
      message: platform Jobs and Pods may only use an allow-listed service account
    - expression: >-
        (
          object.kind == 'Pod'
          ? (
            (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath)))
            && (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false)
            && (!has(object.spec.hostPID) || object.spec.hostPID == false)
            && (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
            && object.spec.containers.all(c,
              (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
              && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0))
            && (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
              (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
              && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0)))
          )
          : (
            (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v, !has(v.hostPath)))
            && (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false)
            && (!has(object.spec.template.spec.hostPID) || object.spec.template.spec.hostPID == false)
            && (!has(object.spec.template.spec.hostIPC) || object.spec.template.spec.hostIPC == false)
            && object.spec.template.spec.containers.all(c,
              (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
              && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0))
            && (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c,
              (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
              && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0)))
          )
        )
      message: platform Jobs and Pods must not use hostPath, host namespaces, privileged, or added capabilities
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-platform-application
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["applications"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cicd
  matchConditions:
    - name: platform-or-deliver
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:bifrost-platform-prod:bifrost-platform',
          'system:serviceaccount:bifrost-platform-stg:bifrost-platform',
          'system:serviceaccount:cicd:tekton-deliver'
        ]
  validations:
    - expression: >-
        has(object.spec.source) == has(oldObject.spec.source)
        && (
          !has(object.spec.source)
          || (
            object.spec.source.repoURL == oldObject.spec.source.repoURL
            && object.spec.source.path == oldObject.spec.source.path
            && has(object.spec.source.helm) == has(oldObject.spec.source.helm)
            && (!has(object.spec.source.helm) || object.spec.source.helm == oldObject.spec.source.helm)
            && has(object.spec.source.plugin) == has(oldObject.spec.source.plugin)
            && (!has(object.spec.source.plugin) || object.spec.source.plugin == oldObject.spec.source.plugin)
            && has(object.spec.source.directory) == has(oldObject.spec.source.directory)
            && (!has(object.spec.source.directory) || object.spec.source.directory == oldObject.spec.source.directory)
          )
        )
        && object.spec.project == oldObject.spec.project
        && object.spec.destination.namespace == oldObject.spec.destination.namespace
        && object.spec.destination.server == oldObject.spec.destination.server
        && has(object.spec.sources) == has(oldObject.spec.sources)
        && (!has(object.spec.sources) || object.spec.sources == oldObject.spec.sources)
      message: platform may change only the sync operation and targetRevision
    # spec.source.kustomize stays as it is, with one exception (TD-335, W-31 3.4 ①): a platform
    # delivery, as tekton-deliver, pins its own application to the two images it deploys, by
    # digest, and to nothing else (task-argocd-pin-sync-platform.yaml writes exactly this list).
    # Without the exception the first STG run's pin was denied here (2026-10-22).
    - expression: >-
        !has(object.spec.source) || !has(oldObject.spec.source)
        || (
          has(object.spec.source.kustomize) == has(oldObject.spec.source.kustomize)
          && (!has(object.spec.source.kustomize) || object.spec.source.kustomize == oldObject.spec.source.kustomize)
        )
        || (
          request.userInfo.username == 'system:serviceaccount:cicd:tekton-deliver'
          && object.metadata.name in ['bifrost-platform-stg', 'bifrost-platform-prod']
          && has(object.spec.source.kustomize)
          && object.spec.source.kustomize.all(k, k == 'images')
          && has(object.spec.source.kustomize.images)
          && size(object.spec.source.kustomize.images) == 2
          && object.spec.source.kustomize.images[0].matches('^registry[.]cicd[.]svc[.]cluster[.]local:5000/bifrost-platform-api=192[.]168[.]10[.]73:30500/bifrost-platform-api@sha256:[0-9a-f]{64}$')
          && object.spec.source.kustomize.images[1].matches('^registry[.]cicd[.]svc[.]cluster[.]local:5000/bifrost-platform-console=192[.]168[.]10[.]73:30500/bifrost-platform-console@sha256:[0-9a-f]{64}$')
        )
      message: only a platform delivery may change spec.source.kustomize, and only to pin its application's api and console images by digest
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-applier-pod-spec
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: applier
      expression: request.userInfo.username == 'system:serviceaccount:cicd:bifrost-applier'
  validations:
    - expression: >-
        object.metadata.namespace == 'monitoring' || object.kind == 'CronJob' || (
          (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v, !has(v.hostPath)))
          && (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false)
          && (!has(object.spec.template.spec.hostPID) || object.spec.template.spec.hostPID == false)
          && (!has(object.spec.template.spec.hostIPC) || object.spec.template.spec.hostIPC == false)
          && object.spec.template.spec.containers.all(c,
            (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
            && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0))
          && (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c,
            (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
            && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0)))
        )
      message: applier workloads must not use hostPath, host namespaces, privileged, or added capabilities
    - expression: >-
        object.kind != 'CronJob' || object.metadata.namespace == 'monitoring' || (
          (!has(object.spec.jobTemplate.spec.template.spec.volumes) || object.spec.jobTemplate.spec.template.spec.volumes.all(v, !has(v.hostPath)))
          && (!has(object.spec.jobTemplate.spec.template.spec.hostNetwork) || object.spec.jobTemplate.spec.template.spec.hostNetwork == false)
          && (!has(object.spec.jobTemplate.spec.template.spec.hostPID) || object.spec.jobTemplate.spec.template.spec.hostPID == false)
          && (!has(object.spec.jobTemplate.spec.template.spec.hostIPC) || object.spec.jobTemplate.spec.template.spec.hostIPC == false)
          && object.spec.jobTemplate.spec.template.spec.containers.all(c,
            (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
            && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0))
          && (!has(object.spec.jobTemplate.spec.template.spec.initContainers) || object.spec.jobTemplate.spec.template.spec.initContainers.all(c,
            (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
            && (!has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0)))
        )
      message: applier CronJobs must not use hostPath, host namespaces, privileged, or added capabilities
    - expression: >-
        object.kind == 'CronJob' || (
          !has(object.spec.template.spec.serviceAccountName)
          || object.spec.template.spec.serviceAccountName == ''
          || object.spec.template.spec.serviceAccountName == 'default'
          || (object.metadata.namespace == 'bifrost-dev' && object.spec.template.spec.serviceAccountName in ['api-ops', 'daemon-worker'])
          || (object.metadata.namespace == 'monitoring' && object.spec.template.spec.serviceAccountName in ['maintainer-reconcile'])
          || (object.metadata.namespace == 'cicd' && object.spec.template.spec.serviceAccountName in ['tekton-pipelinerun-ttl'])
        )
      message: applier workloads may only use a service account measured for that namespace
    - expression: >-
        object.kind != 'CronJob' || (
          !has(object.spec.jobTemplate.spec.template.spec.serviceAccountName)
          || object.spec.jobTemplate.spec.template.spec.serviceAccountName == ''
          || object.spec.jobTemplate.spec.template.spec.serviceAccountName == 'default'
          || (object.metadata.namespace == 'bifrost-dev' && object.spec.jobTemplate.spec.template.spec.serviceAccountName in ['api-ops', 'daemon-worker'])
          || (object.metadata.namespace == 'monitoring' && object.spec.jobTemplate.spec.template.spec.serviceAccountName in ['maintainer-reconcile'])
          || (object.metadata.namespace == 'cicd' && object.spec.jobTemplate.spec.template.spec.serviceAccountName in ['tekton-pipelinerun-ttl'])
        )
      message: applier CronJobs may only use a service account measured for that namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bifrost-applier-tekton-spec
  labels: {app.kubernetes.io/part-of: bifrost-platform}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tasks", "pipelines"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cicd
  matchConditions:
    - name: applier
      expression: request.userInfo.username == 'system:serviceaccount:cicd:bifrost-applier'
  validations:
    - expression: >-
        (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath)))
        && (!has(object.spec.steps) || object.spec.steps.all(s,
          (!has(s.securityContext) || !has(s.securityContext.privileged) || s.securityContext.privileged == false)
          && (!has(s.securityContext) || !has(s.securityContext.capabilities) || !has(s.securityContext.capabilities.add) || s.securityContext.capabilities.add.size() == 0)))
        && (!has(object.spec.sidecars) || object.spec.sidecars.all(s,
          (!has(s.securityContext) || !has(s.securityContext.privileged) || s.securityContext.privileged == false)))
        && (!has(object.spec.tasks) || object.spec.tasks.all(t,
          !has(t.taskSpec)
          || (
            (!has(t.taskSpec.volumes) || t.taskSpec.volumes.all(v, !has(v.hostPath)))
            && (!has(t.taskSpec.steps) || t.taskSpec.steps.all(s,
              (!has(s.securityContext) || !has(s.securityContext.privileged) || s.securityContext.privileged == false)
              && (!has(s.securityContext) || !has(s.securityContext.capabilities) || !has(s.securityContext.capabilities.add) || s.securityContext.capabilities.add.size() == 0)))
          )))
      message: applier Tekton Tasks and Pipelines must not use hostPath or privileged steps
---
