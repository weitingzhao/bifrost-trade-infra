# Applier identity for bifrost-apply-manifest. Generated by
# scripts/gen_platform_rbac.py from actuation-policy.yaml; do not edit by hand.
# No Secrets except the named Gitea credential, no RBAC, no cluster-scoped
# writes (only get on Namespaces), and no binding in a denied namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bifrost-applier
  namespace: cicd
  labels: {app.kubernetes.io/part-of: bifrost-platform}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-applier
  labels: {app.kubernetes.io/part-of: bifrost-platform}
rules:
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, create, patch, update]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, create, patch, update]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, create, patch, update]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, create, patch, update]
  - apiGroups: ["traefik.io"]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, create, patch, update]
  - apiGroups: ["monitoring.coreos.com"]
    resources: [servicemonitors, podmonitors, prometheusrules, scrapeconfigs]
    verbs: [get, list, create, patch, update]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-applier-cicd
  labels: {app.kubernetes.io/part-of: bifrost-platform}
rules:
  - apiGroups: ["tekton.dev"]
    resources: [pipelines, tasks]
    verbs: [get, list, create, patch, update]
  - apiGroups: ["triggers.tekton.dev"]
    resources: [triggertemplates, triggerbindings, eventlisteners]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-applier-namespaces
  labels: {app.kubernetes.io/part-of: bifrost-platform}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bifrost-applier-namespaces
  labels: {app.kubernetes.io/part-of: bifrost-platform}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bifrost-applier-namespaces}
subjects: [{kind: ServiceAccount, name: bifrost-applier, namespace: cicd}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bifrost-applier-read
  namespace: cicd
  labels: {app.kubernetes.io/part-of: bifrost-platform}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [gitea-git-credentials]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [bifrost-actuation-policy, bifrost-apply-manifest-check]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bifrost-applier
  namespace: bifrost-dev
  labels: {app.kubernetes.io/part-of: bifrost-platform}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bifrost-applier}
subjects: [{kind: ServiceAccount, name: bifrost-applier, namespace: cicd}]
---
