apiVersion: v1
kind: Service
metadata:
  name: owner-exec
  namespace: bifrost-owner-exec
  labels:
    app.kubernetes.io/name: owner-exec
    app.kubernetes.io/part-of: bifrost-owner-exec
spec:
  selector:
    app.kubernetes.io/name: owner-exec
  ports:
    - {name: http, port: 8787, targetPort: http}
---
# Straight from Traefik to the runner, past the Console's nginx (which logs a
# line per request). Priority above the Console's host rule (10) in
# k8s/overlays/platform-prod/ops-ingressroute.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: owner-exec
  namespace: bifrost-owner-exec
  labels:
    app.kubernetes.io/name: owner-exec
    app.kubernetes.io/part-of: bifrost-owner-exec
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`ops.bifrost.lan`) && PathPrefix(`/api/owner-exec/`)
      kind: Rule
      priority: 100
      services:
        - name: owner-exec
          port: 8787
