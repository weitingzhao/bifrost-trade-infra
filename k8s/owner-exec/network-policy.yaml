# The Pod may reach DNS, the API server and PROD's platform-api, and nothing
# else: not the Trade gateways, not Monitor /control/*, not redis-ib, not the
# LAN. In: Traefik only. The runner probes an address this policy must block
# 30 seconds after start and refuses every request if it connects
# (OWNER_EXEC_EGRESS_PROBE in runner.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: owner-exec
  namespace: bifrost-owner-exec
  labels: {app.kubernetes.io/part-of: bifrost-owner-exec}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: owner-exec
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 8787}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The API server: its Service address and the node it listens on (both, as
    # which one a policy sees depends on where the address is rewritten).
    - to:
        - ipBlock: {cidr: 10.43.0.1/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 192.168.10.73/32}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-platform-prod
          podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-api
      ports:
        - {protocol: TCP, port: 8780}
