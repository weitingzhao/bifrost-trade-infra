# One Pod, two containers of the platform-api image (which carries owner-exec,
# bash, kubectl, git, python3):
#
#   runner  holds the TOTP seed, checks the code, talks to platform-api.
#           No cluster identity.
#   shell   runs the approved command with the cluster identity owner-exec.
#           No seed; it is never sent the code or the admin sign-in.
#
# They are separate containers because a command runs as the same user as
# whatever starts it: beside the runner it could read the seed file and the
# runner's memory.
#
# OWNER_EXEC_IMAGE is replaced by enroll.sh with the digest PROD's
# platform-api runs. The seed Secret owner-exec-seed is created by enroll.sh
# from the Owner's terminal and is in no repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner-exec
  namespace: bifrost-owner-exec
  labels:
    app.kubernetes.io/name: owner-exec
    app.kubernetes.io/part-of: bifrost-owner-exec
spec:
  replicas: 1
  # One replica, stopped before the next starts: the used-code record lives in
  # the process, and two runners would each accept the same code once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: owner-exec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owner-exec
        app.kubernetes.io/part-of: bifrost-owner-exec
    spec:
      serviceAccountName: owner-exec
      # Mounted by hand below, into the shell container only.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: runner
          image: OWNER_EXEC_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["owner-exec"]
          env:
            - name: PLATFORM_API_URL
              value: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780
            - name: OWNER_EXEC_SEED_FILE
              value: /etc/owner-exec/seed
            - name: OWNER_EXEC_SHELL_URL
              value: http://127.0.0.1:8788
            - name: OWNER_EXEC_TIMEOUT
              value: 30m
            # An address the NetworkPolicy does not allow and that otherwise
            # answers: Grafana's Service. Reachable means the policy is not in force.
            - name: OWNER_EXEC_EGRESS_PROBE
              value: kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 8787
          # exec, not httpGet: a kubelet probe comes from the node, which the
          # NetworkPolicy's ingress rule does not list.
          readinessProbe:
            exec:
              command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8787"]
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: seed, mountPath: /etc/owner-exec, readOnly: true}
            - {name: runner-tmp, mountPath: /tmp}
        - name: shell
          image: OWNER_EXEC_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["owner-exec", "shell"]
          env:
            - name: OWNER_EXEC_SHELL_LISTEN
              value: 127.0.0.1:8788
            - name: TMPDIR
              value: /tmp
          readinessProbe:
            exec:
              command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8788"]
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: shell-tmp, mountPath: /tmp}
      volumes:
        - name: seed
          secret:
            secretName: owner-exec-seed
            defaultMode: 0440
            items: [{key: seed, path: seed}]
        # What the kubelet would mount by default, with the shortest token
        # lifetime the API allows: a token a command prints is dead in 10 minutes.
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        - name: runner-tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: shell-tmp
          emptyDir: {sizeLimit: 1Gi}
