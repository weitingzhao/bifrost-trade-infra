# Traefik (k3s HelmChartConfig) — Trade NodePorts + cross-namespace CRD backends.
#   Needed so Trade IngressRoutes can route /api/plugin/market-data →
#   market-data-api.plugin-market-data, /api/plugin/flex-query →
#   flex-query-api.plugin-flex-query, and /api/plugin/research →
#   research-api.research (ExternalName is disallowed by Traefik).
# The only definition of kube-system/HelmChartConfig traefik; not under any Argo app.
# Apply: make k3s-apply-traefik-helmchartconfig
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |-
    ports:
      trade-stg:
        port: 30880
        expose:
          default: true
        exposedPort: 30880
        protocol: TCP
      trade-prod:
        port: 30881
        expose:
          default: true
        exposedPort: 30881
        protocol: TCP
      trade-dev:
        port: 30882
        expose:
          default: true
        exposedPort: 30882
        protocol: TCP
    # Two replicas on two different nodes, so losing one node does not take every gateway down.
    # On 2026-09-06 the single replica sat on the node that died (mini-pc-a) and Traefik itself was
    # gone for ~5 minutes until the default 300s eviction; Prod then answered 503 for five hours.
    # The Service is externalTrafficPolicy Cluster, so every NodePort reaches either replica.
    deployment:
      replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-kube-system
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # Helm replaces lists, so the first two entries repeat the k3s packaged defaults. The last two
    # evict a replica off a dead node after 45s instead of 300s, matching the Prod workloads.
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 45
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 45
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
        allowEmptyServices: true
    # Access log to stdout (→ promtail → Loki), only for 4xx/5xx, so a gateway 404/503 can be told
    # apart from a backend one after the fact. Request headers stay dropped (chart default), so
    # Authorization never reaches the log; no Bifrost client puts a token in the URL.
    logs:
      access:
        enabled: true
        format: json
        filters:
          statuscodes: "400-599"
