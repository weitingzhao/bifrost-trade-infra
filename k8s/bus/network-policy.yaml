# Who may reach NATS. Same shape as data/redis/network-policies.yaml: namespaces
# matched by kubernetes.io/metadata.name; everything else is denied once this
# policy selects the pod. kubelet probes are not affected (CNPG's HTTP probes
# work behind the same kind of policy in data).
#
# The two platforms: client 4222 and monitoring HTTP 8222.
# monitoring: 8222 and the exporter 7777 only; Prometheus has no reason to be a
# NATS client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
  labels:
    app.kubernetes.io/name: nats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-platform-stg
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-platform-prod
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 8222
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8222
        - protocol: TCP
          port: 7777
