# nats.data.svc.cluster.local:4222 (clients), :8222 (monitoring HTTP),
# :7777 (prometheus-nats-exporter, scraped by k8s/monitoring/bifrost-nats.yaml).
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
    - name: metrics
      port: 7777
      targetPort: metrics
