# Example — db-init's login for one Trade env (TD-85). Real file (gitignored):
#   k8s/base/secrets/bifrost-<env>-db-owner.yaml, written by scripts/trade-app-role.sh owner-secret <env>
#   or scripts/materialize_k8s_trade_secrets.py. Only the db-init Job reads it (explicit env, which
#   wins over its envFrom of bifrost-<env>-secrets). See docs/SECRETS.md. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: bifrost-prod-db-owner
  labels:
    app.kubernetes.io/part-of: bifrost
    app.kubernetes.io/component: db-init
type: Opaque
stringData:
  PGUSER: "bifrost"
  GOLDEN_SOURCE_USER: "bifrost"
  PGPASSWORD: "REPLACE_ME"
  GOLDEN_SOURCE_PASSWORD: "REPLACE_ME"
