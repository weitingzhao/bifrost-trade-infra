# api-ops reads workload state in its namespace. Read-only since api 0.8.0 (TD-40): the only writer,
# POST /ops/market-ingest/control (scale / restart / delete worker pods), was deleted; Owner 2026-10-04.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-ops
  labels:
    app.kubernetes.io/name: api-ops
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-ops-actuator
  labels:
    app.kubernetes.io/name: api-ops
rules:
  # IB socket services are StatefulSets (Lease HA); both kinds are read.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-ops-actuator
  labels:
    app.kubernetes.io/name: api-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-ops-actuator
subjects:
  - kind: ServiceAccount
    name: api-ops
