---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-monitor
  labels:
    app.kubernetes.io/name: api-monitor
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-monitor
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: api-ops
      volumes:
        - name: bifrost-config
          configMap:
            name: bifrost-config
      containers:
        - name: api-monitor
          image: registry.cicd.svc.cluster.local:5000/bifrost-api-monitor:stg
          imagePullPolicy: IfNotPresent
          env:
            - name: BIFROST_CONFIG
              value: /app/config/runtime.yaml
            - name: BIFROST_ENV
              value: stg
            - name: ENABLE_METRICS
              value: "true"
            - name: API_DOMAIN
              value: monitor
            - name: MARKET_DATA_PLUGIN_URL
              value: http://market-data-api.plugin-market-data.svc.cluster.local:8790/market
            - name: MARKET_DATA_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-stg-secrets
                  key: MARKET_DATA_WRITE_TOKEN
                  optional: true
          envFrom:
            - secretRef:
                name: bifrost-stg-secrets
                optional: true
          ports:
            - name: http
              containerPort: 8765
          volumeMounts:
            - name: bifrost-config
              mountPath: /app/config/runtime.yaml
              subPath: runtime.yaml
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-monitor
  labels:
    app.kubernetes.io/name: api-monitor
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-monitor
  ports:
    - name: http
      port: 8765
      targetPort: http
---
# Phase B: docs absorbed into api-monitor (IngressRoute /api/docs → monitor)
# TD-55 alias: retires in B2 (after 7 days of zero traffic); docs answer at /api/monitor/research/docs/*.
apiVersion: v1
kind: Service
metadata:
  name: api-docs
  labels:
    app.kubernetes.io/name: api-docs
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-monitor
  ports:
    - name: http
      port: 8765
      targetPort: http
---
# Phase B Wave B4: ops absorbed into api-monitor (IngressRoute /api/ops → monitor)
# TD-55 alias: retires in B2 (after 7 days of zero traffic); ops answer at /api/monitor/ops/*.
apiVersion: v1
kind: Service
metadata:
  name: api-ops
  labels:
    app.kubernetes.io/name: api-ops
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-monitor
  ports:
    - name: http
      port: 8765
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-account
  labels:
    app.kubernetes.io/name: api-account
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-account
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-account
        app.kubernetes.io/component: api
    spec:
      volumes:
        - name: bifrost-config
          configMap:
            name: bifrost-config
      containers:
        - name: api-account
          image: registry.cicd.svc.cluster.local:5000/bifrost-api-account:stg
          imagePullPolicy: IfNotPresent
          env:
            - name: BIFROST_CONFIG
              value: /app/config/runtime.yaml
            - name: BIFROST_ENV
              value: stg
            - name: ENABLE_METRICS
              value: "true"
            - name: API_DOMAIN
              value: account
            # Phase B: merged trading + portfolio (paths /executions*, /portfolio*, /position-categories*).
            # The account app reads the plugin's last daily close when a live quote is stale --
            # Positions' stock price and the short legs' spot (core quote_freshness). Without
            # this it called localhost:8790, every fallback came back empty, and stale March
            # quotes were shown instead (debt TD-02).
            - name: MARKET_DATA_PLUGIN_URL
              value: http://market-data-api.plugin-market-data.svc.cluster.local:8790/market
          envFrom:
            - secretRef:
                name: bifrost-stg-secrets
                optional: true
          ports:
            - name: http
              containerPort: 8769
          volumeMounts:
            - name: bifrost-config
              mountPath: /app/config/runtime.yaml
              subPath: runtime.yaml
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
# api-account's own Service; gateway prefix /api/account (TD-55 B1). In-cluster callers use this name.
apiVersion: v1
kind: Service
metadata:
  name: api-account
  labels:
    app.kubernetes.io/name: api-account
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-account
  ports:
    - name: http
      port: 8769
      targetPort: http
---
# Compatibility alias: IngressRoute /api/trading → account pod
# TD-55 alias: retires in B2, after Research stops naming it and 7 days of zero gateway traffic.
apiVersion: v1
kind: Service
metadata:
  name: api-trading
  labels:
    app.kubernetes.io/name: api-trading
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-account
  ports:
    - name: http
      port: 8769
      targetPort: http
---
# Phase B: strategy absorbed into api-account (IngressRoute /api/strategy → account)
# TD-55 alias: retires in B2, after Research stops naming it and 7 days of zero gateway traffic.
apiVersion: v1
kind: Service
metadata:
  name: api-strategy
  labels:
    app.kubernetes.io/name: api-strategy
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-account
  ports:
    - name: http
      port: 8769
      targetPort: http
---
# Compatibility alias: IngressRoute /api/portfolio → account pod (port unified to 8769)
# TD-55 alias: retires in B2 (after 7 days of zero traffic).
apiVersion: v1
kind: Service
metadata:
  name: api-portfolio
  labels:
    app.kubernetes.io/name: api-portfolio
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-account
  ports:
    - name: http
      port: 8769
      targetPort: http
