apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-research
  labels:
    app.kubernetes.io/name: api-research
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-research
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-research
        app.kubernetes.io/component: api
    spec:
      volumes:
        - name: bifrost-config
          configMap:
            name: bifrost-config
      containers:
        - name: api-research
          image: registry.cicd.svc.cluster.local:5000/bifrost-api-research:stg
          imagePullPolicy: IfNotPresent
          env:
            - name: BIFROST_CONFIG
              value: /app/config/runtime.yaml
            - name: BIFROST_ENV
              value: stg
            - name: ENABLE_METRICS
              value: "true"
            - name: API_DOMAIN
              value: research
            - name: MARKET_DATA_PLUGIN_URL
              value: http://market-data-api.plugin-market-data.svc.cluster.local:8790/market
            # The feedback store's own Golden Source connection (api >= 0.7.5,
            # TD-49 D4 / TD-77 E5): role feedback_writer, DML on ops_feedback only.
            # Secret bifrost-feedback-secrets is created per namespace by the Owner
            # (scripts/feedback-writer-secret.sh secret <env>) and never committed.
            # Not optional: a pod without it stays Pending (CreateContainerConfigError)
            # and the old one keeps serving, instead of starting with no password.
            - name: FEEDBACK_PG_HOST
              value: bifrost-postgres-rw.data.svc.cluster.local
            - name: FEEDBACK_PG_PORT
              value: "5432"
            - name: FEEDBACK_PG_USER
              value: feedback_writer
            - name: FEEDBACK_PG_DATABASE
              value: bifrost_golden_source
            - name: FEEDBACK_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-feedback-secrets
                  key: FEEDBACK_PG_PASSWORD
            - name: MARKET_DATA_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-stg-secrets
                  key: MARKET_DATA_WRITE_TOKEN
                  optional: true
          envFrom:
            - secretRef:
                name: bifrost-stg-secrets
                optional: true
          ports:
            - name: http
              containerPort: 8773
          volumeMounts:
            - name: bifrost-config
              mountPath: /app/config/runtime.yaml
              subPath: runtime.yaml
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
