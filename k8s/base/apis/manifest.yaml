      port: 8769
      targetPort: http
---
# Phase B: strategy absorbed into api-account (IngressRoute /api/strategy → account)
apiVersion: v1
kind: Service
metadata:
  name: api-strategy
  labels:
    app.kubernetes.io/name: api-strategy
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-account
  ports:
    - name: http
      port: 8769
      targetPort: http
---
# Compatibility alias: IngressRoute /api/portfolio → account pod (port unified to 8769)
apiVersion: v1
kind: Service
metadata:
  name: api-portfolio
  labels:
    app.kubernetes.io/name: api-portfolio
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: bifrost-trade
spec:
  selector:
    app.kubernetes.io/name: api-account
  ports:
    - name: http
      port: 8769
      targetPort: http
