# Trading daemon (bifrost-worker image).
# W8 trade-k8s-native: daemon Deployment uses K8s Lease (R-DV3) — replicas:2 hot standby,
# only the Lease holder runs the GsTrading FSM loop.
#
# raw_broker.account / .positions in the shared Golden Source are written by this
# daemon's PostgresSink in STG and PROD (STG currently runs it at replicas 0).
# DEV's daemon does not write them (overlays/dev/daemon-golden-writes-off.patch.yaml).
# The retired account-sync Deployment that used to sit here was deleted 2026-10-02 (TD-22).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemon
  labels:
    app.kubernetes.io/name: daemon
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daemon
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: daemon-worker  # Lease RBAC (daemon-rbac.yaml)
      volumes:
        - name: bifrost-config
          configMap:
            name: bifrost-config
      # W7: wait for CNPG + Redis before daemon FSM starts.
      initContainers:
        - name: wait-for-data
          image: registry.cicd.svc.cluster.local:5000/bifrost-worker:stg
          imagePullPolicy: Always
          command: ["python", "scripts/wait_for_data.py"]
          workingDir: /src/bifrost-trade-worker
          env:
            - name: BIFROST_CONFIG
              value: /app/config/runtime.yaml
            - name: BIFROST_ENV
              value: stg
          volumeMounts:
            - name: bifrost-config
              mountPath: /app/config/runtime.yaml
              subPath: runtime.yaml
      containers:
        - name: daemon
          image: registry.cicd.svc.cluster.local:5000/bifrost-worker:stg
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/run_daemon.py"]
          workingDir: /src/bifrost-trade-worker
          env:
            - name: BIFROST_CONFIG
              value: /app/config/runtime.yaml
            - name: BIFROST_ENV
              value: stg
            - name: MARKET_DATA_PLUGIN_URL
              value: http://market-data-api.plugin-market-data.svc.cluster.local:8790/market
            - name: MARKET_DATA_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-stg-secrets
                  key: MARKET_DATA_WRITE_TOKEN
                  optional: true
            # W8: K8s Lease active-standby — only the holder runs auto-trade FSM (R-DV3).
            - name: BIFROST_DAEMON_LEASE_ENABLED
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - secretRef:
                name: bifrost-stg-secrets
                optional: true
          volumeMounts:
            - name: bifrost-config
              mountPath: /app/config/runtime.yaml
              subPath: runtime.yaml
          # TD-215: worker >= 0.2.7 serves /metrics (scraped by k8s/monitoring/bifrost-trade-daemon.yaml)
          # and /health on 9108 (BIFROST_DAEMON_METRICS_PORT).
          ports:
            - name: metrics
              containerPort: 9108
          readinessProbe:
            exec:
              command: ["python", "scripts/wait_for_data.py", "--once"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
          # TD-215: restart the Lease holder when its heartbeat loop has not passed for 600 s
          # (/health answers 503; a standby pod always answers 200). Fails only on that explicit
          # 503: an image without the endpoint (worker < 0.2.7) or a server that never bound
          # refuses the connection, which passes, so syncing this manifest ahead of the image
          # cannot put the only raw_broker writer into a restart loop.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import sys, urllib.error, urllib.request
                  try:
                      urllib.request.urlopen("http://127.0.0.1:9108/health", timeout=5)
                  except urllib.error.HTTPError as e:
                      sys.exit(1 if e.code == 503 else 0)
                  except Exception:
                      sys.exit(0)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
