# TD-444 step 5 runbook §5.2: nightly copy of the market-data archive onto the SSD share.
# Reads plugin-market-data/market-data-archive (read-only), writes market-archive-backup
# (static PV fast-plugin-market-data-market-archive-backup, k8s/storage/nfs-fast/arc/pv.yaml).
# The script (market_archive_replica.py, mounted from the ConfigMap ../kustomization.yaml
# generates) only adds verified files and publishes the verified ledger prefix; it never
# deletes. @MARKET_DATA_IMAGE@ is the plugin image pinned by digest (filled by render.py).
# Alert: BifrostMarketArchiveReplicaStale (k8s/monitoring/bifrost-host-rules.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-archive-replica
  namespace: plugin-market-data
  labels:
    app.kubernetes.io/name: market-archive-replica
    app.kubernetes.io/part-of: bifrost
spec:
  schedule: "0 7 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-archive-replica
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: replica
              image: "@MARKET_DATA_IMAGE@"
              command: ["python3", "/scripts/market_archive_replica.py", "--src", "/archive", "--dst", "/replica"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: archive
                  mountPath: /archive
                  readOnly: true
                - name: replica
                  mountPath: /replica
          volumes:
            - name: scripts
              configMap:
                name: market-archive-replica-script
            - name: archive
              persistentVolumeClaim:
                claimName: market-data-archive
                readOnly: true
            - name: replica
              persistentVolumeClaim:
                claimName: market-archive-backup
