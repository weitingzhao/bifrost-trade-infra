# Owner 亲手应用。对应设计第 7 节的表，步 1。没有别的东西应用这份文件。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: freezes.release.bifrost.io
spec:
  group: release.bifrost.io
  scope: Cluster
  names:
    kind: Freeze
    listKind: FreezeList
    plural: freezes
    singular: freeze
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^freeze-[0-9a-f]{32}$')"
              message: "name must match ^freeze-[0-9a-f]{32}$"
          properties:
            spec:
              type: object
              additionalProperties: false
              required: ["who", "reason", "at"]
              properties:
                who:
                  type: string
                  minLength: 1
                  maxLength: 128
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                at:
                  type: string
                  format: date-time
                via:
                  type: string
                  maxLength: 64
