# Long-lived token. The apiserver fills data.token and data.ca.crt.
# No values belong in git.
apiVersion: v1
kind: Secret
metadata:
  name: bifrost-agent-token
  namespace: bifrost-access
  annotations:
    kubernetes.io/service-account.name: bifrost-agent
  labels:
    app.kubernetes.io/part-of: bifrost
    app.kubernetes.io/name: bifrost-agent
type: kubernetes.io/service-account-token
