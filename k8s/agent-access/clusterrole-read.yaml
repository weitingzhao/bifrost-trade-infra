# Reads that the built-in view ClusterRole does not cover (measured 2026-10-09
# against clusterrole/view). view already includes pods/log, metrics.k8s.io
# nodes and pods, and tekton.dev pipelines / pipelineruns / tasks / taskruns.
# metrics are repeated here so the grant does not depend on aggregation.
# No secrets. No write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-agent-read
  labels:
    app.kubernetes.io/part-of: bifrost
    app.kubernetes.io/name: bifrost-agent
rules:
  # Cluster-scoped and proxy reads the built-in view role leaves out. The local
  # platform-api (PLATFORM_KUBECONFIG is this file) lists nodes, and Agents read
  # Prometheus / Alertmanager / Loki through the apiserver service proxy (GET only).
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
      - scrapeconfigs
      - prometheuses
      - alertmanagers
    verbs: ["get", "list", "watch"]
