# Prod overlay — deep-merged over config.yaml (from config.yaml.example).
# NOTE: This file is the LOCAL Docker Compose fallback (non-K3s). The canonical prod config
#   is k8s/overlays/prod/config/config.prod.yaml (CNPG @ data NS, bifrost_prod).
# ops.auth.tokens：生产 token 勿提交 git；通过 .env OPS_* 或部署密钥注入。

server:
  skip_monitor_ib: false
  architecture:
    monitor_port: 8765
    docs_port: 8767
  account:
    trading_port: 8769
    portfolio_port: 8771
  research:
    research_port: 8773
    market_port: 8772
    strategy_port: 8770
  feed:
    massive_port: 8766

sink: postgres

ib:
  connect_timeout: 60.0
  host:
    ip: 192.168.10.30
    port_type: tws_live
    client_id:
      daemon: 10
      listener: 1
      operator: 20
      worker_market: 40
      ingestor: 50
      account_agent: 60
  secondary:
    ip: 192.168.10.33
    port_type: tws_live
    client_id:
      listener: 1
      operator: 20
      account_agent: 60

utilized:
  services:
    server: prod
    massive: prod
    docs: prod
    ops: prod
    trading: prod
    strategy: prod
    portfolio: prod
    market: prod
    research: prod

postgres:
  host: 192.168.10.73
  port: 30432
  user: bifrost
  password: ""
  database: bifrost_dev

# Shared brokerage Golden Source (IB account/positions/executions)
golden_source:
  host: 192.168.10.73
  port: 30432
  database: bifrost_golden_source
  user: bifrost
  password: ""
  fdw_user: brokerage_reader
  fdw_password: ""

redis:
  enabled: true
  host: 192.168.10.70
  port: 6379
  db: 0

ops:
  control_profile: prod
  executor_mode: kubernetes
  daemon_scale_guard: freeze
  auth:
    default_role: "operator"
    allow_unauthenticated_reads: false
    tokens: []
  audit:
    persist: true

# Plugin redis-massive — ExternalName → redis-massive.data.svc.cluster.local
redis_massive:
  enabled: true
  host: redis-massive
  port: 6379
  db: 0
  username: trade-prod
  password: ""


# api_key + rest_base still used by Research REST (polygon_http); WS migrated to Plugin
massive:
  api_key: ""
  tier: starter
  ws_url: wss://delayed.polygon.io/options
  features:
    trades_enabled: false
    ws_enabled: false
