# ============================================================
# Bifrost Trade — Production Docker Compose (Phase 2C)
# 使用方式: cp .env.example .env && make sync-prod-config && make prod-preflight
#
# PG/Redis 默认外置（CNPG @ data NS / LAN NodePort，见 config.prod.yaml）；仅 greenfield/CI:
#   docker compose --profile embedded-infra up -d
# ============================================================

x-python-common: &python-common
  env_file: .env
  environment:
    BIFROST_ENV: prod
    BIFROST_CONFIG: /app/config/config.prod.yaml
  restart: unless-stopped
  networks:
    - bifrost-net
  volumes:
    - ./config:/app/config:ro

x-api-build: &api-build
  build:
    context: ../bifrost-trade-api
    args:
      BIFROST_CORE_REF: ${BIFROST_CORE_REF:-main}
      BIFROST_WORKER_REF: ${BIFROST_WORKER_REF:-main}
      BIFROST_SOCKET_REF: ${BIFROST_SOCKET_REF:-main}
      GITHUB_ORG: ${GITHUB_ORG}
  <<: *python-common

x-worker-build: &worker-build
  build:
    context: ../bifrost-trade-worker
    args:
      BIFROST_CORE_REF: ${BIFROST_CORE_REF:-main}
      GITHUB_ORG: ${GITHUB_ORG}
  <<: *python-common

x-socket-build: &socket-build
  build:
    context: ../bifrost-trade-socket
    args:
      BIFROST_CORE_REF: ${BIFROST_CORE_REF:-main}
      GITHUB_ORG: ${GITHUB_ORG}
  <<: *python-common

services:

  # ── 可选内嵌基础设施（默认不启；生产连 CNPG / Redis）────────

  postgres:
    profiles: [embedded-infra]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bifrost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bifrost_prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bifrost}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bifrost-net
    restart: unless-stopped

  redis:
    profiles: [embedded-infra]
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bifrost-net
    restart: unless-stopped

  # ── 交易 daemon ───────────────────────────────────────────

  daemon:
    <<: *worker-build
    command: python scripts/run_daemon.py

  account-sync:
    <<: *worker-build
    command: python scripts/run_account_sync_daemon.py

  # ── IB / Massive socket 边缘 ──────────────────────────────

  ib-ingestor:
    <<: *socket-build
    profiles: [legacy-ib]
    command: python scripts/run_ib_ingestor.py

  ib-account-agent:
    <<: *socket-build
    profiles: [legacy-ib]
    command: python scripts/run_ib_account_agent.py

  ib-operator:
    <<: *socket-build
    profiles: [legacy-ib]
    command: python scripts/run_ib_operator.py

  # massive-ws retired — Polygon Options WS is Plugin polygon-ws-ingestor → redis-massive

  # ── FastAPI 后端 (8 个域；api-massive P7 retired → Market Data Plugin) ──

  api-monitor:
    <<: *api-build
    command: python scripts/run_server.py monitor

  api-account:
    <<: *api-build
    command: python scripts/run_server.py account

  api-market:
    <<: *api-build
    command: python scripts/run_server.py market

  api-research:
    <<: *api-build
    command: python scripts/run_server.py research

  # ── 前端（仅内部网络；对外入口为 nginx）────────────────────

  frontend:
    build:
      context: ../bifrost-trade-frontend
    depends_on:
      - api-monitor
    networks:
      - bifrost-net
    restart: unless-stopped

  # ── 反向代理（统一入口 :80）──────────────────────────────

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - api-monitor
      - api-market
    networks:
      - bifrost-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  bifrost-net:
    driver: bridge
