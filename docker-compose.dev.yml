# ============================================================
# Bifrost Trade — 本地开发 Docker Compose
# 使用方式: make dev  (或 docker compose -f docker-compose.dev.yml up)
# 特点: 挂载 monorepo 源码；entrypoint editable 安装 core/worker/api
# 健康检查: make dev-health
#
# Wave 14G-F: IB edge 默认走 Plugin → redis-ib。ib-ingestor / ib-account-agent /
# ib-operator 仅在 --profile legacy-ib 时启动（排障逃生舱，禁止与 Plugin 双写）。
# bifrost-trade-socket 已移出多仓 workspace — legacy-ib 须先解压回 ../bifrost-trade-socket。
#
# PG/Redis 默认不 Docker 化：容器通过 config.dev.yaml 连 CNPG（LAN NodePort / in-cluster DNS；见 .env）。
# Legacy bare-metal .80 / options_db decommissioned 2026-06-29.
# 仅 CI/隔离空库时需要: make dev-docker-infra  (profile docker-infra)
# ============================================================

x-dev-volumes: &dev-volumes
  # rw mounts: entrypoint runs `pip install -e` (needs egg-info writes)
  - ../bifrost-trade-core:/workspace/bifrost-trade-core
  - ../bifrost-trade-worker:/workspace/bifrost-trade-worker
  - ../bifrost-trade-api:/workspace/bifrost-trade-api
  - ../bifrost-trade-core/config/config.yaml.example:/app/config/config.yaml:ro
  - ./config/config.dev.yaml:/app/config/config.dev.yaml:ro
  - dev-pip-cache:/root/.cache/pip
  - dev-install-state:/var/lib/bifrost-dev
  - ./docker/dev-install.sh:/usr/local/bin/bifrost-dev-install.sh:ro

# Only for --profile legacy-ib (restore ../bifrost-trade-socket first)
x-legacy-ib-volumes: &legacy-ib-volumes
  - ../bifrost-trade-core:/workspace/bifrost-trade-core
  - ../bifrost-trade-worker:/workspace/bifrost-trade-worker
  - ../bifrost-trade-socket:/workspace/bifrost-trade-socket
  - ../bifrost-trade-api:/workspace/bifrost-trade-api
  - ../bifrost-trade-core/config/config.yaml.example:/app/config/config.yaml:ro
  - ./config/config.dev.yaml:/app/config/config.dev.yaml:ro
  - dev-pip-cache:/root/.cache/pip
  - dev-install-state:/var/lib/bifrost-dev
  - ./docker/dev-install.sh:/usr/local/bin/bifrost-dev-install.sh:ro

x-dev-env: &dev-env
  BIFROST_CONFIG: /app/config/config.dev.yaml
  BIFROST_ENV: dev

x-dev-build: &dev-build
  build:
    context: .
    dockerfile: docker/Dockerfile.dev

x-dev-api: &dev-api
  <<: *dev-build
  volumes: *dev-volumes
  environment:
    <<: *dev-env
    BIFROST_DEV_STACK: api
  env_file:
    - path: .env
      required: false

services:

  postgres:
    profiles: [docker-infra]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bifrost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bifrost_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bifrost_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bifrost} -d ${POSTGRES_DB:-bifrost_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: [docker-infra]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  daemon:
    <<: *dev-build
    command: ["python", "/workspace/bifrost-trade-worker/scripts/run_daemon.py"]
    volumes: *dev-volumes
    environment:
      <<: *dev-env
      BIFROST_DEV_STACK: daemon
    env_file:
    - path: .env
      required: false

  ib-ingestor:
    <<: *dev-build
    profiles: [legacy-ib]
    command: ["python", "/workspace/bifrost-trade-socket/scripts/run_ib_ingestor.py"]
    volumes: *legacy-ib-volumes
    environment:
      <<: *dev-env
      BIFROST_DEV_STACK: socket
    env_file:
    - path: .env
      required: false

  ib-account-agent:
    <<: *dev-build
    profiles: [legacy-ib]
    command: ["python", "/workspace/bifrost-trade-socket/scripts/run_ib_account_agent.py"]
    volumes: *legacy-ib-volumes
    environment:
      <<: *dev-env
      BIFROST_DEV_STACK: socket
    env_file:
    - path: .env
      required: false

  ib-operator:
    <<: *dev-build
    profiles: [legacy-ib]
    command: ["python", "/workspace/bifrost-trade-socket/scripts/run_ib_operator.py"]
    volumes: *legacy-ib-volumes
    environment:
      <<: *dev-env
      BIFROST_DEV_STACK: socket
    env_file:
    - path: .env
      required: false

  api-monitor:
    <<: *dev-api
    command: ["python", "/workspace/bifrost-trade-api/scripts/run_server.py", "monitor"]
    ports: ["8765:8765"]

  api-account:
    <<: *dev-api
    command: ["python", "/workspace/bifrost-trade-api/scripts/run_server.py", "account"]
    ports: ["8769:8769"]

  api-market:
    <<: *dev-api
    command: ["python", "/workspace/bifrost-trade-api/scripts/run_server.py", "market"]
    ports: ["8772:8772"]

  api-research:
    <<: *dev-api
    command: ["python", "/workspace/bifrost-trade-api/scripts/run_server.py", "research"]
    ports: ["8773:8773"]

  frontend:
    image: node:20-slim
    working_dir: /app
    command: npm run dev -- --host
    volumes:
      - ../bifrost-trade-frontend:/app
    ports: ["5173:5173"]
    environment:
      - NODE_ENV=development

volumes:
  dev-pip-cache:
  dev-install-state:
  postgres-dev-data:
