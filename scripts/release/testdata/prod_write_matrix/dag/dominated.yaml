apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: demo-dominated
  namespace: cicd
spec:
  tasks:
    - name: release-window
      taskRef:
        name: bifrost-release-window
    - name: rollout
      runAfter: [release-window]
      taskRef:
        name: bifrost-rollout-platform-stg
      params:
        - name: namespace
          value: bifrost-platform-prod
