apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: demo-undominated
  namespace: cicd
spec:
  tasks:
    - name: rollout
      taskRef:
        name: bifrost-rollout-platform-stg
      params:
        - name: namespace
          value: bifrost-platform-prod
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bifrost-rollout-platform-stg
  namespace: cicd
spec:
  steps:
    - name: rollout
      script: kubectl rollout restart deployment/platform-api -n bifrost-platform-prod
