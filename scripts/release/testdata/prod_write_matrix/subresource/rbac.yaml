apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scale-and-pods
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scale-and-pods
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: scale-and-pods}
subjects:
  - {kind: User, name: sub-user}
