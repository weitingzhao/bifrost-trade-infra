apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patch-dep
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: only-stg
  namespace: bifrost-stg
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: patch-dep}
subjects:
  - {kind: User, name: scoped-user}
