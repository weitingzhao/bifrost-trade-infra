apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: extra
  namespace: bifrost-platform-prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: extra
  namespace: bifrost-platform-prod
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: extra}
subjects:
  - {kind: ServiceAccount, name: extra-writer, namespace: cicd}
