apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patch-dep
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: patch-dep
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: patch-dep}
subjects:
  - {kind: User, name: gated-user}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: demo-gate
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["deployments"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: bifrost-platform-prod
  validations:
    - expression: "true"
      message: demo gate does not refuse image
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: demo-gate
spec:
  policyName: demo-gate
  validationActions: [Deny]
