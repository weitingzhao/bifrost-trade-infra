# Loki for the whole K3s cluster (SingleBinary + Promtail). Chart pinned in install-loki.sh.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  # 30-day retention: with persistence on, nothing else bounds the PVC (~0.17 GiB/day measured 2026-09).
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 720h
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 1
  # 512Mi / 500m sat at the memory ceiling: GC pegged the CPU limit, /ready (1s timeout) failed and the
  # loki Service lost its endpoints 58 times in 7 days (2026-09-28). GOMEMLIMIT makes the Go GC work
  # below the cgroup limit instead of at it.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  extraEnv:
    - name: GOMEMLIMIT
      value: 900MiB
  # Keep Loki's disk and memory off the Postgres nodes.
  nodeSelector:
    bifrost.io/workload-pool: general
  # Data on the NAS (nfs-hot), not local-path: the local-path PVC storage-loki-0 was bound to
  # ubt-k3s-05, and when 05 was shut down for a disk swap (2026-11-20) loki-0 sat Pending about
  # 14 hours and no logs were collected. The chart's volumeClaimTemplate would claim that same
  # PVC again, so persistence is off and the data volume is a PVC the repo owns
  # (k8s/monitoring/loki-data-nfs-pvc.yaml), mounted where the chart mounts storage.
  # storage-loki-0 and its PV are left as they are: the logs before 2026-11-20 are on 05's disk.
  persistence:
    enabled: false
  extraVolumes:
    - name: data
      persistentVolumeClaim:
        claimName: loki-data-nfs
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki

gateway:
  enabled: false

# Nested chart key is unused (Promtail is a separate helm release + values-promtail.yaml).
# Keep limits in sync so a future combined install does not regress CI-node OOM.
promtail:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false
