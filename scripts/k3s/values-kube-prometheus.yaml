# Conservative defaults for bootstrap K3s clusters.
#
# k3s embeds kube-controller-manager / kube-scheduler / kube-proxy in the
# k3s-server process. Stock kube-prometheus scrape jobs never appear, so
# KubeControllerManagerDown / KubeSchedulerDown / KubeProxyDown fire forever
# with "Target disappeared from Prometheus target discovery". Disable those
# scrapes + alerting groups — do not mute in Alertmanager.
defaultRules:
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeProxy: false
  disabled:
    # kubernetes-system group: k3s kubelet/apiserver patch skew is normal.
    KubeVersionMismatch: true

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 10d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

grafana:
  # Browser deep link for Ops Console → Open Grafana (STG @ .73:30883).
  service:
    type: NodePort
    port: 80
    nodePort: 30883
  # Wave 7: Console Selected Domain embeds Grafana d-solo panels (same LAN).
  # allow_embedding clears X-Frame-Options:deny; anonymous Viewer skips login for iframe.
  grafana.ini:
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: true
      org_role: Viewer
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-webhook-auth
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: default
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - match_re:
            alertname: Bifrost.*
          receiver: bifrost-ops-agent
          continue: false
    # Mute kube/node noise for elastic WOL standby when BifrostElasticStandbyMarker fires.
    # Node-scoped alerts keep equal:node. Aggregate TargetDown and DaemonSet/Pod
    # alerts often omit `node` — inhibit by alertname (+ job/namespace) only.
    inhibit_rules:
      - source_matchers:
          - elastic_standby="true"
        target_matchers:
          - alertname=~"KubeNodeNotReady|KubeNodeUnreachable|KubeletInstanceUnreachable"
        equal: ['node']
      - source_matchers:
          - elastic_standby="true"
        target_matchers:
          - alertname=~"KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|KubePodNotReady"
          - namespace=~"monitoring|kube-system"
      - source_matchers:
          - elastic_standby="true"
        target_matchers:
          - alertname="TargetDown"
          - job=~".*(node-exporter|kubelet).*"
    receivers:
      - name: default
      - name: bifrost-ops-agent
        webhook_configs:
          - url: http://platform-api.bifrost-platform-stg.svc.cluster.local:8780/api/v1/ops-agent/alertmanager
            send_resolved: true
            http_config:
              bearer_token_file: /etc/alertmanager/secrets/alertmanager-webhook-auth/token

# Expose bifrost.io/wol on kube_node_labels so BifrostElasticStandbyMarker can
# match without hardcoding node names (requires helm upgrade of the stack).
kube-state-metrics:
  metricLabelsAllowlist:
    - nodes=[bifrost.io/wol,bifrost.io/workload-pool]
