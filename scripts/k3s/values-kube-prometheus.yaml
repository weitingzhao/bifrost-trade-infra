# Conservative defaults for bootstrap K3s clusters.
#
# k3s embeds kube-controller-manager / kube-scheduler / kube-proxy in the
# k3s-server process. Stock kube-prometheus scrape jobs never appear, so
# KubeControllerManagerDown / KubeSchedulerDown / KubeProxyDown fire forever
# with "Target disappeared from Prometheus target discovery". Disable those
# scrapes + alerting groups — do not mute in Alertmanager.
defaultRules:
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeProxy: false
  disabled:
    # kubernetes-system group: k3s kubelet/apiserver patch skew is normal.
    KubeVersionMismatch: true

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# etcd is embedded in k3s-server on ubt-k3s-01 (single member) and has no pod, so the
# chart's headless kube-etcd Service gets its endpoints from this list. k3s serves
# etcd metrics on <node-ip>:2381 only with `etcd-expose-metrics: true`
# (/etc/rancher/k3s/config.yaml, written by install-server.sh); without it they
# stay on 127.0.0.1. The chart's etcd alert group (etcdHighFsyncDurations, …)
# had no data until 2026-10-03.
kubeEtcd:
  enabled: true
  endpoints:
    - 192.168.10.73
  service:
    enabled: true
    port: 2381
    targetPort: 2381

prometheus:
  prometheusSpec:
    retention: 10d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

grafana:
  # Browser deep link for Ops Console → Open Grafana (STG @ .73:30883).
  service:
    type: NodePort
    port: 80
    nodePort: 30883
  # Wave 7: Console Selected Domain embeds Grafana d-solo panels (same LAN).
  # allow_embedding clears X-Frame-Options:deny; anonymous Viewer skips login for iframe.
  grafana.ini:
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: true
      org_role: Viewer
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-webhook-auth
      # bearer token for the ntfy relay on Mac mini .50 (TD-209); created by hand,
      # the same value as ALERT_RELAY_TOKEN in that Mini's config/.env
      - alertmanager-relay-auth
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  config:
    global:
      resolve_timeout: 5m
    # Everything reaches the Owner. The root used to point at an *empty* `default`
    # receiver with one route for `Bifrost.*`, so every other alert fired in
    # Prometheus and was silently dropped here — including the stack's own
    # NodeFilesystemAlmostOutOfSpace / KubePersistentVolumeFillingUp, which were
    # being counted as a capacity backstop that did not exist (2026-09-25).
    #
    # Connecting the root is small because the inhibit rules below already do
    # their job: measured 2026-09-26 against Alertmanager's own view (not
    # Prometheus's firing list, which does not know about inhibition), 13 alerts
    # were deliverable and 15 were inhibited. Of the 13, five were already
    # routed, two are the non-events nulled below, and the rest are real.
    route:
      receiver: bifrost-ops-agent
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog always fires. Sent every 5 min to the relay on Mac mini .50,
        # which pages when it stops arriving: the dead-man's switch for this
        # Alertmanager, Prometheus and the path between them and the Owner (TD-209).
        - receiver: owner-heartbeat
          matchers:
            - alertname="Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        # Exists only to drive the info-inhibition rule; never an event.
        - receiver: "null"
          matchers:
            - alertname="InfoInhibitor"
        # The webhook below is PROD platform-api's audit log (LANE-A1). Critical
        # alerts, backup / WAL / NAS MinIO alerts, and cluster-state backup alerts
        # (LANE-A2, BifrostClusterStateBackup*) also page the Owner through ntfy
        # (relay on Mac mini .50). `continue` keeps them flowing to the webhook.
        - receiver: owner-ntfy
          matchers:
            - severity="critical"
          continue: true
        - receiver: owner-ntfy
          matchers:
            - alertname=~"Bifrost(PostgresBackup.*|PostgresWalArchiveStalled|LogicalBackup.*|MinIONas.*|ClusterStateBackup.*)"
          continue: true
        # Everything (including the paged alerts above) still reaches the webhook.
        - receiver: bifrost-ops-agent
    # Mute kube/node noise for elastic WOL standby when BifrostElasticStandbyMarker fires.
    # Node-scoped alerts keep equal:node. Aggregate TargetDown and DaemonSet/Pod
    # alerts often omit `node` — inhibit by alertname (+ job/namespace) only.
    inhibit_rules:
      - source_matchers:
          - elastic_standby="true"
        target_matchers:
          - alertname=~"KubeNodeNotReady|KubeNodeUnreachable|KubeletInstanceUnreachable"
        equal: ['node']
      - source_matchers:
          - elastic_standby="true"
        target_matchers:
          - alertname=~"KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|KubePodNotReady"
          - namespace=~"monitoring|kube-system"
      - source_matchers:
          - elastic_standby="true"
        target_matchers:
          - alertname="TargetDown"
          - job=~".*(node-exporter|kubelet).*"
    receivers:
      # `default` is gone: an unconfigured receiver is a silent drop, and the
      # root now names the webhook directly.
      - name: "null"
      - name: owner-ntfy
        webhook_configs:
          - url: http://192.168.10.50:8783/api/v1/alerts/alertmanager
            send_resolved: true
            http_config:
              bearer_token_file: /etc/alertmanager/secrets/alertmanager-relay-auth/token
      - name: owner-heartbeat
        webhook_configs:
          - url: http://192.168.10.50:8783/api/v1/alerts/heartbeat
            send_resolved: false
            http_config:
              bearer_token_file: /etc/alertmanager/secrets/alertmanager-relay-auth/token
      - name: bifrost-ops-agent
        webhook_configs:
          - url: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780/api/v1/ops-agent/alertmanager
            send_resolved: true
            http_config:
              bearer_token_file: /etc/alertmanager/secrets/alertmanager-webhook-auth/token

# Expose bifrost.io/wol on kube_node_labels so BifrostElasticStandbyMarker can
# match without hardcoding node names (requires helm upgrade of the stack).
kube-state-metrics:
  metricLabelsAllowlist:
    - nodes=[bifrost.io/wol,bifrost.io/workload-pool]
