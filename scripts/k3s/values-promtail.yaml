# Promtail — ship container logs to in-cluster Loki (STG).
config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    # Stop tailing pods that finished successfully. Completed Tekton TaskRun pods stay for 7 days
    # (cicd/tekton-pipelinerun-ttl), ~1,930 of them on 2026-09-28; promtail CPU tracked the number
    # of files it tails (2,108 files -> 0.60 cores on ubt-k3s-04), not the bytes it reads. Their
    # logs were shipped while they ran. Failed pods stay tracked: their last lines are the error.
    extraRelabelConfigs:
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Succeeded
        action: drop
    # Truncate a line before Loki refuses it. Loki's max_line_size is 256 KiB (262144 B, the
    # default) and a longer line gets the push answered 400 "max entry size exceeded"; promtail
    # does not retry a 400 and counts the WHOLE batch in promtail_dropped_entries_total
    # (reason ingester_error) although Loki kept the batch's other lines. One dagster-daemon
    # line at the 22:45 and 03:00 UTC schedule ticks did that every night 09-28..10-06
    # (17-20 "dropped" per batch on the node the daemon ran on), and loki_gate.py then called
    # every release gate INCONCLUSIVE (TD-152). 250KB (promtail reads KB as 1024 B, so 256000 B;
    # "KiB" does not parse and promtail would not start) leaves room under Loki's limit, which
    # counts structured metadata too. Truncations: promtail_mutated_entries_total{reason="line_too_long"}.
    extraLimitsConfig: |
      max_line_size: 250KB
      max_line_size_truncate: true

# cicd node tails hundreds of Tekton step pods; 256Mi/512Mi OOMKilled (444+ restarts).
# Keep request modest so quiet nodes are not over-reserved; raise limit for CI spikes.
# CPU 500m throttled the ubt-k3s-04 pod 99% (CNPG + ib-gateway logs) so /metrics timed out;
# ubt-k3s-05 79%, ubt-k3s-02 55% (2026-09-28).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

daemonset:
  enabled: true
