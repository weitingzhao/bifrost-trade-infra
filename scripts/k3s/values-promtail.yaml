# Promtail — ship container logs to in-cluster Loki (STG).
config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

# cicd node tails hundreds of Tekton step pods; 256Mi/512Mi OOMKilled (444+ restarts).
# Keep request modest so quiet nodes are not over-reserved; raise limit for CI spikes.
# CPU 500m throttled the ubt-k3s-04 pod 99% (CNPG + ib-gateway logs) so /metrics timed out;
# ubt-k3s-05 79%, ubt-k3s-02 55% (2026-09-28).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

daemonset:
  enabled: true
